project: lambda
kind: Added
body: "Declare `x-telo-ref` targets in object form with an explicit `use:` — handler slots are `kind: Telo.Executable, use: trigger.inbound` (collapsing the `anyOf: [Telo.Invocable, Telo.Runnable]` pair), and `Lambda.Function.handlers` is `kind: Self.Handler, use: dependency`. Replaces the deprecated `<namespace>/<module>#<Kind>` form and pins the http-dispatch import to the OCI ref `0.11.0`."
