kind: Telo.Library
metadata:
  name: ApifyFacebookReelsScraper
  version: 0.0.319
  description: >-
    Facebook Reels Scraper: the Apify actor apify/facebook-reels-scraper (build 0.0.319) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from hundreds of Facebook reels from one or multiple Facebook pages and profiles.
    Get reel URL, text, page or profile URL, timestamp, number of plays and more. Download the data
    in JSON, CSV, and Excel and use it in apps, spreadsheets, and reports.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
