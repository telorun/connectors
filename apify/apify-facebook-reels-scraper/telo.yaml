kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/facebook-reels-scraper, from its build 0.0.319 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: Facebook URLs
      description: >-
        Enter a Facebook page URL to scrape its reels, e.g.
        https://www.facebook.com/LeonardoDiCaprio/, or a direct reel URL to scrape one reel, e.g.
        https://www.facebook.com/reel/1350782990582563/.
    resultsLimit:
      type: integer
      title: Results amount
      description: If this limit is not set as many results as possible are returned
      minimum: 1
    onlyPostsNewerThan:
      type: string
      title: Reels newer than
      description: >-
        Scrape reels from the provided date to the present day. The date should be in YYYY-MM-DD or
        full ISO absolute format or in relative format e.g. 1 days, 2 months, 3 years. The JSON
        input also supports adding time units (UTC timezone): Full or partial ISO timestamp (e.g.,
        `2025-09-23T10:02:01`) as absolute time and relative time, e.g., `1 hour` or `2 minutes`.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
