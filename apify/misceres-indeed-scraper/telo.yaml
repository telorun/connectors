kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of misceres/indeed-scraper, from its build 0.0.117 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    position:
      type: string
      title: Positions/keywords for search
      description: >-
        Any combination of positions or keywords for search. Can be used together with Start URLs -
        both will be scraped independently, each limited by Max job listings per search.
    maxItemsPerSearch:
      type: integer
      title: Max job listings per search
      description: >-
        Maximum number of job listings to scrape for each keyword search and each Start URL. When
        both are used together, each is limited independently by this value.
      minimum: 1
    country:
      type: string
      title: Country for search
      description: Country for job search.
      enum:
        - AQ
