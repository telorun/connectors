kind: Telo.Library
metadata:
  name: MisceresIndeedScraper
  version: 0.0.117
  description: >-
    Indeed Scraper: the Apify actor misceres/indeed-scraper (build 0.0.117) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Scrape jobs posted on Indeed. Get detailed information from this job portal about saved and
    sponsored jobs. Specify the search based on location with the output attributes position,
    location, and description.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
