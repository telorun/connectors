        - AE
        - GB
        - US
        - UY
        - VE
        - VN
      default: US
    location:
      type: string
      title: Location for search
      description: >-
        Any combination of city, zip code or locality for search. Used together with
        position/keywords.
    parseCompanyDetails:
      type: boolean
      title: Scrape company details
      description: >-
        If true, each job also includes company details: description, website URL, logo, company
        size and rating. These come from the same API response as the job itself, so turning this on
        costs no extra requests.
      default: false
    saveOnlyUniqueItems:
      type: boolean
      title: Save only unique job listings
      description: If true, only unique job listings will be scraped.
      default: true
    followApplyRedirects:
      type: boolean
      title: Follow redirects for apply link (no longer needed)
      description: >-
        Has no effect. `externalApplyLink` is now always the employer's own apply URL, because it
        comes resolved from Indeed's API instead of being followed by the scraper. Left in place so
        existing runs keep working.
      default: false
    startUrls:
      type: array
      title: Start URLs
      description: >-
        List of URLs that will be scraped. Can be main website URL, category/search URLs, company
        jobs URL (in the format of `https://www.indeed.com/cmp/Google/jobs`) or detail/product URLs.
        Can be combined with keyword search - both will execute independently.
