kind: Telo.Library
metadata:
  name: ApifyFacebookReviewsScraper
  version: 0.0.365
  description: >-
    Facebook Reviews Scraper: the Apify actor apify/facebook-reviews-scraper (build 0.0.365) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from hundreds of Facebook reviews from one or multiple Facebook pages. Get review
    text, timestamp, review URL, likes and comments count and basic reviewer info. Download the data
    in JSON, CSV, Excel and use it in apps, spreadsheets, and reports.
