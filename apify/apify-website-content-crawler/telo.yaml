kind: Telo.Library
metadata:
  name: ApifyWebsiteContentCrawler
  version: 0.3.101
  description: >-
    Website Content Crawler: the Apify actor apify/website-content-crawler (build 0.3.101) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Crawl websites and extract text content to feed AI models, LLM applications, vector databases,
    or RAG pipelines. The Actor supports rich formatting using Markdown, cleans the HTML, downloads
    files, and integrates well with 🦜🔗 LangChain, LlamaIndex, and the wider LLM ecosystem.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/website-content-crawler, from its build 0.3.101 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - proxyConfiguration
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        One or more URLs where the crawler will start. By default, it crawls only these URLs and
        their sub-pages (same URL path); use **Include URL patterns (globs)** to override this
        behavior.

        For example, for start URL `https://example.com/blog`, it will crawl also
        `https://example.com/blog/post` or `https://example.com/blog/article`.
    crawlerType:
      type: string
      title: Crawler type
      description: >-
        Select the crawling engine:

        - **Adaptive switching** between browser and raw HTTP: Fast and renders JavaScript content
        if present. Default and recommended option.

        - **Headless browser** (Firefox+Playwright): Reliable, renders JavaScript content, best in
        avoiding blocking, but might be slow.

        - **Raw HTTP client** (Cheerio): Fastest, but doesn't render JavaScript content.

        - **Raw HTTP client with JavaScript** (JSDOM): Deprecated, use Cheerio instead.

        - **Headless browser** (Chrome+Playwright): Deprecated, use Firefox+Playwright instead.

        More details about Crawler types are in
        [readme](https://console.apify.com/actors/aYG0l9s7dbB7j3gbS/information/version-0/readme#crawler-types).
      enum:
        - playwright:adaptive
        - playwright:firefox
        - cheerio
        - jsdom
        - playwright:chrome
      default: playwright:firefox
    includeUrlGlobs:
      type: array
      title: Include URL patterns (globs)
      description: >-
        Define URL patterns (globs) to extend crawling beyond **Start URLs** and their subpages.

        Example: `https://www.example.com/blog/**` matches any blog page —
        `https://www.example.com/blog/post-title` or `https://www.example.com/blog/category/post` —
        even if the Start URL is `https://www.example.com/product/some-product`.

        It affects only links found on pages, but not **Start URLs** - if you want to crawl a page,
        make sure to specify its URL in the **Start URLs** field.

        Combined with **Exclude URL patterns**, you can precisely control which pages are crawled.

        Learn more about globs
        [here](https://www.digitalocean.com/community/tools/glob?comments=true&glob=https%3A%2F%2Fexample.com%2Fscrape_this%2F%2A%2A&matches=false&tests=https%3A%2F%2Fexample.com%2Ftools%2F&tests=https%3A%2F%2Fexample.com%2Fscrape_this%2F&tests=https%3A%2F%2Fexample.com%2Fscrape_this%2F123%3Ftest%3Dabc&tests=https%3A%2F%2Fexample.com%2Fdont_scrape_this)
        and test them with our **Glob tester** under this input.
      default: []
    excludeUrlGlobs:
      type: array
      title: Exclude URL patterns (globs)
      description: >-
        Glob patterns matching URLs of pages that will be excluded from crawling. Note that this
        affects only links found on pages, but not **Start URLs**, which are always crawled.

        For example `https://{store,docs}.example.com/**` excludes all URLs starting with
        `https://store.example.com/` or `https://docs.example.com/`, and
        `https://example.com/**/*\?*foo=*` excludes all URLs that contain `foo` query parameter with
        any value.

        Learn more about globs
        [here](https://www.digitalocean.com/community/tools/glob?comments=true&glob=https%3A%2F%2Fexample.com%2Fscrape_this%2F%2A%2A&matches=false&tests=https%3A%2F%2Fexample.com%2Ftools%2F&tests=https%3A%2F%2Fexample.com%2Fscrape_this%2F&tests=https%3A%2F%2Fexample.com%2Fscrape_this%2F123%3Ftest%3Dabc&tests=https%3A%2F%2Fexample.com%2Fdont_scrape_this)
        and test them with our **Glob tester** under this input.
      default: []
    maxCrawlDepth:
      type: integer
      title: Max crawling depth
      description: >-
        The maximum number of links starting from the start URL that the crawler will recursively
        follow. The start URLs have depth `0`, the pages linked directly from the start URLs have
        depth `1`, and so on.

        Useful to prevent accidental crawler runaway. By setting it to `0`, the Actor will only
        crawl the Start URLs.
      minimum: 0
      default: 20
    maxCrawlPages:
      type: integer
      title: Max pages
      description: >-
        The maximum number of pages to crawl: defaults to 9999999, which is effectively unlimited;
        set it to cap the number of pages to prevent accidental crawler runaway.

        It includes the start URLs, pagination pages, pages with no content, etc. The crawler will
        automatically finish after reaching this number.
      minimum: 0
      default: 9999999
    useSitemaps:
      type: boolean
      title: Load URLs from Sitemaps
      description: >-
        If enabled, the crawler will look for [Sitemaps](https://en.wikipedia.org/wiki/Sitemaps) at
        the domains of the provided *Start URLs* and enqueue matching URLs similarly as the links
        found on crawled pages.

        You can also reference a `sitemap.xml` file directly by adding it as another Start URL (e.g.
        `https://www.example.com/sitemap.xml`)

        The crawling could be more robust with Sitemaps, as it includes pages that might be not
        reachable from Start URLs. However, **loading and processing Sitemaps can take a lot of
        time, especially for large sites**.

        Note that if a page is found via Sitemaps, it will have `depth` of `1`.
      default: false
    onlyCrawlPagesModifiedSince:
      type: string
      title: Crawl only pages changed since (experimental)
      description: >-
        If set, the crawler will only crawl URLs of pages that may have changed since the provided
        date. You can enter a date in ISO format YYYY-MM-DD or YYYY-MM-DDTHH:mm:ssZ. On navigation,
        a page that returns a `304 Not Modified` response will be considered unchanged and skipped.
        **Start URL** is always crawled.

        Works even better with `useSitemaps` enabled - a sitemap that contains `` tags will be used
        to determine if pages have changed and filter them out to save crawling resources. Pages
        without a `` tag will be enqueued regardless of this setting.
      pattern: ^((\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d(\.\d+)?)?Z)?)?$
      default: ""
    useLlmsTxt:
      type: boolean
      title: Crawl /llms.txt and Markdown files
      description: >-
        If enabled, the crawler will look for `/llms.txt` files at the root of the domains of the
        provided Start URLs (e.g., `https://example.com/llms.txt`) and enqueue them for crawling.
        Note that this also enables crawling other Markdown files and enqueueing links from them.
      default: false
    respectRobotsTxtFile:
      type: boolean
      title: Respect the robots.txt file
      description: >-
        If enabled, the crawler will consult the robots.txt file for the target website before
        crawling each page. At the moment, the crawler does not use any specific user agent
        identifier. The crawl-delay directive is also not supported yet.
      default: false
    keepUrlFragments:
      type: boolean
      title: "URL #fragments identify unique pages"
      description: >-
        Indicates that URL fragments (e.g. http://example.com#fragment) should be included when
        checking whether a URL has already been visited or not. Typically, URL fragments are used
        for page navigation only and therefore they should be ignored, as they don't identify
        separate pages. However, some single-page websites use URL fragments to display different
        pages; in such a case, this option should be enabled.
      default: false
    ignoreCanonicalUrl:
      type: boolean
      title: Ignore canonical URLs
      description: >-
        If enabled, the Actor will ignore the canonical URL or the `ETag` header reported by the
        page, and use the actual URL instead. You can use this feature for websites that report
        invalid canonical URLs, which causes the Actor to skip those pages in results.
      default: false
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: >-
        Enables loading the websites from IP addresses in specific geographies and to circumvent
        blocking.
      default:
        useApifyProxy: true
    initialCookies:
      type: array
      title: Custom cookies
      description: >-
        Cookies that will be pre-set to all pages the scraper opens. This is useful for pages that
        require login. The value is expected to be a JSON array of objects with `name` and `value`
        properties. For example:

        ```json

        [
          {
            "name": "cookieName",
            "value": "cookieValue",
            "path": "/",
            "domain": ".apify.com"
          }
        ]

        ```

        You can use the [EditThisCookie](https://docs.apify.com/academy/tools/edit-this-cookie)
        browser extension to copy browser cookies in this format, and paste it here.

        Note that the value is secret and encrypted to protect your login cookies.
      x-telo-sensitive: true
    customHttpHeaders:
      type: object
      title: Custom HTTP headers
      description: >-
        HTTP headers that will be added to all requests made by the crawler. This is useful for
        setting custom authentication headers or other headers required by the target website. The
        value is expected to be a JSON object with `name` and `value` properties pairs. For example:
        `{ "name1": "value1", "Authorization": "Basic a1b2c3d4..." }`.
      default: {}
    signHttpRequests:
      type: boolean
      title: Sign HTTP requests (experimental)
      description: >-
        If enabled, the crawler will sign all HTTP requests using its Web Bot Auth private key. This
        is necessary if you want to use Website Content Crawler as a Cloudflare Signed Agent.
      default: false
    initialConcurrency:
      type: integer
      title: Initial concurrency
      description: >-
        The initial number of web browsers or HTTP clients running in parallel. The system scales
        the concurrency up and down based on the current CPU and memory load. If the value is set to
        0 (default), the Actor uses the default setting for the specific crawler type.

        Note that if you set this value too high, the Actor will run out of memory and crash. If too
        low, it will be slow at start before it scales the concurrency up.
      minimum: 0
      maximum: 999
      default: 0
    maxConcurrency:
      type: integer
      title: Max concurrency
      description: >-
        The maximum number of web browsers or HTTP clients running in parallel. This setting is
        useful to avoid overloading the target websites and to avoid getting blocked.
      minimum: 1
      maximum: 999
      default: 200
    requestTimeoutSecs:
      type: integer
      title: Page request timeout
      description: Timeout in seconds for making the request and processing its response. Defaults to 60s.
      minimum: 1
      maximum: 600
      default: 60
    minFileDownloadSpeedKBps:
      type: integer
      title: Minimum file download speed
      description: >-
        The minimum viable file download speed in kilobytes per seconds. If the file download speed
        is lower than this value for a prolonged duration, the crawler will consider the file
        download as failing, abort it, and retry it again (up to "Maximum number of retries" times).
        This is useful to avoid your crawls being stuck on slow file downloads.
      default: 128
    maxRequestRetries:
      type: integer
      title: Maximum number of retries on network / server errors
      description: >-
        The maximum number of times the crawler will retry the request on network, proxy or server
        errors. If the (n+1)-th request still fails, the crawler will mark this request as failed.
      minimum: 0
      maximum: 20
      default: 3
    maxSessionRotations:
      type: integer
      title: Maximum number of session rotations
      description: >-
        The maximum number of times the crawler will rotate the session (IP address + browser
        configuration) on anti-scraping measures like CAPTCHAs. If the crawler rotates the session
        more than this number and the page is still blocked, it will finish with an error.
      minimum: 0
      maximum: 20
      default: 10
    ignoreHttpsErrors:
      type: boolean
      title: Ignore HTTPS errors
      description: If enabled, the scraper will ignore HTTPS certificate errors. Use at your own risk.
      default: false
    dynamicContentWaitSecs:
      type: integer
      title: Wait for dynamic content
      description: >-
        The maximum time in seconds to wait for dynamic page content to load. By default, it is 10
        seconds. The crawler will continue processing the page either if this time elapses, or if it
        detects the network became idle as there are no more requests for additional resources.

        When using the **Wait for selector** option, the crawler will wait for the selector to
        appear for this amount of time. If the selector doesn't appear within this period, the
        request will fail and will be retried.

        Note that this setting is ignored for the raw HTTP client, because it doesn't execute
        JavaScript or loads any dynamic resources. Similarly, if the value is set to `0`, the
        crawler doesn't wait for any dynamic to load and processes the HTML as provided on load.
      default: 10
    waitForSelector:
      type: string
      title: Wait for selector
      description: >-
        Specify a **CSS selector** to tell the crawler to wait for a specific element to appear
        before it starts extracting content. This is helpful for pages where the content loads
        dynamically.

        Examples: `div`, `#id-of-an-element`, `.class-name`

        This setting disables the default content-load detection. If the element doesn't appear
        within the **Wait for dynamic content** timeout, the request will fail and be retried.

        If **Wait for dynamic content** is set to `0`, the crawler does not wait for late elements.
        Instead, it checks the selector only against the current page state / HTML snapshot, and
        fails the request immediately if the selector is not found.

        With the raw HTTP client, this option checks for the presence of the selector in the HTML
        content and throws an error if it's not found.
      default: ""
    softWaitForSelector:
      type: string
      title: Soft wait for selector
      description: >-
        If set, the crawler will wait for the specified CSS selector to appear in the page before
        proceeding with the content extraction. Unlike the `waitForSelector` option, this option
        doesn't fail the request if the selector doesn't appear within the timeout (the request
        processing will continue).
      default: ""
    maxScrollHeightPixels:
      type: integer
      title: Maximum scroll height
      description: >-
        The crawler will scroll down the page until all content is loaded (and network becomes
        idle), or until this maximum scrolling height is reached. Setting this value to `0` disables
        scrolling altogether.

        Note that this setting is ignored for the raw HTTP client, because it doesn't execute
        JavaScript or loads any dynamic resources.
      minimum: 0
      default: 5000
    removeCookieWarnings:
      type: boolean
      title: Remove cookie warnings
      description: >-
        If enabled, the Actor will try to remove cookies consent dialogs or modals, using the [I
        don't care about
        cookies](https://addons.mozilla.org/en-US/firefox/addon/i-dont-care-about-cookies/) browser
        extension, to improve the accuracy of the extracted text. Note that there is a small
        performance penalty if this feature is enabled.

        This setting is ignored when using the raw HTTP crawler type.
      default: true
    blockMedia:
      type: boolean
      title: Block loading of images and videos
      description: >-
        If the flag is enabled and the Actor is using a headless browser, it will not load images,
        fonts, stylesheets and videos to improve performance. It will load scripts as usual - that
        is after all the point of using a headless browser.
      default: false
    expandIframes:
      type: boolean
      title: Expand iframe elements
      description: >-
        By default, the Actor will extract content from `iframe` elements. If you want to
        specifically skip `iframe` processing, disable this option. Works only for the
        `playwright:firefox` crawler type.
      default: true
    clickElementsCssSelector:
      type: string
      title: Expand clickable elements
      description: >-
        A CSS selector matching DOM elements that will be clicked. This is useful for expanding
        collapsed sections, in order to capture their text content. The value must be a valid CSS
        selector as accepted by the `document.querySelectorAll()` function.
      default: '[aria-expanded="false"]'
    stickyContainerCssSelector:
      type: string
      title: Make containers sticky
      description: >-
        This is an **experimental** feature. A CSS selector matching DOM elements that will be
        prevented from deleting any of their children. This is useful in conjunction with the
        "Expand clickable elements" option on pages where hidden content is actually removed from
        the DOM (i.e., some variants of the accordion pattern). Enabling this might corrupt the
        extracted content, which is why it is disabled by default. It is possible to enable the
        feature for the whole page with the `*` selector, or you can target specific elements if the
        former has unwanted side effects.
    pageFunction:
      type:
        - string
        - "null"
      title: Page function
      description: >-
        A declaration of an asynchronous JS function (e.g. `async function pageFunction({ page }) {
        await page.click('.submit-button') }`).

        The function receives `context` as the only argument. Context is a JavaScript object
        containing the following properties:

        - `page`: Currently loaded Playwright `Page` instance.

        - `request`: The request object that triggered the page load.

        The function will be executed in the browser context for each crawled page, after the page
        is loaded (included all dynamic content) and before the content is extracted and cleaned.
      default: ""
    keepElementsCssSelector:
      type: string
      title: Keep HTML elements (CSS selector)
      description: >-
        Extract only relevant page content by specifying CSS selectors (e.g. `div`, `#element-id`,
        `.class-name`). [Learn more about CSS
        selectors](https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Basic_selectors).

        If any selectors are defined, everything else will be removed from the page.

        This option runs before the `HTML transformer` option. If you are missing content in the
        output despite using this option, try disabling the `HTML transformer`.
      default: ""
    removeElementsCssSelector:
      type: string
      title: Remove HTML elements (CSS selector)
      description: >-
        Specify which HTML elements should be removed from the page before text extraction. This is
        useful to skip irrelevant page content.

        By default, the Actor removes common navigation elements, headers, footers, modals, scripts,
        and inline image. You can disable the removal by setting this value to some non-existent CSS
        selector like `dummy_keep_everything`.
      default: |-
        nav, footer, script, style, noscript, svg, img[src^='data:'],
        [role="alert"],
        [role="banner"],
        [role="dialog"],
        [role="alertdialog"],
        [role="region"][aria-label*="skip" i],
        [aria-modal="true"]
    htmlTransformer:
      type: string
      title: HTML transformer
      description: >-
        Specify how to transform HTML to get meaningful content, removing extra fluff like
        navigation or pop-ups. This is applied after any HTML elements are removed or clicked.

        - **Readable text with fallback**: Uses Mozilla's Readability to extract content, but keeps
        the original HTML if it's not a clear article. Great for sites with mixed content like
        articles and product pages.

        - **Readable text** (Default): Also uses Mozilla's Readability but is more aggressive,
        removing headers, footers, and navigation. Best for blogs and article-heavy sites.

        - **Extractus**: An alternative content extraction algorithm that might work better for
        certain news sites or blogs with unique layouts.

        - **Defuddle**: More forgiving than Readability, better preserving elements like math and
        footnotes, code. It also extracts metadata and uses mobile styles for clean-up.

        - **None**: Only performs basic cleaning and removes elements specified by you. This option
        is best when you need to preserve most of the page's original HTML.
      enum:
        - readableTextIfPossible
        - readableText
        - extractus
        - defuddle
        - none
      default: readableText
    readableTextCharThreshold:
      type: integer
      title: Readable text extractor character threshold
      description: >-
        A configuration options for the "Readable text" HTML transformer. It contains the minimum
        number of characters an article must have in order to be considered relevant.
      default: 100
    aggressivePrune:
      type: boolean
      title: Remove duplicate text lines
      description: >-
        This is an **experimental feature**. If enabled, the crawler will prune content lines that
        are very similar to the ones already crawled on other pages, using the Count-Min Sketch
        algorithm. This is useful to strip repeating content in the scraped data like menus,
        headers, footers, etc. In some (not very likely) cases, it might remove relevant content
        from some pages.
      default: false
    debugMode:
      type: boolean
      title: Debug mode (stores output of all HTML transformers)
      description: >-
        If enabled, the Actor will store the output of all types of HTML transformers, including the
        ones that are not used by default, and it will also store the HTML to Key-value Store with a
        link. All this data is stored under the `debug` field in the resulting Dataset.
      default: false
    debugLog:
      type: boolean
      title: Debug log
      description: >-
        If enabled, the actor log will include debug messages. Beware that this can be quite verbose.
      default: false
    storeSkippedUrls:
      type: boolean
      title: Store skipped URLs
      description: >-
        If enabled, the crawler will store all URLs that were skipped during the crawl in a
        Key-Value Store record named `SKIPPED_URLS`. The record will contain a JSON object with
        reasons for skipping and the URLs that were skipped for each reason. This is useful for
        debugging and understanding why certain pages were not crawled.
      default: false
    saveHtml:
      type: boolean
      title: Save HTML to dataset (deprecated)
      description: >-
        If enabled, the crawler stores full transformed HTML of all pages found to the output
        dataset under the `html` field. **This option has been deprecated** in favor of the
        `saveHtmlAsFile` option, because the dataset records have a size of approximately 10MB and
        it's harder to review the HTML for debugging.
      default: false
    saveHtmlAsFile:
      type: boolean
      title: Save HTML to key-value store
      description: >-
        If enabled, the crawler stores full transformed HTML of all pages found to the default
        key-value store and saves links to the files as `htmlUrl` field in the output dataset.
        Storing HTML in key-value store is preferred to storing it into the dataset with the
        `saveHtml` option, because there's no size limit and it's easier for debugging as you can
        easily view the HTML.
      default: false
    saveMarkdown:
      type: boolean
      title: Save Markdown
      description: >-
        If enabled, the crawler converts the transformed HTML of all pages found to Markdown, and
        stores it under the `markdown` field in the output dataset.
      default: true
    summarize:
      type: boolean
      title: Summarize pages with AI (experimental) ($)
      description: >-
        If enabled, the crawler generates a one-sentence AI summary of each crawled web page and
        stores it under the `summary` field in the output dataset. This helps downstream LLM
        processing by describing what each page is about without reading the full content. Only web
        pages that have headings or extracted Markdown are summarized (files such as PDFs or images
        are not).

        **This is a paid feature.** Summaries are generated through the OpenRouter Actor, which
        starts additional Actor runs and incurs extra cost on top of the crawl (billed to your
        account).
      default: false
    saveFiles:
      type: boolean
      title: Save files
      description: >-
        Deprecated in favor of the `saveContentTypes` option. Will be removed soon. If enabled, the
        crawler downloads files linked from the web pages, as long as their URL has one of the
        following file extensions: PDF, DOC, DOCX, XLS, XLSX, and CSV. Note that unlike web pages,
        the files are downloaded regardless if they are under **Start URLs** or not. The files are
        stored to the default key-value store, and metadata about them to the output dataset,
        similarly as for web pages.
      default: false
    saveContentTypes:
      type: string
      title: Save linked files with Content-Type
      description: >-
        The crawler downloads files linked from the web pages, as long as their content type matches
        the provided value. Select predefined Content-type
        (https://www.iana.org/assignments/media-types/media-types.xhtml) groups to download common
        file types, or enter custom HTTP Content-type strings, including wildcards (e.g.,
        application/pdf, text/\*, image/\*) for specific downloads. Note that unlike web pages, the
        files are downloaded regardless if they are under **Start URLs** or not. The files are
        stored to the default key-value store, and metadata about them to the output dataset,
        similarly as for web pages.
    saveScreenshots:
      type: boolean
      title: Save screenshots (headless browser only)
      description: >-
        If enabled, the crawler stores a screenshot for each article page to the default key-value
        store. The link to the screenshot is stored under the `screenshotUrl` field in the output
        dataset. It is useful for debugging, but reduces performance and increases storage costs.

        Note that this feature only works with the `playwright:firefox` crawler type.
      default: false
    maxResults:
      type: integer
      title: Max results
      description: >-
        The maximum number of web pages and files to store. This setting helps prevent an accidental
        crawler runaway by automatically stopping the crawl once this limit is reached. Note that
        the crawler skips pages whose canonical URL matches a page that has already been crawled, so
        it may crawl more pages than the number of stored results. Similarly, there may be more
        stored results than crawled web pages because downloaded files also count toward results.
      minimum: 0
      default: 9999999
    clientSideMinChangePercentage:
      type: integer
      title: (Adaptive crawling only) Minimum client-side content change percentage
      description: >-
        The least amount of content (as a percentage) change after the initial load required to
        consider the pages client-side rendered
      minimum: 1
      default: 15
    renderingTypeDetectionPercentage:
      type: integer
      title: >-
        (Adaptive crawling only) How often should the crawler attempt to detect page rendering type
      description: How often should the adaptive attempt to detect page rendering type
      minimum: 1
      maximum: 100
      default: 10
    reuseStoredDetectionResults:
      type: boolean
      title: Reuse stored detections results (experimental)
      description: >-
        If enabled, the crawler (if using playwright:adaptive) will reuse results of rendering type
        detections done in previous runs to speed up crawling of statically rendered pages
      default: false
---
kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item apify/website-content-crawler produces.
schema:
  type: object
  additionalProperties: true
---
kind: Telo.Definition
metadata:
  name: Run
  description: Run Website Content Crawler and wait for its dataset items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActorSync
    metadata:
      name: run
    client: !cel "self.client"
invoke: !ref run
inputs:
  actorId: apify/website-content-crawler
  build: 0.3.101
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
result:
  items: !cel "result.body"
---
kind: Telo.Definition
metadata:
  name: Start
  description: >-
    Run Website Content Crawler in the background, poll until the run finishes, and return the run
    and its dataset items. Raises APIFY_RUN_NOT_SUCCEEDED when the run ends FAILED, TIMED-OUT or
    ABORTED.
capability: Telo.Invocable
throws:
  codes:
    APIFY_RUN_NOT_SUCCEEDED:
      description: >-
        The run finished without succeeding. `data` is the Apify run object (id, status,
        statusMessage, …).
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - run
      - items
    properties:
      run:
        type: object
        additionalProperties: true
        description: "The finished Apify run: id, status, defaultDatasetId, stats, usageTotalUsd, …"
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActor
    metadata:
      name: start
    client: !cel "self.client"
  - kind: Apify.GetRun
    metadata:
      name: getRun
    client: !cel "self.client"
  - kind: Apify.GetDatasetItems
    metadata:
      name: getItems
    client: !cel "self.client"
  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
        inputs:
          runId: !cel "inputs.runId"
          waitForFinish: 60
    outputs:
      run: !cel "steps.poll.result.body.data"
  - kind: Flow.Sequence
    metadata:
      name: seq
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - input
        properties:
          input:
            type: object
          timeout:
            type:
              - integer
              - "null"
          memory:
            type:
              - integer
              - "null"
          maxItems:
            type:
              - integer
              - "null"
          maxTotalChargeUsd:
            type:
              - number
              - "null"
    steps:
      - name: start
        invoke: !ref start
        inputs:
          actorId: apify/website-content-crawler
          build: 0.3.101
          input: !cel "inputs.input"
          timeout: !cel "inputs.?timeout.orValue(null)"
          memory: !cel "inputs.?memory.orValue(null)"
          maxItems: !cel "inputs.?maxItems.orValue(null)"
          maxTotalChargeUsd: !cel "inputs.?maxTotalChargeUsd.orValue(null)"
      - name: wait
        invoke: !ref wait
        inputs:
          runId: !cel "steps.start.result.body.data.id"
      - name: check
        if: !cel "steps.wait.result.run.status != 'SUCCEEDED'"
        then:
          - name: fail
            throw:
              code: APIFY_RUN_NOT_SUCCEEDED
              message: !cel >-
                'Apify run ' + steps.wait.result.run.id + ' finished with status ' +
                steps.wait.result.run.status
              data: !cel "steps.wait.result.run"
      - name: items
        invoke: !ref getItems
        inputs:
          datasetId: !cel "steps.wait.result.run.defaultDatasetId"
    outputs:
      run: !cel "steps.wait.result.run"
      items: !cel "steps.items.result.body"
invoke: !ref seq
inputs:
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
