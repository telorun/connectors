kind: Telo.Library
metadata:
  name: ApifyGeminiSearchScraper
  version: 0.0.95
  description: >-
    Gemini Search Scraper: the Apify actor apify/gemini-search-scraper (build 0.0.95) as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    No-code scraper for Google Gemini AI search. Run any prompt and extract Gemini's AI responses,
    cited sources, and links at scale. Track brand visibility in AI search (GEO), monitor
    competitors, and run market research. Export to JSON, CSV, or Excel. No API key needed.
