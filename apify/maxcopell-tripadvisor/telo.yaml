schema:
  type: object
  additionalProperties: false
  properties:
    query:
      type:
        - string
        - "null"
      title: Search Query
      description: >-
        You can enter a location name or a keyword here. If you search for a location, the scraper
        will take the first 'Location' type result and scrape hotels, restaurants, and attractions
        for that location. If you search for a keyword, the scraper will only scrape places directly
        listed on the search results page (it won't crawl destinations listed among those results).
    startUrls:
      type: array
      title: Start URLs
      description: >-
        URLs to start with instead of a location name. You can use URLs with search query included
        (containing 'Search?q='), tourism URLs or URLs pointing to a concrete hotel, restaurant, or
        attraction (containing 'Hotel_Review', 'Restaurant_Review', or 'Attraction_Review'). URLs of
        **public** trips are supported as well. The Actor can also handle category URLs for all 3
        kinds of places, including search filters. Just note that the Actor also scrapes nearby
        results for hotels. You can tell them apart from results strictly matching the search
        filters using `isNearbyResult` output field.
    maxItemsPerQuery:
      type: integer
      title: Max results (per search query/start URL)
      description: >-
        Limit the number of places to be scraped per search query/start URL. If you want to set a
        limit across all search queries use 'Options' -> 'Maximum charged results'. Set this field
        to a value larger than `3000` to activate the *'deeper city search'*.
      minimum: 1
    includeTags:
      type: boolean
      title: Include review tags
      description: >-
        Include the review tags (keyword labels summarizing what reviewers mention) for each place.
      default: true
    includeNearbyResults:
      type: boolean
      title: Include nearby results
      description: >-
        If checked, the results will include not only results strictly matching your search criteria
        but also their nearby results. This feature is currently available only for hotels and
        restaurants.
      default: false
    includeAttractions:
      type: boolean
      title: Include things to do
      description: If checked, the results will include attractions/things to do for a given location.
      default: true
    includeRestaurants:
      type: boolean
      title: Include restaurants
      description: If checked, the results will include restaurants for a given location.
      default: true
    includeHotels:
      type: boolean
      title: Include hotels
      description: If checked, the results will include hotels for a given location.
      default: true
    checkInDate:
      type: string
      title: Hotel check-in date
      description: >-
        Hotel rooms prices will be calculated for this check-in date. Select the date in format
        YYYY-MM-DD or {number} {unit} *(e.g. '3 days' or '1 week')*
