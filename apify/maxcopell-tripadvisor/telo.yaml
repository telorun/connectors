kind: Telo.Library
metadata:
  name: MaxcopellTripadvisor
  version: 0.0.295
  description: >-
    Tripadvisor Scraper: the Apify actor maxcopell/tripadvisor (build 0.0.295) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    This unofficial Tripadvisor API is a data extraction tool able to get data on hotels,
    restaurants, things to do, vacation rentals, attractions, tours, and public trips. Get pricing,
    contact details, amenities, awards, ratings, and more. Download your data in Excel, JSON, CSV,
    and other formats.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
