kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/facebook-search-scraper, from its build 0.0.339 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - categories
  properties:
    categories:
      type: array
      title: 🔍 Search terms
      description: >-
        Add one or multiple keywords. You can add the keywords one by one, or use the Bulk edit
        section to pull them from a prepared list.
      uniqueItems: true
      default: []
    locations:
      type: array
      title: 📍 Location (applied to each search term)
      description: Free text location definition. Just add a name of a country, city or province.
      uniqueItems: true
      default: []
    searchType:
      type: string
      title: 🔎 Search type
      description: >-
        Choose the type of Facebook search data you want to scrape. Posts return both images and
        reels.
      enum:
        - pages-google
        - pages
        - profiles
        - posts
        - reels
      default: pages-google
    resultsLimit:
      type: integer
      title: 💯 Up to [number] of search results
      description: >-
        Set the number of results you expect for the entire run (if this limit is not set, as many
        results as possible are returned).
      minimum: 1
