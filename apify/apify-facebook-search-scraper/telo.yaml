kind: Telo.Library
metadata:
  name: ApifyFacebookSearchScraper
  version: 0.0.339
  description: >-
    Facebook Search Scraper: the Apify actor apify/facebook-search-scraper (build 0.0.339) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape Facebook search results: posts, pages, profiles and reels. Add a keyword and extract
    search results like pages details, profile information, recent posts or reels. Export scraped
    data, schedule via API, integrate with other tools or AI workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
