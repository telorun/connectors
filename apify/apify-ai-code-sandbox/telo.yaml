kind: Telo.Library
metadata:
  name: ApifyAiCodeSandbox
  version: 1.0.5
  description: >-
    AI Code Sandbox: the Apify actor apify/ai-code-sandbox (build 1.0.5) as typed Telo kinds. `Run`
    runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Provides a secure execution environment for code generated by AI agents. Interact with the
    sandbox through web shell, REST API, or MCP. Supports Python and Node.js runtimes, Claude Code,
    Codex CLI, and OpenCode coding agents, and persists state.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/ai-code-sandbox, from its build 1.0.5 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    agentSkills:
      type: string
      title: Agent skills
      description: >-
        Skill packages to install for the AI coding agent — SKILLS.md files with specialized
        instructions (see https://skills.sh/). One skill per line — a GitHub `owner/repo` (e.g.
        `anthropics/skills`) or repo URL (e.g. `https://github.com/anthropics/skills`); blank lines
        and `#` comments are ignored. Also accepts a JSON array like `["apify/agent-skills",
        "anthropics/skills"]`.
    nodeDependencies:
      type: string
      title: Node.js dependencies
      description: >-
        npm packages for JavaScript/TypeScript code execution (/sandbox/js-ts). One
        `package@version` per line — same syntax `npm install ` accepts (omit `@version` for
        `latest`; blank lines and `#` comments are ignored). Also accepts a package.json-style JSON
        object like `{"zod": "^3.0", "axios": "latest"}`.
    pythonRequirements:
      type: string
      title: Python requirements
      description: >-
        Python packages for Python code execution (/sandbox/py), in requirements.txt format — one
        package per line, blank lines and `#` comments are ignored.
    mcpConnectors:
      type: array
      title: MCP connectors
      description: >-
        One or more MCP connectors that will be available to the sandbox. They are pre-configured in
        Claude Code, Codex, and OpenCode, as well as written to `/sandbox/mcp.json` so tools like
        `mcpc connect` pick them up immediately.
      default: []
    initBashScript:
      type: string
      title: Setup script
      description: >-
        Bash script execute run on startup, after Node and Python dependencies are installed. Use it
        to install system packages, create directories, or set up the environment.
    envVars:
      type: string
      title: Environment variables
      description: >-
        Secret environment variables that are exposed **only to the setup script**, then deleted
        before the shell, MCP server, and code execution start. Encrypted at rest by Apify.

        Accepts dotenv format (`KEY=VALUE` per line with # comments), or a JSON object, e.g.
        `{"KEY": "VALUE"}`.
      x-telo-sensitive: true
    idleTimeoutSecs:
      type: integer
      title: Idle timeout
      description: >-
        The container shuts down automatically after this many seconds of inactivity (no requests or
        shell interaction). Set to 0 to disable. Recommended: set the standard Actor timeout to 0
        (infinite) when using this setting.
      minimum: 0
      default: 900
    bridges:
      type: array
      title: Bridges
      description: >-
        Expose web servers that you start **inside** the sandbox at a public URL path on this
        container, so they're reachable from the browser or other services. Each bridge forwards `/`
        to `http://127.0.0.1:/...` over HTTP and WebSocket. Use for your own dev server, a TUI
        gateway, an admin UI, etc.

        Example: `[{"path": "/myapp", "target": "http://127.0.0.1:3000/myapp"}]` — visiting `/myapp`
        forwards to the local server on port 3000.

        Bridges can also be added/removed at runtime via the `/bridges` API.
      items:
        type: object
        additionalProperties: false
        required:
          - path
          - target
        properties:
          path:
            type: string
            title: Exposed path
            description: External URL path (e.g., /openclaw)
          target:
            type: string
            title: Local service URL
            description: Full URL of local service (e.g., http://127.0.0.1:18789/openclaw)
      default: []
