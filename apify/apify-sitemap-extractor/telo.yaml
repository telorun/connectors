kind: Telo.Library
metadata:
  name: ApifySitemapExtractor
  version: 0.1.30
  description: >-
    Sitemap Extractor: the Apify actor apify/sitemap-extractor (build 0.1.30) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    This Apify Actor extracts all URLs from a website's sitemaps and checks their status codes via
    lightweight HTTP requests. It provides a clean list of valid links, acting as an ideal
    pre-processor to ensure your larger crawling projects target only active URLs.
  repository: https://github.com/telorun/connectors
