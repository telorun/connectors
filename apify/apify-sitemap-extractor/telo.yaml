schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - proxyConfiguration
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        A static list of domains to scrape.

        For details, see the Start URLs (https://apify.com/apify/sitemap-extractor#start-urls)
        section in the README.
    checkPageStatus:
      type: boolean
      title: Check page status
      description: >-
        When enabled (the default), the Actor sends a HEAD request to every page found in the
        sitemaps and outputs its HTTP status code. Disable this option to skip those requests
        entirely and simply output the list of page URLs (with lastmod) discovered in the sitemaps.
        This is much faster and lighter, but the output will not contain the status field, and
        lastmod falls back to the sitemap only (no Last-Modified header), so it will be null more
        often.
      default: true
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: >-
        Specifies proxy servers that will be used by the scraper in order to hide its origin.

        For details, see Proxy configuration
        (https://apify.com/apify/sitemap-extractor#proxy-configuration) in README.
      default:
        useApifyProxy: true
    proxyRotation:
      type: string
      title: Proxy rotation
      description: >-
        This property indicates the strategy of proxy rotation and can only be used in conjunction
        with Apify Proxy. The recommended setting automatically picks the best proxies from your
        available pool and rotates them evenly, discarding proxies that become blocked or
        unresponsive. If this strategy does not work for you for any reason, you may configure the
        scraper to either use a new proxy for each request, or to use one proxy as long as possible,
        until the proxy fails. IMPORTANT: This setting will only use your available Apify Proxy
        pool, so if you don't have enough proxies for a given task, no rotation setting will produce
        satisfactory results.
      enum:
        - RECOMMENDED
        - PER_REQUEST
        - UNTIL_FAILURE
      default: RECOMMENDED
    maxCrawlingDepth:
      type: integer
      title: Max crawling depth
      description: >-
        Specifies how many sitemap levels the crawler will descend. This value is a safeguard
        against infinite crawling depths for misconfigured scrapers.

        If set to 1, will process only the root sitemap. If set to 0, there is no limit.
      minimum: 0
      default: 0
    maxRequestRetries:
      type: integer
      title: Max request retries
      description: >-
        The maximum number of times the scraper will retry to load each web page on error, in case
        of a page load error or an exception thrown by the Page function.

        If set to 0, the page will be considered failed right after the first error.
      minimum: 0
      default: 3
