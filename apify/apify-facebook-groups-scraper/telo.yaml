kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/facebook-groups-scraper, from its build 0.0.386 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: 🔗 Facebook group URLs
      description: Insert a URL of a valid Facebook group. Only public Facebook groups can be scraped.
    resultsLimit:
      type: integer
      title: ✍️ Number of posts
      description: >-
        Select the number of posts you want to scrape. If this limit is not set, as many results as
        possible will be returned.
      minimum: 1
    viewOption:
      type: string
      title: 📜 Sorting order
      description: >-
        Select sorting order by which the posts should be scraped. Please note that the Number of
        results field will be applied to New posts only. The BuySell items sorting will return
        results for BuySell groups only.
      enum:
        - CHRONOLOGICAL
        - RECENT_ACTIVITY
        - TOP_POSTS
        - CHRONOLOGICAL_LISTINGS
      default: CHRONOLOGICAL
    onlyPostsNewerThan:
      type: string
      title: Posts newer than
      description: >-
        Scrapes post from the provided date to the present day. The date should be in YYYY-MM-DD or
        full ISO absolute format or in relative format e.g. 1 days, 2 months, 3 years. The JSON
        input also supports adding time units (UTC timezone): Full or partial ISO timestamp (e.g.,
        `2025-09-23T10:02:01`) as absolute time and relative time, e.g., `1 hour` or `2 minutes`.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
