kind: Telo.Library
metadata:
  name: ApifyFacebookGroupsScraper
  version: 0.0.386
  description: >-
    Facebook Groups Scraper: the Apify actor apify/facebook-groups-scraper (build 0.0.386) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from one or multiple public Facebook groups. Get group and post URLs, post text,
    comments, timestamp, likes and comments count, and basic commentator info. Download the data in
    JSON, CSV, and Excel and use it in apps, spreadsheets, and reports.
  repository: https://github.com/telorun/connectors
  license: MIT
