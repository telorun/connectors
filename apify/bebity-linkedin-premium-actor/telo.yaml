kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of bebity/linkedin-premium-actor, from its build 0.0.301 input schema.
schema:
  type: object
  additionalProperties: true
  properties:
    action:
      type: string
      title: 🎯 Action
      description: "What to scrape: people profiles or companies."
      enum:
        - get-profiles
        - get-companies
      default: get-profiles
    keywords:
      type: array
      title: 🔍 Search terms, names or URLs
      description: >-
        One bulk list. Each entry is either a SEARCH term ("web developer", "John Doe") — searched
        and capped by the limit — OR a DIRECT lookup: a full LinkedIn URL, or a "/in/{slug}"
        (profiles) / "/company/{slug}" (companies) path. Direct lookups return exactly one result
        each and ignore the limit. A bare slug WITHOUT the /in/ or /company/ marker is treated as a
        search term.
      default:
        - web dev
    limit:
      type: integer
      title: 🔢 Limit of results per search query
      description: >-
        Max rows per search term: limit=5 over 2 search terms returns up to 10 rows. Ignored for
        direct URLs/slugs — each is always scraped.
      default: 1
    location:
      type: array
      title: 🌍 Location
      description: >-
        Filter people-search results by location (get-profiles only). Type a place name (e.g.
        "Paris", "United States", "Greater London") — it is matched against LinkedIn's location
        autocomplete and the best match is used. Add several to widen the filter (matches ANY of
        them). You can also paste a raw LinkedIn geo id (e.g. 106383538) or geo URN to skip the
        lookup. Unrecognized entries are skipped with a warning.
      uniqueItems: true
    company:
      type: string
      title: 🏢 Current company
      description: >-
        Narrow a people search to members who currently work at this company — this is how you get
        the employees of a company. Accepts a company URL
        (https://www.linkedin.com/company/stripe/), its slug (stripe) or its name (Stripe); a URL or
        slug is the most reliable. Combines with keywords, location and job title. Ignored for
        company runs and for direct profile URLs.
    jobTitle:
      type: string
      title: 💼 Job title
      description: >-
        Narrow a people search to this job title, matched as an exact phrase (e.g. "Data
        Scientist"). Combines with keywords, location and current company.
    profileFields:
      type:
        - array
        - "null"
      title: 🧩 Profile data to scrape
      description: >-
        Which profile sections to scrape (profiles only). Each option is one LinkedIn request — pick
        only what you need for faster, cheaper runs. Default is About (cheapest single section).
        Select all options to scrape the full profile. Base identity (name, headline, location,
        picture, follower/connection counts) is always returned.
      uniqueItems: true
      items:
        type: string
        enum:
          - about
          - experience
          - languages
          - skills
          - honors
          - projects
          - organizations
          - courses
          - publications
          - contact
      default:
        - about
