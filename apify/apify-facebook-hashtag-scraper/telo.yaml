  name: ApifyFacebookHashtagScraper
  version: 0.0.138
  description: >-
    Facebook Hashtag Scraper: the Apify actor apify/facebook-hashtag-scraper (build 0.0.138) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from hundreds of Facebook posts using one or multiple hashtags. Get post text&URL,
    time of posting, basic poster info, image&video URLs, OCR text, likes, comments and shares
    count, and more. Download the data in JSON, CSV, Excel and use it in apps, spreadsheets, and
    reports.
