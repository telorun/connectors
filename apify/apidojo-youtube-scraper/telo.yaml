kind: Telo.Library
metadata:
  name: ApidojoYoutubeScraper
  version: 0.0.1062
  description: >-
    Youtube Scraper (Pay Per Result): the Apify actor apidojo/youtube-scraper (build 0.0.1062) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Experience unparalleled efficiency and depth with its ultra-fast capabilities in searching, URL,
    playlist, channel, and profile scraping. It comes equipped with a variety of filters to
    customize your data collection precisely. Plus, it's incredibly affordable at only $0.50 per
    1000 videos!
  repository: https://github.com/telorun/connectors
  license: MIT
