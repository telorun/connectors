kind: Telo.Library
metadata:
  name: ApifyCheerioScraper
  version: 3.0.22
  description: >-
    Cheerio Scraper: the Apify actor apify/cheerio-scraper (build 3.0.22) as typed Telo kinds. `Run`
    runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Crawls websites using raw HTTP requests, parses the HTML with the Cheerio library, and extracts
    data from the pages using a Node.js code. Supports both recursive crawling and lists of URLs.
    This actor is a high-performance alternative to apify/web-scraper for websites that do not
    require JavaScript.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/cheerio-scraper, from its build 3.0.22 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - pageFunction
    - proxyConfiguration
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        A static list of URLs to scrape.

        For details, see the Start URLs (https://apify.com/apify/cheerio-scraper#start-urls) section
        in the README.
    keepUrlFragments:
      type: boolean
      title: "URL #fragments identify unique pages"
      description: >-
        Indicates that URL fragments (e.g. http://example.com#fragment) should be included when
        checking whether a URL has already been visited or not. Typically, URL fragments are used
        for page navigation only and therefore they should be ignored, as they don't identify
        separate pages. However, some single-page websites use URL fragments to display different
        pages; in such cases, this option should be enabled.
      default: false
    respectRobotsTxtFile:
      type: boolean
      title: Respect the robots.txt file
      description: >-
        If enabled, the crawler will consult the robots.txt file for the target website before
        crawling each page. At the moment, the crawler does not use any specific user agent
        identifier. The crawl-delay directive is also not supported yet.
      default: false
    globs:
      type: array
      title: Glob Patterns
      description: >-
        Glob patterns to match links in the page that you want to enqueue. Combine with Link
        selector to tell the scraper where to find links. Omitting the Glob patterns will cause the
        scraper to enqueue all links matched by the Link selector.
      default: []
    pseudoUrls:
      type: array
      title: Pseudo-URLs
      description: >-
        Specifies what kind of URLs found by the Link selector should be added to the request queue.
        A pseudo-URL is a URL with regular expressions enclosed in [] brackets, e.g.
        http://www.example.com/[.*].

        If Pseudo-URLs are omitted, the Actor enqueues all links matched by the Link selector.

        For details, see Pseudo-URLs (https://apify.com/apify/cheerio-scraper#pseudo-urls) in
        README.
      default: []
    excludes:
      type: array
      title: Exclude Glob Patterns
      description: Glob patterns to match links in the page that you want to exclude from being enqueued.
      default: []
    linkSelector:
      type: string
      title: Link selector
      description: >-
        A CSS selector stating which links on the page (<a> elements with href attribute) shall be
        followed and added to the request queue. To filter the links added to the queue, use the
        Pseudo-URLs and/or Glob patterns field.

        If the Link selector is empty, the page links are ignored.

        For details, see the Link selector (https://apify.com/apify/cheerio-scraper#link-selector)
        in README.
    pageFunction:
      type: string
      title: Page function
      description: >-
        A JavaScript function that is executed for every page loaded server-side in Node.js 12. Use
        it to scrape data from the page, perform actions or add new URLs to the request queue.

        For details, see Page function (https://apify.com/apify/cheerio-scraper#page-function) in
        README.
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: >-
        Specifies proxy servers that will be used by the scraper in order to hide its origin.

        For details, see Proxy configuration
        (https://apify.com/apify/cheerio-scraper#proxy-configuration) in README.
      default:
        useApifyProxy: true
    proxyRotation:
      type: string
      title: Proxy rotation
      description: >-
        This property indicates the strategy of proxy rotation and can only be used in conjunction
        with Apify Proxy. The recommended setting automatically picks the best proxies from your
        available pool and rotates them evenly, discarding proxies that become blocked or
        unresponsive. If this strategy does not work for you for any reason, you may configure the
        scraper to either use a new proxy for each request, or to use one proxy as long as possible,
        until the proxy fails. IMPORTANT: This setting will only use your available Apify Proxy
        pool, so if you don't have enough proxies for a given task, no rotation setting will produce
        satisfactory results.
      enum:
        - RECOMMENDED
        - PER_REQUEST
        - UNTIL_FAILURE
      default: RECOMMENDED
    sessionPoolName:
      type: string
      title: Session pool name
      description: >-
        Use only english alphanumeric characters dashes and underscores. A session is a
        representation of a user. It has it's own IP and cookies which are then used together to
        emulate a real user. Usage of the sessions is controlled by the Proxy rotation option. By
        providing a session pool name, you enable sharing of those sessions across multiple Actor
        runs. This is very useful when you need specific cookies for accessing the websites or when
        a lot of your proxies are already blocked. Instead of trying randomly, a list of working
        sessions will be saved and a new Actor run can reuse those sessions. Note that the IP lock
        on sessions expires after 24 hours, unless the session is used again in that window.
      minLength: 3
      maxLength: 200
      pattern: "[0-9A-z-]"
    initialCookies:
      type: array
      title: Initial cookies
      description: >-
        A JSON array with cookies that will be send with every HTTP request made by the Cheerio
        Scraper, in the format accepted by the tough-cookie
        (https://www.npmjs.com/package/tough-cookie) NPM package. This option is useful for
        transferring a logged-in session from an external web browser. For details how to do this,
        read this help article
        (https://help.apify.com/en/articles/1444249-log-in-to-website-by-transferring-cookies-from-web-browser-legacy).
      x-telo-sensitive: true
    additionalMimeTypes:
      type: array
      title: Additional MIME types
      description: >-
        A JSON array specifying additional MIME content types of web pages to support. By default,
        Cheerio Scraper supports the text/html and application/xhtml+xml content types, and skips
        all other resources. For details, see Content types
        (https://apify.com/apify/cheerio-scraper#content-types) in README.
      default: []
    suggestResponseEncoding:
      type: string
      title: Suggest response encoding
      description: >-
        The scraper automatically determines response encoding from the response headers. If the
        headers are invalid or information is missing, malformed responses may be produced. Use the
        Suggest response encoding option to provide a fall-back encoding to the Scraper for cases
        where it could not be determined.
    forceResponseEncoding:
      type: boolean
      title: Force response encoding
      description: >-
        If enabled, the suggested response encoding will be used even if a valid response encoding
        is provided by the target website. Use this only when you've inspected the responses
        thoroughly and are sure that they are the ones doing it wrong.
      default: false
    ignoreSslErrors:
      type: boolean
      title: Ignore SSL errors
      description: If enabled, the scraper will ignore SSL/TLS certificate errors. Use at your own risk.
      default: false
    preNavigationHooks:
      type: string
      title: Pre-navigation hooks
      description: >-
        Async functions that are sequentially evaluated before the navigation. Good for setting
        additional cookies or browser properties before navigation. The function accepts two
        parameters, `crawlingContext` and `requestAsBrowserOptions`, which are passed to the
        `requestAsBrowser()` function the crawler calls to navigate.
    postNavigationHooks:
      type: string
      title: Post-navigation hooks
      description: >-
        Async functions that are sequentially evaluated after the navigation. Good for checking if
        the navigation was successful. The function accepts `crawlingContext` as the only parameter.
    maxRequestRetries:
      type: integer
      title: Max request retries
      description: >-
        The maximum number of times the scraper will retry to load each web page on error, in case
        of a page load error or an exception thrown by the Page function.

        If set to 0, the page will be considered failed right after the first error.
      minimum: 0
      default: 3
    maxPagesPerCrawl:
      type: integer
      title: Max pages per run
      description: >-
        The maximum number of pages that the scraper will load. The scraper will stop when this
        limit is reached. It is always a good idea to set this limit in order to prevent excess
        platform usage for misconfigured scrapers. Note that the actual number of pages loaded might
        be slightly higher than this value.

        If set to 0, there is no limit.
      minimum: 0
      default: 0
    maxResultsPerCrawl:
      type: integer
      title: Max result records
      description: >-
        The maximum number of records that will be saved to the resulting dataset. The scraper will
        stop when this limit is reached.

        If set to 0, there is no limit.
      minimum: 0
      default: 0
    maxCrawlingDepth:
      type: integer
      title: Max crawling depth
      description: >-
        Specifies how many links away from the Start URLs the scraper will descend. This value is a
        safeguard against infinite crawling depths for misconfigured scrapers. Note that pages added
        using context.enqueuePage() in Page function are not subject to the maximum depth
        constraint.

        If set to 0, there is no limit.
      minimum: 0
      default: 0
    maxConcurrency:
      type: integer
      title: Max concurrency
      description: >-
        Specifies the maximum number of pages that can be processed by the scraper in parallel. The
        scraper automatically increases and decreases concurrency based on available system
        resources. This option enables you to set an upper limit, for example to reduce the load on
        a target web server.
      minimum: 1
      default: 50
    pageLoadTimeoutSecs:
      type: integer
      title: Page load timeout
      description: >-
        The maximum amount of time the scraper will wait for a web page to load, in seconds. If the
        web page does not load in this timeframe, it is considered to have failed and will be
        retried (subject to Max page retries), similarly as with other page load errors.
      minimum: 1
      default: 60
    pageFunctionTimeoutSecs:
      type: integer
      title: Page function timeout
      description: >-
        The maximum amount of time the scraper will wait for the Page function to execute, in
        seconds. It is always a good idea to set this limit, to ensure that unexpected behavior in
        page function will not get the scraper stuck.
      minimum: 1
      default: 60
    debugLog:
      type: boolean
      title: Enable debug log
      description: >-
        If enabled, the Actor log will include debug messages. Beware that this can be quite
        verbose. Use context.log.debug('message') to log your own debug messages from the Page
        function.
      default: false
    customData:
      type: object
      title: Custom data
      description: >-
        A custom JSON object that is passed to the Page function as context.customData. This setting
        is useful when invoking the scraper via API, in order to pass some arbitrary parameters to
        your code.
      default: {}
    datasetName:
      type: string
      title: Dataset name
      description: >-
        Name or ID of the dataset that will be used for storing results. If left empty, the default
        dataset of the run will be used.
    keyValueStoreName:
      type: string
      title: Key-value store name
      description: >-
        Name or ID of the key-value store that will be used for storing records. If left empty, the
        default key-value store of the run will be used.
    requestQueueName:
      type: string
      title: Request queue name
      description: >-
        Name of the request queue that will be used for storing requests. If left empty, the default
        request queue of the run will be used.
