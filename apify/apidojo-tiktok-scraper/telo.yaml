kind: Telo.Library
metadata:
  name: ApidojoTiktokScraper
  version: 0.0.1140
  description: >-
    Tiktok Scraper (Pay Per Result): the Apify actor apidojo/tiktok-scraper (build 0.0.1140) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract TikTok profiles, videos, hashtags, comments at 600 posts/sec. No proxy, 98% success
    rate. Scrape music, locations & user data with query builder. Export JSON/CSV, API integration.
    Perfect for influencer discovery, lead gen, market research. $0.30 per 1K posts.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
