schema:
  type: object
  additionalProperties: false
  properties:
    keywords:
      type: array
      title: Search Keywords
      description: >-
        List of search terms to look for on Google Maps. Each keyword will be searched independently
        in the specified location. E.g., restaurants, cafes, dentists, plumbers.
    location:
      type: string
      title: Location
      description: >-
        The geographic area to search in. Can be a city, state, country, or any place name. The
        scraper will geocode this into a polygon and split it into grid segments for thorough
        coverage. E.g., Palm Beach, FL, USA or Berlin, Germany.
    max_result_per_keyword:
      type: integer
      title: Max Results Per Keyword
      description: >-
        Maximum number of unique places to collect per keyword. The scraper stops searching for a
        keyword once this limit is reached. Set to 0 or leave empty for unlimited results.
      minimum: 0
      maximum: 500000
    include_nearby_places:
      type: boolean
      title: Include Nearby Places
      description: >-
        When enabled, places located just outside the location's strict boundary are kept instead of
        being dropped as 'out of location'. The buffer scales with the location type (~5 km for
        cities/POIs, ~10 km for states, ~25 km for countries). Useful when results near the border
        of a city or region are being filtered out.
      default: false
    scrape_contacts:
      type: boolean
      title: "🏢 Add-on: Company contacts enrichment"
      description: >-
        Enrich Google Maps places with contact details extracted from the business website,
        including business emails and social media profiles (Meta, LinkedIn, X, etc). Price is
        charged per place at $1.5 per 1000 places that have a website.
      default: false
    custom_geolocation:
      type: object
      title: Custom Geolocation
      description: >-
        Custom GeoJSON shape, used **only when the `Location` field is empty**. If both `Location`
        and `Custom Geolocation` are set, `Location` wins and this field is ignored. Coordinates use
        **`[longitude, latitude]`** order (GeoJSON standard).

        Supported shapes:

        • **Polygon** — `{"type":"Polygon","coordinates":[[[lon,lat],...]]}`

        • **MultiPolygon** — `{"type":"MultiPolygon","coordinates":[[[[lon,lat],...]]]}`

        • **Circle** — `{"type":"Point","coordinates":[lon,lat],"radius_km":5}` (or
        `"type":"Circle"`)

        `Feature` and `FeatureCollection` envelopes (e.g. exports from geojson.io or Google My Maps)
        are auto-unwrapped.
