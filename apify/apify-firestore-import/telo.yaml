kind: Telo.Library
metadata:
  name: ApifyFirestoreImport
  version: 0.0.3
  description: >-
    Firestore Import: the Apify actor apify/firestore-import (build 0.0.3) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Seamlessly import data from Apify datasets into Firebase Firestore database. This integration
    allows full control over document IDs, conflict resolution (overwrite, merge, skip), and data
    transformation using a custom JavaScript function.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/firestore-import, from its build 0.0.3 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - serviceAccountKey
    - collection
    - datasetId
    - databaseName
    - documentConflictResolution
    - batchSize
  properties:
    serviceAccountKey:
      type: string
      title: Service Account Key
      description: >-
        Service account key in JSON format. You can get it from *Firebase Console* -> *Project
        Settings* -> *Service accounts* -> *Generate new private key*. Paste the whole JSON string
        here.
      x-telo-sensitive: true
    datasetId:
      type: string
      title: Dataset ID
      description: ID of the Apify dataset to import data from.
    collection:
      type: string
      title: Collection
      description: >-
        Firestore collection to import data to. If it doesn't exist, it will be created. Note: you
        can customize the collection for each document using the `transformFunction` input. This can
        be useful when you want to import data to sub-collections.
    databaseName:
      type: string
      title: Database Name
      description: >-
        Name of the Firestore database. If not provided, the default database (`"(default)"`) will
        be used.
      default: (default)
    idField:
      type: string
      title: ID Field
      description: >-
        Field in the dataset item that will be used as a Firestore document ID. If not provided, all
        documents will be created with a random ID generated by Firestore (it means that value of
        `documentConflictResolution` is ignored in that case). This is useful when you want to
        update existing documents in Firestore. Note: you can customize the ID for each document
        independently using the `transformFunction` input field.
    documentConflictResolution:
      type: string
      title: Document Conflict Resolution
      description: >-
        How to handle conflicts when importing data to Firestore:

        - *overwrite*: replace existing Firestore documents with the same ID.

        - *merge*: merge data from the dataset items with existing Firestore documents.

        - *skip*: documents with existing IDs will be skipped.

        ⚠️ Please note that the *skip* resolution has really bad performance on large scale and
        can't use batch writes.
      enum:
        - overwrite
        - merge
        - skip
      default: overwrite
    transformFunction:
      type: string
      title: Transform Function
      description: >-
        Function that transforms each item from the dataset before importing it to Firestore. The
        function must return an object (or array of objects) with the `data` key that contains the
        transformed document and other optional fields. See README for more details and examples.
    batchSize:
      type: integer
      title: Batch Size
      description: >-
        Number of items to import in a single batch. Lower values are safer but slower, see
        [Firestore limits](https://firebase.google.com/docs/firestore/quotas) (10 MiB batch write).
        Please note that *skip* conflict resolution does not use batch writes and will always import
        one item at a time.
      default: 500
