kind: Telo.Library
metadata:
  name: HarvestapiLinkedinCompanyEmployees
  version: 0.0.165
  description: >-
    LinkedIn Company Employees Scraper (No Cookies): the Apify actor
    harvestapi/linkedin-company-employees (build 0.0.165) as typed Telo kinds. `Run` runs it and
    waits for its results (Apify allows up to 5 minutes); `Start` runs it in the background and
    polls until it finishes, for runs of any length. Both take an ApifyClient and the actor's own
