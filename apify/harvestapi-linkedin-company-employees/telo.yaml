  properties:
    profileScraperMode:
      type: string
      title: Profile Scraper Mode
      description: >-
        Choose the mode for scraping LinkedIn profiles. The Short mode provides basic information,
        while the Full mode includes full detailed profile data.
      enum:
        - Short ($4 per 1k)
        - Full ($8 per 1k)
        - Full + email search ($12 per 1k)
      default: Full ($8 per 1k)
