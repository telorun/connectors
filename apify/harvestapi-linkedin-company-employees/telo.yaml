      maxItems: 1000
    locations:
      type: array
      title: Locations Filter
      description: >-
        Filter employees by these LinkedIn locations. Example: `San Francisco`. LinkedIn does not
        always understand your text queries. For example for "UK" query it will apply "Ukraine"
        location, so you should use "United Kingdom" in this case. Try this out first in the
