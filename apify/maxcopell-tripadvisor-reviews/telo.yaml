kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item maxcopell/tripadvisor-reviews produces.
schema:
  type: object
  additionalProperties: true
  properties:
    placeInfo:
      description: Summary information about the reviewed location.
    id:
      type:
        - string
        - "null"
      description: Unique numeric review ID.
    lang:
      type:
        - string
        - "null"
      description: BCP 47 language code of the review text.
    originalLanguage:
      type:
        - string
        - "null"
      description: Original language of the review text.
    isMachineTranslated:
      type:
        - boolean
        - "null"
      description: Indicates if the review is machine translated on the TripAdvisor website.
    locationId:
      type:
        - string
        - "null"
      description: Tripadvisor location ID the review belongs to.
    publishedDate:
      type:
        - string
        - "null"
      description: Date when the review was published (`YYYY-MM-DD` format).
    publishedPlatform:
      type:
        - string
        - "null"
      description: Platform the review was originally published on, if known.
    rating:
      type:
        - number
        - "null"
      description: Star rating given by the reviewer (1–5).
    helpfulVotes:
      type:
        - number
        - "null"
      description: Number of helpful votes received.
    url:
      type:
        - string
        - "null"
      description: Direct URL to the review on Tripadvisor.
    travelDate:
      type:
        - string
        - "null"
      description: Month and year of the visit (`YYYY-MM` format).
    text:
      type:
        - string
        - "null"
      description: Full review text.
    user:
      description: Reviewer profile information.
    title:
      type:
        - string
        - "null"
      description: Review title / headline.
    ownerResponse:
      description: Owner's response to the review, if any.
    subratings:
      type:
        - array
        - "null"
      description: Category-level sub-ratings (e.g. food, service, value).
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          name:
            type:
              - string
              - "null"
            description: Name of the rated category.
          value:
            type:
              - number
              - "null"
            description: Numeric score for the category (1–5).
    photos:
      type:
        - array
        - "null"
      description: Photos attached to the review.
      items: {}
    tripType:
      type:
        - string
        - "null"
      description: Type of trip (e.g. `BUSINESS`, `COUPLES`, `FAMILY`, `FRIENDS`, `SOLO`).
