kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of maxcopell/tripadvisor-reviews, from its build 0.0.234 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: Paste here a URL(s) of a specific place you want to get reviews from.
    sourceDatasetId:
      type: string
      title: Tripadvisor Scraper dataset ID of a finished run
      description: Dataset ID of a finished Tripadvisor Scraper run to get start URLs from.
    maxItemsPerQuery:
      type: integer
      title: Limit reviews for each place
      description: >-
        Use a large value (for example 1 million) to get all reviews from each place. If you want to
        set a limit across all reviews use 'Options' -> 'Maximum charged results'.
      minimum: 1
    scrapeReviewerInfo:
      type: boolean
      title: Scrape reviewer info
      description: >-
        Scrape reviewer info (name, profile picture, location etc.).

        ⚠️ This returns personal data. You're responsible for having a legal basis to collect and
        use it under privacy laws.
      default: true
    lastReviewDate:
      type: string
      title: Only reviews since date
      description: >-
        It is a date where the scraper stops loading older reviews. Select the date in format
        YYYY-MM-DD or {number} {unit} *(e.g. '3 days' or '1 week')*
      pattern: ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$|^(\d+)\s*(day|week|month|year)s?$
    disableMachineTranslations:
      type: boolean
      title: Disable machine translation of the reviews
      description: >-
        When enabled, the reviews are returned in their original language instead of the Tripadvisor
        machine translation to English. Note: the original texts are loaded with one additional
        request per page of reviews.
      default: false
    reviewRatings:
      type: array
