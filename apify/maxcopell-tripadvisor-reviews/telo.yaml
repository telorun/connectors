kind: Telo.Library
metadata:
  name: MaxcopellTripadvisorReviews
  version: 0.0.234
  description: >-
    Tripadvisor Reviews Scraper: the Apify actor maxcopell/tripadvisor-reviews (build 0.0.234) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Get and download reviews for chosen places on Tripadvisor. Extract the review text, URL, rating,
    date of travel, published date, basic reviewer info, owner's response, helpful votes, images,
    review language, place details. Download reviews in XML, JSON, CSV.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
