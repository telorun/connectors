schema:
  type: object
  additionalProperties: false
  properties:
    searchQueries:
      type: array
      title: Search queries
      description: >-
        Queries to search LinkedIn posts. The same query as you would use in the LinkedIn search bar.
      maxItems: 10000
    maxPosts:
      type: integer
      title: Maximum number of posts to scrape per each search query
      description: >-
        Maximum number of posts to scrape per each search query. If you set this to 0, it will
        scrape all posts.
    postedLimit:
      type: string
      title: Posted Limit
      description: "Fetch posts no older than X time. Options: '1h', '24h', 'week', 'month'."
      enum:
        - any
