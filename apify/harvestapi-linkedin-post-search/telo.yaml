        - 24h
        - week
        - month
        - 3months
        - 6months
        - year
    postedLimitDate:
      type: string
      title: Posted Limit Date
      description: >-
        Scrape posts from now up to and including this date. It supports the [Date time string
        format](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date#date_time_string_format).
        For example, "2011-10-10", or "2011-10-10T14:48:00.000+09:00" or a timestamp: "628021800000"
    sortBy:
      type: string
      title: Sort by
      description: Sort by 'relevance' or 'date'.
      enum:
        - relevance
        - date
    authorUrls:
      type: array
      title: Profile or Company URLs who posted
      description: >-
        List of LinkedIn profile or company URLs to scrape. Example:
        `https://www.linkedin.com/in/williamhgates` will fetch posted or re-posted content by Bill
        Gates.
      maxItems: 10
    authorsCompanies:
      type: array
      title: Companies where authors work
      description: >-
        Scrape posts of profile-authors who assigned to LinkedIn Company Names of these companies.
        Example: `Google` will fetch posts of Google employees or ex-employees in some cases.
      maxItems: 20
    mentioningMember:
      type: array
      title: Mentioning member
      description: >-
        List of LinkedIn profile URLs of members mentioned in posts. Example:
        `https://www.linkedin.com/in/williamhgates` will fetch posts mentioning Bill Gates.
      maxItems: 10
    mentioningCompany:
      type: array
      title: Mentioning company
      description: >-
        List of LinkedIn Company Names mentioned in posts. Example:
        `https://www.linkedin.com/company/google` will fetch posts mentioning Google.
    contentType:
      type: string
      title: Content type
      description: >-
        Filter posts by content type. For example, if you choose 'Videos', it will scrape only posts
        containing videos.
      enum:
        - all
        - videos
        - images
        - jobs
        - live_videos
        - documents
        - collaborative_articles
    authorsIndustryId:
      type: array
      title: Authors industry ID
      description: >-
        Scrape posts of profile-authors who assigned to LinkedIn Industry IDs of these industries.
