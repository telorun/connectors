      enum:
        - short
        - main
      default: short
    postNestedReactions:
      type: boolean
      title: Post nested reactions (legacy, not recommended to enable)
      description: >-
        Whether to add reactions items inside post items. In a case of hundreds of reactions, the
        Actor might hit the max item size limit and won't be able to save a post.
    scrapeComments:
      type: boolean
      title: Scrape Comments
      description: Scrape comments of posts.
    commentsPostedLimit:
      type: string
      title: Comments Posted Limit (filter)
      description: "Fetch comments no older than X time. Options: '1h', '24h', 'week', 'month'."
      enum:
        - any
        - 1h
        - 24h
        - week
        - month
        - 3months
        - 6months
        - year
    maxComments:
      type: integer
      title: Maximum number of comments to scrape per post
      description: Maximum number of comments to scrape per post. Default is 10.
    commentsProfileScraperMode:
      type: string
      title: Profile Scraper Mode for comments
      description: >-
        Choose the mode for scraping LinkedIn profiles. The Short mode provides basic information,
        while the Full mode includes full detailed profile data.
      enum:
        - short
        - main
      default: short
    postNestedComments:
      type: boolean
      title: Post nested comments (legacy, not recommended to enable)
      description: >-
        Whether to add comments items inside post items. In a case of hundreds of comments, the
