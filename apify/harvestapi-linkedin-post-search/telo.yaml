        https://github.com/HarvestAPI/linkedin-industry-codes-v2/blob/main/linkedin_industry_code_v2_all_eng.csv
      maxItems: 20
    authorKeywords:
      type: string
      title: Author keywords
      description: >-
        Scrape posts of profile-authors whose profiles contain at least one of these keywords in the
        headline or job title sections.
    profileScraperMode:
      type: string
      title: Profile Scraper Mode
      description: >-
        Choose the mode for scraping LinkedIn profiles. The Short mode provides basic information,
        while the Full mode includes full detailed profile data.
      enum:
        - short
        - main
      default: short
    startPage:
      type: integer
      title: Start Page
      description: The page number to start scraping from.
      minimum: 1
      maximum: 100
      default: 1
    scrapePages:
      type: integer
      title: Number of pages to scrape
      description: The number of search pages to scrape. Each page contains 100 posts
      minimum: 0
      maximum: 100
    scrapeReactions:
      type: boolean
      title: Scrape Reactions
      description: Scrape reactions of posts.
    maxReactions:
      type: integer
      title: Maximum number of reactions to scrape per post
      description: Maximum number of reactions to scrape per post. Default is 10.
    reactionsProfileScraperMode:
      type: string
      title: Profile Scraper Mode for reactions
      description: >-
        Choose the mode for scraping LinkedIn profiles. The Short mode provides basic information,
