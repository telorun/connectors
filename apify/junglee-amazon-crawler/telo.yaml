kind: Telo.Library
metadata:
  name: JungleeAmazonCrawler
  version: 0.0.441
  description: >-
    Amazon Product Scraper: the Apify actor junglee/Amazon-crawler (build 0.0.441) as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    Use this Amazon scraper to collect data based on URL and country from the Amazon website.
    Extract product information without using the Amazon API, including reviews, prices,
    descriptions, and Amazon Standard Identification Numbers (ASINs). Download data in various
    structured formats.
  repository: https://github.com/telorun/connectors
  license: MIT
