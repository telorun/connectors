kind: Telo.Library
metadata:
  name: StreamersYoutubeChannelScraper
  version: 0.0.252
  description: >-
    Fast YouTube Channel Scraper: the Apify actor streamers/youtube-channel-scraper (build 0.0.252)
    as typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    This alternative YouTube Data API has no limits or quotas. Use it to scrape one or multiple
    YouTube channels: channel info, URL, total number of subscribers, videos and views, creation
    date. Try it and get basic video data. You can download extracted data in JSON, CSV, and Excel.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of streamers/youtube-channel-scraper, from its build 0.0.252 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: Direct URLs
      description: >-
        Enter a link to a channel (https://www.youtube.com/c/Apify). You can also import a CSV file
        or Google Sheet with a list of URLs.
    maxResults:
      type: integer
      title: Maximum videos per search term
      description: >-
        Limit the number of regular videos (not streams, not shorts) you want to get from one
        channel. If you use several urls on the input you will get this number for each channel.
      minimum: 0
      maximum: 999999
      default: 0
    maxResultsShorts:
      type: integer
      title: Maximum shorts per search term
      description: Limit the number of Shorts videos you want to get from the channel.
      minimum: 0
      maximum: 999999
      default: 0
    maxResultStreams:
      type: integer
      title: Maximum streams per search term
      description: Limit the number of Stream videos you want to get from the channel.
      minimum: 0
      maximum: 999999
      default: 0
    oldestPostDate:
      type: string
      title: Scrape videos published after [date]
      description: >-
        Only posts uploaded after or on this date will be scraped. Alternatively, specify how old
        the scraped videos should be in days. Putting 1 day will get you only today's posts, 2 days
        - yesterday's and today's, and so on. Note, that if you select this, sorting parameter will
        be auto-reset to NEWEST
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    sortVideosBy:
      type: string
      title: Sort by
      description: >-
        Maps to the sorting buttons on the top of the channel's 'Videos', 'Shorts' and 'Live' pages.
      enum:
        - NEWEST
        - POPULAR
        - OLDEST
