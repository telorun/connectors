kind: Telo.Library
metadata:
  name: VdrmotaContactInfoScraper
  version: 0.2.242
  description: >-
    Contact Details Scraper: the Apify actor vdrmota/contact-info-scraper (build 0.2.242) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Email extractor and lead scraper to extract and download emails, phone numbers, Facebook,
    Twitter, LinkedIn, Instagram, Threads, Snapchat, and Telegram profiles from any website. Extract
    contact information at scale from lists of URLs and download the data as Excel, CSV, JSON, HTML,
    and XML.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of vdrmota/contact-info-scraper, from its build 0.2.242 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - proxyConfig
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        The list of web pages from which the scraper will start crawling.

        You can also pass Linktree (https://linktr.ee) (linktr.ee) link-in-bio pages. The Actor
        reads every link on the profile and scrapes those linked sites for contact details, even
        with Stay within domain enabled.
    maxRequestsPerStartUrl:
      type: integer
      title: Maximum pages per start URL
      description: The maximum number of pages that will be enqueued from each start URL you provide.
      minimum: 1
    mergeContacts:
      type: boolean
      title: Merge contacts
      description: >-
        Enable this option to merge all contacts and social media from every page of the same start
        URL into a single, clean result row.
      default: true
    maxDepth:
      type: integer
      title: Maximum link depth
      description: >-
        The maximum number of links away from the Start URLs that the Actor will crawl. If 0, the
        scraper will not follow any links. If empty or null, the scraper will follow links to an
        arbitrary depth.
      minimum: 0
    maxRequests:
      type: integer
      title: Maximum pages for whole scrape
      description: >-
        The maximum number of pages the scraper will load. It is always a good idea to limit the
        number of pages, otherwise the scraper might run infinitely or consume too many resources.
      minimum: 1
    sameDomain:
      type: boolean
      title: Stay within domain
      description: >-
        If set, the scraper will only follow links within the same domain as the referring page.

        Links found on a Linktree (https://linktr.ee) (linktr.ee) page are an exception - they are
        always followed, even when this is enabled.
      default: true
    considerChildFrames:
      type: boolean
      title: Scrape iframes
      description: >-
        If set, the scraper will also extract contact information from iframes. You might not always
        want this (e.g. it will include data from online ads).
      default: true
    maximumLeadsEnrichmentRecords:
      type: integer
      title: "⏩ Add-on: Extract business leads information - Maximum leads per domain ($)"
      description: >-
        Set the maximum number of lead records to scrape per domain found. Default is 0, meaning no
        leads are scraped.

        ⚠️ This returns personal data. You're responsible for having a legal basis to collect and
        use it under privacy laws.

        To keep leads relevant, large chains and online platforms (e.g. social media, retail giants,
        food delivery) are filtered out automatically.
      minimum: 0
      default: 0
    leadsEnrichmentDepartments:
      type: array
      title: Filter by department
      description: >-
        Include only specific departments (e.g. Sales, Marketing, or C-Suite). Only works when the
        Maximum leads per domain add-on (maximumLeadsEnrichmentRecords) is enabled. Note that some
        job titles may be miscategorized.
      items:
        type: string
        enum:
          - c_suite
          - product
          - engineering_technical
          - design
          - education
          - finance
          - human_resources
          - information_technology
          - legal
          - marketing
          - medical_health
          - operations
          - sales
          - consulting
    verifyLeadsEnrichmentEmails:
      type: boolean
      title: "⏩ Add-on: Email verification ($)"
      description: >-
        When enabled, verifies the email address of each lead extracted during business leads
        enrichment. Each lead receives an emailVerification object with the verification result and
        quality assessment.

        Charged (decisive results): valid (ok), invalid, and disposable email addresses.

        Not charged: catch-all, unknown, and error results.

        ⚠️ This add-on requires business leads enrichment to be enabled.
      default: false
    scrapeSocialMediaProfiles:
      type: object
      title: "🔍 Add-on: Social media profile enrichment ($)"
      description: >-
        Enriched profiles are available in the Social profiles output tab. See the section
        description above for what data is retrieved and how it's priced.

        ⚠️ This returns personal data. You're responsible for having a legal basis to collect and
        use it under privacy laws.
      additionalProperties: false
      properties:
        facebooks:
          type: boolean
          title: Enable Facebook profile scraping
          description: >-
            Enable scraping detailed Facebook profile information for discovered Facebook URLs. This
            will provide additional data like follower counts, profile pictures, and more.
        instagrams:
          type: boolean
          title: Enable Instagram profile scraping
          description: >-
            Enable scraping detailed Instagram profile information for discovered Instagram URLs.
            This will provide additional data like follower counts, profile pictures, and more.
        youtubes:
          type: boolean
          title: Enable YouTube channel scraping
          description: >-
            Enable scraping detailed YouTube channel information for discovered YouTube URLs. This
            will provide additional data like subscriber counts, channel descriptions, and more.
        tiktoks:
          type: boolean
          title: Enable TikTok profile scraping
          description: >-
            Enable scraping detailed TikTok profile information for discovered TikTok URLs. This
            will provide additional data like follower counts, profile pictures, and more.
        twitters:
          type: boolean
          title: Enable X (Twitter) profile scraping
          description: >-
            Enable scraping detailed Twitter profile information for discovered X (Twitter) URLs.
            This will provide additional data like follower counts, profile pictures, and more.
      default:
        facebooks: false
        instagrams: false
        youtubes: false
        tiktoks: false
        twitters: false
    useBrowser:
      type: boolean
      title: Use browser for scraping
      description: If set, the scraper will use a browser for crawling the pages.
      default: false
    waitUntil:
      type: string
      title: When to consider a page loaded
      description: >-
        Select when a page should be considered loaded so that the Actor can start scraping it.
        *Only works with the browser.*
      enum:
        - commit
        - domcontentloaded
        - load
        - networkidle
      default: domcontentloaded
    proxyConfig:
      type: object
      title: Proxy
      description: >-
        Proxy servers let you bypass website protections, avoid IP address blocking, and view
        content for other countries. Try to use a proxy if you are experiencing timeout errors.
      default:
        useApifyProxy: true
