    personLocationCityIncludes:
      type: array
      title: Person city - Includes
      description: >-
        What this does: Includes only people in these cities.

        Best practice: Combine with country/state filters so city names are interpreted correctly.
      items:
        type: string
    personLocationCityExcludes:
      type: array
      title: Person city - Excludes
      description: >-
        What this does: Excludes people in these cities.

        Best practice: Use to remove metro areas that create low-fit results.
      items:
        type: string
    companySection:
      type: string
      title: "-"
      description: UI section
    companyMatchMode:
      type: string
      title: Combine company filters
      description: >-
        What this does: Controls how your separate Company filters combine - company name, industry
        and keywords. It does not change how any single filter matches text.

        Important: the default is Any, so a company only has to match ONE of them. If you set name =
        Acme and industry = Computer Software, Any returns Acme plus every software company. Choose
        All if a company must match every company filter you set.

        Best practice: Use All when you have set more than one company filter and want precision.
      enum:
        - all
        - any
      default: any
    companyNameIncludes:
      type: array
      title: Company name - Includes
      description: >-
        What this does: Includes leads at companies whose names match any entered value.

        Best practice: Use for account-based targeting (named account lists).
      items:
        type: string
    companyNameExcludes:
      type: array
      title: Company name - Excludes
      description: >-
        What this does: Excludes leads at companies whose names match any entered value.

        Best practice: Use to remove partners, competitors, or internal accounts.
      items:
        type: string
    companyNameMatchMode:
      type: string
      title: Company name matching
      description: >-
        What this does: Controls how closely a company name must match the text you enter. Broad
        matches all your words in any order, so "Tech Solutions" also finds "Solutions for Tech".
        Phrase requires the words together in order. Exact Prefix is strictest.

        Best practice: Start with Broad. Switch to Phrase or Exact if you see unrelated companies.
      enum:
        - broad
        - phrase
        - exact
      default: broad
    companyIndustryIncludes:
      type: array
      title: Industry - Includes
      description: >-
        What this does: Includes only selected company industries.

        Best practice: Start with a narrow set of primary industries, then expand.
      items:
        type: string
        enum:
          - Accounting
          - Agriculture
          - Airlines/Aviation
