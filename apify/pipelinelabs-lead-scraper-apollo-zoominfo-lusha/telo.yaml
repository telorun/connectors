    runOptionsSection:
      type: string
      title: "-"
      description: UI section
    resetProgress:
      type: boolean
      title: Reset saved progress
      description: >-
        What this does: Ignores saved cursor progress and starts this run from the beginning.

        Best practice: Use only when intentionally re-running the same search from scratch (can
        produce duplicates).
      default: false
    dontSaveProgress:
      type: boolean
      title: Don't save progress (always start from beginning)
      description: >-
        What this does: Disables cursor saving for this run, so future runs start from the beginning
        again.

        Best practice: Keep OFF for normal production extraction; turn ON only for temporary
        testing.
      default: false
    customOffset:
      type: integer
      title: Custom offset (optional)
      description: >-
        What this does: Starts extraction from a specific position in the result stream.

        Best practice: Leave empty unless you are intentionally skipping ahead or replaying a known
        offset.
      minimum: 0
    countOnly:
      type: boolean
      title: Count only (no leads extracted)
      description: >-
        What this does: Runs a fast count query and returns how many leads match your filters —
        without extracting any leads and without any charge.

        Best practice: Use this to validate your filters before committing to a full run.
      default: false
