    companyKeywordSection:
      type: string
      title: "-"
      description: UI section
    companyKeywordIncludes:
      type: array
      title: Company keyword - Includes
      description: >-
        What this does: Includes companies whose name/description contains these keywords.

        Best practice: Use product/problem keywords to find similar companies.
      items:
        type: string
    companyKeywordExcludes:
      type: array
      title: Company keyword - Excludes
      description: >-
        What this does: Excludes companies whose name/description contains these keywords.

        Best practice: Add obvious false-positive terms to clean results quickly.
      items:
        type: string
    companyKeywordMode:
      type: string
      title: Company keyword matching
      description: >-
        What this does: Controls how closely a company keyword must match. Broad matches all your
        words in any order. Phrase requires the words together in order. Exact Prefix is strictest.

        Best practice: Start with Broad. Move to Phrase or Exact when narrowing results.
      enum:
        - broad
        - phrase
        - exact
      default: broad
    companySizeSection:
      type: string
      title: "-"
      description: UI section
    companySizeIncludes:
      type: array
      title: Company size - Includes
      description: >-
        What this does: Includes selected company size buckets.

        Best practice: Pick the closest size band to your ideal customers first.
      items:
        type: string
        enum:
          - 1-10
          - 11-50
          - 51-200
          - 201-500
          - 501-1000
          - 1001-5000
          - 5001-10000
          - 10001+
    companySizeExcludes:
      type: array
      title: Company size - Excludes
      description: >-
        What this does: Excludes selected company size buckets.

        Best practice: Use to remove segments outside your target size profile.
      items:
        type: string
        enum:
          - 1-10
          - 11-50
          - 51-200
          - 201-500
          - 501-1000
          - 1001-5000
          - 5001-10000
          - 10001+
    companyEmployeeMin:
      type: integer
      title: Custom company size min (optional)
      description: >-
        What this does: Adds a custom company size minimum include range.

        Best practice: Use with Company size buckets when you need finer control.
      minimum: 0
    companyEmployeeMax:
      type: integer
      title: Custom company size max (optional)
      description: >-
        What this does: Adds a custom company size maximum include range.

        Best practice: Leave empty unless you need precision beyond the standard buckets.
      minimum: 0
    companyDomainSection:
      type: string
      title: "-"
      description: UI section
    companyDomainIncludes:
      type: array
      title: Company domain - Includes
      description: >-
        What this does: Includes only companies with these website domains.

        Best practice: Keep Domain match mode on Strict unless you intentionally need broader
        matching.
      items:
        type: string
    companyDomainExcludes:
      type: array
      title: Company domain - Excludes
      description: >-
        What this does: Excludes companies with these website domains.

        Best practice: Use to remove subsidiaries, duplicates, or known bad domains.
      items:
        type: string
    companyDomainMatchMode:
      type: string
      title: Company domain matching
      description: >-
        What this does: Controls how closely a company domain must match. Strict matches the exact
        domain. Contains matches any domain containing your text, which can return many unrelated
        companies.

        Best practice: Use Strict by default. Contains should be used intentionally for broad
        discovery.
      enum:
        - strict
        - contains
      default: strict
