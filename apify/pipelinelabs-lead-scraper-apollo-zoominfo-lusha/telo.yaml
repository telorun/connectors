kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item pipelinelabs/lead-scraper-apollo-zoominfo-lusha produces.
schema:
  type: object
  additionalProperties: true
---
kind: Telo.Definition
metadata:
  name: Run
  description: >-
    Run 🎉 Leads Scraper ✅ $0.8/1k Leads ✅ 250M+ Database ✅ Like Apollo and wait for its dataset
    items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
