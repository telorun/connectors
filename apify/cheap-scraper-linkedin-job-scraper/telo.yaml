---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of cheap_scraper/linkedin-job-scraper, from its build 0.0.49 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        One or more URLs of the pages where the crawler will start. Note that the Actor will
        additionally crawl job page data.
    keyword:
      type: array
      title: Keywords
      description: Keyword to search for. (e.g., Software Engineer)
    locations:
      type: array
      title: Locations
      description: >-
        One or more locations to search in (e.g. Montreal, Canada). Each location is combined with
        every keyword to generate one search per pair. When set alongside the legacy Location field,
        both are merged.
      uniqueItems: true
    location:
      type: string
      title: Location (Legacy)
      description: >-
        Single location to search in. Use the Locations field instead to search multiple locations
        at once.
    distance:
      type: string
      title: Distance (Search Radius)
      description: Search radius from the location in miles. Leave empty for default.
      enum:
        - ""
        - "5"
        - "10"
        - "15"
        - "25"
        - "50"
      default: ""
    publishedAt:
      type: string
      title: Published At
      description: How old publications should be in Days. Default is ANY.
      enum:
        - ""
        - r86400
        - r604800
        - r2592000
      default: ""
    jobType:
      type: array
      title: Job Type
      description: >-
        Filter by job type (Full-time, Part-time, Contract, etc.). Multiple selections allowed. When
        LinkedIn serves its classic search engine this filter works normally. When LinkedIn serves
        its AI search engine the filter is ignored, so the scraper instead embeds it into the search
        query itself, which the AI search understands: the search is retried once with e.g.
        'Full-time ' for a single selection or '(Full-time OR Contract) ' for multiple selections.
      uniqueItems: true
      items:
        type: string
        enum:
          - full-time
          - part-time
          - contract
          - temporary
          - internship
          - volunteer
    experienceLevel:
      type: array
      title: Experience Level
      description: >-
        Filter by experience level. Multiple selections allowed. When LinkedIn serves its classic
        search engine this filter works normally. When LinkedIn serves its AI search engine the
        filter is ignored, so the scraper instead embeds it into the search query itself, which the
        AI search understands: the search is retried once with e.g. 'Entry level ' for a single
        selection or '(Entry level OR Associate) ' for multiple selections.
      uniqueItems: true
      items:
        type: string
        enum:
          - internship
          - entry-level
          - associate
          - mid-senior
          - director
          - executive
    workType:
      type: array
      title: Work Type
      description: >-
        Filter by work location type (On-site, Remote, Hybrid). Multiple selections allowed. When
        LinkedIn serves its classic search engine this filter works normally. When LinkedIn serves
        its AI search engine the filter is ignored by LinkedIn and job pages have no field to verify
        it, so the scraper instead embeds the work type into the search query itself, which the AI
        search understands: the search is retried once with e.g. 'Remote ' for a single selection or
        '(Remote OR "On-Site") ' for multiple selections.
      uniqueItems: true
      items:
        type: string
        enum:
          - on-site
          - remote
          - hybrid
    companyInclude:
      type: array
      title: Only These Companies
      description: >-
        Restrict the search to specific companies. Add one company name per entry (e.g. Google,
        Shopify). Each name is resolved to a LinkedIn company ID and added to the search URL —
        LinkedIn will only return jobs from those companies.

        If a name cannot be matched, it is silently skipped.
      uniqueItems: true
    filterUnder10Applicants:
      type: boolean
      title: Under 10 Applicants Only
      description: >-
        When enabled, LinkedIn will only return jobs with fewer than 10 applicants. Appends
        `f_EA=true` to the search URL. Keyword-based search only — does not affect URL-based search.
      default: false
    filterEasyApply:
      type: boolean
      title: Easy Apply Only
      description: >-
        When enabled, LinkedIn will only return jobs that support Easy Apply (apply directly on
        LinkedIn without leaving the site). Appends `f_AL=true` to the search URL. Keyword-based
        search only — does not affect URL-based search.
      default: false
    subLocationExclude:
      type: array
      title: Skip These Cities / Areas
      description: >-
        Exclude jobs from specific cities or areas. Add each city name as a separate entry — any job
        whose location contains that name will be skipped (e.g. add "Laval" to exclude all jobs in
        Laval). Works independently of the Locations field. Also works with URL-based search.
      uniqueItems: true
    companyExclude:
      type: array
      title: Exclude These Companies
      description: >-
        Skip jobs from specific companies. Add one company name per entry — any job whose company
        name exactly matches (case-insensitive) will not be collected. Works for both keyword-based
        and URL-based searches.
      uniqueItems: true
    jobTitleExclude:
      type: array
      title: Exclude Job Titles Containing
      description: >-
        Skip jobs whose title contains any of these keywords (whole-word, case-insensitive). For
        example, entering "senior" will exclude "Senior Software Engineer" but not "seniority".
        Works for both keyword-based and URL-based searches.
      uniqueItems: true
    jobIndustryInclude:
      type: array
      title: Include Industries
      description: >-
        Only keep jobs where the **industry** matches one of the selected values.

        **Note:** This takes priority over **Exclude Industries** when both are set.

        Jobs are still collected and counted toward billing. Use `dynamicFilterMatch` to filter them
        in your results. Non-matching jobs are saved with `dynamicFilterMatch: false`.

        Find all LinkedIn industries here: [LinkedIn Industry
        Codes](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/industry-codes-v2)
      uniqueItems: true
      items:
        type: string
