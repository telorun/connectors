    excludeRecruitingAgencies:
      type: boolean
      title: Exclude Recruiting Agencies
      description: >-
        When enabled, jobs posted by staffing and recruiting agencies will be flagged with
        `dynamicFilterMatch: false`. Jobs are still collected and counted toward your billing — use
        `dynamicFilterMatch` to filter them out in your results.`
      default: false
    companySizeMin:
      type: integer
      title: Company Min Employees
      description: >-
        Only keep jobs from companies with at least this many employees. Jobs that do not match are
        still collected and counted toward your billing — use `dynamicFilterMatch` to filter them
        out.
      minimum: 1
    companySizeMax:
      type: integer
      title: Company Max Employees
      description: >-
        Only keep jobs from companies with at most this many employees. Jobs that do not match are
        still collected and counted toward your billing — use `dynamicFilterMatch` to filter them
        out.
      minimum: 1
    companyOrganizationTypeInclude:
      type: array
      title: Include Company Organization Types
      description: >-
        Only keep jobs from companies whose LinkedIn company page organization type matches one of
        the selected values. Takes priority over "Exclude Company Organization Types" when both are
        set.

        Jobs are still collected and counted toward your billing — use `dynamicFilterMatch` to
        filter them out in your results. Non-matching jobs are saved with `dynamicFilterMatch:
        false`.

        Full list of organization types at [LinkedIn Company
        Profile](https://learn.microsoft.com/en-us/linkedin/shared/references/fields/company-profile)
      uniqueItems: true
      items:
        type: string
        enum:
          - Public Company
          - Educational
          - Self Employed
          - Government Agency
          - Non Profit
          - Self Owned
          - Privately Held
          - Partnership
    companyOrganizationTypeExclude:
      type: array
      title: Exclude Company Organization Types
      description: >-
        Flag jobs from companies whose LinkedIn company page organization type matches any of the
        selected values as `dynamicFilterMatch: false`. Only applies when "Include Company
        Organization Types" is not set. Jobs are still collected and counted toward your billing —
        use `dynamicFilterMatch` to filter them out in your results.
         Full list of organization types at [LinkedIn Company Profile](https://learn.microsoft.com/en-us/linkedin/shared/references/fields/company-profile)
      uniqueItems: true
      items:
        type: string
        enum:
          - Public Company
          - Educational
          - Self Employed
          - Government Agency
          - Non Profit
          - Self Owned
          - Privately Held
          - Partnership
    companyFoundedDateMin:
      type: integer
      title: Company Founded After (year)
      description: >-
        Only keep jobs from companies founded in or after this year. Jobs from companies whose
        founding year is not available always pass.

        Jobs are still collected and counted toward your billing — use `dynamicFilterMatch` to
        filter them out in your results.
      minimum: 1800
    companyFoundedDateMax:
      type: integer
      title: Company Founded Before (year)
      description: >-
        Only keep jobs from companies founded in or before this year. Jobs from companies whose
        founding year is not available always pass.

        Jobs are still collected and counted toward your billing — use `dynamicFilterMatch` to
        filter them out in your results.
      minimum: 1800
    companyFollowersCountMin:
      type: integer
      title: Company Min Followers
      description: >-
        Only keep jobs from companies with at least this many LinkedIn followers. Jobs from
        companies whose follower count is not available always pass.

        Jobs are still collected and counted toward your billing — use `dynamicFilterMatch` to
        filter them out in your results.
      minimum: 0
    companyFollowersCountMax:
      type: integer
      title: Company Max Followers
      description: >-
        Only keep jobs from companies with at most this many LinkedIn followers. Jobs from companies
        whose follower count is not available always pass.

        Jobs are still collected and counted toward your billing — use `dynamicFilterMatch` to
        filter them out in your results.
      minimum: 0
    requireRecruiterProfile:
      type: boolean
      title: Recruiter Profile Required
      description: >-
        When enabled, only jobs that have a recruiter profile associated with the posting will have
        `dynamicFilterMatch: true`. Jobs without a recruiter profile are still collected and billed
        — use `dynamicFilterMatch` to filter them out.
      default: false
    requireSalaryInfo:
      type: boolean
      title: Salary Info Required
      description: >-
        When enabled, only jobs that include salary information in the posting will have
        `dynamicFilterMatch: true`. Jobs without salary info are still collected and billed — use
        `dynamicFilterMatch` to filter them out.
      default: false
    resumeKeywords:
      type: array
      title: Skills and Keywords
      description: >-
        Each entry has a required `keyword` and optional `aliases` for abbreviations (e.g.
        `JavaScript` → `JS`). Each job in the output will include `matchedKeywords`,
        `unmatchedKeywords`, and `keywordMatchScorePercentage` (0–100).
      items:
        type: object
        additionalProperties: false
        required:
          - keyword
        properties:
          keyword:
            type: string
            title: Keyword
            description: Skill or keyword from your resume (e.g. JavaScript)
          aliases:
            type: array
            title: Aliases
            description: Alternate names or abbreviations (e.g. JS)
    maxItems:
      type: integer
      title: Maximum Results
      description: >-
        Maximum number of job listings to scrape. Leave empty for no limit. Note: Minimum is 150
        results when using pay-per-result billing.
      minimum: 150
    saveOnlyUniqueItems:
      type: boolean
      title: Save Only Unique Items
      description: If enabled, only unique items will be saved. Default is false.
      default: false
    enrichCompanyData:
      type: boolean
      title: Enrich Company Data
      description: >-
        When disabled, the scraper runs significantly faster by skipping additional company page
        requests. When enabled, the scraper fetches extra company details including: company
        description, full address (street, city, region, postal code, country), employee count, and
        company website. Default is disabled for optimal performance.
      default: false
    salaryBase:
      type: string
      title: Minimum Salary
      description: >-
        Filter by minimum salary. Only one value allowed. 🛠️ In maintenance: this filter currently
        only works when LinkedIn serves its classic search engine. When LinkedIn serves its new
        AI-powered search, it silently ignores this filter, and since salary cannot be verified
        reliably from job postings, the scraper has no workaround - results will include jobs below
        this salary. It will be restored once LinkedIn supports it again.
      enum:
        - ""
        - "40000"
        - "60000"
        - "80000"
        - "100000"
        - "120000"
    jobFunctionInclude:
      type: array
      title: Include Job Functions (Deprecated)
      description: >-
        ⚠️ **Deprecated, no longer available:** LinkedIn no longer exposes the job function on
        public job pages, so the scraper cannot read it anymore (the output field `workType` is
        empty). Using it flags every job with `dynamicFilterMatch: false`. Do not use it. Only keep
        jobs where the **job function** matches one of the selected values.

        **Note:** This takes priority over **Exclude Job Functions** when both are set.

        Jobs are still collected and counted toward billing. Use `dynamicFilterMatch` to filter them
        in your results. Non-matching jobs are saved with `dynamicFilterMatch: false`.

        Applies to both URL-based and keyword-based searches.

        Find all LinkedIn job functions here: [LinkedIn Job Function
        Codes](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/job-function-codes)
      uniqueItems: true
      items:
        type: string
        enum:
          - Accounting / Auditing
          - Administrative
          - Advertising
          - Analyst
          - Art / Creative
          - Business Development
          - Consulting
          - Customer Service
          - Design
          - Distribution
          - Education
          - Engineering
          - Finance
          - General Business
          - HealthCare Provider
          - Human Resources
          - Information Technology
          - Legal
          - Management
          - Manufacturing
          - Marketing
          - Other
          - Product Management
          - Production
          - Project Management
          - Public Relations
          - Purchasing
          - QualityAssurance
          - Research
          - Sales
          - Science
          - Strategy / Planning
          - Supply Chain
          - Training
          - Writing / Editing
    jobFunctionExclude:
      type: array
      title: Exclude Job Functions (Deprecated)
      description: >-
        ⚠️ **Deprecated, no longer available:** LinkedIn no longer exposes the job function on
        public job pages, so the scraper cannot read it anymore (the output field `workType` is
        empty). Using it has no effect (no job is ever excluded). Do not use it. Exclude jobs whose
        **job function** matches any of the selected values. Only applies when "Include Job
        Functions" is not set.

        Jobs are still collected and counted toward your billing — use `dynamicFilterMatch` to
        filter them out in your results. Non-matching jobs are saved with `dynamicFilterMatch:
        false`.

        Find all LinkedIn job functions here: [LinkedIn Job Function
        Codes](https://learn.microsoft.com/en-us/linkedin/shared/references/reference-tables/job-function-codes)
      uniqueItems: true
      items:
        type: string
        enum:
          - Accounting / Auditing
          - Administrative
          - Advertising
          - Analyst
          - Art / Creative
          - Business Development
          - Consulting
          - Customer Service
          - Design
          - Distribution
          - Education
          - Engineering
          - Finance
          - General Business
          - HealthCare Provider
          - Human Resources
          - Information Technology
          - Legal
          - Management
          - Manufacturing
