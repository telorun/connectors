kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item cheap_scraper/linkedin-job-scraper produces.
schema:
  type: object
  additionalProperties: true
  properties:
    jobId:
      type:
        - string
        - "null"
      description: Unique LinkedIn job identifier
    jobTitle:
      type:
        - string
        - "null"
      description: Job position title
    location:
      type:
        - string
        - "null"
      description: Job location as text
    salaryInfo:
      type:
        - array
        - "null"
      description: Salary range as formatted strings (e.g., ['$69100.00', '$129200.00'])
      items:
        type:
          - string
          - "null"
    postedTime:
      type:
        - string
        - "null"
      description: Human-readable posted time (e.g., '2 days ago')
    publishedAt:
      type:
        - string
        - "null"
      description: ISO 8601 date when job was published
    searchString:
      type:
        - string
        - "null"
      description: Search query that found this job
    jobUrl:
      type:
        - string
        - "null"
      description: LinkedIn job posting URL
    companyName:
      type:
        - string
        - "null"
      description: Company name
    companyUrl:
      type:
        - string
        - "null"
      description: LinkedIn company page URL
    companyLogo:
      type:
        - string
        - "null"
      description: Company logo image URL
    companyId:
      type:
        - string
        - "null"
      description: LinkedIn company identifier
    companyDescription:
      type:
        - string
        - "null"
      description: Company description (when enrichCompanyData=true)
    companyEmployeeCount:
      type:
        - number
        - "null"
      description: Number of employees (when enrichCompanyData=true)
    companyWebsite:
      type:
        - string
        - "null"
      description: Company website URL (when enrichCompanyData=true)
    companyAddress:
      type:
        - object
        - "null"
      description: Company address details (when enrichCompanyData=true)
      additionalProperties: true
      properties:
        streetAddress:
          type:
            - string
            - "null"
        addressLocality:
          type:
            - string
            - "null"
        addressRegion:
          type:
            - string
            - "null"
        postalCode:
          type:
            - string
            - "null"
        addressCountry:
          type:
            - string
            - "null"
    companyIndustry:
      type:
        - string
        - "null"
      description: >-
        Industry category from the LinkedIn company page About section (when enrichCompanyData=true)
    companyEmployeeCountRange:
      type:
        - string
        - "null"
      description: >-
        Employee count range displayed on the company page, e.g. '1,001-5,000 employees' (when
        enrichCompanyData=true)
    companyOrganizationType:
      type:
        - string
        - "null"
      description: Organisation type, e.g. 'Privately Held', 'Public Company' (when enrichCompanyData=true)
    companyFoundedDate:
      type:
        - string
        - "null"
      description: Year the company was founded (when enrichCompanyData=true)
    companySpecialties:
      type:
        - array
        - "null"
      description: List of company specialties from the About section (when enrichCompanyData=true)
      items:
        type:
          - string
          - "null"
    companyFollowersCount:
      type:
        - number
        - "null"
      description: Number of LinkedIn followers the company has (when enrichCompanyData=true)
    companyOfficeLocations:
      type:
        - array
        - "null"
      description: List of office addresses listed on the company page (when enrichCompanyData=true)
      items:
        type:
          - string
          - "null"
    companyAffiliatedPages:
      type:
        - array
        - "null"
      description: Names of affiliated LinkedIn company pages (when enrichCompanyData=true)
      items:
        type:
          - string
          - "null"
    companyRecentPosts:
      type:
        - array
        - "null"
      description: Recent posts published by the company on LinkedIn (when enrichCompanyData=true)
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          text:
            type:
              - string
              - "null"
            description: Post text content
          datePublished:
            type:
              - string
              - "null"
            description: ISO 8601 date the post was published
          url:
            type:
              - string
              - "null"
            description: URL to the post
    jobDescription:
      type:
        - string
        - "null"
      description: Full job description (plain text)
    applicationsCount:
      type:
        - string
        - "null"
      description: Number of applications received
    contractType:
      type:
        - string
        - "null"
      description: Employment type (Full-time, Part-time, etc.)
    experienceLevel:
      type:
        - string
        - "null"
      description: Required experience level
    yearsOfExperience:
      type:
        - array
        - "null"
      description: Structured years of experience requirements extracted from the job description
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          years:
            type:
              - string
              - "null"
            description: "Normalized value: '5', '3+', '2-5'"
          context:
            type:
              - string
              - "null"
            description: Surrounding text providing context for the requirement
          lang:
            type:
              - string
              - "null"
            description: "Detected language: en, fr, de, es, nl"
    workType:
      type:
        - string
        - "null"
      description: >-
        Deprecated: job function/work type. LinkedIn no longer exposes it, so this field is now
        always empty.
    sector:
      type:
        - string
        - "null"
      description: Industry sector
    applyUrl:
      type:
        - string
        - "null"
      description: URL to apply for the job
    applyType:
      type:
        - string
        - "null"
      description: "Application type: EASY_APPLY or EXTERNAL"
    posterFullName:
      type:
        - string
        - "null"
      description: Recruiter/poster full name
    posterProfileUrl:
      type:
        - string
        - "null"
      description: Recruiter LinkedIn profile URL
    dynamicFilterMatch:
      type:
        - boolean
        - "null"
      description: >-
        Indicates whether the job passed all enabled dynamic (post-fetch) filters. True when no
        dynamic filters are configured or all configured filters matched. False when the job did not
        meet the criteria — it is still saved to the dataset. See the 🔎 Dynamic Filters section in
        the input schema for available filters.
    matchedKeywords:
      type:
        - array
        - "null"
      description: >-
        Resume keywords from 'resumeKeywords' input that were found in the job description. Only
        present when 'resumeKeywords' input is provided.
      items:
        type:
          - string
          - "null"
    unmatchedKeywords:
      type:
        - array
        - "null"
      description: >-
        Resume keywords from 'resumeKeywords' input that were NOT found in the job description. Only
        present when 'resumeKeywords' input is provided.
      items:
        type:
          - string
          - "null"
    keywordMatchScorePercentage:
      type:
        - number
        - "null"
      description: >-
        Percentage of your resume keywords found in the job description (0–100). Computed as:
        round(matched ÷ total × 100). Example: 3 out of 5 keywords matched = 60. Only present when
        'resumeKeywords' input is provided.
---
kind: Telo.Definition
metadata:
  name: Run
  description: >-
    Run LinkedIn Jobs Scraper | Remove Duplicate Jobs | Pay Per Result and wait for its dataset
    items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActorSync
    metadata:
      name: run
    client: !cel "self.client"
invoke: !ref run
inputs:
  actorId: cheap_scraper/linkedin-job-scraper
  build: 0.0.49
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
result:
  items: !cel "result.body"
---
kind: Telo.Definition
metadata:
  name: Start
  description: >-
    Run LinkedIn Jobs Scraper | Remove Duplicate Jobs | Pay Per Result in the background, poll until
    the run finishes, and return the run and its dataset items. Raises APIFY_RUN_NOT_SUCCEEDED when
    the run ends FAILED, TIMED-OUT or ABORTED.
capability: Telo.Invocable
throws:
  codes:
    APIFY_RUN_NOT_SUCCEEDED:
      description: >-
        The run finished without succeeding. `data` is the Apify run object (id, status,
        statusMessage, …).
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - run
      - items
    properties:
      run:
        type: object
        additionalProperties: true
        description: "The finished Apify run: id, status, defaultDatasetId, stats, usageTotalUsd, …"
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActor
    metadata:
      name: start
    client: !cel "self.client"
  - kind: Apify.GetRun
    metadata:
      name: getRun
    client: !cel "self.client"
  - kind: Apify.GetDatasetItems
    metadata:
      name: getItems
    client: !cel "self.client"
  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
        inputs:
          runId: !cel "inputs.runId"
          waitForFinish: 60
    outputs:
      run: !cel "steps.poll.result.body.data"
  - kind: Flow.Sequence
    metadata:
      name: seq
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - input
        properties:
          input:
            type: object
          timeout:
            type:
              - integer
              - "null"
          memory:
            type:
              - integer
              - "null"
          maxItems:
            type:
              - integer
              - "null"
          maxTotalChargeUsd:
            type:
              - number
              - "null"
    steps:
      - name: start
        invoke: !ref start
        inputs:
          actorId: cheap_scraper/linkedin-job-scraper
          build: 0.0.49
          input: !cel "inputs.input"
          timeout: !cel "inputs.?timeout.orValue(null)"
          memory: !cel "inputs.?memory.orValue(null)"
          maxItems: !cel "inputs.?maxItems.orValue(null)"
          maxTotalChargeUsd: !cel "inputs.?maxTotalChargeUsd.orValue(null)"
      - name: wait
        invoke: !ref wait
        inputs:
          runId: !cel "steps.start.result.body.data.id"
      - name: check
        if: !cel "steps.wait.result.run.status != 'SUCCEEDED'"
        then:
          - name: fail
            throw:
              code: APIFY_RUN_NOT_SUCCEEDED
              message: !cel >-
                'Apify run ' + steps.wait.result.run.id + ' finished with status ' +
                steps.wait.result.run.status
              data: !cel "steps.wait.result.run"
      - name: items
        invoke: !ref getItems
        inputs:
          datasetId: !cel "steps.wait.result.run.defaultDatasetId"
    outputs:
      run: !cel "steps.wait.result.run"
      items: !cel "steps.items.result.body"
invoke: !ref seq
inputs:
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
