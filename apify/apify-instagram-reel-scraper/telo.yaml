kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-reel-scraper, from its build 0.0.614 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - username
  properties:
    username:
      type: array
      title: 🎞️ Instagram username, profile URL, ID, reel URL or audio URL
      description: >-
        Add Instagram usernames, profile URLs, IDs, or direct reel URLs. Each item will be processed
        individually.
    resultsLimit:
      type: integer
      title: 💯 Maximum reels per profile
      description: >-
        Set how many reels should be scraped per profile or URL. For example, if set to 5, the
        scraper will extract up to 5 reels from each profile. This setting is ignored when scraping
        direct reel URLs.
      minimum: 1
    onlyPostsNewerThan:
      type: string
      title: 📅 Scrape reels newer than
      description: >-
        Scrape reels from the provided date up to the present. For audio URLs this filter is
        ignored. Supported formats include `YYYY-MM-DD`, full ISO timestamps (e.g.
        `2025-09-23T10:02:01`), or relative time such as `1 day`, `2 weeks`, or `3 months`. All
        times are evaluated in UTC.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    skipPinnedPosts:
      type: boolean
      title: 📌 Skip pinned reels
      description: Enable this option if you want to exclude pinned reels from the overall results.
      default: false
    skipTrialReels:
      type: boolean
      title: 🎬 Skip trial reels
      description: >-
        If enabled, the feed will be scraped without trial reels: an Instagram feature creators use
        to test a video with non-followers before sharing it with their existing audience. Learn
        more (https://creators.instagram.com/blog/instagram-trial-reels).
      default: false
    includeSharesCount:
      type: boolean
      title: $ Include shares count
      description: >-
        Extract the number of shares for each reel. Available for paying users only. Upgrade to the
        Starter plan (https://console.apify.com/billing/subscription) to unlock it.
      default: false
    includeTranscript:
      type: boolean
      title: $ Include transcript
      description: >-
        Extract a text transcript of the reel audio for content analysis. This add-on feature
        (https://apify.com/apify/instagram-reel-scraper/pricing) is charged per minute of audio.
      default: false
    includeDownloadedVideo:
      type: boolean
      title: $ Include downloaded video
      description: >-
        Download the reel video and store a local copy before Instagram links expire. This add-on
        feature (https://apify.com/apify/instagram-reel-scraper/pricing) is charged per 1 MB
        downloaded.
      default: false
