kind: Telo.Library
metadata:
  name: ApifyInstagramReelScraper
  version: 0.0.614
  description: >-
    Instagram Reel Scraper: the Apify actor apify/instagram-reel-scraper (build 0.0.614) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape or download Instagram reels. Just add Instagram profile or reel URL, and get caption,
    timestamp, transcript, hashtags, mentions, tagged users, comments, likes, shares, views,
    duration, and downloaded video. Export scraped data, schedule via API, and integrate with other
    tools or AI workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
