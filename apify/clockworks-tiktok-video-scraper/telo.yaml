kind: Telo.Library
metadata:
  name: ClockworksTiktokVideoScraper
  version: 0.0.477
  description: >-
    TikTok Video Scraper: the Apify actor clockworks/tiktok-video-scraper (build 0.0.477) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from chosen tiktoks. Just add a TikTok URL and get TikTok video and profile data:
    URLs, numbers of shares, followers, hashtags, hearts, video, and music metadata. Export scraped
    data, run the scraper via API, schedule and monitor runs or integrate with other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
