kind: Telo.Library
metadata:
  name: ClockworksTiktokScraper
  version: 0.0.620
  description: >-
    TikTok Scraper: the Apify actor clockworks/tiktok-scraper (build 0.0.620) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Extract data from TikTok videos, hashtags, and users. Use URLs or search queries to scrape
    TikTok profiles, hashtags, posts, URLs, shares, followers, hearts, names, video, and
    music-related data. Export scraped data, run the scraper via API, schedule and monitor runs or
    integrate with other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of clockworks/tiktok-scraper, from its build 0.0.620 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    hashtags:
      type: array
      title: "#️⃣ Videos with this hashtag"
      description: >-
        Just add one or more TikTok hashtags and the scraper will collect data about videos
        containing this hashtag: likes, users, followers and more.
         You can enter the hashtags one by one, or use the Bulk edit section to add a prepared list.
    resultsPerPage:
      type: integer
      title: 💯 Number of videos per hashtag, profile or search
      description: >-
        Add the number of tiktoks you want to scrape per hashtag, profile, or search query. This
        field is applicable to #️⃣ Hashtags, 😎 Profiles, and 🔍 Search.
      minimum: 1
      maximum: 1000000
      default: 1
    profiles:
      type: array
      title: Usernames
      description: >-
        Add one or multiple TikTok usernames or user IDs you want to scrape. You can enter the
        usernames one by one, or use the Bulk edit section to add a prepared list.
    profileScrapeSections:
      type: array
      title: Profile sections to scrape
      description: >-
        If a profile has reposted videos, you can scrape them by selecting 'Reposts'. If a profile
        currently has an active story, you can scrape it by selecting 'Stories'
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          - videos
          - reposts
          - stories
      default:
        - videos
    profileSorting:
      type: string
      title: Profile video sorting
      description: >-
        Select Latest to scrape the most recent videos first, Oldest - the oldest videos first,
        Popular - the most popular videos first. Date filters only work with Latest and Oldest. Only
        supported for Videos section. Note: Popular sorting is limited by TikTok to approximately
        400–500 videos per profile and may return significantly fewer results than Latest or Oldest.
      enum:
        - latest
        - popular
        - oldest
      default: latest
    excludePinnedPosts:
      type: boolean
      title: Exclude pinned posts
      description: >-
        Tick to exclude pinned posts from profiles. Pinned posts are usually the first videos on a
        profile's page.
      default: false
    oldestPostDateUnified:
      type: string
      title: 📅 Date filter - scrape profile videos published after [date] ($)
      description: >-
        Optional charged filter. Only videos uploaded after or on this date will be scraped.
        Alternatively, specify how old the scraped videos should be in days. Putting 1 will get you
        only today's posts, 2 - yesterday's and today's, and so on.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    newestPostDate:
      type: string
      title: 📅 Date filter - scrape profile videos published before [date] ($)
      description: Optional charged filter. Only videos uploaded before or on this date will be scraped.
    mostDiggs:
      type: integer
      title: ⭐ Popularity filter - scrape videos with number of hearts < [number] ($)
      description: >-
        Optional charged filter. Scrapes only videos with less hearts than the number you add.
        Doesn't work with date filters
      minimum: 1
    leastDiggs:
      type: integer
      title: ⭐ Popularity filter - scrape videos with number of hearts ≥ [number] ($)
      description: >-
        Optional charged filter. Scrapes only videos with no less hearts than the number you add.
        Doesn't work with date filters
      minimum: 1
    maxFollowersPerProfile:
      type: integer
      title: 🗂️ Maximum number of followers profiles ($)
      description: >-
        Scrapes number of 'Followers' profiles requested from the inputted profiles. You can find
        the link to the dataset under the followDatasetUrl field in the output. If you want to
        scrape only Followers/Following profiles, go to our TikTok Followers Scraper.
      minimum: 0
    maxFollowingPerProfile:
      type: integer
      title: 🗂️ Maximum number of following profiles ($)
      description: >-
        Scrapes number of 'Following' profiles requested from the inputted profiles. You can find
        the link to the dataset under the followDatasetUrl field in the output. If you want to
        scrape only Followers/Following profiles, go to our TikTok Followers Scraper.
      minimum: 0
    searchQueries:
      type: array
      title: Search queries
      description: >-
        Your keyword will apply to both videos and profiles. Use the Search sorting field below to
        specify whether you want your search to apply to top content, videos or users.
         As for your query's format, you can use any query that works on TikTok.
    searchSection:
      type: string
      title: Top/Video/Profile section
      description: >-
        By default, this scraper will sort the search results by whatever shows up in the Top
        section of TikTok search.
         But you can narrow it down: if you want to apply your search query to just videos, use Video, just profiles - Profile.
      enum:
        - ""
        - /video
        - /user
      default: ""
    maxProfilesPerQuery:
      type: integer
      title: Number of profiles per query
      description: >-
        Only applies to profile searches. In this case ignore the  💯 Number of videos  section and
        choose the number of profiles you want to scrape here.
      minimum: 1
      default: 10
    videoSearchSorting:
      type: string
      title: 🎯 Video search sorting ($)
      description: >-
        Optional charged filter. Select how you want the search results to be sorted when searching
        for videos. Only valid with `/video` search section.
      enum:
        - MOST_RELEVANT
        - MOST_LIKED
        - LATEST
      default: MOST_RELEVANT
    videoSearchDateFilter:
      type: string
      title: 📅 Video search date filter ($)
      description: >-
        Optional charged filter. Select a date range in which to search for videos. Only valid with
        `/video` search section.
      enum:
        - ALL_TIME
        - PAST_24_HOURS
        - PAST_WEEK
        - PAST_MONTH
        - LAST_3_MONTHS
        - LAST_6_MONTHS
      default: ALL_TIME
    scrapeRelatedSearchWords:
      type: boolean
      title: Scrape related search words
      description: >-
        Tick to include the keywords TikTok shows in the 'Others also searched for' section on the
        search results page. The words will be added to every video result.
      default: false
    postURLs:
      type: array
      title: Direct URLs for scraping specific tiktoks
      description: >-
        Add the URLs of tiktok videos you want to scrape. You can paste video URLs one by one, or
        use the Bulk edit section to add a prepared list.
    scrapeRelatedVideos:
      type: boolean
      title: Scrape related videos
      description: >-
        Tick to scrape related videos for the post URLs you provide.

        - The maximum number of scraped related videos is set by the `resultsPerPage` count.

        - Note that this only works for direct video URLs from the `postURLs` field.
      default: false
    scrapeAdditionalAuthorMeta:
      type: boolean
      title: Scrape additional author profile metadata
      description: >-
        Tick to fetch full author profile data (createTime, roomId) for each scraped video. Note:
        when scraping by profile URL, this data is already included by default — this option only
        makes a difference for other search types (e.g. hashtags, keywords).
      default: false
    shouldDownloadVideos:
      type: boolean
      title: "⬇️ Add-on: video download ($)"
      description: This is a charged add-on. Tick to download TikTok videos.
      default: false
    shouldDownloadCovers:
      type: boolean
      title: Include thumbnails
      description: Tick to download TikTok video cover images (thumbnails).
      default: false
    shouldDownloadSlideshowImages:
      type: boolean
      title: Download slideshow images
      description: Tick to download TikTok slideshow images.
      default: false
    shouldDownloadAvatars:
      type: boolean
      title: Include profile avatars
      description: Tick to download authors' profile pictures.
      default: false
    shouldDownloadMusicCovers:
      type: boolean
      title: Include sound covers
      description: Tick to download cover images of sounds used in posts.
      default: false
    videoKvStoreIdOrName:
      type: string
      title: >-
        ✍️ Name your storage for videos. Unnamed key-value stores will be deleted after 7 days (or
        longer on paid plans)
      description: >-
        Name (or ID) of the Key Value Store where the videos and other media like thumbnails will be
        stored. Omit to store in the default one. Using this option will provide a named Key-Value
        store can help bypass data retention and store the content forever until the store is
        manually deleted.

        The Key-Value store's name can consist of a versatile combination of uppercase letters,
        lowercase letters, digits, or hyphens, all without any spaces.
      pattern: ^[a-zA-Z0-9-]+$
    downloadSubtitlesOptions:
      type: string
      title: Subtitles & Transcription
      description: >-
        Choose how to handle subtitles and audio transcription for input videos. Subtitles are
        provided by TikTok for some videos, and transcription means that this Actor will use
        speech-to-text AI to generate video transcript. Transcripts are charged as an extra event
        according to your plan.
      enum:
        - NEVER_DOWNLOAD_SUBTITLES
        - DOWNLOAD_SUBTITLES
        - DOWNLOAD_AND_TRANSCRIBE_VIDEOS_WITHOUT_SUBTITLES
        - TRANSCRIBE_ALL_VIDEOS
      default: NEVER_DOWNLOAD_SUBTITLES
    aiVideoDescription:
      type: boolean
      title: AI video description
      description: >-
        Use AI to generate a time-segmented description of each video (what is seen and heard, per
        scene). Provided inline under `videoMeta.aiVideoDescription`. Charged per video-second, only
        when the description is produced successfully.
      default: false
    aiVideoSummary:
      type: boolean
      title: AI video summary
      description: >-
        Use AI to generate a high-level summary of each video as a piece of content. Provided inline
        under `videoMeta.aiVideoSummary`. Charged per video-second, only when the summary is
        produced successfully.
      default: false
    commentsPerPost:
      type: integer
      title: Maximum comments per post
      description: >-
        The number of comments extracted from every result. Due to TikTok API limitations, the
        actual number of scraped comments may differ, especially for posts with thousands of
        comments. The link to the dataset will be under a field commentsDatasetURL in the output.
      minimum: 0
    topLevelCommentsPerPost:
      type: integer
      title: Maximum top-level comments per post
      description: The maximum number of top-level (non-reply) comments you want from a single post.
      minimum: 0
    maxRepliesPerComment:
      type: integer
      title: Maximum replies per comment
      description: >-
        The maximum number of replies you want from a single comment.

        Note: Successful extraction of all desired replies is currently not guaranteed.
      minimum: 0
    proxyCountryCode:
      type: string
      title: Proxy country
      description: >-
        Country to use with proxy. Use it in case you want to scrape posts only available for some
        country.
      enum:
        - None
        - AF
        - AL
        - DZ
        - AS
        - AD
        - AO
        - AI
        - AG
