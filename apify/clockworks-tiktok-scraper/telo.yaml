            - "null"
    mediaUrls:
      type:
        - array
        - "null"
      description: Array of media URLs associated with the video
      items:
        type:
          - string
          - "null"
    slideshowImageLinks:
      type:
        - array
        - "null"
      description: Image links for slideshow-style posts
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          tiktokLink:
            type:
              - string
              - "null"
          downloadLink:
            type:
              - string
              - "null"
    diggCount:
      type:
        - number
        - "null"
      description: Number of likes (hearts) the video has received
    shareCount:
      type:
        - number
        - "null"
      description: Number of times the video has been shared
    playCount:
      type:
        - number
        - "null"
      description: Number of times the video has been viewed
    commentCount:
      type:
        - number
        - "null"
      description: Number of comments on the video
    collectCount:
      type:
        - number
        - "null"
      description: Number of times the video has been saved/bookmarked
    repostCount:
      type:
        - number
        - "null"
      description: Number of times the video has been reposted
    mentions:
      type:
        - array
        - "null"
      description: Array of usernames mentioned in the video caption
      items:
        type:
          - string
          - "null"
    detailedMentions:
      type:
        - array
        - "null"
      description: Detailed information about users mentioned in the caption
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          id:
            type:
              - string
              - "null"
          name:
            type:
              - string
              - "null"
          nickName:
            type:
              - string
              - "null"
          profileUrl:
            type:
              - string
              - "null"
          postUrl:
            type:
              - string
              - "null"
          secUid:
            type:
              - string
              - "null"
    hashtags:
      type:
        - array
        - "null"
      description: Array of hashtags used in the video caption
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          id:
            type:
              - string
              - "null"
          name:
            type:
              - string
              - "null"
          title:
            type:
              - string
              - "null"
          cover:
            type:
              - string
              - "null"
    effectStickers:
      type:
        - array
        - "null"
      description: Visual effects and stickers applied to the video
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          ID:
            type:
              - string
              - "null"
          name:
            type:
              - string
              - "null"
          stickerStats:
            type:
              - object
              - "null"
            additionalProperties: true
            properties:
              useCount:
                type:
                  - number
                  - "null"
    isSlideshow:
      type:
        - boolean
        - "null"
      description: Whether the post is a slideshow of images rather than a video
    isPinned:
      type:
        - boolean
        - "null"
      description: Whether the video is pinned to the author's profile
    isSponsored:
      type:
        - boolean
        - "null"
      description: Whether the video contains sponsored content
    hasTikTokShopProduct:
      type:
        - boolean
        - "null"
      description: >-
        Whether the video has a TikTok Shop product attached. Only meaningful when present: an
        omitted value means we could not determine it, not that the video has no product. Search
        results are the case where TikTok often does not expose the signal.
    commentsDatasetUrl:
      type:
        - string
        - "null"
      description: URL to the dataset containing comments for this video, if collected separately
    input:
      type:
        - string
        - "null"
      description: Original input value used to find this video
    url:
      type:
        - string
        - "null"
      description: URL associated with an error result
    error:
      type:
        - string
        - "null"
      description: Error message if the item could not be scraped
    errorCode:
      type:
        - string
        - "null"
      description: Machine-readable error code
    invalidUrls:
      type:
        - array
        - "null"
      description: List of invalid URLs that could not be processed
      items: {}
    comments:
      type:
        - array
        - "null"
      description: Comments collected inline for this video, if comment collection was enabled
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          cid:
            type:
              - string
              - "null"
          text:
            type:
              - string
              - "null"
          createTime:
            type:
              - number
              - "null"
          createTimeISO:
            type:
              - string
              - "null"
          diggCount:
            type:
              - number
              - "null"
          replyCommentTotal:
            type:
              - number
              - "null"
          uid:
            type:
              - string
              - "null"
          uniqueId:
            type:
              - string
              - "null"
          repliesToId:
            type:
              - string
              - "null"
          avatarThumbnail:
            type:
              - string
              - "null"
          likedByAuthor:
            type:
              - boolean
              - "null"
          pinnedByAuthor:
            type:
              - boolean
              - "null"
          mentions:
            type:
              - array
              - "null"
            items:
              type:
                - string
                - "null"
          detailedMentions:
            type:
              - array
              - "null"
            items:
              type:
                - object
                - "null"
          images:
            type:
              - array
              - "null"
            items:
              type:
                - object
                - "null"
          sticker:
            type:
              - object
              - "null"
    submittedVideoUrl:
      type:
        - string
        - "null"
      description: Original video URL from the input, useful for mapping results back to inputs
    fromProfileSection:
      type:
        - string
        - "null"
      description: Profile section this video was scraped from
    isStory:
      type:
        - boolean
        - "null"
      description: >-
        Whether this item was scraped as a profile's active TikTok Story, rather than a regular post
    searchQuery:
      type:
        - string
        - "null"
      description: Search query used to find this video
    searchHashtag:
      type:
        - object
        - "null"
      description: Hashtag used to find this video
      additionalProperties: true
      properties:
        name:
          type:
            - string
            - "null"
        views:
          type:
            - number
            - "null"
    searchMusic:
      type:
        - object
        - "null"
      description: Music used to find this video
      additionalProperties: true
      properties:
        musicTag:
          type:
            - string
            - "null"
        videos:
          type:
            - string
            - "null"
---
kind: Telo.Definition
metadata:
  name: Run
  description: Run TikTok Scraper and wait for its dataset items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActorSync
    metadata:
      name: run
    client: !cel "self.client"
invoke: !ref run
inputs:
  actorId: clockworks/tiktok-scraper
  build: 0.0.620
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
result:
  items: !cel "result.body"
---
kind: Telo.Definition
metadata:
  name: Start
  description: >-
    Run TikTok Scraper in the background, poll until the run finishes, and return the run and its
    dataset items. Raises APIFY_RUN_NOT_SUCCEEDED when the run ends FAILED, TIMED-OUT or ABORTED.
capability: Telo.Invocable
throws:
  codes:
    APIFY_RUN_NOT_SUCCEEDED:
      description: >-
        The run finished without succeeding. `data` is the Apify run object (id, status,
        statusMessage, …).
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - run
      - items
    properties:
      run:
        type: object
        additionalProperties: true
        description: "The finished Apify run: id, status, defaultDatasetId, stats, usageTotalUsd, …"
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActor
    metadata:
      name: start
    client: !cel "self.client"
  - kind: Apify.GetRun
    metadata:
      name: getRun
    client: !cel "self.client"
  - kind: Apify.GetDatasetItems
    metadata:
      name: getItems
    client: !cel "self.client"
  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
        inputs:
          runId: !cel "inputs.runId"
          waitForFinish: 60
    outputs:
      run: !cel "steps.poll.result.body.data"
  - kind: Flow.Sequence
    metadata:
      name: seq
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - input
        properties:
          input:
            type: object
          timeout:
            type:
              - integer
              - "null"
          memory:
            type:
              - integer
              - "null"
          maxItems:
            type:
              - integer
              - "null"
          maxTotalChargeUsd:
            type:
              - number
              - "null"
    steps:
      - name: start
        invoke: !ref start
        inputs:
          actorId: clockworks/tiktok-scraper
          build: 0.0.620
          input: !cel "inputs.input"
          timeout: !cel "inputs.?timeout.orValue(null)"
          memory: !cel "inputs.?memory.orValue(null)"
          maxItems: !cel "inputs.?maxItems.orValue(null)"
          maxTotalChargeUsd: !cel "inputs.?maxTotalChargeUsd.orValue(null)"
      - name: wait
        invoke: !ref wait
        inputs:
          runId: !cel "steps.start.result.body.data.id"
      - name: check
        if: !cel "steps.wait.result.run.status != 'SUCCEEDED'"
        then:
          - name: fail
            throw:
              code: APIFY_RUN_NOT_SUCCEEDED
              message: !cel >-
                'Apify run ' + steps.wait.result.run.id + ' finished with status ' +
                steps.wait.result.run.status
              data: !cel "steps.wait.result.run"
      - name: items
        invoke: !ref getItems
        inputs:
          datasetId: !cel "steps.wait.result.run.defaultDatasetId"
    outputs:
      run: !cel "steps.wait.result.run"
      items: !cel "steps.items.result.body"
invoke: !ref seq
inputs:
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
