            - "null"
        avatar:
          type:
            - string
            - "null"
        signature:
          type:
            - string
            - "null"
        bioLink:
          type:
            - string
            - "null"
        region:
          type:
            - string
            - "null"
        following:
          type:
            - number
            - "null"
        fans:
          type:
            - number
            - "null"
        video:
          type:
            - number
            - "null"
        heart:
