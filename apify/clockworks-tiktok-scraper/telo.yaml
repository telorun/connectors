kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item clockworks/tiktok-scraper produces.
schema:
  type: object
  additionalProperties: true
  properties:
    id:
      type:
        - string
        - "null"
      description: Unique identifier of the TikTok video
    text:
      type:
        - string
        - "null"
      description: Caption text of the TikTok video
    textLanguage:
      type:
        - string
        - "null"
      description: Detected language of the video caption
    createTime:
      type:
        - number
        - "null"
      description: Unix timestamp when the video was created
    createTimeISO:
      type:
        - string
        - "null"
      description: ISO 8601 formatted creation date and time
    isMuted:
      type:
        - boolean
        - "null"
      description: Whether the video audio is muted
    webVideoUrl:
      type:
        - string
        - "null"
      description: URL to view the video on TikTok
    locationCreated:
      type:
        - string
        - "null"
      description: Country code where the video was created
    isAd:
      type:
        - boolean
        - "null"
      description: Whether the video is a sponsored advertisement
    authorMeta:
      type:
        - object
        - "null"
      description: Metadata about the video author
      additionalProperties: true
      properties:
