            description: "`REQUIRED` or `PREFERRED`."
    emails:
      type:
        - array
        - "null"
      title: Emails
      description: >-
        Email addresses found in the job description. Prime lead-generation signal — most postings
        expose none.
      items:
        type:
          - string
          - "null"
    contacts:
      type:
        - array
        - "null"
      title: Contacts
      description: Recruiter contact blocks published on the posting (mostly on non-US domains).
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
