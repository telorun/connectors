        userMinimumPayAmount:
          type:
            - number
            - "null"
          title: User minimum pay amount
        userMinimumPaySalaryType:
          type:
            - string
            - "null"
          title: User minimum pay period
    benefits:
      type:
        - array
        - "null"
      title: Benefits
      description: Benefits advertised on the posting.
      items:
        type:
          - string
          - "null"
    socialInsurance:
      type:
        - array
        - "null"
      title: Social insurance
      description: Insurance and social coverage items listed on the posting (mostly on non-US domains).
      items:
        type:
          - string
          - "null"
    descriptionText:
      type:
        - string
        - "null"
      title: Description (text)
      description: Full job description as plain text, ready for NLP, embeddings or keyword search.
    descriptionHtml:
      type:
        - string
        - "null"
      title: Description (HTML)
      description: Full job description with the original HTML markup (lists, headings, emphasis).
    requirements:
