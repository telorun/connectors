              - "null"
            title: Contact types
            items:
              type:
                - string
                - "null"
    hiringDemand:
      type:
        - object
        - "null"
      title: Hiring demand
      description: Urgency badges shown on the listing. Useful to prioritize outreach or applications.
      additionalProperties: true
      properties:
        isUrgentHire:
          type:
            - boolean
            - "null"
          title: Urgently hiring
        isHighVolumeHiring:
          type:
            - boolean
            - "null"
