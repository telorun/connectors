kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item borderline/indeed-scraper produces.
schema:
  type: object
  additionalProperties: true
  properties:
    title:
      type:
        - string
        - "null"
      title: Job title
      description: Job title exactly as published by the employer on Indeed.
    normalizedTitle:
      type:
        - string
        - "null"
      title: Normalized job title
      description: >-
        Indeed's normalized form of the job title, useful to group postings that describe the same
        role under different wordings.
    displayTitle:
      type:
        - string
        - "null"
      title: Display title
      description: >-
        Job title as Indeed renders it on the listing page. Often shorter than the title published
        by the employer.
    jobKey:
      type:
        - string
        - "null"
      title: Job key
      description: >-
        Indeed's unique identifier for the posting (the `jk` parameter of the job URL). Use it as
        the primary key when deduplicating or upserting into your own database.
    refNum:
      type:
        - string
        - "null"
      title: Employer reference number
      description: >-
        The employer's own reference for this posting, as carried by the job feed. Lets you match a
        posting against an applicant tracking system.
    jobUrl:
      type:
        - string
        - "null"
      title: Job URL
      description: Canonical Indeed URL of the job posting.
    applyUrl:
      type:
        - string
        - "null"
      title: Apply URL
      description: >-
        Direct application link, when the employer applies off-site (ATS, career site, job board).
        Absent for Indeed Apply postings.
    isEasyApply:
      type:
        - boolean
        - "null"
      title: Indeed Apply
      description: >-
        True when the posting accepts Indeed's one-click application. Absent when the information
        could not be retrieved for this run.
    easyApplyUrl:
      type:
        - string
        - "null"
      title: Indeed Apply URL
      description: >-
        Direct one-click application endpoint on Indeed. Different from the apply URL above, which
        points at the posting page.
    campaignCount:
      type:
        - number
        - "null"
      title: Funded campaigns
      description: >-
        Number of funded advertising campaigns attached to this posting. 0 means the employer is not
        paying to promote it. Unlike the sponsored flag, this does not depend on the search query
        that found the job.
    source:
      type:
        - string
        - "null"
      title: Source
      description: >-
        Where Indeed originally aggregated the listing from: the employer's own career site, an ATS
        or a partner job board.
    feedSourceType:
      type:
        - string
        - "null"
      title: Posted by
      description: >-
        Who published the posting to Indeed: EMPLOYER for a direct employer posting, RECRUITER when
        it came through a staffing agency.
    sourceEmployerName:
      type:
        - string
        - "null"
      title: Source employer name
      description: >-
        Employer name as declared by the source feed. Differs from the company name on roughly a
        third of postings, typically when an agency posts on a client's behalf.
    jobType:
      type:
        - array
        - "null"
      title: Job type
      description: Contract types attached to the posting, as labelled by Indeed in the listing's locale.
      items:
        type:
          - string
          - "null"
    occupation:
      type:
        - array
        - "null"
      title: Occupation categories
      description: >-
        Indeed's normalized occupation taxonomy for the role. Useful to group postings across job
        titles.
      items:
        type:
          - string
          - "null"
    occupationMostLikely:
      type:
        - array
        - "null"
      title: Most likely occupation
      description: >-
        The occupation Indeed considers most likely for this posting, from the same taxonomy as the
        occupation field. Usually one entry, occasionally more.
      items:
        type:
          - string
          - "null"
    attributes:
      type:
        - array
        - "null"
      title: Attributes
      description: >-
        Skills, tools, languages and perks extracted by Indeed from the description and shown as
        tags on the listing.
      items:
        type:
          - string
          - "null"
    employerProvidedAttributes:
      type:
        - array
        - "null"
      title: Employer-provided attributes
      description: >-
        Attributes the employer declared itself, as opposed to the attributes field, which Indeed
        infers from the posting text.
      items:
        type:
          - string
          - "null"
    isRemote:
      type:
        - boolean
        - "null"
      title: Remote
      description: True when Indeed flags the posting as remote work.
    workingSystem:
      type:
        - array
        - "null"
      title: Working system
      description: >-
        Work arrangement labels attached to the posting (flextime, shift work, on-site, hybrid...).
      items:
        type:
          - string
          - "null"
    shiftAndSchedule:
      type:
        - array
        - "null"
      title: Shift and schedule
      description: Schedule tags of the posting (days, shifts, weekend availability...).
      items:
        type:
          - string
          - "null"
    shifts:
      type:
        - object
        - array
        - "null"
      title: Shift details
      description: >-
        Detailed shift plan for hourly and shift-based postings: date ranges, start time, duration,
        breaks and time zone.
      additionalProperties: true
      properties:
        notes:
          type:
            - string
            - "null"
          title: Notes
          description: Free-text note about the shift plan.
        timeZone:
          type:
            - string
            - "null"
          title: Time zone
          description: IANA time zone the shift times are expressed in.
        shiftSchedule:
          type:
            - object
            - "null"
          title: Shift schedule
          description: Date ranges the shift applies to.
          additionalProperties: true
          properties:
            dateRange:
              type:
                - array
                - "null"
              title: Date ranges
              description: Start/end dates of each shift period.
              items:
                type:
                  - object
                  - "null"
                additionalProperties: true
                properties:
                  startDate:
                    type:
                      - string
                      - "null"
                  endDate:
                    type:
                      - string
                      - "null"
        shiftTimes:
          type:
            - object
            - "null"
          title: Shift times
          description: Shift start, duration and break period.
    age:
      type:
        - string
        - "null"
      title: Job age
      description: Relative freshness label shown on the search results page, in the listing's language.
    datePublished:
      type:
        - string
        - "null"
      title: Date published
      description: Date the posting was published on Indeed.
    scrapedAt:
      type:
        - string
        - "null"
      title: Scraped at
      description: ISO 8601 timestamp of when this record was collected.
    postedToday:
      type:
        - boolean
        - "null"
      title: Posted today
      description: True when the posting was published on the day of the scrape.
    isRepost:
      type:
        - boolean
        - "null"
      title: Is a repost
      description: >-
        True when the posting is a republication of an earlier one. Separates genuinely new hiring
        demand from recycled listings.
    isLatestPost:
      type:
        - boolean
        - "null"
      title: Is the latest post
      description: >-
        True when this is the most recent version of the posting. False marks an older copy that the
        employer has since republished.
    isSponsored:
      type:
        - boolean
        - "null"
      title: Sponsored
      description: >-
        True when the posting appeared as a paid/sponsored placement in the search results instead
        of an organic listing. This describes how the job appeared in THIS search: the same jobKey
        can be sponsored for one query and organic for another. Use it to filter out promoted
        listings or to track ad placement.
    expired:
      type:
        - boolean
        - "null"
      title: Expired
      description: True when the posting is no longer accepting applications.
    language:
      type:
        - string
        - "null"
      title: Language
      description: ISO 639-1 language code of the posting content.
    locale:
      type:
        - string
        - "null"
      title: Locale
      description: Locale of the Indeed domain the job was scraped from.
    companyName:
      type:
        - string
        - "null"
      title: Company name
      description: Employer name as displayed on the posting.
    companyUrl:
      type:
        - string
        - "null"
      title: Company URL
      description: URL of the employer's Indeed company profile.
    companyLogoUrl:
      type:
        - string
        - "null"
      title: Company logo URL
      description: Direct link to the employer's logo image.
    companyHeaderUrl:
      type:
        - string
        - "null"
      title: Company header URL
      description: Direct link to the banner image of the employer's company profile.
    companySector:
      type:
        - string
        - "null"
      title: Company sector
      description: >-
        Sector shown on the employer's Indeed company page, in the language of the country searched.
    companyAddresses:
      type:
        - array
        - string
        - "null"
      title: Company addresses
      description: Office locations listed on the employer's company profile.
      items:
        type:
          - string
          - "null"
    companyNumEmployees:
      type:
        - string
        - "null"
      title: Number of employees
      description: Company size bracket declared by the employer.
    companyRevenue:
      type:
        - string
        - "null"
      title: Company revenue
      description: Revenue bracket declared by the employer.
    companyDescription:
      type:
        - string
        - "null"
      title: Company description
      description: Full 'About us' text from the employer's Indeed company profile.
    companyBriefDescription:
      type:
        - string
        - "null"
      title: Company brief description
      description: Short employer summary shown at the top of the company profile.
    companyPhone:
      type:
        - string
        - "null"
      title: Company phone
      description: Phone number published on the employer's company profile.
    companyFounded:
      type:
        - object
        - "null"
      title: Company founded
      description: Founding date of the company, as day/month/year parts. Most profiles only expose the year.
      additionalProperties: true
      properties:
        year:
          type:
            - number
            - "null"
          title: Year
        month:
          type:
            - number
            - "null"
          title: Month
        day:
          type:
            - number
            - "null"
          title: Day
    companyLinks:
      type:
        - object
        - "null"
      title: Company links
      description: External links published on the employer's company profile.
      additionalProperties: true
      properties:
        corporateWebsite:
          type:
            - string
            - "null"
          title: Corporate website
        twitter:
          type:
            - string
            - "null"
          title: X / Twitter
        facebook:
          type:
            - string
            - "null"
          title: Facebook
        instagram:
          type:
            - string
            - "null"
          title: Instagram
        customLinks:
          type:
            - array
            - "null"
          title: Custom links
          description: Additional labelled links added by the employer (career site, benefits page...).
          items:
            type:
              - object
              - "null"
            additionalProperties: true
            properties:
              label:
                type:
                  - string
                  - "null"
              name:
                type:
                  - string
                  - "null"
              url:
                type:
                  - string
                  - "null"
    companyCeo:
      type:
        - object
        - "null"
      title: Company CEO
      description: CEO published on the employer's company profile.
      additionalProperties: true
      properties:
        name:
          type:
            - string
            - "null"
          title: Name
        photoUrl:
          type:
            - string
            - "null"
          title: Photo URL
        startDate:
          type:
            - string
            - "null"
          title: Start date
    rating:
      type:
        - object
        - "null"
      title: Employer rating
      description: Aggregated employee rating of the employer on Indeed.
      additionalProperties: true
      properties:
        rating:
          type:
            - number
            - "null"
          title: Rating
          description: Average rating out of 5.
        count:
          type:
            - number
            - "null"
          title: Reviews count
          description: Number of reviews the rating is based on.
        countContent:
          type:
            - string
            - "null"
          title: Count label
        descriptionContent:
          type:
            - string
            - "null"
          title: Description label
        ariaContent:
          type:
            - string
            - "null"
          title: Accessibility label
        showCount:
          type:
            - boolean
            - "null"
          title: Show count
        showDescription:
          type:
            - boolean
            - "null"
          title: Show description
        size:
          type:
            - string
            - "null"
          title: Size
    location:
      type:
        - object
        - "null"
      title: Location
      description: Workplace location of the posting, geocoded by Indeed when available.
      additionalProperties: true
      properties:
        country:
          type:
            - string
            - "null"
          title: Country
        countryCode:
          type:
            - string
            - "null"
          title: Country code
        city:
          type:
            - string
            - "null"
          title: City
        admin1Code:
          type:
            - string
            - "null"
          title: State or first-level division
          description: >-
            State in the United States (TX, CA), constituent country in the United Kingdom (ENG).
            Absent on fully remote postings, which have no physical location.
        admin2Code:
          type:
            - string
            - "null"
          title: County or second-level division
          description: FIPS county code in the United States (113), region in the United Kingdom (NW).
        admin3Code:
          type:
            - string
            - "null"
          title: Third-level division
          description: >-
            Finest administrative division, where the country has one. Absent for United States
            postings, which stop at the county level.
        postalCode:
          type:
            - string
            - "null"
          title: Postal code
        streetAddress:
          type:
            - string
            - "null"
          title: Street address
        formattedAddressShort:
          type:
            - string
            - "null"
          title: Short address
          description: Compact address as shown on the search results page.
        formattedAddressLong:
          type:
            - string
            - "null"
          title: Long address
        fullAddress:
          type:
            - string
            - "null"
          title: Full address
          description: Street, city, region and postal code combined.
        latitude:
          type:
            - number
            - "null"
          title: Latitude
        longitude:
          type:
            - number
            - "null"
          title: Longitude
    salary:
