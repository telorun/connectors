      description: >-
        Snowflake table to write into. With Exact names on, matching is case-sensitive. Names are
        uppercase by default. To check, run a `SHOW` command. Browse what you can access in
        Snowsight's Databases explorer, Snowflake's web interface.
      additionalProperties: false
      required:
