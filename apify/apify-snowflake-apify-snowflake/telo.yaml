          title: Database
          description: >-
            Name of an existing Snowflake database. To list the ones you can access, run `SHOW
            DATABASES;` in Snowflake.
          minLength: 1
        schema:
          type: string
          title: Schema
          description: >-
            Name of an existing schema in that database. To list the ones you can access, run `SHOW
            SCHEMAS IN DATABASE ;` in Snowflake.
          minLength: 1
        table:
          type: string
          title: Table
          description: >-
            With Insert into existing table (`append`), it must already exist. To list tables, run
            `SHOW TABLES IN SCHEMA .;` in Snowflake. With Create new table, it's created if it
