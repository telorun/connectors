        properties:
          source:
            type: string
            title: Source field
            description: Dataset field to import. Case-sensitive.
            minLength: 1
          destination:
            type: string
            title: Destination column
            description: Snowflake column to write this field to.
            minLength: 1
      default: []
    quoteIdentifiers:
      type: boolean
      title: Exact names
      description: >-
        When on, database, schema, table, and column names keep their case and special characters.
        Names must match exactly. Names with lowercase letters, spaces, or special characters need
        double quotes in queries. When off, names are uppercase and unquoted, and column names can
        only use letters, digits, and underscores, starting with a letter or underscore. Other names
        fail the run.
      default: true
