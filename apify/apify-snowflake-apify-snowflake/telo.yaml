    snowflakeAccount:
      type: string
      title: Account identifier
      description: >-
        Uses `orgname-accountname` format, like `myorg-myaccount`. Go to Snowflake -> Your Account
        -> Connect a tool to Snowflake -> Account identifier, or run `SELECT
        CURRENT_ORGANIZATION_NAME() || '-' || CURRENT_ACCOUNT_NAME();`.
    snowflakeUsername:
      type: string
      title: Login name
      description: >-
        Go to Snowflake -> Your Account -> Connect a tool to Snowflake -> Login name, or run
        `DESCRIBE USER ;` with the name from `SELECT CURRENT_USER();` and copy `LOGIN_NAME`.
    snowflakePat:
      type: string
      title: Programmatic access token
      description: >-
        Go to Snowflake -> Your Account -> Settings -> Authentication -> Programmatic access tokens
        and generate one, or run `ALTER USER ADD PROGRAMMATIC ACCESS TOKEN ;` in Snowflake.
        Snowflake shows the token only once.
