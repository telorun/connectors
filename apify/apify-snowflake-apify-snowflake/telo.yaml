      description: >-
        Leave empty to use your default warehouse. Required if you don't have one. To check, run
        `SELECT CURRENT_WAREHOUSE();` in Snowflake.
    importMode:
      type: string
      title: Import mode
      description: >-
        Both options add rows and never replace data. Create new table (`create_new`) also creates a
        missing table.
      enum:
        - append
        - create_new
      default: append
    destination:
      type: object
