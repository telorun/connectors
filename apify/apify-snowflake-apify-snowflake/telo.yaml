kind: Telo.Library
metadata:
  name: ApifySnowflakeApifySnowflake
  version: 0.1.0
  description: >-
    Snowflake (apify/snowflake): the Apify actor apify/snowflake-apify-snowflake as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    Imports any Apify dataset into a Snowflake table with append or create modes. Supports custom
    column mapping, automatic table creation with schema inference, batching, resumable imports, and
    programmatic access token (PAT) authentication. Works standalone or as an Actor-to-Actor
    integration.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
