kind: Telo.Library
metadata:
  name: ApifyInstagramPostScraper
  version: 0.0.646
  description: >-
    Instagram Post Scraper: the Apify actor apify/instagram-post-scraper (build 0.0.646) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape Instagram posts. Just add one or more Instagram usernames and get your data in seconds
    including caption, metrics, images, mentions, coauthors, recent comments, sponsored status,
    video duration, views. Export scraped data, schedule scraper via API, integrate with other tools
    or AI workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-post-scraper, from its build 0.0.646 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - username
  properties:
    username:
      type: array
      title: 🕺 Instagram username, profile URL, or post URL
      description: >-
        Insert the username or URL of any profile you want to get posts from. You can also paste the
        post URLs.
    resultsLimit:
      type: integer
      title: 💯 Maximum posts per profile
      description: >-
        This is the maximum number of posts you want to scrape per profile. If you set it to 5,
        you'll get 5 posts for each profile you've included. This setting does not apply if you're
        scraping by post URLs.
      minimum: 1
    skipPinnedPosts:
      type: boolean
      title: 📌 Skip pinned posts
      description: Check if you do not want to save pinned posts.
      default: false
    includeMusicData:
      type: boolean
      title: $ Include music data (for Images and Carousels)
      description: >-
        Extract music data for Image and Carousel posts. Video posts already include music data with
        `Detailed data`. Available for paying users only. Upgrade to the Starter plan
        (https://console.apify.com/billing/subscription) to unlock it.
      default: false
    onlyPostsNewerThan:
      type: string
      title: 📅 Extract posts that are newer than
      description: >-
        Limit how far back to the history the scraper should go. The date should be in YYYY-MM-DD or
        full ISO absolute format or in relative format e.g. 1 days, 2 months, 3 years. All time
        values are taken in UTC timezone
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    dataDetailLevel:
      type: string
      title: Data detail level
      description: Choose the data package you want to extract. Please note the Detailed data are paid extra.
      enum:
        - basicData
        - detailedData
      default: detailedData
