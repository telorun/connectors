    startUrls:
      type: array
      title: LinkedIn URLs
      description: >-
        Paste LinkedIn job-search URLs (from the search page after applying filters), single job
        URLs, or a company page URL (e.g. https://www.linkedin.com/company/openai/) to scrape every
        job at that company. When provided, these drive the run and the search filters above are
        ignored.
    maxRowsPerUrl:
      type: integer
      title: Max results per URL
      description: >-
        Maximum results to collect from each pasted URL above. Set 0 (the default) for all available
        — each URL runs to its last page. Bound the total with the run's max items / cost limit.
      minimum: 0
      default: 0
    companyProfile:
      type: boolean
      title: 🏢 Company profile
      description: >-
        Add each company's profile to its jobs: headcount, followers, industry, description,
        tagline, headquarters (structured), company type, founding year and the company's website.
        Read once per company from its public LinkedIn page and reused across that company's jobs.
        Turn it off for the fastest possible run.
      default: true
    enrichCompany:
      type: boolean
      title: ⭐ Hiring contact & job signals
      description: >-
        Add the fields the listing card does not carry: the hiring contact's headline and photo, the
        salary source (employer-provided vs LinkedIn estimate), and the job's own signals —
        workplace type, job status (open/closed), exact posting timestamp, repost flag,
        verified-hiring badge and a structured location. It all comes from a single lookup, so it is
        one premium add-on (one charge), billed on top of the base rate only for the jobs it
        enriches. Leave off for the base rate.
      default: false
