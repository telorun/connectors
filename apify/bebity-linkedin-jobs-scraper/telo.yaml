schema:
  type: object
  additionalProperties: false
  properties:
    titles:
      type: array
      title: Job titles / keywords
      description: >-
        What to search for (e.g. Web developer). Add several — each is searched separately (up to
        Results per search each) and every result is tagged with the term it came from (in
        scrapingInfo). Leave empty for a broad search.
    locations:
      type: array
      title: Job locations
      description: >-
        Where to search (e.g. Paris, New York). Every title is crossed with every location — each
        title × location pair is its own search — and every result is tagged with the location it
        came from (in scrapingInfo).
    rows:
      type: integer
      title: Results per search
      description: >-
        How many jobs to return per search (up to 1000). Each job title × location is its own
        search. Set 0 (the default) for all available — every search runs to its last page. The
        whole run is also capped by the max items / cost limit you set on the run, so use that to
        bound the total.
      minimum: 0
      maximum: 1000
      default: 0
    companyName:
      type: array
      title: Company name
      description: Restrict to specific companies by name (e.g. Google, NASA).
    companyId:
      type: array
      title: Company id
      description: >-
        Restrict to specific companies by numeric LinkedIn id (e.g. Facebook: 76987811, Uber:
        1815218). Numbers only.
    companyUrls:
      type: array
      title: Company URLs
      description: >-
        Filter the search to specific companies by their LinkedIn page URL (e.g.
        https://www.linkedin.com/company/openai/) — often easier than finding the numeric id.
        Combines with your title/location filters. A numeric /company/{id} URL is used directly; a
        name URL is resolved automatically. (To instead scrape every job of a company on its own,
        paste the company URL into Start URLs.)
    publishedAt:
      type: string
      title: Published at
      description: How recent the posting must be.
      enum:
        - ""
        - r2592000
        - r604800
        - r86400
      default: ""
    easyApply:
      type: boolean
      title: Easy Apply only
      description: Only return jobs that offer LinkedIn Easy Apply.
      default: false
    under10Applicants:
      type: boolean
      title: Under 10 applicants
      description: Only return jobs with fewer than 10 applicants — less-competitive roles.
      default: false
    workTypes:
      type: array
      title: Workplace type
      description: On-site, Remote and/or Hybrid. Pick one or more to match any of them.
