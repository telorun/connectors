kind: Telo.Library
metadata:
  name: ApifyFacebookAdsScraper
  version: 0.0.391
  description: >-
    Facebook Ads Library Scraper: the Apify actor apify/facebook-ads-scraper (build 0.0.391) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract advertising data from Facebook, Instagram, WhatsApp, Threads. Get ads, publishers,
    prices, reach estimates, impressions, links, images, IDs, timestamps, product info, and more
    from Facebook Ad Library. Export ad data, schedule runs via API, and integrate with other tools
    or AI workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/facebook-ads-scraper, from its build 0.0.391 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: 🔗 Meta Ad Library URL or Facebook Page URL
      description: >-
        Add a Facebook Page URL, a brand URL from Meta Ad Library, or a Meta Ad Library search URL.
        You can add multiple URLs using the Bulk edit option.
    resultsLimit:
      type: integer
      title: 💯 Results limit per URL
      description: ⚠️  If you leave this field empty, you will get as many results as possible.
      minimum: 1
    onlyTotal:
      type: boolean
      title: Get only the total ad count per page
      description: >-
        When enabled, the Actor returns just the total number of ads for each page instead of
        scraping individual ads. Results are saved as a single dataset item per page.
    includeAboutPage:
      type: boolean
      title: Include page "About" information (location, contact details, page history)
      description: >-
        When enabled, the Actor extracts the About tab details from each page's Ad Library profile:

        - Managing organizations – the advertiser's business address and phone number.

        - Primary country location – where the page's admins are based.

        - Page history – creation date, name changes, and merges.

        Valuable signals for competitor and brand research.
    isDetailsPerAd:
      type: boolean
      title: Include extra ad details (reach & spend data, basic Instagram data)
      description: >-
        When enabled, the Actor opens each ad's detail view and adds an ad_details object with:

        - Advertiser page info – Instagram username, follower count, and verification; page likes,
        category, and "About" text.

        - Spend data – the page's ad spend and whether it's a registered political advertiser.

        - EU audience & reach (for ads targeting the EU) – targeted countries, gender, and age
        range, total EU reach, a per-country age/gender reach breakdown, and the ad's declared payer
        and beneficiary.
    activeStatus:
      type: string
      title: 🖱️  Active status (if not specified within the Meta Ad Library URL)
      description: >-
        Filter ads by whether they're currently running. Active ads are still being shown to users,
        while inactive ads have stopped running but remain archived in the Meta Ad Library. Choose
        Active and inactive to scrape both.

        ⚠️ Note: if the Meta Ad Library URL you provide already specifies an active status, that
        value takes priority and this field is ignored.
      enum:
        - ""
        - active
        - inactive
      default: ""
    sorting:
      type: string
      title: 🗂️  Sorting (if not set in the Meta Ad Library URL)
      description: >-
        Set the order of the scraped ads: the default order, by impressions (high to low), or most
        recent first.

        ⚠️ Note: if the Meta Ad Library URL you provide already specifies sorting type, that value
        takes priority and this field is ignored.
      enum:
        - ""
        - total_impressions
        - relevancy_monthly_grouped
      default: ""
    onlyAdsNewerThan:
      type: string
      title: Scrape ads newer than
      description: >-
        Only scrape ads active on or after this date. Combine it with Scrape ads older than to set a
        closed date range. Use an absolute date (YYYY-MM-DD) or a relative value, such as 1 day, 2
        months, or 3 years.
      pattern: ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$|^(\d+)\s*(day|week|month|year)s?$
    onlyAdsOlderThan:
      type: string
      title: Scrape ads older than
      description: >-
        Only scrape ads that were active during or before this date. Combine it with Scrape ads
        newer than to set a closed date range. Use an absolute date (YYYY-MM-DD) or a relative
        value, such as 1 day, 2 months, or 3 years.
      pattern: ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$|^(\d+)\s*(day|week|month|year)s?$
    enrichWithEcommerceData:
      type: boolean
      title: $ Enrich with e-commerce data
      description: >-
        When enabled, the Actor detects e-commerce product pages from each ad's landing page URL and
        adds pricing and product details to the ad.

        ⚠️ Note: you may get more product enrichment results than ads, because a single ad can
        contain multiple product URLs, each of which is enriched separately.
      default: false
