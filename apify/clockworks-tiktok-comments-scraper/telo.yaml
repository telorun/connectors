kind: Telo.Library
metadata:
  name: ClockworksTiktokCommentsScraper
  version: 0.0.476
  description: >-
    TikTok Comments Scraper: the Apify actor clockworks/tiktok-comments-scraper (build 0.0.476) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract TikTok comments. Just add a TikTok URL and get TikTok video and profile data: comments,
    URLs, numbers of shares, followers, hashtags, hearts, video, and music metadata. Export scraped
    data, run the scraper via API, schedule and monitor runs or integrate with other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of clockworks/tiktok-comments-scraper, from its build 0.0.476 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    postURLs:
      type: array
      title: TikTok video URLs
      description: >-
        Add the video URLs you want to extract comments from. Enter URLs one by one or edit it in
        bulk.
    commentsPerPost:
      type: integer
      title: Maximum comments (replies included) per post
      description: >-
        The number of comments extracted from every result. Due to TikTok API limitations, the
        actual number of scraped comments may differ, especially for posts with thousands of
        comments.
      minimum: 1
    topLevelCommentsPerPost:
      type: integer
      title: Maximum top-level comments per post
      description: The maximum number of top-level (non-reply) comments you want from a single post.
      minimum: 1
    maxRepliesPerComment:
      type: integer
      title: Maximum replies per comment
      description: >-
        The maximum number of replies you want from a single comment.

        Note: Successful extraction of all desired replies is currently not guaranteed.
      minimum: 0
    profiles:
      type: array
      title: Usernames
      description: >-
        Add one or multiple TikTok usernames you want to scrape. You can enter the usernames one by
        one, or use the Bulk edit section to add a prepared list.
    resultsPerPage:
      type: integer
      title: 💯 Number of videos per profile
      description: Add the number of videos you want to scrape per profile.
      minimum: 1
      maximum: 1000000
      default: 1
    profileScrapeSections:
      type: array
      title: Profile sections to scrape
      description: If a profile has reposted videos, you can scrape them by selecting Reposts
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          - videos
          - reposts
      default:
        - videos
    profileSorting:
      type: string
      title: Profile video sorting
      description: >-
        Select Latest to scrape the most recent videos first, Oldest - the oldest videos first,
        Popular - the most popular videos first. Date filters only work with Latest and Oldest.
        Note: Popular sorting is limited by TikTok to approximately 400–500 videos per profile and
        may return significantly fewer results than Latest or Oldest.
      enum:
        - latest
        - popular
        - oldest
      default: latest
    oldestPostDateUnified:
      type: string
      title: Scrape profile videos published after [date]
      description: >-
        Optional filter. Only videos uploaded after or on this date will be scraped. Alternatively,
        specify how old the scraped videos should be in days. Putting 1 will get you only today's
        posts, 2 - yesterday's and today's, and so on.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    newestPostDate:
      type: string
      title: Scrape videos published before [date]
      description: Optional filter. Only videos uploaded before or on this date will be scraped.
    excludePinnedPosts:
      type: boolean
      title: Exclude pinned posts
      description: >-
        Tick to exclude pinned posts from profiles. Pinned posts are usually the first videos on a
        profile's page.
      default: false
