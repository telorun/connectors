kind: Telo.Library
metadata:
  name: ApifyFacebookCommentsScraper
  version: 0.0.374
  description: >-
    Facebook Comments Scraper: the Apify actor apify/facebook-comments-scraper (build 0.0.374) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from hundreds of Facebook comments from one or multiple Facebook posts. Get comment
    text, timestamp, likes count and basic commenter info. Download the data in JSON, CSV, Excel and
    use it in apps, spreadsheets, and reports.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/facebook-comments-scraper, from its build 0.0.374 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: Facebook URLs
      description: Valid facebook URL
    resultsLimit:
      type: integer
      title: Results amount
      description: If this limit is not set as many results as possible are returned
      minimum: 1
    includeNestedComments:
      type: boolean
      title: Include comment replies
      description: >-
        If checked, the actor will return up to 3 levels of comments/replies for each post. Note
        that each reply/comment will be returned as a separate result.
      default: false
    viewOption:
      type: string
      title: Comments mode
      description: Choose the way the comments are sorted
      enum:
        - RANKED_THREADED
        - RECENT_ACTIVITY
        - RANKED_UNFILTERED
      default: RANKED_UNFILTERED
    onlyCommentsNewerThan:
      type: string
      title: 📅 Extract comments that are newer than
      description: >-
        Limit how far back to the history the scraper should go. The date should be in YYYY-MM-DD or
        full ISO absolute format or in relative format e.g. 1 year, 2 months, 3 days, 4 hours, or 5
        minutes. All time values are taken in UTC timezone. This add-on feature
        (https://apify.com/apify/facebook-comments-scraper/pricing) is billed separately.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
