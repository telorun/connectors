kind: Telo.Library
metadata:
  name: ApifyInstagramApiScraper
  version: 0.1.676
  description: >-
    Instagram API Scraper: the Apify actor apify/instagram-api-scraper (build 0.1.676) as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    Scrape and download Instagram posts, profiles, places, hashtags, photos without login. Supports
    search keywords and URL lists. Download your data as HTML table, JSON, CSV, Excel, XML, and RSS
    feed.
  repository: https://github.com/telorun/connectors
