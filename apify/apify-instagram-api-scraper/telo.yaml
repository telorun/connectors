kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-api-scraper, from its build 0.1.676 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    directUrls:
      type: array
      title: Instagram URLs you want to scrape
      description: >-
        Add one or more Instagram URLs to scrape. The field is optional, but you need to either use
        this field or search query below.
      uniqueItems: true
      items:
        type: string
        pattern: https:\/\/(www\.)?instagram\.com\/.+
    resultsType:
      type: string
      title: What do you want to scrape from each page?
      description: >-
        You can choose to get posts, comments or details from Instagram URLs. Comments can only be
        scraped from post URLs.

        ❗Please note that the stories type has been deprecated. It used to return reels data, which
        wasn’t aligned with its purpose. Please use reels instead.
      enum:
        - posts
        - comments
        - details
        - mentions
        - reels
        - stories
      default: posts
    resultsLimit:
      type: integer
      title: Max results per URL
      description: >-
        How many posts or comments (max 50 comments per post) you want to scrape from each Instagram
        URL. If you set this to 1, you will get a single post from each page.
      minimum: 1
    onlyPostsNewerThan:
      type: string
      title: Newer than
      description: >-
        Limit how far back to the history the scraper should go. The date should be in YYYY-MM-DD or
        full ISO absolute format or in relative format e.g. 1 days, 2 months, 3 years. All time
        values are taken in UTC timezone
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    search:
      type: string
      title: Search query
      description: >-
        Provide a search query which will be used to search Instagram for profiles, hashtags or
        places.
    searchType:
      type: string
      title: Search type
      description: What type of pages to search for (you can look for hashtags, profiles or places).
      enum:
        - user
        - hashtag
        - place
      default: hashtag
    searchLimit:
      type: integer
      title: Search results limit
      description: How many search results (hashtags, users or places) should be returned.
      minimum: 1
      maximum: 250
    addParentData:
      type: boolean
      title: Add metadata
      description: >-
        Only for feed items - add data source to results, i.e. for profile posts metadata is
        profile, for tag posts metadata is hashtag
      default: false
