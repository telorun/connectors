kind: Telo.Library
metadata:
  name: ApifyInstagramHashtagScraper
  version: 0.0.707
  description: >-
    Instagram Hashtag Scraper: the Apify actor apify/instagram-hashtag-scraper (build 0.0.707) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape Instagram posts and reels by hashtags. Just add one or more hashtags and extract
    captions, locations, likes, plays, shares, comments count, images, timestamps, audio, and other
    hashtags. Export scraped hashtags, run the scraper via API, schedule and monitor runs or
    integrate with other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-hashtag-scraper, from its build 0.0.707 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - hashtags
  properties:
    hashtags:
      type: array
      title: "#️⃣ Hashtags or keywords"
      description: >-
        Type in or paste the hashtag with or without # symbol.
         ⚠️ Each hashtag is treated as one single search term. If you put several words in one line (e.g. travel photography food), they'll be merged into a single hashtag (#travelphotographyfood). To search for terms separately, add each one as its own entry using the &#43; Add button — and use keyword search if you need multi-word phrases.
        🔎 Searching by keyword? Add your keywords in this same field, then enable Scrape with a
        keyword instead of hashtag toggle below. You can add as many keywords as you like in one
        field, space-separated.
      items:
        type: string
    keywordSearch:
      type: boolean
      title: 🔎 Scrape with a keyword instead of hashtag
      description: >-
        Enable this option if you want to get posts or reels by a specific keyword instead of a
        hashtag. Add your keywords to the Hashtags or keywords field above. Unlike with hashtags,
        multiple words are supported as keywords, just add spaces between them. The dataset will be
        slightly different than the one produced by hashtag. See examples here
        (https://apify.com/apify/instagram-hashtag-scraper#what-is-the-difference-between-extracting-instagram-data-by-hashtag-and-by-keyword)
        with the difference between hashtag and keyword extraction.
    resultsType:
      type: string
      title: 📝 🎞️ Content type
      description: Choose whether to scrape posts or reels for the selected hashtags or keywords.
      enum:
        - posts
        - reels
        - stories
      default: posts
    resultsLimit:
      type: integer
      title: 💯 Maximum posts or reels per hashtag or keyword
      description: >-
        Set the maximum number of results (reels or posts) you want to scrape. If you set this to 5,
        you will scrape 5 posts for each hashtag or keyword you provide. With this setup, if you
        decide to add 7 different hashtags or keywords, you will scrape 35 posts altogether.

        ⚠️ Free usage covers just the first page of results. To get more pages, Upgrade your plan
        (https://console.apify.com/billing/current-period).
      minimum: 1
