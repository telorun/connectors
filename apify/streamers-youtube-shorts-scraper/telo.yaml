kind: Telo.Library
metadata:
  name: StreamersYoutubeShortsScraper
  version: 0.0.261
  description: >-
    YouTube Shorts Scraper: the Apify actor streamers/youtube-shorts-scraper (build 0.0.261) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract YouTube Shorts data from one or multiple YouTube channels. Get video URL, caption,
    timestamp, likes, dislikes, views and comments count, basic channel info, and more. This
    alternative YouTube API has no limits or quotas. Download the data in JSON, CSV, and Excel.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
