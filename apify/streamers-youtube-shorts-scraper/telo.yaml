kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of streamers/youtube-shorts-scraper, from its build 0.0.261 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - channels
  properties:
    channels:
      type: array
      title: Name(s) of the channel
      description: >-
        Enter a username of a channel (without @ sign) or a link to it (e.g.
        https://www.youtube.com/c/Apify).
    maxResultsShorts:
      type: integer
      title: Maximum number of shorts per search term
      description: Limit the number of Shorts videos you want to crawl from the channel.
      minimum: 1
      maximum: 999999
      default: 1
    oldestPostDate:
      type:
        - string
        - "null"
      title: Scrape shorts published after [date]
      description: >-
        Only posts uploaded after or on this date will be scraped. Alternatively, specify how old
        the scraped videos should be in days. Putting 1 day will get you only today's posts, 2 days
        - yesterday's and today's, and so on. Note, that if you select this, sorting parameter will
        be auto-reset to NEWEST
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    sortChannelShortsBy:
      type:
        - string
        - "null"
      title: Sort shorts by
      description: Maps to the three sorting buttons on the top of the channel shorts page.
      enum:
        - NEWEST
        - POPULAR
        - OLDEST
        - null
