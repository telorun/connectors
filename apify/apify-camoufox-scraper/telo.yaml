    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/camoufox-scraper, from its build 3.0.7 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - pageFunction
    - proxyConfiguration
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: URLs to start with
    globs:
      type: array
      title: Glob Patterns
      description: >-
        Glob patterns to match links in the page that you want to enqueue. Combine with Link
        selector to tell the scraper where to find links. Omitting the Glob patterns will cause the
        scraper to enqueue all links matched by the Link selector.
      default: []
    pseudoUrls:
      type: array
      title: Pseudo-URLs
      description: >-
        Pseudo-URLs to match links in the page that you want to enqueue. Combine with Link selector
        to tell the scraper where to find links. Omitting the Pseudo-URLs will cause the scraper to
        enqueue all links matched by the Link selector.
      default: []
    excludes:
      type: array
      title: Exclude Glob Patterns
      description: Glob patterns to match links in the page that you want to exclude from being enqueued.
      default: []
    linkSelector:
      type: string
      title: Link selector
      description: >-
        CSS selector matching elements with 'href' attributes that should be enqueued. To enqueue
        urls from  tags, you would enter div.my-class. Leave empty to ignore all links.
    keepUrlFragments:
      type: boolean
      title: Keep URL fragments
      description: >-
        URL fragments (the parts of URL after a #) are not considered when the scraper determines
        whether a URL has already been visited. This means that when adding URLs such as
        https://example.com/#foo and https://example.com/#bar, only the first will be visited. Turn
        this option on to tell the scraper to visit both.
      default: false
    respectRobotsTxtFile:
      type: boolean
      title: Respect the robots.txt file
      description: >-
        If enabled, the crawler will consult the robots.txt file for the target website before
        crawling each page. At the moment, the crawler does not use any specific user agent
        identifier. The crawl-delay directive is also not supported yet.
      default: false
    pageFunction:
      type: string
      title: Page function
      description: Function executed for each request
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: >-
        Specifies proxy servers that will be used by the scraper in order to hide its origin.

        For details, see Proxy configuration
        (https://apify.com/apify/camoufox-scraper#proxy-configuration) in README.
      default:
        useApifyProxy: true
    proxyRotation:
      type: string
      title: Proxy rotation
      description: >-
        This property indicates the strategy of proxy rotation and can only be used in conjunction
        with Apify Proxy. The recommended setting automatically picks the best proxies from your
        available pool and rotates them evenly, discarding proxies that become blocked or
        unresponsive. If this strategy does not work for you for any reason, you may configure the
        scraper to either use a new proxy for each request, or to use one proxy as long as possible,
        until the proxy fails. IMPORTANT: This setting will only use your available Apify Proxy
        pool, so if you don't have enough proxies for a given task, no rotation setting will produce
        satisfactory results.
      enum:
        - RECOMMENDED
        - PER_REQUEST
        - UNTIL_FAILURE
      default: RECOMMENDED
    sessionPoolName:
      type: string
      title: Session pool name
      description: >-
        Use only english alphanumeric characters dashes and underscores. A session is a
        representation of a user. It has it's own IP and cookies which are then used together to
        emulate a real user. Usage of the sessions is controlled by the Proxy rotation option. By
        providing a session pool name, you enable sharing of those sessions across multiple Actor
        runs. This is very useful when you need specific cookies for accessing the websites or when
        a lot of your proxies are already blocked. Instead of trying randomly, a list of working
        sessions will be saved and a new Actor run can reuse those sessions. Note that the IP lock
        on sessions expires after 24 hours, unless the session is used again in that window.
      minLength: 3
      maxLength: 200
      pattern: "[0-9A-z-]"
    initialCookies:
      type: array
      title: Initial cookies
      description: The provided cookies will be pre-set to all pages the scraper opens.
      default: []
    headless:
      type: boolean
      title: Run browsers in headless mode
      description: >-
        By default, browsers run in headless mode. You can toggle this off to run them in headful
        mode, which can help with certain rare anti-scraping protections but is slower and more
        costly.
      default: true
    ignoreSslErrors:
      type: boolean
      title: Ignore SSL errors
      description: Scraper will ignore SSL certificate errors.
      default: false
    downloadMedia:
      type: boolean
      title: Download media
      description: >-
        Scraper will download media such as images, fonts, videos and sounds. Disabling this may
        speed up the scrape, but certain websites could stop working correctly.
      default: true
    maxRequestRetries:
      type: integer
      title: Max request retries
      description: >-
        Maximum number of times the request for the page will be retried in case of an error.
        Setting it to 0 means that the request will be attempted once and will not be retried if it
        fails.
      minimum: 0
      default: 3
    maxPagesPerCrawl:
      type: integer
      title: Max pages per run
      description: Maximum number of pages that the scraper will open. 0 means unlimited.
      minimum: 0
      default: 0
    maxResultsPerCrawl:
      type: integer
      title: Max result records
      description: >-
        Maximum number of results that will be saved to dataset. The scraper will terminate
        afterwards. 0 means unlimited.
      minimum: 0
      default: 0
    maxCrawlingDepth:
      type: integer
      title: Max crawling depth
      description: >-
        Defines how many links away from the StartURLs will the scraper descend. 0 means unlimited.
      minimum: 0
      default: 0
    maxConcurrency:
      type: integer
      title: Max concurrency
      description: >-
        Defines how many pages can be processed by the scraper in parallel. The scraper
        automatically increases and decreases concurrency based on available system resources. Use
        this option to set a hard limit.
      minimum: 1
      default: 50
    pageLoadTimeoutSecs:
      type: integer
      title: Page load timeout
      description: Maximum time the scraper will allow a web page to load in seconds.
      minimum: 1
      default: 60
    pageFunctionTimeoutSecs:
      type: integer
      title: Page function timeout
      description: Maximum time the scraper will wait for the page function to execute in seconds.
      minimum: 1
      default: 60
    waitUntil:
      type: string
      title: Navigation wait until
      description: >-
        The scraper will wait until the selected events are triggered in the page before executing
        the page function. Available events are domcontentloaded, load and networkidle See
        Playwright docs (https://playwright.dev/docs/api/class-page#page-goto-option-wait-until).
      enum:
        - networkidle
        - load
        - domcontentloaded
      default: networkidle
    preNavigationHooks:
      type: string
      title: Pre-navigation hooks
      description: >-
        Async functions that are sequentially evaluated before the navigation. Good for setting
        additional cookies or browser properties before navigation. The function accepts two
        parameters, `crawlingContext` and `gotoOptions`, which are passed to the `page.goto()`
        function the crawler calls to navigate.
    postNavigationHooks:
      type: string
      title: Post-navigation hooks
      description: >-
        Async functions that are sequentially evaluated after the navigation. Good for checking if
        the navigation was successful. The function accepts `crawlingContext` as the only parameter.
    closeCookieModals:
      type: boolean
      title: Dismiss cookie modals
      description: >-
        Using the [I don't care about
        cookies](https://addons.mozilla.org/en-US/firefox/addon/i-dont-care-about-cookies/) browser
        extension. When on, the crawler will automatically try to dismiss cookie consent modals.
        This can be useful when crawling European websites that show cookie consent modals.
      default: false
    maxScrollHeightPixels:
      type: integer
      title: Maximum scrolling distance in pixels
      description: >-
        The crawler will scroll down the page until all content is loaded or the maximum scrolling
        distance is reached. Setting this to `0` disables scrolling altogether.
      default: 5000
    debugLog:
      type: boolean
      title: Debug log
      description: >-
        Debug messages will be included in the log. Use context.log.debug('message') to log your own
        debug messages.
      default: false
    browserLog:
      type: boolean
      title: Browser log
      description: >-
        Console messages from the Browser will be included in the log. This may result in the log
        being flooded by error messages, warnings and other messages of little value, especially
        with high concurrency.
      default: false
    customData:
      type: object
      title: Custom data
      description: This object will be available on pageFunction's context as customData.
      default: {}
    datasetName:
      type: string
      title: Dataset name
      description: >-
        Name or ID of the dataset that will be used for storing results. If left empty, the default
        dataset of the run will be used.
    keyValueStoreName:
      type: string
      title: Key-value store name
      description: >-
        Name or ID of the key-value store that will be used for storing records. If left empty, the
        default key-value store of the run will be used.
    requestQueueName:
      type: string
      title: Request queue name
      description: >-
        Name of the request queue that will be used for storing requests. If left empty, the default
        request queue of the run will be used.
    os:
      type: array
      title: Emulated operating system
      description: >-
        Operating system to use for the fingerprint generation. Can be 'windows', 'macos', 'linux',
        or a list to randomly choose from.
      items:
        type: string
        enum:
          - linux
          - windows
          - macos
    block_images:
      type: boolean
      title: Block image loading
      description: >-
        Blocks the image loading on the page. Saves bandwidth and speeds up the scraping, but might
        cause detection of the scraper.
      default: false
    block_webrtc:
      type: boolean
      title: Block WebRTC
      description: Blocks WebRTC capabilities in Camoufox. Note that this might break some web applications.
      default: false
    block_webgl:
      type: boolean
      title: Block WebGL
      description: Blocks WebGL capabilities in Camoufox. Note that this might break some websites.
    disable_coop:
      type: boolean
      title: Disable Cross-Origin-Opener-Policy
      description: Disables the Cross-Origin-Opener-Policy.
    geoip:
      type: boolean
      title: GeoIP (⚠️ might not fully work with Apify Proxy ⚠️).
      description: Calculate geo-data based on IP address. Might not fully work with Apify Proxy.
      default: false
    humanize:
      type: string
      title: Humanize cursor movement (speed in seconds)
      description: Humanize cursor movement.
    locale:
      type: array
      title: Locales
      description: Locales to use in the browser / OS.
    fonts:
      type: array
      title: Fonts
      description: Fonts to load into the browser / OS.
    custom_fonts_only:
      type: boolean
      title: Custom fonts only
      description: >-
        If enabled, only custom fonts (from the option `fonts`) are used. This will disable the
        default OS fonts.
    enable_cache:
      type: boolean
      title: Enable cache
      description: Cache previous pages and requests in Camoufox.
    debug:
      type: boolean
      title: Camoufox debug
      description: Prints the config being sent to Camoufox.
