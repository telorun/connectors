kind: Telo.Library
metadata:
  name: ApifyCamoufoxScraper
  version: 3.0.7
  description: >-
    Camoufox Scraper: the Apify actor apify/camoufox-scraper (build 3.0.7) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Crawls websites with stealthy Camoufox browser and Playwright library using a provided
    server-side Node.js code. Supports both recursive crawling and a list of URLs. Supports login to
    a website.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
