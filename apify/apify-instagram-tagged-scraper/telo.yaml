kind: Telo.Library
metadata:
  name: ApifyInstagramTaggedScraper
  version: 0.0.585
  description: >-
    Instagram Mentions Scraper: the Apify actor apify/instagram-tagged-scraper (build 0.0.585) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from tagged posts and mentions on Instagram. Just add one or more Instagram
    usernames and get post text, hashtags, mentions, comments, images, likes, locations, and
    metadata. Export scraped data, run the scraper via API, schedule and monitor runs, or integrate
    with other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
