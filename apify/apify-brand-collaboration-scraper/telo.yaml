kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/brand-collaboration-scraper, from its build 0.0.123 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: 📕 Instagram/Facebook profile or Meta Library Branded Content URL
      description: >-
        Two kinds of URL work here. 1) Profile URL — just paste an Instagram or Facebook profile,
        e.g. https://www.instagram.com/sephora/ or https://www.facebook.com/sephora/. The platform
        in the URL decides where collaborations are pulled from: Instagram URLs return Instagram
        collabs, Facebook URLs return Facebook collabs. 2) Branded Content Library URL — head over
        to Meta Branded Content Library, set it up for platform, creator or brand, and copy the URL.
        Use this when you want Meta's own query and platform filters baked into the input. You can
        mix both kinds in one run and add a list of URLs using the Bulk edit option.
      items:
        type: string
    resultsLimit:
      type: integer
      title: 💯 Maximum posts/reels per URL
      description: >-
        Set the maximum number of results you want to scrape. If you set it to 5, you'll get 5
        results for each input URL you've included. ⚠️ If you leave this field empty, you will get
        as many results as possible.
      minimum: 1
    onlyPostsNewerThan:
      type: string
      title: Scrape content newer than
      description: >-
        Scrape reels and posts from the provided date to the present day (or date set in 'Older
        than'). The date should be in YYYY-MM-DD absolute format or in relative format, e.g., 1 day,
        2 months, 3 years. The JSON input also supports adding time units (UTC timezone): Full or
        partial ISO timestamp (e.g., `2025-09-23T10:02:01`) as absolute time and relative time,
        e.g., `1 hour` or `2 minutes`. For profile URLs, this is the only way to limit the date
        range. For Branded Content Library URLs, it overrides the `start_date` query parameter of
        each input URL.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    onlyPostsOlderThan:
      type: string
      title: Scrape content older than
      description: >-
        Scrape branded content from the provided date to the past (or date set in 'Newer than'). The
        date should be in YYYY-MM-DD or full ISO absolute format or in relative format e.g. 1 days,
        2 months, 3 years. The JSON input also supports adding time units (UTC timezone): Full or
        partial ISO timestamp (e.g., `2025-09-23T10:02:01`) as absolute time and relative time,
        e.g., `1 hour` or `2 minutes`. For profile URLs, this is the only way to limit the date
        range. For Branded Content Library URLs, it overrides the `end_date` query parameter of each
        input URL.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
