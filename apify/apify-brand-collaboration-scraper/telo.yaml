kind: Telo.Library
metadata:
  name: ApifyBrandCollaborationScraper
  version: 0.0.123
  description: >-
    Meta Brand Collaboration Scraper: the Apify actor apify/brand-collaboration-scraper (build
    0.0.123) as typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5
    minutes); `Start` runs it in the background and polls until it finishes, for runs of any length.
    Both take an ApifyClient and the actor's own input, type-checked against the actor's input
    schema.

    Extract branded content partnerships from Meta Ad Library. Get creators, brand partners, content
    types, dates, and links from Instagram and Facebook. Enrich with profile and post details.
    Export data, schedule runs via API, and integrate with other tools or AI workflows workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
