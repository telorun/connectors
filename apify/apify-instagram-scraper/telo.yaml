kind: Telo.Library
metadata:
  name: ApifyInstagramScraper
  version: 0.0.830
  description: >-
    Instagram Scraper: the Apify actor apify/instagram-scraper (build 0.0.830) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Extract Instagram posts, reels, profiles, places, hashtags, carousels, and comments. Get data
    from Instagram using one or more Instagram URLs or search queries: content, context, metrics,
    metadata. Export scraped data, run the scraper via API, schedule and monitor runs or integrate
    with other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-scraper, from its build 0.0.830 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    resultsType:
      type: string
      title: Content to scrape
      description: >-
        **Posts** returns a feed of content. **Profile, hashtag, or place details** returns metadata
        about the page: follower count, bio, post count, and profile picture.

        Comments only work with post URLs, e.g. `instagram.com/p/ABC123xyz/` not
        `instagram.com/username/`.
      enum:
        - posts
        - details
        - comments
        - reels
        - mentions
        - stories
      default: posts
    directUrls:
      type: array
      title: Instagram URLs based on content type
      description: >-
        Add one or more Instagram URLs to scrape.

        URL format must match your content type:- /p/ for posts and comments

        - /reel/ for reels

        - /username/ for profile details

        Leave blank if using the search query instead.
      uniqueItems: true
      items:
        type: string
        pattern: ^(https:\/\/)?(www\.)?instagram\.com\/[A-Za-z0-9._-]+(\/.*)?$
    resultsLimit:
      type: integer
      title: Results limit per URL
      description: >-
        Set how many posts or comments to scrape per Instagram URL. Higher values increase compute
        usage and cost.

        ⚠️ Free usage gets only the top 15 comments, sorted by newest, and around 21 mentions.
        Upgrade to  Starter plan (https://console.apify.com/billing/subscription) for full access.

        Use `1` to retrieve a single post per page.
      minimum: 1
    onlyPostsNewerThan:
      type: string
      title: Filter by date
      description: >-
        Limit how far back to scrape. Enter a date in `YYYY-MM-DD`, ISO format, or as a relative
        value, e.g. `1 day`, `2 months`, `3 years`.

        Times are in UTC, not local time. New York is UTC-5 in winter, UTC-4 in summer. Pinned posts
        may still appear even with this filter set.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    search:
      type: string
      title: Search query
      description: >-
        Search for Instagram hashtags, profiles, or places.

        Use `#` for hashtags, e.g. `#travel`.
    searchType:
      type: string
      title: Search type
      description: >-
        Hashtag search returns posts tagged with that term. Profile search returns matching
        accounts. Place search returns matching locations.
      enum:
        - hashtag
        - profile
        - place
        - user
      default: hashtag
    searchLimit:
      type: integer
      title: Search results limit
      description: >-
        Set how many profiles, places, or hashtags to find.

        To limit posts per result, use Results limit per URL.

        Higher values increase compute usage and cost.
      minimum: 1
      maximum: 250
    addParentData:
      type: boolean
      title: Add metadata
      description: >-
        This applies only to feed items. Adds a dataSource field to each result: profile posts are
        labeled `profile`, and tag posts are labeled `hashtag`.
      default: false
