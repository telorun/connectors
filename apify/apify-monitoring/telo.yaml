kind: Telo.Library
metadata:
  name: ApifyMonitoring
  version: 0.0.219
  description: >-
    Monitoring: the Apify actor apify/monitoring (build 0.0.219) as typed Telo kinds. `Run` runs it
    and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the background and
    polls until it finishes, for runs of any length. Both take an ApifyClient and the actor's own
    input, type-checked against the actor's input schema.

    This actor monitors your actors' statuses, validates their datasets' data, and displays useful
    information in an interactive dashboard. And if something happens, you'll get notified via email
    or Slack.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
