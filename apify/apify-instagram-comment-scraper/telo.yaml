    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-comment-scraper, from its build 0.0.646 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - directUrls
  properties:
    directUrls:
      type: array
      title: 🔗 Instagram posts or reels URLs
      description: >-
        Add one or multiple URLs to scrape comments from - posts or reels. You can add URLs one by
        one or upload a list using the Bulk edit option.
      uniqueItems: true
      items:
        type: string
        pattern: >-
          https?:\/\/(?:www\.)?instagram\.com\/(?!reels\/audio\/)(?:(?:[^!@#$%^&*(){},'"\/\s`\\=-]+\/)?(?:p|reel)|reels)\/[^\/]+
    resultsLimit:
      type: integer
      title: 💯 Up to [number] of comments
      description: >-
        Set the number of comments you expect to scrape from each post or reel.
         If set to 5, you will get 5 comments per URL. If you add 2 URLs, you will extract 10 results altogether.
        ❗️ If you choose to scrape replies as well, the total number will be greater than you set
        for comments.
      minimum: 1
    includeNestedComments:
      type: boolean
      title: $ Include replies
      description: >-
        This feature is for paying users only. If checked, the scraper will extract replies for each
        comment.

        ⚠️ Note that each reply/comment will be displayed as a separate result, so you'll get more
        results in total than you set in `resultsLimit` section above.
