kind: Telo.Library
metadata:
  name: ApifyInstagramCommentScraper
  version: 0.0.646
  description: >-
    Instagram Comments Scraper: the Apify actor apify/instagram-comment-scraper (build 0.0.646) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape Instagram comments from posts or reels. Just add one or more Instagram post URLs to get
    comment text, post and comment IDs, replies, timestamp, owner IDs, usernames, profile pics.
    Export scraped datasets, run the scraper via API, schedule and monitor runs or integrate with
    other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
