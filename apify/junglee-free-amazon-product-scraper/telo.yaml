kind: Telo.Library
metadata:
  name: JungleeFreeAmazonProductScraper
  version: 0.0.338
  description: >-
    Amazon Scraper: the Apify actor junglee/free-amazon-product-scraper (build 0.0.338) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Gets you product data from Amazon. Unofficial API. Scrapes and downloads product information
    without using the Amazon API, including reviews, prices, descriptions, and ASIN.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
