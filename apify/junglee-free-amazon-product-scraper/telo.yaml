kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of junglee/free-amazon-product-scraper, from its build 0.0.338 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - categoryUrls
  properties:
    categoryUrls:
      type: array
      title: Urls of Amazon categories
      description: Enter urls of Amazon categories. You can also use specific product URLs directly.
      uniqueItems: true
    maxItemsPerStartUrl:
      type: integer
      title: Max results (per start URL)
      description: >-
        Enter the maximum number of results you want to scrape per each star URL. This will let the
        scraper know when to stop.
      minimum: 0
    maxSearchPagesPerStartUrl:
      type: integer
      title: Maximum search pages (per start URL)
      description: >-
        Enter the maximum number of search pages to scrape for each start URL. E.g. only scrape the
        first 5 pages.

        This field can also be used with the `maxItemsPerStartUrl` option, the scraper will stop
        after either one of these limits is reached.
      minimum: 1
    maxProductVariantsAsSeparateResults:
      type: integer
      title: Maximum product variants per product (as separate results)
      description: >-
        Enter the maximum number of product variants you want to scrape per each product, outputted
        as separate results.

        **Please beware** that **you can already get** most of the **variant details** changes, in
        the **`variantDetails` field**, which is outputted by default.

        Note that this **will increase the number of requests** and **extend the scraping time**.
      minimum: 0
    useCaptchaSolver:
      type: boolean
      title: "Use Captcha solver (warning: see description)"
      description: >-
        If enabled the scraper will automatically solve captchas thrown by Amazon. This will
        decrease the amount of request retries and increase the speed of the scraper.

        ***IMPORTANT*** - This option works well only for the `'.com'` Amazon domain, but even for
        that one Amazon doesn't show a few product fields after solving a captcha (specifically:
        'attributes', 'manufacturer attributes', and 'bestseller ranks')
      default: false
    scrapeProductVariantPrices:
      type: boolean
      title: Scrape product variant prices
      description: >-
        Enable this option to extract prices of different variations of a product. Useful when you
        need prices for each variant.

        Note that this **will increase the number of requests** and **extend the scraping time**.
      default: false
    scrapeProductDetails:
      type:
        - boolean
        - "null"
      title: Scrape product details
      description: >-
        If enabled, the scraper will extract each found product from the category page in detail
        (this is the default behavior).

        If disabled, the scraper will only extract the quick product information from the category
        page. Useful for faster and more lightweight searches for products.
      default: true
