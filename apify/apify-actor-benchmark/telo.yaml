kind: Telo.Library
metadata:
  name: ApifyActorBenchmark
  version: 0.0.8
  description: >-
    Actor Benchmark: the Apify actor apify/actor-benchmark (build 0.0.8) as typed Telo kinds. `Run`
    runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Compares various builds of the same actor to measure how they perform on the same input
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/actor-benchmark, from its build 0.0.8 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - buildNumbers
  properties:
    buildNumbers:
      type: array
      title: Build numbers or tags
      description: >-
        List of build numbers or tags to benchmark. Each entry will receive an identical run in
        parallel. You can use exact version numbers (e.g. "0.3.67") or tags (e.g. "canary"), which
        will use the latest build associated with that tag.
    runsPerBuild:
      type: integer
      title: Runs per build
      description: >-
        Number of times each build is run. Results are averaged to reduce the effect of outliers.
        All runs are started in parallel on your account, so make sure you have enough memory quota
        available to allow them all to start simultaneously.
      minimum: 1
      default: 3
    actorId:
      type: string
      title: Actor ID
      description: The ID or name of the Apify actor to benchmark (e.g. "apify/website-content-crawler").
    actorInput:
      type: object
      title: Actor input
      description: The JSON input passed to every run of the benchmarked actor.
    taskId:
      type: string
      title: Task ID
      description: The ID or name of an Apify task to benchmark (e.g. "my-username/my-task").
    maxRunDurationSecs:
      type: integer
      title: Max run duration (seconds)
      description: Timeout in seconds for each actor run. Runs exceeding this limit will be aborted.
      minimum: 10
    memoryMbytes:
      type: integer
      title: Memory (MB)
      description: Memory in megabytes allocated to each actor run.
      minimum: 512
      maximum: 32768
    extractRunData:
      type: string
      title: Extract function
      description: >-
        A JavaScript function expression called once for every finished run, to pick what you want
        to measure. It receives one object with: `run` (the run object from the Apify API, refreshed
        after the run finished), `client` (an authenticated Apify API client, e.g. to read the run's
        dataset or key-value store), `build` (the build number or tag), `runNumber` (1-based index
        of the run within its build) and `utils` (`sum`, `mean`, `median` and `round` helpers). It
        may be async and must return a plain object, e.g. `{ durationSecs: 12.3, emptyItems: 4 }`.
        The object is stored as is in the "allRuns" dataset and passed to "Aggregate function". The
        code runs inside this Actor with your API token; it is not sandboxed. Must be provided
        together with "Aggregate function".
      default: |
        async ({ run, client, utils }) => {
            const durationSecs = (new Date(run.finishedAt) - new Date(run.startedAt)) / 1000;

            let itemCount = 0;
            for await (const _item of client.dataset(run.defaultDatasetId).listItems()) {
                itemCount++;
            }

            const totalCost = run.usageTotalUsd ?? 0;
            return {
                durationSecs: utils.round(durationSecs, 2),
                itemCount,
                totalCost: utils.round(totalCost, 6),
                itemsPerSecond: utils.round(durationSecs > 0 ? itemCount / durationSecs : 0, 4),
                costPerItem: utils.round(itemCount > 0 ? totalCost / itemCount : 0, 8),
            };
        }
    aggregate:
      type: string
      title: Aggregate function
      description: >-
        A JavaScript function expression called once for every build, to turn the objects extracted
        from that build's runs into the statistics to report (averages, percentiles, …). It receives
        one object with: `build` (the build number or tag), `runs` (array of the objects returned by
        "Extract function" for the build's succeeded or timed-out runs whose extraction worked) and
        `utils` (`sum`, `mean`, `median` and `round` helpers). It may be async and must return a
        plain object, e.g. `{ meanDurationSecs: 12.3 }`. The object, plus `build`, becomes one item
        of the default dataset, and every field that is a number in all builds is plotted in its own
        chart. Each build is aggregated on its own, so the function cannot compare builds with each
        other (e.g. against a baseline build).
      default: |
        ({ runs, utils }) => {
            const average = (field, decimals) => utils.round(utils.mean(runs.map((run) => run[field])), decimals);

            return {
                durationSecs: average('durationSecs', 2),
                itemCount: average('itemCount', 2),
                totalCost: average('totalCost', 6),
                itemsPerSecond: average('itemsPerSecond', 4),
                costPerItem: average('costPerItem', 8),
            };
        }
    generateCharts:
      type: boolean
      title: Generate charts
      description: >-
        Save one bar chart per numeric field returned by the aggregate function to the key-value
        store, with the builds on the X axis.
      default: true
    reportPrompt:
      type: string
      title: Report prompt
      description: >-
        Your request to an AI model that reads the statistics returned by the aggregate function and
        writes a report, e.g. "Which build is fastest, and is the cost difference worth it?". Leave
        empty to not generate a report. Only the statistics of each build, plus which actor or task
        was benchmarked and how many runs each build had, are sent to the model, not the raw run
        data. The request goes through the Apify OpenRouter Actor, which starts an additional run
        billed to your account. The report is saved as "report.md" in the key-value store and
        written to the log. A failed request only logs a warning.
    reportModel:
      type: string
      title: Report model
      description: OpenRouter model used to write the report.
      default: anthropic/claude-haiku-4.5
---
