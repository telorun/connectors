kind: Telo.JsonSchema
metadata:
  name: Input
  description: >-
    The input of fantastic-jobs/advanced-linkedin-job-search-api, from its build 0.0.74 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    timeRange:
      type: string
      title: Time Range
      description: >-
        Select the time range for job listings. You can choose between hourly (1h), daily (24h),
        weekly (7d), or all active jobs (great to get started, last 6 months, 6m). We strongly
        recommend running the Actor at the same time every hour/day/week to ensure that you get all
        jobs without duplicates
      enum:
        - 1h
        - 24h
        - 7d
        - 6m
      default: 7d
    limit:
      type: integer
      title: Maximum Jobs per API call
      description: >-
        Maximum number of jobs to return per run. The minimum is 10 and the maximum is 5,000. Please
        set the memory to 1GB for runs above 2,000 jobs.
      minimum: 10
      maximum: 5000
      default: 10
    removeAgency:
      type: boolean
      title: Remove Agency Jobs
      description: Filter out recruitment agencies, job boards and other low quality sources
    recruiterOnly:
      type: boolean
      title: Include only Jobs With Recruiter Profile (paid add-on, see pricing table)
      description: >-
        Only return jobs that include a `recruiter_url` (a LinkedIn profile link to the recruiter
        who posted the job) ⚠️ Enabling this option triggers an additional per-result charge — see
        pricing.
      default: false
    titleSearch:
      type: array
      title: Title Search
      description: >-
        Array of job titles to search for. Use :* for prefix matching (e.g., 'Soft:*' will match
        'Software', 'Softball', etc.)
    titleExclusionSearch:
      type: array
      title: Title Exclusion Search
      description: >-
        Array of job titles to exclude. Use :* for prefix matching (e.g., 'Soft:*' will match
        'Software', 'Softball', etc.)
    locationSearch:
      type: array
      title: Location Search
      description: >-
        Array of locations to search for. Location search uses phrase matching, so you must use the
        exact 'City, State/Region, Country' format. All locations use English names (e.g., 'Munich'
        not 'München', 'Bavaria' not 'Bayern'). For the UK, use the constituent country as the state
        (e.g., 'London, England, United Kingdom', 'Edinburgh, Scotland, United Kingdom'). For the
        US, use the full state name (e.g., 'New York, New York, United States', 'San Francisco,
        California, United States'). You can also search by just a country (e.g., 'United Kingdom')
        or a city (e.g., 'London'). Do not use abbreviations (NY, US, UK). Use :* for prefix
        matching (e.g., 'New:*' will match 'New York', 'New Jersey', etc.). If anything is unclear,
        please create an issue.
    locationExclusionSearch:
      type: array
      title: Location Exclusion Search
      description: >-
        Array of locations to exclude. Location search uses phrase matching, so you must use the
        exact 'City, State/Region, Country' format. All locations use English names. For the UK, use
        the constituent country as the state (e.g., 'London, England, United Kingdom'). Do not use
        abbreviations (NY, US, UK). Use :* for prefix matching (e.g., 'New:*' will match 'New York',
        'New Jersey', etc.). If anything is unclear, please create an issue.
    descriptionSearch:
      type: array
      title: Description Search (includes title) (not supported with 6m time range)
      description: >-
        Warning: This search is NOT supported with the 6m backfill API. It might also be too
        intensive for the 7d API. Please be very specific, limit your searches to a handful of
        keywords, and combine with one of the other searches, preferably titleSearch. Array of terms
        to search in job title & description. Use :* for prefix matching (e.g., 'Python:*' will
        match 'Python', 'Pythonic', etc.)
    descriptionExclusionSearch:
      type: array
      title: Description Exclusion Search (includes title) (not supported with 6m time range)
      description: >-
        Warning: This search is NOT supported with the 6m backfill API. It might also be too
        intensive for the 7d API. Please be very specific, limit your searches to a handful of
        keywords, and combine with one of the other searches, preferably titleSearch. Array of terms
        to exclude from job title & description. Use :* for prefix matching (e.g., 'Python:*' will
        match 'Python', 'Pythonic', etc.)
    organizationSlugFilter:
      type: array
      title: Organization Slug Filter
      description: >-
        Filter by LinkedIn organization slugs (exact match). The slug is the company specific part
        of the url. For example the slug in the following url is 'tesla-motors':
        https://www.linkedin.com/company/tesla-motors/
    organizationSlugExclusionFilter:
      type: array
      title: Organization Slug Exclusion Filter
      description: >-
        Exclude jobs from specific LinkedIn organization slugs (exact match). The slug is the
        company specific part of the url. For example the slug in the following url is
        'tesla-motors': https://www.linkedin.com/company/tesla-motors/
    organizationSearch:
      type: array
      title: Organization Search
      description: >-
        Array of organization names to search for. Use :* for prefix matching (e.g., 'Google:*' will
        match 'Google', 'Google Cloud', etc.) Getting several companies with the same name? Use the
        organizationSlugFilter to filter by LinkedIn organization slugs.
    organizationExclusionSearch:
      type: array
      title: Organization Exclusion Search
      description: >-
        Array of organization names to exclude. Use :* for prefix matching (e.g., 'Google:*' will
        match 'Google', 'Google Cloud', etc.) Getting several companies with the same name? Use the
        organizationSlugExclusionFilter to filter by LinkedIn organization slugs.
    descriptionType:
      type: string
      title: Description Type
      description: >-
        Format of the job description. Choose 'text' for plain text or 'html' for HTML formatted
        description. Leave empty to include no description.
      enum:
        - text
        - html
      default: text
    datePostedAfter:
      type: string
      title: Date Posted After
      description: >-
        We don't recommend using this parameter if you retrieve jobs on a regular interval with the
        1h/24h/7d time range. Filter jobs posted on or after a specific date. The correct format is
        '2025-01-01'. To include time, use the following syntax: '2025-01-01T14:00:00'. Warning,
        some LinkedIn jobs don't include time and default to 00:00 Please keep in mind that the jobs
        posted date/time is UTC and there's a 1 to 2 hour delay before jobs appear on this API.
        Please be wary of duplicate jobs when using this filter.
    seniorityFilter:
      type: array
      title: Seniority Level (English speaking countries only)
      description: >-
        Filter English speaking countries by seniority level. This filter is case sensitive. You can
        select multiple seniority levels.
      items:
        type: string
        enum:
          - Associate
          - Director
          - Executive
          - Mid-Senior level
          - Entry level
          - Not Applicable
          - Internship
    noDirectApply:
      type: boolean
      title: Exclude jobs with Easy Apply
      description: Filter for jobs that do not have easy apply on LinkedIn.
    directApply:
      type: boolean
      title: Easy Apply Only
      description: Filter for jobs that can be applied to directly through LinkedIn Easy Apply
    industryFilter:
      type: array
      title: Industry Filter
      description: >-
        Filter by LinkedIn industries. Use exact industry names. Industries containing commas will
        be automatically wrapped in quotes. You can find a list of industries on our website:
        https://fantastic.jobs/article/linkedin-industries
    organizationEmployeesLte:
      type: integer
      title: Max Employees
      description: Maximum number of employees in the company
      minimum: 0
    organizationEmployeesGte:
      type: integer
      title: Min Employees
      description: Minimum number of employees in the company
      minimum: 0
    aiEmploymentTypeFilter:
      type: array
      title: AI Employment Type
      description: >-
        Filter by AI-derived employment type. Normalized, market-independent values now that every
        job is AI-analysed.
      items:
        type: string
        enum:
          - FULL_TIME
          - PART_TIME
          - CONTRACTOR
          - TEMPORARY
          - INTERN
          - VOLUNTEER
          - PER_DIEM
          - OTHER
    excludeATSDuplicate:
      type: boolean
      title: Exclude ATS Duplicates (only use in combination with the Career Site Job Listing API!)
      description: >-
        Set this parameter to true to remove the majority of duplicate jobs between this API and the
        'Career Site Job Listing API' actor. LinkedIn jobs are checked against the ATS dataset using
        two exact-match signals: job title + organization name + country, and job title + LinkedIn
        company profile + country. Agency listings are now checked. Jobs flagged as duplicates will
        have ats_duplicate=true, checked non-duplicates will have ats_duplicate=false, and unchecked
        jobs will have ats_duplicate=null.
    populateAiRemoteLocation:
      type: boolean
      title: Populate AI Remote Location
      description: >-
        If enabled, populates ai_remote_location with locations_derived when ai_remote_location is
        empty.
      default: false
    populateAiRemoteLocationDerived:
      type: boolean
      title: Populate AI Remote Location Derived
      description: >-
        If enabled, populates ai_remote_location_derived with locations_derived when
        ai_remote_location_derived is empty.
      default: false
    aiWorkArrangementFilter:
      type: array
      title: AI Work Arrangement
      description: >-
        Filter by work arrangement. Remote OK = remote with an office available. Remote Solely =
        remote with no office available. Include both to include all remote jobs.
      items:
        type: string
        enum:
          - On-site
          - Hybrid
          - Remote OK
          - Remote Solely
    hasSalary:
      type: boolean
      title: Has Salary
      description: >-
        Filter for jobs with salary information only. Set to false to include all jobs. Results
        include jobs that have either an AI enriched salary or a raw salary (discovered in the job
        posting schema).
    aiExperienceLevelFilter:
      type: array
      title: AI Experience Level
      description: Filter by years of experience
      items:
        type: string
        enum:
          - 0-2
          - 2-5
          - 5-10
          - 10+
    aiVisaSponsorshipFilter:
      type: boolean
      title: AI Visa Sponsorship
      description: Filter for jobs offering visa sponsorship only. Set to false to include all jobs.
    aiTaxonomiesFilter:
      type: array
      title: AI Taxonomies Filter
      description: Filter by AI taxonomies
      items:
        type: string
        enum:
          - Technology
          - Healthcare
          - Management & Leadership
          - Finance & Accounting
          - Human Resources
          - Sales
          - Marketing
          - Customer Service & Support
          - Education
          - Legal
          - Engineering
          - Science & Research
          - Trades
          - Construction
          - Manufacturing
          - Logistics
          - Creative & Media
          - Hospitality
          - Environmental & Sustainability
          - Retail
          - Data & Analytics
          - Software
          - Energy
          - Agriculture
          - Social Services
          - Administrative
          - Government & Public Sector
          - Art & Design
          - Food & Beverage
          - Transportation
          - Consulting
          - Sports & Recreation
          - Security & Safety
    aiTaxonomiesPrimaryFilter:
      type: array
      title: AI Taxonomies Primary Filter
      description: Filter by primary AI taxonomy
      items:
        type: string
        enum:
          - Technology
          - Healthcare
          - Management & Leadership
          - Finance & Accounting
          - Human Resources
          - Sales
          - Marketing
          - Customer Service & Support
          - Education
          - Legal
          - Engineering
          - Science & Research
