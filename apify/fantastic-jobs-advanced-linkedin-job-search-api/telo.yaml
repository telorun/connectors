          - Social Services
          - Administrative
          - Government & Public Sector
          - Art & Design
          - Food & Beverage
          - Transportation
          - Consulting
          - Sports & Recreation
          - Security & Safety
    aiTaxonomiesExclusionFilter:
      type: array
      title: "AI Taxonomies Exclusion Filter (warning: this filter is very broad)"
      description: >-
        Exclude jobs by AI taxonomies. Warning: this filter is very broad and will exclude jobs that
        are not in any of the selected taxonomies. For example, 'Healthcare' might exclude Software
        Engineer job in Healthcare. Use inclusive filters to avoid this.
      items:
        type: string
        enum:
          - Technology
          - Healthcare
          - Management & Leadership
          - Finance & Accounting
          - Human Resources
          - Sales
          - Marketing
          - Customer Service & Support
          - Education
          - Legal
          - Engineering
          - Science & Research
          - Trades
          - Construction
          - Manufacturing
          - Logistics
          - Creative & Media
          - Hospitality
          - Environmental & Sustainability
          - Retail
          - Data & Analytics
          - Software
          - Energy
          - Agriculture
          - Social Services
          - Administrative
          - Government & Public Sector
          - Art & Design
          - Food & Beverage
          - Transportation
          - Consulting
          - Sports & Recreation
          - Security & Safety
    industryExclusionFilter:
      type: array
      title: Industry Exclusion Filter
      description: >-
        Exclude jobs from these LinkedIn industries. Use exact industry names; industries containing
        commas are automatically wrapped in quotes.
    organizationSizeFilter:
      type: array
      title: Company Size
      description: Filter by LinkedIn company-size bucket (matches the org_linkedin_size field).
      items:
        type: string
        enum:
          - "1"
          - 2-10
          - 11-50
          - 51-200
          - 201-500
          - 501-1000
          - 1001-5000
          - 5001-10000
          - 10001+
    aiLanguageFilter:
      type: array
      title: AI Language
      description: >-
        Filter by the AI-detected language of the job description (e.g. English, French, German,
        Spanish). Matches the ai_job_language field.
    hasNoLocation:
      type: boolean
      title: Has No Location
      description: >-
        When true, returns only jobs with no normalized location (locations_derived is null). Do not
        combine with location search, which would always return zero rows.
      default: false
    remote:
      type: boolean
      title: Remote (deprecated, use AI Work Arrangement)
      description: >-
        Deprecated in favor of AI Work Arrangement (aiWorkArrangementFilter). When set to true, this
        is translated to ai_work_arrangement=Remote OK,Remote Solely. If you set AI Work Arrangement
        explicitly, this parameter is ignored. Set to false to include all jobs.
    EmploymentTypeFilter:
      type: array
      title: Employment Type (deprecated, use AI Employment Type)
      description: >-
        Deprecated in favor of AI Employment Type (aiEmploymentTypeFilter). Filter by raw,
        source-provided employment type. Values are country-specific and vary by job board.
      items:
        type: string
        enum:
          - FULL_TIME
          - PART_TIME
          - CONTRACTOR
          - TEMPORARY
          - INTERN
          - VOLUNTEER
          - PER_DIEM
          - OTHER
    aiHasSalary:
      type: boolean
      title: AI Has Salary (deprecated, use hasSalary)
      description: >-
        Deprecated alias of hasSalary with the same functionality. Filter for jobs with salary
        information only. Set to false to include all jobs. Results include jobs that have either an
        AI enriched salary or a raw salary (discovered in the job posting schema).
