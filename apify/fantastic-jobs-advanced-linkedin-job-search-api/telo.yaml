kind: Telo.Library
metadata:
  name: FantasticJobsAdvancedLinkedinJobSearchApi
  version: 0.0.74
  description: >-
    Advanced LinkedIn Job Search API: the Apify actor
    fantastic-jobs/advanced-linkedin-job-search-api (build 0.0.74) as typed Telo kinds. `Run` runs
    it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the background
    and polls until it finishes, for runs of any length. Both take an ApifyClient and the actor's
    own input, type-checked against the actor's input schema.

    Access our real-time LinkedIn Jobs database with over 10 million new jobs per month. With
    detailed company data, recruiter data, and AI enrichments! Get exact results with our advanced
    filters on title, description, location, company description, no. of employees, industry.
    Powered by Fantastic.jobs
  repository: https://github.com/telorun/connectors
