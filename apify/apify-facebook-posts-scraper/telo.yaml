kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/facebook-posts-scraper, from its build 0.0.404 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: Facebook URLs
      description: >-
        Enter a valid Facebook page URL, e.g. https://www.facebook.com/humansofnewyork/. Note that
        you can only scrape public pages with this Actor, not personal profiles.
    resultsLimit:
      type: integer
      title: Results amount
      description: >-
        Set how many posts should be scraped per page. For example, if set to 5, the scraper will
        extract up to 5 posts from each page. This setting is ignored when scraping direct post
        URLs. If this limit is not set, as many results as possible are returned.
      minimum: 1
    captionText:
      type: boolean
      title: Include video transcript
      description: Extract video transcript (if available).
      default: false
    onlyPostsNewerThan:
      type: string
      title: Posts newer than
      description: >-
        Scrape posts from the provided date to the present day (or date set in 'Older than'). The
        date should be in YYYY-MM-DD absolute format or in relative format, e.g., 1 day, 2 months, 3
        years. The JSON input also supports adding time units (UTC timezone): Full or partial ISO
        timestamp (e.g., `2025-09-23T10:02:01`) as absolute time and relative time, e.g., `1 hour`
        or `2 minutes`.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    onlyPostsOlderThan:
      type: string
      title: Posts older than
      description: >-
        Scrape posts from the provided date to the past (or date set in 'Newer than'). The date
        should be in YYYY-MM-DD or full ISO absolute format or in relative format e.g. 1 days, 2
        months, 3 years. The JSON input also supports adding time units (UTC timezone): Full or
        partial ISO timestamp (e.g., `2025-09-23T10:02:01`) as absolute time and relative time,
        e.g., `1 hour` or `2 minutes`.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
