kind: Telo.Library
metadata:
  name: ApifyFacebookPostsScraper
  version: 0.0.404
  description: >-
    Facebook Posts Scraper: the Apify actor apify/facebook-posts-scraper (build 0.0.404) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract posts, videos, and engagement metrics from Facebook pages. Get text captions, reactions,
    video transcripts, images, external links, collaborators, and more from Facebook pages and
    profiles. Export ad data, schedule runs via API, and integrate with other tools or AI workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
