kind: Telo.Library
metadata:
  name: ApifyGoogleSearchScraper
  version: 0.0.468
  description: >-
    Google Search Results Scraper: the Apify actor apify/google-search-scraper (build 0.0.468) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape Google Search Engine Results Pages (SERPs). Select the country or language and extract
    organic and paid results, AI Mode, AI overviews, ads, queries, People Also Ask, prices, reviews,
    like a Google SERP API. Export data, run the scraper via API, schedule runs, or integrate with
    other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
