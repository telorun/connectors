    locationUule:
      type: string
      title: Exact location (Google UULE parameter)
      description: >-
        The code for the exact location for the Google search. It's passed to Google Search as the
        uule URL query parameter. You can use the UULE code generator (https://padavvan.github.io/).
        Learn more about emulating local search
        (https://moz.com/ugc/geolocation-the-ultimate-tip-to-emulate-local-search).
    forceExactMatch:
      type: boolean
      title: Force exact match
      description: >-
        If checked, the scraper will search for the exact phrase in the query. This is done by
        wrapping the query in quotes. Note that this may return fewer results. Also note that if
        you're using operators such as OR or AND, the whole query will be wrapped in quotes, such as
        "Windows AND macOS". If you want to search for queries such as "Windows" AND "macOS", you
        need to specify them directly in the queries field.
      default: false
    site:
      type: string
      title: Site
      description: >-
        Limits the search to a specific site, such as: site:example.com. Note that the site filter
        takes precedence over the relatedToSite filter. If both filters are set, the relatedToSite
        filter will be ignored and not added to the search queries.
      pattern: ^([\w-]+\.)+\w+$
    relatedToSite:
      type: string
      title: Related to site
      description: >-
        Filters pages related to a specific site, such as: related:example.com. Note that the site
        filter takes precedence over the relatedToSite filter. If both filters are set, the
        relatedToSite filter will be ignored and not added to the search queries.
      pattern: ^([\w-]+\.)+\w+$
    wordsInTitle:
      type: array
      title: Words in title
      description: >-
        Filters pages with specific words in the title. The scraper uses the intitle: operator, even
        for multiple words (e.g. recipe site:allrecipes.com intitle:"easy apple" intitle:pie).
        There's also a allintitle: operator available, but it's problematic when combined with other
        search filters, so the scraper avoids using it. If you need to use the allintitle: operator
        specifically, you can include it in your custom queries from the queries field.
      maxItems: 32
      items:
        type: string
        pattern: ^[^\s](.+[^\s])*$
      default: []
    wordsInText:
      type: array
      title: Words in text
      description: >-
        Filters pages with specific words in the text. The scraper uses the intext: operator, even
        for multiple words (e.g. cartoon site:wikipedia.com intext:cat intext:mouse). There's also a
        allintext: operator available, but it's problematic when combined with other search filters,
        so the scraper avoids using it. If you need to use the allintext: operator specifically, you
        can include it in your custom queries from the queries field.
      maxItems: 32
      items:
        type: string
        pattern: ^[^\s](.+[^\s])*$
      default: []
    wordsInUrl:
      type: array
      title: Words in URL
      description: >-
        Filters pages with specific words in the URL. The scraper uses the inurl: operator, even for
        multiple words (e.g. recipe site:allrecipes.com inurl:apple inurl:pie). There's also a
        allinurl: operator available, but it's problematic when combined with other search filters,
        so the scraper avoids using it. If you need to use the allinurl: operator specifically, you
        can include it in your custom queries from the queries field.
      maxItems: 32
      items:
        type: string
        pattern: ^[^\s](.+[^\s])*$
      default: []
    quickDateRange:
      type: string
      title: Quick date range
      description: >-
        Filters results from a specific date range. d[number] specifies the number of past days
        (e.g. the past 10 days can be written as d10). The same applies to hours, weeks, months, and
        years: h[number], w[number], m[number], y[number]. Example for the past year: 'y1' or even
        'y'. The value is passed to Google Search using the tbs URL query parameter, prefixed with
        qdr:. You should avoid combining this filter with the beforeDate and afterDate filters to
        prevent conflicts.
      pattern: ^[hdwmy]\d*$
    beforeDate:
      type: string
      title: Before date
      description: >-
        Filters results from before the specified date. Either absolute date (e.g. `2024-05-03`) or
        relative date from now into the past (e.g. `8 days`, `3 months`). Absolute time is always
        interpreted in the UTC timezone, not your local timezone - please convert accordingly.
        Supported relative date & time units: `days`, `weeks`, `months`, `years`. You should avoid
        combining this filter with the `quickDateRange` filter to prevent conflicts.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    afterDate:
      type: string
      title: After date
      description: >-
        Filters results from after the specified date. Either absolute date (e.g. `2024-05-03`) or
        relative date from now into the past (e.g. `8 days`, `3 months`). Absolute time is always
        interpreted in the UTC timezone, not your local timezone - please convert accordingly.
        Supported relative date & time units: `days`, `weeks`, `months`, `years`. You should avoid
        combining this filter with the `quickDateRange` filter to prevent conflicts.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    fileTypes:
      type: array
      title: File types
      description: >-
        Filters results of specific file types using the filetype: operator, such as filetype:pdf.
        You can select multiple file types as well. They will be combined with the OR operator, for
        example: filetype:doc OR filetype:txt. If you need to use a file type that is not in the
        list (such as a source code file type), you can include it in your custom queries from the
        queries field, using the filetype: operator.
      maxItems: 10
      items:
        type: string
        enum:
          - pdf
          - csv
          - epub
          - ps
          - htm
          - html
          - xls
          - xlsx
          - ppt
          - pptx
          - doc
          - docx
          - odp
          - ods
          - odt
          - rtf
          - svg
          - tex
          - txt
          - wml
          - wap
          - xml
          - xps
          - md
          - readme
          - log
          - yml
          - yaml
          - toml
          - ipynb
          - sas
          - sql
          - rdf
          - avif
          - avi
          - mkv
          - mov
          - flv
          - asf
          - ogv
    mobileResults:
      type: boolean
      title: Mobile results
      description: >-
        If checked, the scraper returns results from the mobile version of Google Search. Otherwise,
        desktop results are returned.
      default: false
    includeUnfilteredResults:
      type: boolean
      title: Unfiltered results
      description: If checked, the lower-quality results that Google normally filters out are included.
      default: false
    saveHtml:
      type: boolean
      title: Save HTML to dataset
      description: >-
        If checked, the HTML of the Google Search results pages is stored in the default dataset,
        under the html property. This is useful if you need to process the HTML, but it makes the
        dataset large.
      default: false
    saveHtmlToKeyValueStore:
      type: boolean
      title: Save HTML to key-value store
      description: >-
        If checked, the HTML of the Google Search results pages is stored in the default key-value
        store, and links to the files are stored in the dataset under the htmlSnapshotUrl property.
        This is useful for debugging, since you can easily view the pages in the browser. Note that
        this feature may slow down the Actor.
      default: true
    includeIcons:
      type: boolean
      title: Include icon image data (base64)
      description: >-
        If checked, all of the results (organicResults, paidResults, suggestedResults) will contain
        Base64-encoded icon image data if found.
      default: false
---
kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item apify/google-search-scraper produces.
schema:
  type: object
  additionalProperties: true
---
kind: Telo.Definition
metadata:
  name: Run
  description: >-
    Run Google Search Results Scraper and wait for its dataset items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActorSync
    metadata:
      name: run
    client: !cel "self.client"
invoke: !ref run
inputs:
  actorId: apify/google-search-scraper
  build: 0.0.468
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
result:
  items: !cel "result.body"
---
kind: Telo.Definition
metadata:
  name: Start
  description: >-
    Run Google Search Results Scraper in the background, poll until the run finishes, and return the
    run and its dataset items. Raises APIFY_RUN_NOT_SUCCEEDED when the run ends FAILED, TIMED-OUT or
    ABORTED.
capability: Telo.Invocable
throws:
  codes:
    APIFY_RUN_NOT_SUCCEEDED:
      description: >-
        The run finished without succeeding. `data` is the Apify run object (id, status,
        statusMessage, …).
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - run
      - items
    properties:
      run:
        type: object
        additionalProperties: true
        description: "The finished Apify run: id, status, defaultDatasetId, stats, usageTotalUsd, …"
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActor
    metadata:
      name: start
    client: !cel "self.client"
  - kind: Apify.GetRun
    metadata:
      name: getRun
    client: !cel "self.client"
  - kind: Apify.GetDatasetItems
    metadata:
      name: getItems
    client: !cel "self.client"
  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
        inputs:
          runId: !cel "inputs.runId"
          waitForFinish: 60
    outputs:
      run: !cel "steps.poll.result.body.data"
  - kind: Flow.Sequence
    metadata:
      name: seq
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - input
        properties:
          input:
            type: object
          timeout:
            type:
              - integer
              - "null"
          memory:
            type:
              - integer
              - "null"
          maxItems:
            type:
              - integer
              - "null"
          maxTotalChargeUsd:
            type:
              - number
              - "null"
    steps:
      - name: start
        invoke: !ref start
        inputs:
          actorId: apify/google-search-scraper
          build: 0.0.468
          input: !cel "inputs.input"
          timeout: !cel "inputs.?timeout.orValue(null)"
          memory: !cel "inputs.?memory.orValue(null)"
          maxItems: !cel "inputs.?maxItems.orValue(null)"
          maxTotalChargeUsd: !cel "inputs.?maxTotalChargeUsd.orValue(null)"
      - name: wait
        invoke: !ref wait
        inputs:
          runId: !cel "steps.start.result.body.data.id"
      - name: check
        if: !cel "steps.wait.result.run.status != 'SUCCEEDED'"
        then:
          - name: fail
            throw:
              code: APIFY_RUN_NOT_SUCCEEDED
              message: !cel >-
                'Apify run ' + steps.wait.result.run.id + ' finished with status ' +
                steps.wait.result.run.status
              data: !cel "steps.wait.result.run"
      - name: items
        invoke: !ref getItems
        inputs:
          datasetId: !cel "steps.wait.result.run.defaultDatasetId"
    outputs:
      run: !cel "steps.wait.result.run"
      items: !cel "steps.items.result.body"
invoke: !ref seq
inputs:
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
