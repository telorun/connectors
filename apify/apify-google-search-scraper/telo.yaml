kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/google-search-scraper, from its build 0.0.468 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - queries
  properties:
    queries:
      type: string
      title: Search term(s)
      description: >-
        Use regular search words or enter Google Search URLs. You can also apply [advanced Google
        search techniques](https://blog.apify.com/how-to-scrape-google-like-a-pro/), such as AI
        site:twitter.com or javascript OR python. You can also define selected search filters as
        separate fields below (in the Advanced search filters section). Just ensure that your
        queries do not exceed 32 words to comply with Google Search limits.
      pattern: "[^\\s]+"
    maxPagesPerQuery:
      type: integer
      title: Max pages per search
      description: >-
        Maximum number of pages to scrape per search query. Each page contains approximately 10
        results.
      minimum: 1
    aiOverview:
      type: object
      title: "⏩ Add-on: Google AI Overview ($)"
      description: >-
        Get the complete AI Overview whenever Google shows one for your query - handy when the short
        snippet isn't enough. May take slightly longer than a standard run, and works best on
        queries likely to trigger an AI Overview. Costs extra per captured AI Overview - see the
        Pricing tab (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest)
        for your rate.
      additionalProperties: false
      properties:
        scrapeFullAiOverview:
          type: boolean
          title: "⏩ Add-on: Google AI Overview ($)"
          description: Turn on to capture the full AI Overview whenever one appears.
      default:
        scrapeFullAiOverview: false
    aiModeSearch:
      type: object
      title: "⏩ Add-on: Google AI Mode ($)"
      description: >-
        See how your brand appears in Google AI Mode, Google's dedicated AI search interface on
        google.com (distinct from the AI Overview snippets in regular results). Great for AEO and
        GEO tracking. Costs extra per result - see the Pricing tab
        (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest) for your
        rate.
      additionalProperties: false
      properties:
        enableAiMode:
          type: boolean
          title: "⏩ Add-on: Google AI Mode ($)"
          description: Turn on to fetch Google AI Mode results for every query.
      default:
        enableAiMode: false
    geminiSearch:
      type: object
      title: "⏩ Add-on: Gemini search ($)"
      description: >-
        Get an AI answer from Google Gemini (gemini.google.com), Google's standalone assistant,
        separate from Google Search.

        Costs extra per result - see the Pricing tab
        (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest) for your
        rate.
      additionalProperties: false
      properties:
        enableGemini:
          type: boolean
          title: "⏩ Add-on: Gemini search ($)"
          description: Turn on to fetch a Gemini answer for every query.
      default:
        enableGemini: false
    perplexitySearch:
      type: object
      title: "⏩ Add-on: Perplexity AI search ($)"
      description: >-
        Get AI answers and citations from Perplexity's Sonar model.

        Costs extra per result - see the Pricing tab
        (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest) for your
        rate.
      additionalProperties: false
      properties:
        enablePerplexity:
          type: boolean
          title: "⏩ Add-on: Perplexity AI search ($)"
          description: Turn on to fetch a Perplexity answer for every query.
        searchRecency:
          type: string
          title: Search recency
          description: Filter search results based on their recency.
          enum:
            - day
            - week
            - month
            - year
        returnImages:
          type: boolean
          title: Include images in Perplexity AI answers
          description: Include relevant images in Perplexity's answer.
        returnRelatedQuestions:
          type: boolean
          title: Include related questions in Perplexity AI answers
          description: Include follow-up questions related to your query.
      default:
        enablePerplexity: false
        returnImages: false
        returnRelatedQuestions: false
    chatGptSearch:
      type: object
      title: "⏩ Add-on: ChatGPT search ($)"
      description: >-
        Get AI answers from OpenAI's search model.

        Costs extra per result - see the Pricing tab
        (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest) for your
        rate.
      additionalProperties: false
      properties:
        enableChatGpt:
          type: boolean
          title: "⏩ Add-on: ChatGPT search ($)"
          description: Turn on to fetch a ChatGPT answer for every query.
      default:
        enableChatGpt: false
    copilotSearch:
      type: object
      title: "⏩ Add-on: Microsoft Copilot search ($)"
      description: Get AI answers from Microsoft Copilot.
      additionalProperties: false
      properties:
        enableCopilot:
          type: boolean
          title: "⏩ Add-on: Microsoft Copilot search ($)"
          description: Turn on to fetch a Microsoft Copilot answer for every query.
        copilotSearchMode:
          type: string
          title: Microsoft Copilot search mode
          description: >-
            Select which Microsoft Copilot chat mode to use for the request:

            • chat - Standard conversational mode. Best for general queries and quick answers.

            • reasoning - Deep analytical mode. Best for complex questions requiring logical depth.

            • smart - Balanced mode combining speed and reasoning for most use cases.

            • study - Detailed explanatory mode. Best for educational and research-oriented prompts.
          enum:
            - chat
            - reasoning
            - smart
            - study
      default:
        enableCopilot: false
    maximumLeadsEnrichmentRecords:
      type: integer
      title: "⏩ Add-on: Extract business leads information: max leads per domain ($)"
      description: >-
        Maximum number of lead records to scrape per domain found. Set to 0 (the default) to disable
        leads enrichment.

        ⚠️ This returns personal data. You're responsible for having a legal basis to collect and
        use it under privacy laws.

        ⚠️ This value is a multiplier - see the section description above for how costs are
        calculated.
      minimum: 0
      default: 0
    leadsEnrichmentDepartments:
      type: array
      title: Lead departments
      description: >-
        Include only leads from specific departments, such as Sales, Marketing, or C-suite. Only
        applies when business leads enrichment (maximumLeadsEnrichmentRecords) is enabled. Note that
        some job titles may be miscategorized.
      items:
        type: string
        enum:
          - c_suite
          - product
          - engineering_technical
          - design
          - education
          - finance
          - human_resources
          - information_technology
          - legal
          - marketing
          - medical_health
          - operations
          - sales
          - consulting
    verifyLeadsEnrichmentEmails:
      type: boolean
      title: "⏩ Add-on: Email verification ($)"
      description: >-
        Check whether each lead's email is actually deliverable before you reach out. Adds an
        emailVerification object to every lead with the result and a quality score.

        Charged (decisive results): valid (ok), invalid, and disposable addresses.

        Not charged: catch-all, unknown, and error results.

        ⚠️ Requires business leads enrichment to be enabled.
      default: false
    linkProspecting:
      type: object
      title: "🔗 Add-on: Link prospecting tool ($)"
      description: >-
        Charged events: search-page-scraped (base, per Google SERP page), website-content-scraped,
        lead-scraped (up to 5 contacts per domain, marketing and C-suite roles only), and one event
        per enabled AI engine query. See the Pricing tab
        (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest) for rates.

        ⚠️ If business leads enrichment is also active, domains that appear in both organic results
        and AI citations may be enriched by both features and charged for leads separately.

        ⚠️ If the Full website content add-on is also active, pages shared between the two add-ons
        are scraped and charged only once.
      additionalProperties: false
      properties:
        brandName:
          type: string
          title: Brand name
          description: >-
            Your brand name to search for on every cited page. Setting this field enables the Link
            prospecting tool add-on. Pages where this name is found are saved with
            isBrandMentionedInSource: true. Pages where it is absent are saved with
            isBrandMentionedInSource: false and enriched with outreach contacts. Leave empty to
            disable this add-on.
        ownDomains:
          type: array
          title: Own domains
          description: >-
            List of domains belonging to your brand. These are excluded from Link prospecting tool
            results - you don't need to find outreach contacts on your own site. Subdomains are also
            excluded when their root domain matches.
          items:
            type: string
        ignoredDomains:
          type: array
          title: Ignored domains
          description: >-
            List of domains to exclude from Link prospecting tool (e.g. competitor sites or
            well-known directories). Subdomains are also excluded when their root domain matches.
          items:
            type: string
    websiteContentScraper:
      type: object
      title: "🔍 Add-on: Full website content ($)"
      description: >-
        Get the full page content of every organic result as websiteContent.text, plus
        websiteContent.markdown when the page converts cleanly (null otherwise). Uses the Website
        Content Crawler. Charged event: website-content-scraped, per successfully scraped page. See
        the Pricing tab
        (https://console.apify.com/actors/nFJndFXA5zjCTuudP/info/pricing?build=latest) for rates.

        ⚠️ If the Link prospecting tool add-on is also active, pages shared between the two add-ons
        are scraped and charged only once.
      additionalProperties: false
      properties:
        enable:
          type: boolean
          title: "🔍 Add-on: Full website content ($)"
          description: Turn on to scrape each organic result page and attach its content to the result item.
      default:
        enable: false
    focusOnPaidAds:
      type: boolean
      title: "📢 Add-on: Paid results (ads) extraction ($)"
      description: Turn on to capture the Google Ads shown for each query.
      default: false
