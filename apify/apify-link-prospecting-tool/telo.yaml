kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/link-prospecting-tool, from its build 0.0.14 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - queries
    - brand
  properties:
    queries:
      type: string
      title: Search queries
      description: >-
        Enter one search query per line. These queries will be sent to the enabled AI platforms
        (ChatGPT, Google AI Mode, AI Overviews, and Perplexity) to check for your brand's
        visibility.
      pattern: "[^\\s]+"
    brand:
      type: string
      title: Brand name
      description: >-
        The brand name to search for in AI-generated responses and cited sources. The search is
        case-insensitive.
    organicResult:
      type: integer
      title: Organic results to include
      description: >-
        How many organic search results to include per query. Asking for more than 10 will slow down
        the Actor.
      minimum: 0
      maximum: 500
      default: 10
    enableChatGpt:
      type: boolean
      title: Enable ChatGPT Search
      description: >-
        Enable ChatGPT Search to get AI-generated answers from OpenAI's search model. Additional
        fees apply per successful result via the Google Search Scraper Actor.
      default: true
    enableAiMode:
      type: boolean
      title: Enable Google AI Mode
      description: >-
        Enable Google AI Mode to get Google's AI-generated responses. Additional fees apply per
        successful result via the Google Search Scraper Actor.
      default: true
    enableAiOverviews:
      type: boolean
      title: Process Google AI Overviews
      description: >-
        Process Google AI Overviews that appear in search results. No additional cost - the Actor
        will analyze the AI Overview content and sources for brand mentions.
      default: true
    enablePerplexity:
      type: boolean
      title: Enable Perplexity AI Search
      description: >-
        Enable Perplexity AI to get answers from the Sonar model. Additional fees apply per
        successful result via the Google Search Scraper Actor.
      default: true
    enableGemini:
      type: boolean
      title: Enable Gemini AI Search
      description: >-
        Fetches an AI answer from Gemini (gemini.google.com) for every query to compare against
        other AI platforms.
      default: true
    enableCopilot:
      type: boolean
      title: Enable Copilot AI Search
      description: Fetches an AI answer from Copilot for every query to compare against other AI models.
      default: true
    ownDomains:
      type: array
      title: Own domains (to exclude)
      description: >-
        List your own domains to exclude from source analysis. Sources from these domains will be
        skipped since you already have presence there.
      items:
        type: string
      default: []
    competitorDomains:
      type: array
      title: Competitor domains (to exclude)
      description: >-
        List competitor domains to exclude from source analysis. Sources from these domains will be
        skipped.
      items:
        type: string
      default: []
    ignoreDomains:
      type: array
      title: Other domains to exclude
      description: >-
        List competitor domains to exclude. For example domain with user generated content like
        Quora and Youtube
      items:
        type: string
      default: []
    maxContactsPerDomain:
      type: integer
      title: Max contacts per domain
      description: >-
        Maximum number of contact leads to scrape from each source domain where the brand isn't
        mentioned. Higher values increase cost but provide more outreach contacts.
      minimum: 1
      maximum: 10
      default: 1
    includeMention:
      type: boolean
      title: Include mentions without backlink
      description: >-
        By default, sources that mention your brand without giving you a backlink are included in
        the contact search.
      default: true
    department:
      type: array
      title: Department to search for leads
      description: >-
        By default, the Actor looks for leads in the marketing department, as they're most likely to
        work on link building.
      items:
        type: string
        enum:
          - c_suite
          - engineering_technical
          - product
          - design
          - finance
          - education
          - human_resources
          - information_technology
          - legal
          - marketing
          - medical_health
          - operations
          - sales
          - consulting
      default:
        - marketing
        - c_suite
    enableEmailVerification:
      type: boolean
      title: Email verification
      description: >-
        When enabled, verifies the email address of each lead extracted during business leads
        enrichment. Each lead receives an emailVerification object with the verification result and
        quality assessment.
      default: true
    searchAuthorName:
      type: boolean
      title: Search for author name
      description: Uses AI to identify the author of the article and find their email address.
      default: false
