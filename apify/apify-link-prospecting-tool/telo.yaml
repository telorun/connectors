kind: Telo.Library
metadata:
  name: ApifyLinkProspectingTool
  version: 0.0.14
  description: >-
    Link Prospecting Tool: the Apify actor apify/link-prospecting-tool (build 0.0.14) as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    Monitor your brand visibility across AI and organic search platforms (ChatGPT, Google AI Mode,
    Google AI Overviews, and Perplexity). Check if quoted sources include your brand, and find link
    outreach opportunities.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
