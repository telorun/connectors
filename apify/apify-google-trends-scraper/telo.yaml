kind: Telo.Library
metadata:
  name: ApifyGoogleTrendsScraper
  version: 0.0.141
  description: >-
    Google Trends Scraper: the Apify actor apify/google-trends-scraper (build 0.0.141) as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    Scrape data from Google Trends by search terms or URLs. Specify locations, define time ranges,
    select categories to get interest by subregion and over time, related queries and topics, and
    more. Export scraped data, run the scraper via API, schedule and monitor runs, or integrate with
    other tools.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
