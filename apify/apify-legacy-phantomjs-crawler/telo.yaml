kind: Telo.Library
metadata:
  name: ApifyLegacyPhantomjsCrawler
  version: 0.0.25
  description: >-
    Legacy PhantomJS Crawler: the Apify actor apify/legacy-phantomjs-crawler (build 0.0.25) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Replacement for the legacy Apify Crawler product with a backward-compatible interface. The Actor
    uses PhantomJS headless browser to recursively crawl websites and extract data from them using a
    piece of front-end JavaScript code.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/legacy-phantomjs-crawler, from its build 0.0.25 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        List of URLs that will be loaded by the crawler on start. For a POST request, append [POST]
        to the URL, e.g. http://www.example.com/[POST]
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - value
        properties:
          key:
            type: string
            title: Label
            description: Optional label of the URL.
            pattern: ^.{0,100}$
          value:
            type: string
            title: URL
            description: URL to be loaded by the crawler. Must start with http:// or https://.
            pattern: ^([hH][tT][tT][pP]:\/\/|[hH][tT][tT][pP][sS]:\/\/)
    crawlPurls:
      type:
        - array
        - "null"
      title: Pseudo-URLs
      description: >-
        Specifies URLs of pages to crawl. Put regular expressions in [ ] brackets, e.g.
        http://www.example.com/[.*]
      items:
        type: object
        additionalProperties: false
        required:
          - value
        properties:
          key:
            type: string
            title: Label
            description: Optional label of the URL.
            pattern: ^.{0,100}$
          value:
            type: string
            title: Pseudo-URL
            description: Pseudo-URL of pages to crawl. Must start with http:// or https://.
            pattern: ^([hH][tT][tT][pP]:\/\/|[hH][tT][tT][pP][sS]:\/\/)
    clickableElementsSelector:
      type:
        - string
        - "null"
      title: Clickable elements
      description: >-
        CSS selector used to find links to other web pages. Leave empty to ignore all links.

        For example: a[href]
    pageFunction:
      type:
        - string
        - "null"
      title: Page function
      description: >-
        JavaScript function that is executed on every crawled page, use it to extract data. Note
        that only ES5.1 syntax is supported.
    interceptRequest:
      type:
        - string
        - "null"
      title: Intercept request function
      description: >-
        JavaScript function called whenever the crawler finds a link or form leading to a new web
        page. Note that only ES5.1 syntax is supported
    considerUrlFragment:
      type:
        - boolean
        - "null"
      title: "URL #fragments identify unique pages"
      description: >-
        Indicates that the URL fragment identifier (i.e. http://example.com/page#this-guy-here)
        should be considered when matching a URL against a Pseudo-URL or when checking whether a
        page has already been visited. Typically, URL fragments are used as internal page anchors
        and therefore they should be ignored because they don't represent separate pages. However,
        many AJAX-based website nowadays use URL fragment to represent page parameters; in such
        cases, this option should be enabled.
      default: false
    loadImages:
      type:
        - boolean
        - "null"
      title: Download HTML images
      description: >-
        Indicates whether the crawler should load HTML images, both those included using the <img>
        tag as well as those included in CSS styles. Disable this feature after you have fine-tuned
        your crawler in order to increase crawling performance and reduce your bandwidth costs.
      default: true
    loadCss:
      type:
        - boolean
        - "null"
      title: Download CSS files
      description: >-
        Indicates whether the crawler should load CSS stylesheet files. Disable this feature after
        you have fine-tuned your crawler in order to increase crawling performance and reduce your
        bandwidth costs.
      default: true
    injectJQuery:
      type:
        - boolean
        - "null"
      title: Inject jQuery
      description: >-
        Indicates that the jQuery (http://jquery.com) library should be injected into each page
        before Page function is invoked. Note that the jQuery object will not be registered into
        global namespace in order to avoid conflicts with libraries used by the web page. It can
        only be accessed through context.jQuery.
      default: true
    injectUnderscoreJs:
      type:
        - boolean
        - "null"
      title: Inject Underscore.js
      description: >-
        Indicates that the Underscore.js (http://underscorejs.org) library should be injected into
        each page before Page function is invoked. Note that the Underscore object will not be
        registered into global namespace in order to avoid conflicts with libraries used by the web
        page. It can only be accessed through context.underscoreJs.
      default: false
    ignoreRobotsTxt:
      type:
        - boolean
        - "null"
      title: Ignore robots exclusion standards
      description: >-
        Indicates that the crawler should ignore robots.txt, <meta name='robots'> tags and
        X-Robots-Tag HTTP headers. Use this feature at your own risk!
      default: false
    skipLoadingFrames:
      type:
        - boolean
        - "null"
      title: Don't load frames and IFRAMEs
      description: >-
        Indicates that child frames included using FRAME or IFRAME tags will not be loaded by the
        crawler. This might improve crawling performance. As a side-effect, JavaScript redirects
        issued by the page before it was completely loaded will not be performed, which might be
        useful in certain situations.
      default: false
    verboseLog:
      type:
        - boolean
        - "null"
      title: Verbose log
      description: >-
        If enabled, the log will also contain DEBUG messages. Note that this setting will
        dramatically slow down the crawler as well as your web browser and increase the log size.
      default: false
    disableWebSecurity:
      type:
        - boolean
        - "null"
      title: Disable web security
      description: >-
        If checked, the virtual browser will allow cross-domain XHRs and untrusted SSL certificates,
        so that your crawler can access content from any domain. Only activate this feature if you
        know what you're doing!
      default: false
    rotateUserAgents:
      type:
        - boolean
        - "null"
      title: Rotate User-Agent headers
      description: >-
        If checked, the crawler automatically rotates the User-Agent HTTP header for each new IP
        address, from a pre-defined list. This settings overwrites User-Agent set in Custom HTTP
        headers.
      default: false
    maxCrawledPages:
      type:
        - integer
        - "null"
      title: Max pages per crawl
      description: >-
        Maximum number of pages that the crawler will open. The crawl will stop when this limit is
        reached. Always set this value in order to prevent infinite loops in misconfigured crawlers.
        Note that in cases of parallel crawling, the actual number of pages visited might be
        slightly higher than this value.
      minimum: 1
      maximum: 999999999
    maxOutputPages:
      type:
        - integer
        - "null"
      title: Max result records
      description: >-
        Maximum number of pages the crawler can output to JSON. The crawl will stop when this limit
        is reached. This value is useful when you only need a limited number of results.
      minimum: 1
      maximum: 999999999
    maxCrawlDepth:
      type:
        - integer
        - "null"
      title: Max crawling depth
      description: >-
        Defines how many links away from the start URLs the crawler will descend. This value is a
        safeguard against infinite crawling depths on misconfigured crawlers. Note that pages added
        using enqueuePage() in Page function are not subject to the maximum depth constraint.
      minimum: 1
      maximum: 999999999
    timeout:
      type:
        - integer
        - "null"
      title: Execution timeout
      description: >-
        This field has been deprecated and its value is ignored. To set the execution timeout, use
        the actor run timeout option instead.
      minimum: 1
      maximum: 1814400
      default: 604800
    resourceTimeout:
      type:
        - integer
        - "null"
      title: Resource timeout
      description: Timeout for network resources loaded by the crawler, in milliseconds.
      minimum: 100
      maximum: 1000000
      default: 30000
    pageLoadTimeout:
      type:
        - integer
        - "null"
      title: Page load timeout
      description: >-
        Timeout for web page load, in milliseconds. If the web page does not load in this time
        frame, it is considered to have failed and will be retried, similarly as with other page
        load errors.
      minimum: 100
      maximum: 1000000
      default: 60000
    pageFunctionTimeout:
      type:
        - integer
        - "null"
      title: Page function timeout
      description: >-
        Timeout for the asynchronous part of the Page function, in milliseconds. Note that this
        value is only applied if your page function runs code in the background, i.e. when it
        invokes context.willFinishLater(). The page function itself always runs to completion
        regardless of the timeout.
      minimum: 0
      maximum: 3600000
      default: 600000
    maxInfiniteScrollHeight:
      type:
        - integer
        - "null"
      title: Infinite scroll height
      description: >-
        Defines the maximum client height in pixels to which the browser window is scrolled in order
        to fetch dynamic AJAX-based content from the web server. By default, the crawler doesn't
        scroll and uses a fixed browser window size. Note that you might need to enable Download
        HTML images to make infinite scroll work, because otherwise the crawler wouldn't know that
        some resources are still being loaded and will stop infinite scrolling prematurely.
      minimum: 0
      maximum: 1000000
    randomWaitBetweenRequests:
      type:
        - integer
        - "null"
      title: Delay between requests
      description: >-
        This option forces the crawler to ensure a minimum time interval between opening two web
        pages, in order to prevent it from overloading the target server. The actual minimum time is
        a random value drawn from a Gaussian distribution with a mean specified by your setting (in
        milliseconds) and a standard deviation corresponding to 25% of the mean. The minimum value
        is 1000 milliseconds, the crawler never issues requests in shorter intervals than 1000
        milliseconds.
      minimum: 1000
      maximum: 1000000
      default: 1000
    maxCrawledPagesPerSlave:
      type:
        - integer
        - "null"
      title: Max pages per IP address
      description: >-
        Maximum number of pages that a single crawling process will open before it is restarted with
        a new proxy server setting. This option can help avoid the blocking of the crawler by the
        target server and also ensures that the crawling processes don't grow too large, as they are
        killed periodically.
      minimum: 1
      maximum: 100
      default: 50
    maxParallelRequests:
      type:
        - integer
        - "null"
      title: Max parallel processes
      description: >-
        The maximum number of parallel processes that will perform the crawl. The actual number
        might be lower if the actor runs without enough memory. Note that each parallel process uses
        a different proxy (if enabled).
      minimum: 1
      maximum: 100
      default: 50
    maxPageRetryCount:
      type:
        - integer
        - "null"
      title: Max page retries
      description: >-
        The maximum number of times the crawler will retry to open a web page on load error. Note
        that on page function errors, the pages are not retried.
      minimum: 0
      maximum: 10
      default: 3
    customHttpHeaders:
      type:
        - array
        - "null"
      title: Custom HTTP headers
      description: >-
        Custom HTTP headers set by the crawler to all requests. It is an array of objects, where
        each object has the key and value properties.
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: >-
        Specifies the type of proxy servers that will be used by the crawler in order to hide its
        origin.
    proxyType:
      type:
        - string
        - "null"
      title: Proxy type (legacy)
      description: >-
        Specifies the type of proxy servers that will be used by the crawler.

        This is a legacy option only kept for backwards compatibility, use proxyConfiguration
        instead!
    proxyGroups:
      type:
        - array
        - "null"
      title: Proxy groups (legacy)
      description: >-
        Specifies Apify Proxy groups to be used when proxyType is SELECTED_PROXY_GROUPS.

        This is a legacy option only kept for backwards compatibility - use proxyConfiguration
        instead!
      default: []
    customProxies:
      type:
        - string
        - "null"
      title: Custom proxies (legacy)
      description: >-
        Specifies Apify Proxy groups to be used when proxyType is CUSTOM. Each proxy should be
        specified in the scheme://user:password@host:port format, multiple proxies should be
        separated by a space or new line.

        This is a legacy option only kept for backwards compatibility - use proxyConfiguration
        instead!
    customData:
      type:
        - object
        - string
        - integer
        - boolean
        - array
        - "null"
      title: Custom data
      description: >-
        A custom JSON object that is passed to Page function and intercept request function as
        context.customData. This setting is mainly useful if you're invoking the crawler using the
        API, so that you can pass some arbitrary parameters to your code.
    finishWebhookUrl:
      type:
        - string
        - "null"
      title: Finish webhook URL
      description: >-
        An HTTP endpoint that receives a POST request right after the run of this actor finishes.
        The POST payload is a JSON object with the following properties: actorId, runId, taskId,
        datasetId and data

        For more information about finish webhooks, please see the actor README.
      maxLength: 1000
      pattern: >-
        ^(?:(?:[hH][tT][tT][pP][sS]?):\/\/)(?:\S+(?::\S*)?@)?(?:(?!10(?:\.\d{1,3}){3})(?!127(?:\.\d{1,3}){3})(?!169\.254(?:\.\d{1,3}){2})(?!192\.168(?:\.\d{1,3}){2})(?!172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])(?:\.(?:1?\d{1,2}|2[0-4]\d|25[0-5])){2}(?:\.(?:[1-9]\d?|1\d\d|2[0-4]\d|25[0-4]))|(?:(?:[a-zA-Z\u00a1-\uffff0-9]+-?)*[a-zA-Z\u00a1-\uffff0-9]+)(?:\.(?:[a-zA-Z\u00a1-\uffff0-9]+-?)*[a-zA-Z\u00a1-\uffff0-9]+)*(?:\.(?:[a-zA-Z\u00a1-\uffff]{2,})))(?::\d{2,5})?(?:\/[^\s]*)?$
    finishWebhookData:
      type:
        - string
        - "null"
      title: Finish webhook data
      description: >-
        Custom string that is sent in the POST payload to Finish webhook URL, as the data property.

        For more information about finish webhooks, please see the actor README.
      maxLength: 10000
    cookiesPersistence:
      type:
        - string
        - "null"
      title: Cookies persistence
      description: >-
        Indicates how cookies collected by the crawler are persisted. This is useful if you need to
        maintain a login.

        For more information about cookies, please see the actor README.
      enum:
        - PER_PROCESS
        - PER_CRAWLER_RUN
        - OVER_CRAWLER_RUNS
        - null
      default: PER_PROCESS
    cookies:
      type:
        - array
        - "null"
      title: Initial cookies
      description: >-
        JSON array with cookies that the crawler starts with. This is useful for reusing a login
        from an external web browser. Note that if the Cookies persistence setting is Over all
        crawler runs, this field in the actor task configuration will be overwritten with new
        cookies from the crawler whenever it successfully finishes.

        For more information about cookies, please see the actor README.
