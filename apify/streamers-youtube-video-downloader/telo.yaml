    audioOnlyUrl:
      type:
        - string
        - "null"
      description: >-
        Direct URL to the best-quality audio-only stream. May be undefined if the video has no
        separate audio track.
    videoOnlyUrl:
      type:
        - string
        - "null"
      description: >-
        Direct URL to the best-quality video-only stream (or combined stream if no separate tracks
        are available)
