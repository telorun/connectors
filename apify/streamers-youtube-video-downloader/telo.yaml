  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
