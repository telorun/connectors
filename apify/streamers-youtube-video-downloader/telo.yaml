kind: Telo.Library
metadata:
  name: StreamersYoutubeVideoDownloader
  version: 0.0.111
  description: >-
    YouTube Video Downloader: the Apify actor streamers/youtube-video-downloader (build 0.0.111) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Use YouTube Video Downloader to download YouTube videos in MP4, MP3, avi, and other formats
    directly to your cloud storage service.  Just add a YouTube video URL and get the converted
    video in a few seconds.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of streamers/youtube-video-downloader, from its build 0.0.111 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - videos
  properties:
    videos:
      type: array
      title: Videos
      description: A list of video urls
      minItems: 1
    storeInKVStore:
      type: boolean
      title: Download to Apify Storage
      description: >-
        Instead of a cloud storage, you can download the videos to Apify Storage. **IMPORTANT**: The
        storage is owned by Apify and the videos in it will be deleted after ~3 days. Links to
        videos are pushed to the dataset.
    preferredQuality:
      type: string
      title: Preferred quality
      description: Optional quality, may require more time to process if > 720p
      enum:
        - 144p
        - 240p
        - 360p
        - 480p
        - 720p
        - 1080p
        - 1440p
        - 2160p
      default: 720p
    preferredFormat:
      type: string
      title: Preferred format
      description: >-
        Optional format, may require more time to process. For now only video formats are supported,
        but audio-only formats will be added in the future
      enum:
        - avi
        - flv
        - mkv
        - mov
        - mp4
        - webm
        - aac
        - aiff
        - alac
        - flac
        - m4a
        - mka
        - mp3
        - ogg
        - opus
        - vorbis
        - wav
    filenameTemplateParts:
      type: array
      title: Name your file with
      description: >-
        Specifies what video info to include in the filename. Each part will be separated by an
        underscore. Video ID is always included at the start, and if the title of the video is too
        long, the whole filename will be truncated to 252 characters. When downloading to Apify's
        Key-Value Store, will transliterate the filename to ASCII characters, if needed.
      maxItems: 3
      items:
        type: string
        enum:
          - title
          - uploader
          - timestamp
      default:
        - title
    s3AccessKeyId:
      type: string
      title: S3 Access Key ID
      description: Access key ID for the S3 bucket
      x-telo-sensitive: true
    s3SecretAccessKey:
      type: string
      title: S3 Secret Access Key
      description: Secret access key for the S3 bucket
      x-telo-sensitive: true
    s3Bucket:
      type: string
      title: S3 Bucket
      description: Name of the S3 bucket. Must be created by you.
    s3Region:
      type: string
      title: S3 Region
      description: Region of the S3 bucket. E.g. 'us-west-1'
    azureConnectionString:
      type: string
      title: Azure Connection String
      description: Connection string for the Azure Blob Storage
      x-telo-sensitive: true
    azureContainerName:
      type: string
      title: Azure Container Name
      description: Name of the Azure container. Will be auto-created if doesn't exist
    googleCloudServiceKey:
      type: string
      title: Google Cloud Service Key JSON
      description: Service account's key JSON object for the Google Cloud Storage
      x-telo-sensitive: true
    googleCloudBucketName:
      type: string
      title: Google Cloud Bucket Name
      description: Name of the Google Cloud bucket. Must be created by you
    transcriptionAndSubtitle:
      type: string
      title: Transcription & Subtitles
      description: >-
        Choose how to handle subtitles and audio transcription for input videos. Subtitles are
        provided by YouTube for some videos, and transcription means that this Actor will use
        speech-to-text AI to generate video transcript. Transcripts are charged as an extra event
        according to your plan.
      enum:
        - NONE
        - ALWAYS_SUBTITLES
        - TRANSCRIPTION_AS_FALLBACK
        - ALWAYS_TRANSCRIBE
      default: NONE
