kind: Telo.Library
metadata:
  name: ApifyFacebookEventsScraper
  version: 0.0.93
  description: >-
    Facebook Events Scraper: the Apify actor apify/facebook-events-scraper (build 0.0.93) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Facebook Events Scraper extracts data such as event name, location, description or number of
    users who are interested. You can use URLs of specific events or come up with search queries and
    explore pretty much unlimited number of events. Search queries can be combined with various
    search filters.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
