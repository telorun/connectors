schema:
  type: object
  additionalProperties: false
  properties:
    searchQueries:
      type: array
      title: Search (What and/or where)
      description: >-
        Search you want to use to discover new events. You can provide search for topics, such as
        'Sport', or for places, such as 'New York', or combine them 'Sport New York'.
      minItems: 0
      uniqueItems: true
      default: []
    startUrls:
      type: array
      title: Or use direct URLs instead of Search
      description: >-
        URLs to start with. You can provide URLs of event details here or search/explore URLs, e.g.
        'https://www.facebook.com/events/1023978871819924' or
        'https://www.facebook.com/events/search/?q=Party' or
        'https://www.facebook.com/events/explore/fr-paris/110774245616525' or
        'https://www.facebook.com/events/search?q=Comedy&sde=AbrQ9KopLfqYT7heXVVCxznkZYxRr9hU1JA4cdLbJhjgs56yyeHW3e833A9dGP1WlEHOyagjWyFL9Y79gw-Ko1iVuJCILVkpVsHkmSbBFb3SEA&%3D'.
      minItems: 0
      uniqueItems: true
      default: []
    maxEvents:
      type: integer
      title: Max Events
      description: >-
        Maximum number of events to extract for each search query or start URL. If you leave this
        field empty, the number of events won't be limited.
