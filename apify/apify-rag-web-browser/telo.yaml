kind: Telo.Library
metadata:
  name: ApifyRagWebBrowser
  version: 1.0.33
  description: >-
    RAG Web Browser: the Apify actor apify/rag-web-browser (build 1.0.33) as typed Telo kinds. `Run`
    runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Web search and fetch tool for AI agents and RAG pipelines. It queries Google Search, scrapes the
    top N pages using a full web browser, and returns their content as clean Markdown for further
    processing by an LLM. Can also fetch individual URLs.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/rag-web-browser, from its build 1.0.33 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - query
  properties:
    query:
      type: string
      title: Search term or URL
      description: >-
        Enter Google Search keywords or a URL of a specific web page. The keywords might include the
        [advanced search operators](https://blog.apify.com/how-to-scrape-google-like-a-pro/).
        Examples:

        - san francisco weather

        - https://www.cnn.com

        - function calling site:openai.com
      pattern: "[^\\s]+"
    maxResults:
      type: integer
      title: Maximum results
      description: >-
        The maximum number of top organic Google Search results whose web pages will be extracted.
        If `query` is a URL, then this field is ignored and the Actor only fetches the specific web
        page.
      minimum: 1
      maximum: 100
      default: 3
    outputFormats:
      type: array
      title: Output formats
      description: >-
        Select one or more formats to which the target web pages will be extracted and saved in the
        resulting dataset.
      items:
        type: string
        enum:
          - text
          - markdown
          - html
          - links
      default:
        - markdown
    requestTimeoutSecs:
      type: integer
      title: Request timeout
      description: >-
        The maximum time in seconds available for the request, including querying Google Search and
        scraping the target web pages. For example, OpenAI allows only [45
        seconds](https://platform.openai.com/docs/actions/production#timeouts) for custom actions.
        If a target page loading and extraction exceeds this timeout, the corresponding page will be
        skipped in results to ensure at least some results are returned within the timeout. If no
        page is extracted within the timeout, the whole request fails.
      minimum: 1
      maximum: 300
      default: 40
    serpProxyGroup:
      type: string
      title: SERP proxy group
      description: >-
        Enables overriding the default Apify Proxy group used for fetching Google Search results.
        Either `GOOGLE_SERP` (default) or `SHADER`. No longer offered in the UI.
      default: GOOGLE_SERP
    serpMaxRetries:
      type: integer
      title: SERP max retries
      description: >-
        The maximum number of times the Actor will retry fetching the Google Search results on
        error. If the last attempt fails, the entire request fails.
      minimum: 0
      maximum: 5
      default: 2
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: Apify Proxy configuration used for scraping the target web pages.
      default:
        useApifyProxy: true
    scrapingTool:
      type: string
      title: Select a scraping tool
      description: >-
        Select a scraping tool for extracting the target web pages. The Browser tool is more
        powerful and can handle JavaScript heavy websites, while the Plain HTML tool can't handle
        JavaScript but is about two times faster.
      enum:
        - browser-playwright
        - raw-http
      default: raw-http
    removeElementsCssSelector:
      type: string
      title: Remove HTML elements (CSS selector)
      description: >-
        A CSS selector matching HTML elements that will be removed from the DOM, before converting
        it to text, Markdown, or saving as HTML. This is useful to skip irrelevant page content. The
        value must be a valid CSS selector as accepted by the `document.querySelectorAll()`
        function.

        By default, the Actor removes common navigation elements, headers, footers, modals, scripts,
        and inline image. You can disable the removal by setting this value to some non-existent CSS
        selector like `dummy_keep_everything`.
      default: |-
        nav, footer, script, style, noscript, svg, img[src^='data:'],
        [role="alert"],
        [role="banner"],
        [role="dialog"],
        [role="alertdialog"],
        [role="region"][aria-label*="skip" i],
        [aria-modal="true"]
    htmlTransformer:
      type: string
      title: HTML transformer
      description: >-
        Specify how to transform the HTML to extract meaningful content without any extra fluff,
        like navigation or modals. The HTML transformation happens after removing and clicking the
        DOM elements.

        - **None** (default) - Only removes the HTML elements specified via 'Remove HTML elements'
        option.

        - **Readable text** - Extracts the main contents of the webpage, without navigation and
        other fluff. If readability is not confident or fails, it keeps the original cleaned HTML
        instead of returning an empty or broken result.
      default: none
    desiredConcurrency:
      type: integer
      title: Desired browsing concurrency
      description: >-
        The desired number of web browsers running in parallel. The system automatically scales the
        number based on the CPU and memory usage. If the initial value is `0`, the Actor picks the
        number automatically based on the available memory.
      minimum: 0
      maximum: 50
      default: 5
    maxRequestRetries:
      type: integer
      title: Target page max retries
      description: >-
        The maximum number of times the Actor will retry loading the target web page on error. If
        the last attempt fails, the page will be skipped in the results.
      minimum: 0
      maximum: 3
      default: 1
    dynamicContentWaitSecs:
      type: integer
      title: Target page dynamic content timeout
      description: >-
        The maximum time in seconds to wait for dynamic page content to load. The Actor considers
        the web page as fully loaded once this time elapses or when the network becomes idle.
      default: 10
    removeCookieWarnings:
      type: boolean
      title: Remove cookie warnings
      description: >-
        If enabled, the Actor attempts to close or remove cookie consent dialogs to improve the
        quality of extracted text. Note that this setting increases the latency.
      default: true
    debugMode:
      type: boolean
      title: Enable debug mode
      description: >-
        If enabled, the Actor will store debugging information into the resulting dataset under the
        `debug` field.
      default: false
