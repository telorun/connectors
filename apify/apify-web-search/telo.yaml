        INVALID_PARAMETER.
    dateFrom:
      type: string
      title: Date from
      description: The earliest publication date to include. Best-effort. See the README.
      pattern: ^\d{4}-\d{2}-\d{2}$
    dateTo:
      type: string
      title: Date to
      description: The latest publication date to include. Best-effort. See the README.
      pattern: ^\d{4}-\d{2}-\d{2}$
    allowedDomains:
      type: array
      title: Allowed domains
      description: >-
        Return only results from these domains. You can list up to 10 domains. A domain matches
        itself and its subdomains, so "wikipedia.org" covers "en.wikipedia.org". A top-level domain
