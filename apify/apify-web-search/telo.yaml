        Maximum number of organic results to return. Leave it empty to get every result on the page.
        You get fewer when the page has fewer, or when domain filters remove some.
      minimum: 1
    languageCode:
      type: string
      title: Language code
      description: >-
        ISO 639-1 code with an optional region suffix, like "en", "de", or "pt-BR". See
        https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes. Google uses it to localize the
        interface and bias ranking, without translating or strictly filtering results. DuckDuckGo
        picks the matching regional variant, or the country's default.
      default: en
    countryCode:
      type: string
      title: Country code
      description: >-
        ISO 3166-1 alpha-2 code, like "US", "DE", or "CZ". The search runs as if you were in that
        country, changing result order and which local businesses appear. Google queries that
        country's domain (google.de for "DE"). DuckDuckGo picks the matching region, preferring the
        languageCode variant ("CA" with "fr") over the default. Results aren't limited to sites
        hosted or registered there. Web Search returns INVALID_COUNTRY if the provider has no market
        there.
      default: US
