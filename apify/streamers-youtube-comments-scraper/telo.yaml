kind: Telo.Library
metadata:
  name: StreamersYoutubeCommentsScraper
  version: 0.0.255
  description: >-
    YouTube Comments Scraper: the Apify actor streamers/youtube-comments-scraper (build 0.0.255) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    This alternative YouTube Data API has no limits or quotas. Extract YouTube comments data from
    one or multiple YouTube videos: full comment text, posting date, author username, video title,
    videoId. Download YouTube comments in JSON, CSV, and Excel.
  repository: https://github.com/telorun/connectors
  license: MIT
