schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
  properties:
    startUrls:
      type: array
      title: Direct video URLs
      description: >-
        Enter a link to a specific Youtube video YouTube video
        (https://www.youtube.com/watch?v=xObhZ0Ga7EQ). You can also import a CSV file or Google
        Sheet with a list of URLs.
      default: []
    maxComments:
      type: integer
      title: Maximum comments
      description: Limit the number of comments you want to scrape per video.
      minimum: 1
      default: 1
    sortCommentsBy:
      type: string
      title: Sorting order
      description: Select Youtube sorting parameter for comments
      enum:
        - TOP_COMMENTS
        - NEWEST_FIRST
      default: NEWEST_FIRST
    oldestCommentDate:
      type: string
      title: Scrape comments published after [date]
      description: >-
        Only comments published after or on this date will be scraped. Alternatively, specify how
        old the scraped comments should be. Putting 1 day will get you only today's comments, 2 days
        - yesterday's and today's, and so on. Note, that if you select this, sorting parameter will
        be auto-reset to newest first
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
