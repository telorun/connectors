kind: Telo.Library
metadata:
  name: ApifyWebScraper
  version: 3.0.25
  description: >-
    Web Scraper: the Apify actor apify/web-scraper (build 3.0.25) as typed Telo kinds. `Run` runs it
    and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the background and
    polls until it finishes, for runs of any length. Both take an ApifyClient and the actor's own
    input, type-checked against the actor's input schema.

    Crawls arbitrary websites using a web browser and extracts structured data from web pages using
    a provided JavaScript function. The Actor supports both recursive crawling and lists of URLs,
    and automatically manages concurrency for maximum performance.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/web-scraper, from its build 3.0.25 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - pageFunction
    - proxyConfiguration
  properties:
    runMode:
      type: string
      title: Run mode
      description: >-
        This property indicates the scraper's mode of operation. In DEVELOPMENT mode, the scraper
        ignores page timeouts, doesn't use sessionPool, opens pages one by one and enables debugging
        via Chrome DevTools.  Open the live view tab or the container URL to access the debugger.
        Further debugging options can be configured in the Advanced configuration section.
        PRODUCTION mode disables debugging and enables timeouts and concurrency.

        For details, see Run mode (https://apify.com/apify/web-scraper#run-mode) in README.
      enum:
        - PRODUCTION
        - DEVELOPMENT
      default: PRODUCTION
    startUrls:
      type: array
      title: Start URLs
      description: >-
        A static list of URLs to scrape.

        For details, see Start URLs (https://apify.com/apify/web-scraper#start-urls) in README.
    keepUrlFragments:
      type: boolean
      title: "URL #fragments identify unique pages"
      description: >-
        Indicates that URL fragments (e.g. http://example.com#fragment) should be included when
        checking whether a URL has already been visited or not. Typically, URL fragments are used
        for page navigation only and therefore they should be ignored, as they don't identify
        separate pages. However, some single-page websites use URL fragments to display different
        pages; in such a case, this option should be enabled.
      default: false
    respectRobotsTxtFile:
      type: boolean
      title: Respect the robots.txt file
      description: >-
        If enabled, the crawler will consult the robots.txt file for the target website before
        crawling each page. At the moment, the crawler does not use any specific user agent
        identifier. The crawl-delay directive is also not supported yet.
      default: false
    linkSelector:
      type: string
      title: Link selector
      description: >-
        A CSS selector saying which links on the page (<a> elements with href attribute) shall be
        followed and added to the request queue. To filter the links added to the queue, use the
        Pseudo-URLs and/or Glob patterns setting.

        If Link selector is empty, the page links are ignored.

        For details, see Link selector (https://apify.com/apify/web-scraper#link-selector) in
        README.
    globs:
      type: array
      title: Glob Patterns
      description: >-
        Glob patterns to match links in the page that you want to enqueue. Combine with Link
        selector to tell the scraper where to find links. Omitting the Glob patterns will cause the
        scraper to enqueue all links matched by the Link selector.
      default: []
    pseudoUrls:
      type: array
      title: Pseudo-URLs
      description: >-
        Specifies what kind of URLs found by Link selector should be added to the request queue. A
        pseudo-URL is a URL with regular expressions enclosed in [] brackets, e.g.
        http://www.example.com/[.*].

        If Pseudo-URLs are omitted, the Actor enqueues all links matched by the Link selector.

        For details, see Pseudo-URLs (https://apify.com/apify/web-scraper#pseudo-urls) in README.
      default: []
    excludes:
      type: array
      title: Exclude Glob Patterns
      description: Glob patterns to match links in the page that you want to exclude from being enqueued.
      default: []
    pageFunction:
      type: string
      title: Page function
      description: >-
        JavaScript (ES6) function that is executed in the context of every page loaded in the Chrome
        browser. Use it to scrape data from the page, perform actions or add new URLs to the request
        queue.

        For details, see Page function (https://apify.com/apify/web-scraper#page-function) in
        README.
    injectJQuery:
      type: boolean
      title: Inject jQuery
      description: >-
        If enabled, the scraper will inject the jQuery (http://jquery.com) library into every web
        page loaded, before Page function is invoked. Note that the jQuery object ($) will not be
        registered into global namespace in order to avoid conflicts with libraries used by the web
        page. It can only be accessed through context.jQuery in Page function.
      default: true
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: >-
        Specifies proxy servers that will be used by the scraper in order to hide its origin.

        For details, see Proxy configuration
        (https://apify.com/apify/web-scraper#proxy-configuration) in README.
      default:
        useApifyProxy: true
    proxyRotation:
      type: string
      title: Proxy rotation
      description: >-
        This property indicates the strategy of proxy rotation and can only be used in conjunction
        with Apify Proxy. The recommended setting automatically picks the best proxies from your
        available pool and rotates them evenly, discarding proxies that become blocked or
        unresponsive. If this strategy does not work for you for any reason, you may configure the
        scraper to either use a new proxy for each request, or to use one proxy as long as possible,
        until the proxy fails. IMPORTANT: This setting will only use your available Apify Proxy
        pool, so if you don't have enough proxies for a given task, no rotation setting will produce
        satisfactory results.
      enum:
        - RECOMMENDED
        - PER_REQUEST
        - UNTIL_FAILURE
      default: RECOMMENDED
    sessionPoolName:
      type: string
      title: Session pool name
      description: >-
        Use only english alphanumeric characters dashes and underscores. A session is a
        representation of a user. It has it's own IP and cookies which are then used together to
        emulate a real user. Usage of the sessions is controlled by the Proxy rotation option. By
        providing a session pool name, you enable sharing of those sessions across multiple Actor
        runs. This is very useful when you need specific cookies for accessing the websites or when
        a lot of your proxies are already blocked. Instead of trying randomly, a list of working
        sessions will be saved and a new Actor run can reuse those sessions. Note that the IP lock
        on sessions expires after 24 hours, unless the session is used again in that window.
      minLength: 3
      maxLength: 200
      pattern: "[0-9A-z-]"
    initialCookies:
      type: array
      title: Initial cookies
      description: >-
        A JSON array with cookies that will be set to every Chrome browser tab opened before loading
        the page, in the format accepted by Puppeteer's Page.setCookie()
        (https://pptr.dev/api/puppeteer.cookie) function. This option is useful for transferring a
        logged-in session from an external web browser.
      x-telo-sensitive: true
    useChrome:
      type: boolean
      title: Use Chrome
      description: >-
        If enabled, the scraper will use a real Chrome browser instead of Chromium bundled with
        Puppeteer. This option may help bypass certain anti-scraping protections, but might make the
        scraper unstable. Use at your own risk 🙂
      default: false
    headless:
      type: boolean
      title: Run browsers in headless mode
      description: >-
        By default, browsers run in headless mode. You can toggle this off to run them in headful
        mode, which can help with certain rare anti-scraping protections but is slower and more
        costly.
      default: true
    ignoreSslErrors:
      type: boolean
      title: Ignore SSL errors
      description: If enabled, the scraper will ignore SSL/TLS certificate errors. Use at your own risk.
      default: false
    ignoreCorsAndCsp:
      type: boolean
      title: Ignore CORS and CSP
      description: >-
        If enabled, the scraper will ignore Content Security Policy (CSP) and Cross-Origin Resource
        Sharing (CORS) settings of visited pages and requested domains. This enables you to freely
        use XHR/Fetch to make HTTP requests from Page function.
      default: false
    downloadMedia:
      type: boolean
      title: Download media files
      description: >-
        If enabled, the scraper will download media such as images, fonts, videos and sound files,
        as usual. Disabling this option might speed up the scrape, but certain websites could stop
        working correctly.
      default: true
    downloadCss:
      type: boolean
      title: Download CSS files
      description: >-
        If enabled, the scraper will download CSS files with stylesheets, as usual. Disabling this
        option may speed up the scrape, but certain websites could stop working correctly, and the
        live view will not look as cool.
      default: true
    maxRequestRetries:
      type: integer
      title: Max page retries
      description: >-
        The maximum number of times the scraper will retry to load each web page on error, in case
        of a page load error or an exception thrown by Page function.

        If set to 0, the page will be considered failed right after the first error.
      minimum: 0
      default: 3
    maxPagesPerCrawl:
      type: integer
      title: Max pages per run
      description: >-
        The maximum number of pages that the scraper will load. The scraper will stop when this
        limit is reached. It's always a good idea to set this limit in order to prevent excess
        platform usage for misconfigured scrapers. Note that the actual number of pages loaded might
        be slightly higher than this value.

        If set to 0, there is no limit.
      minimum: 0
      default: 0
    maxResultsPerCrawl:
      type: integer
      title: Max result records
      description: >-
        The maximum number of records that will be saved to the resulting dataset. The scraper will
        stop when this limit is reached.

        If set to 0, there is no limit.
      minimum: 0
      default: 0
    maxCrawlingDepth:
      type: integer
      title: Max crawling depth
      description: >-
        Specifies how many links away from Start URLs the scraper will descend. This value is a
        safeguard against infinite crawling depths for misconfigured scrapers. Note that pages added
        using context.enqueuePage() in Page function are not subject to the maximum depth
        constraint.

        If set to 0, there is no limit. To crawl only the pages specified by the Start URLs, set
        linkSelector (#linkSelector) empty instead.
      minimum: 0
      default: 0
    maxConcurrency:
      type: integer
      title: Max concurrency
      description: >-
        Specified the maximum number of pages that can be processed by the scraper in parallel. The
        scraper automatically increases and decreases concurrency based on available system
        resources. This option enables you to set an upper limit, for example to reduce the load on
        a target web server.
      minimum: 1
      default: 50
    pageLoadTimeoutSecs:
      type: integer
      title: Page load timeout
      description: >-
        The maximum amount of time the scraper will wait for a web page to load, in seconds. If the
        web page does not load in this timeframe, it is considered to have failed and will be
        retried (subject to Max page retries), similarly as with other page load errors.
      minimum: 1
      default: 60
    pageFunctionTimeoutSecs:
      type: integer
      title: Page function timeout
      description: >-
        The maximum amount of time the scraper will wait for Page function to execute, in seconds.
        It's a good idea to set this limit, to ensure that unexpected behavior in page function will
        not get the scraper stuck.
      minimum: 1
      default: 60
    waitUntil:
      type: array
      title: Navigation waits until
      description: >-
        Contains a JSON array with names of page events to wait, before considering a web page fully
        loaded. The scraper will wait until all of the events are triggered in the web page before
        executing Page function. Available events are domcontentloaded, load, networkidle2 and
        networkidle0.

        For details, see waitUntil option
        (https://pptr.dev/#?product=Puppeteer&show=api-pagegotourl-options) in Puppeteer's
        Page.goto() function documentation.
      default:
        - networkidle2
    preNavigationHooks:
      type: string
      title: Pre-navigation hooks
      description: >-
        Async functions that are sequentially evaluated before the navigation. Good for setting
        additional cookies or browser properties before navigation. The function accepts two
        parameters, `crawlingContext` and `gotoOptions`, which are passed to the `page.goto()`
        function the crawler calls to navigate.
    postNavigationHooks:
      type: string
      title: Post-navigation hooks
      description: >-
        Async functions that are sequentially evaluated after the navigation. Good for checking if
        the navigation was successful. The function accepts `crawlingContext` as the only parameter.
    breakpointLocation:
      type: string
      title: Insert breakpoint
      description: >-
        This property has no effect if Run mode is set to PRODUCTION. When set to DEVELOPMENT it
        inserts a breakpoint at the selected location in every page the scraper visits. Execution of
        code stops at the breakpoint until manually resumed in the DevTools window accessible via
        Live View tab or Container URL. Additional breakpoints can be added by adding debugger;
        statements within your Page function.

        See Run mode (https://apify.com/apify/web-scraper#run-mode) in README for details.
      enum:
        - NONE
        - BEFORE_GOTO
        - BEFORE_PAGE_FUNCTION
        - AFTER_PAGE_FUNCTION
      default: NONE
    closeCookieModals:
      type: boolean
      title: Dismiss cookie modals
      description: >-
        Using the [I don't care about
        cookies](https://addons.mozilla.org/en-US/firefox/addon/i-dont-care-about-cookies/) browser
        extension. When on, the crawler will automatically try to dismiss cookie consent modals.
        This can be useful when crawling European websites that show cookie consent modals.
      default: false
    maxScrollHeightPixels:
      type: integer
      title: Maximum scrolling distance in pixels
      description: >-
        The crawler will scroll down the page until all content is loaded or the maximum scrolling
        distance is reached. Setting this to `0` disables scrolling altogether.
      default: 5000
    debugLog:
      type: boolean
      title: Debug log
      description: >-
        If enabled, the Actor log will include debug messages. Beware that this can be quite
        verbose. Use context.log.debug('message') to log your own debug messages from Page function.
      default: false
    browserLog:
      type: boolean
      title: Browser log
      description: >-
        If enabled, the Actor log will include console messages produced by JavaScript executed by
        the web pages (e.g. using console.log()). Beware that this may result in the log being
        flooded by error messages, warnings and other messages of little value, especially with high
        concurrency.
      default: false
    customData:
      type: object
      title: Custom data
      description: >-
        A custom JSON object that is passed to Page function as context.customData. This setting is
        useful when invoking the scraper via API, in order to pass some arbitrary parameters to your
        code.
      default: {}
    datasetName:
      type: string
      title: Dataset name
      description: >-
        Name or ID of the dataset that will be used for storing results. If left empty, the default
        dataset of the run will be used.
    keyValueStoreName:
      type: string
      title: Key-value store name
      description: >-
        Name or ID of the key-value store that will be used for storing records. If left empty, the
        default key-value store of the run will be used.
    requestQueueName:
      type: string
      title: Request queue name
      description: >-
        Name of the request queue that will be used for storing requests. If left empty, the default
        request queue of the run will be used.
---
kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item apify/web-scraper produces.
schema:
  type: object
  additionalProperties: true
---
kind: Telo.Definition
metadata:
  name: Run
  description: Run Web Scraper and wait for its dataset items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActorSync
    metadata:
      name: run
    client: !cel "self.client"
invoke: !ref run
inputs:
  actorId: apify/web-scraper
  build: 3.0.25
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
result:
  items: !cel "result.body"
---
kind: Telo.Definition
metadata:
  name: Start
  description: >-
    Run Web Scraper in the background, poll until the run finishes, and return the run and its
    dataset items. Raises APIFY_RUN_NOT_SUCCEEDED when the run ends FAILED, TIMED-OUT or ABORTED.
capability: Telo.Invocable
throws:
  codes:
    APIFY_RUN_NOT_SUCCEEDED:
      description: >-
        The run finished without succeeding. `data` is the Apify run object (id, status,
        statusMessage, …).
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - run
      - items
    properties:
      run:
        type: object
        additionalProperties: true
        description: "The finished Apify run: id, status, defaultDatasetId, stats, usageTotalUsd, …"
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActor
    metadata:
      name: start
    client: !cel "self.client"
  - kind: Apify.GetRun
    metadata:
      name: getRun
    client: !cel "self.client"
  - kind: Apify.GetDatasetItems
    metadata:
      name: getItems
    client: !cel "self.client"
  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
        inputs:
          runId: !cel "inputs.runId"
          waitForFinish: 60
    outputs:
      run: !cel "steps.poll.result.body.data"
  - kind: Flow.Sequence
    metadata:
      name: seq
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - input
        properties:
          input:
            type: object
          timeout:
            type:
              - integer
              - "null"
          memory:
            type:
              - integer
              - "null"
          maxItems:
            type:
              - integer
              - "null"
          maxTotalChargeUsd:
            type:
              - number
              - "null"
    steps:
      - name: start
        invoke: !ref start
        inputs:
          actorId: apify/web-scraper
          build: 3.0.25
          input: !cel "inputs.input"
          timeout: !cel "inputs.?timeout.orValue(null)"
          memory: !cel "inputs.?memory.orValue(null)"
          maxItems: !cel "inputs.?maxItems.orValue(null)"
          maxTotalChargeUsd: !cel "inputs.?maxTotalChargeUsd.orValue(null)"
      - name: wait
        invoke: !ref wait
        inputs:
          runId: !cel "steps.start.result.body.data.id"
      - name: check
        if: !cel "steps.wait.result.run.status != 'SUCCEEDED'"
        then:
          - name: fail
            throw:
              code: APIFY_RUN_NOT_SUCCEEDED
              message: !cel >-
                'Apify run ' + steps.wait.result.run.id + ' finished with status ' +
                steps.wait.result.run.status
              data: !cel "steps.wait.result.run"
      - name: items
        invoke: !ref getItems
        inputs:
          datasetId: !cel "steps.wait.result.run.defaultDatasetId"
    outputs:
      run: !cel "steps.wait.result.run"
      items: !cel "steps.items.result.body"
invoke: !ref seq
inputs:
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
