schema:
  type: object
  additionalProperties: false
  properties:
    urls:
      type: array
      title: Linkedin jobs search URLs
      description: >-
        Go to [public linkedin jobs search page](https://www.linkedin.com/jobs/search/) on incognito
        window (to access public version), search with required filters and once you are done, copy
        the full URL from address bar and pass it here. You can pass multiple search URLs.

        When URLs are provided, the AI search filters below are ignored. Leave this empty to use the
        filters instead.
      default: []
    keywords:
      type: string
      title: Keywords
      description: >-
        Job title, skills, or free-text search (e.g. "software engineer remote"). Used only when the
        URLs list above is empty.
    location:
      type: string
      title: Location
      description: >-
        City, region, or country as you would type it on LinkedIn (e.g. "United States", "London,
        United Kingdom", "Remote").
    geoId:
      type: string
      title: Geo ID
      description: >-
        Optional LinkedIn geoId for precise location targeting (found in a LinkedIn search URL as
        `geoId=`). Overrides free-text location when LinkedIn resolves it.
    distance:
      type: integer
      title: Distance (miles)
      description: Search radius in miles around the location. Leave empty for LinkedIn's default.
      minimum: 0
    datePosted:
      type: string
      title: Date posted
      description: Only return jobs posted within this window.
      enum:
        - anyTime
        - past24Hours
        - pastWeek
        - pastMonth
      default: anyTime
    companyIds:
      type: array
      title: Company IDs
      description: >-
        LinkedIn numeric company IDs (from a company URL or `f_C=` in a search URL), e.g. "1441" for
        Google.
      default: []
    under10Applicants:
      type: boolean
      title: Under 10 applicants
      description: Only jobs with fewer than 10 applicants.
      default: false
    autoConvertToAiSearch:
      type: boolean
      title: Auto convert old search URLs to AI search URLs (recommended)
      description: >-
        LinkedIn is now forcing AI job search which removed many classic filters (experience, job
        type, workplace, salary, sort, etc.)

        When this option is enabled, the filters in old search URLs are converted to natural
        language and appended to search keywords. Date posted, Company, Easy apply, and Under 10
        applicants stay as URL filters on AI search.
      default: true
    scrapeCompany:
      type: boolean
      title: Scrape company details
      description: >-
        This will require additional scraping requests for each job record and take longer to scrape
      default: true
    limitPerSource:
      type: integer
      title: Max jobs per search
      description: >-
        Maximum number of jobs to scrape from each input URL (or from the AI search filters when no
        URLs are provided). Leave empty to scrape as many as LinkedIn returns for each search (up to
        ~1000).
