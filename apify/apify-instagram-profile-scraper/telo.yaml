kind: Telo.Library
metadata:
  name: ApifyInstagramProfileScraper
  version: 0.0.655
  description: >-
    Instagram Profile Scraper: the Apify actor apify/instagram-profile-scraper (build 0.0.655) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape all Instagram profile info. Just add Instagram usernames, IDs or URLs and extract name,
    join date, number of followers,  location, bio, website, related profiles, video&post count,
    latest posts. Export scraped data, schedule scraper via API, and integrate with other tools or
    AI workflows.
