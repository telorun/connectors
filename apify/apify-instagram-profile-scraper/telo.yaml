schema:
  type: object
  additionalProperties: false
  required:
    - usernames
  properties:
    usernames:
      type: array
      title: Instagram username(s)
      description: >-
        Provide one or several Instagram user names you want to scrape the posts from. The actor
        will also handle user name IDs.
    includeAboutSection:
      type: boolean
      title: $ Extract about account information
      description: >-
        This feature is for paying users only. If enabled, the scraper will extract information
        about the account, including date joined, country of origin, and the profile's channel
