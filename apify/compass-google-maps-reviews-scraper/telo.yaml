kind: Telo.Library
metadata:
  name: CompassGoogleMapsReviewsScraper
  version: 0.0.540
  description: >-
    Google Maps Reviews Scraper: the Apify actor compass/Google-Maps-Reviews-Scraper (build 0.0.540)
    as typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract all reviews of Google Maps places using place URLs. Get review text, published date,
    response from owner, review URL, and reviewer's details. Download scraped data, run the scraper
    via API, schedule and monitor runs or integrate with other tools.
