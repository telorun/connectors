kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of compass/Google-Maps-Reviews-Scraper, from its build 0.0.540 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    startUrls:
      type: array
      title: Google Maps place URLs
      description: >-
        List of URLs to be crawled. They can be search URLs, place URLs or review detail URLs. Valid
        Google Maps place URLs must contain one of the following subpaths: /maps/search, /maps/place
        or /maps/reviews. This feature also supports uncommon URL formats such as:
        https://google.com/maps?cid=***.
      items:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            title: URL
            description: A single Google Maps URL to scrape.
    placeIds:
      type: array
      title: 🗃 Place IDs
      description: >-
        List of place IDs. Add them one by one or upload a list using the Bulk edit option. A place
        ID has the format ChIJreV9aqYWdkgROM_boL6YbwA - only 27-character IDs starting with ChIJ or
        GhIJ are supported.
      items:
        type: string
        pattern: \S+
    maxReviews:
      type: integer
      title: Number of reviews
      description: >-
        Max number of reviews per place to scrape. If you want to scrape all reviews, remove the
        prefilled value.
      minimum: 1
      default: 10000000
    reviewsSort:
      type: string
      title: Sort reviews by
      description: Define how reviews are sorted.
      enum:
        - newest
        - mostRelevant
        - highestRanking
        - lowestRanking
      default: newest
    reviewsStartDate:
      type: string
      title: Only scrape reviews newer than [date]
      description: >-
        Either absolute date (e.g. `2024-05-03`) or relative date from now into the past (e.g. `8
        days`, `3 months`). JSON input also supports adding time in both absolute (ISO standard,
        e.g. `2024-05-03T20:00:00`) and relative (e.g. `3 hours`) formats. Absolute time is always
        interpreted in the UTC timezone, not your local timezone - please convert accordingly.
        Supported relative date & time units: `minutes`, `hours`, `days`, `weeks`, `months`,
        `years`.
         ⚠️ Heads up: If this parameter is specified, you must choose the 'Newest' sort by value. The reason for this is that with this parameter entered, the Actor stops scraping reviews as soon as it finds the first review that's older than the specified date. If the sorting is not set to 'Newest', it might encounter a review older than the specified date before it reaches the desired review count and not scrape the desired amount of reviews.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    reviewsFilterString:
      type: string
      title: Filter reviews by keywords
      description: >-
        If you enter keywords, only reviews containing those keywords will be scraped. Google limits
