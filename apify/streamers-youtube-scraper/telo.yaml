kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of streamers/youtube-scraper, from its build 0.0.319 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    searchQueries:
      type: array
      title: Search terms
      description: Enter search terms just like you would enter it in YouTube's search bar.
    maxResults:
      type: integer
      title: Maximum videos per search term
      description: >-
        Limit the number of videos you want to crawl. If you scrape a channel, acts as a limit for
        regular videos.
      minimum: 0
      maximum: 999999
      default: 0
    maxResultsShorts:
      type: integer
      title: Maximum shorts per search term
      description: Limit the number of Shorts videos you want to crawl.
      minimum: 0
      maximum: 999999
      default: 0
    maxResultStreams:
      type: integer
      title: Maximum streams per search term
      description: Limit the number of Stream videos you want to crawl.
      minimum: 0
      maximum: 999999
      default: 0
    startUrls:
      type: array
      title: Direct URLs
      description: >-
        Enter a link to a YouTube video (https://www.youtube.com/watch?v=xObhZ0Ga7EQ), channel
        (https://www.youtube.com/c/Apify), playlist
        (https://www.youtube.com/playlist?list=PLObrtcm1Kw6PmbXg8bmfJN-o2Hgx8sidf) or search results
        page (https://www.youtube.com/results?search_query=crawlee). You can also import a CSV file
        or Google Sheet with a list of URLs.

        Note: Input from Search term will be ignored when using this option. If you only want to
        scrape shorts/streams, set Maximum search results to 0, otherwise they represented number of
        regular videos requested
      default: []
    transcriptionAndSubtitle:
      type:
        - string
        - "null"
      title: Transcription & subtitles
      description: >-
        Choose whether to download subtitles, transcribe the video using speech-to-text AI, or both.
        Leave empty to skip subtitles and transcription. Subtitles are added to the dataset items,
        while transcripts are stored in the key-value store
      enum:
        - NONE
        - ALWAYS_SUBTITLES
        - TRANSCRIPTION_AS_FALLBACK
        - ALWAYS_TRANSCRIBE
        - null
      default: NONE
    subtitlesLanguage:
      type: string
      title: Subtitle language
      description: >-
        Language to download subtitles in.

        Note: a subtitle-downloading option must be selected in Transcription & subtitles for this
        to work.
      enum:
        - any
        - en
        - de
        - es
        - fr
        - it
        - ja
        - ko
        - nl
        - pt
        - ru
      default: en
    subtitlesFormat:
      type: string
      title: Subtitle format
      description: Select in what format you want to download subtitles
      enum:
        - srt
        - vtt
        - xml
        - plaintext
      default: srt
    sortingOrder:
      type:
        - string
        - "null"
      title: Sorting order
      description: Select Youtube sorting parameter for search
      enum:
        - relevance
        - rating
        - date
        - views
        - null
    dateFilter:
      type:
        - string
        - "null"
      title: Date filter
      description: Select Youtube upload date filter for search
      enum:
        - hour
        - today
        - week
        - month
        - year
        - null
    videoType:
      type:
        - string
        - "null"
      title: Video type filter
      description: Select Youtube video type filter for search
      enum:
        - video
        - movie
        - null
    lengthFilter:
      type:
        - string
        - "null"
      title: Length filter
      description: Select Youtube video length filter for search
      enum:
        - under4
        - between420
        - plus20
        - null
    isHD:
      type:
        - boolean
        - "null"
      title: HD
      description: Will apply the HD filter for search
    hasSubtitles:
      type:
        - boolean
        - "null"
      title: Subtitles/CC
      description: Will apply the Subtitles/CC filter for search
    hasCC:
      type:
        - boolean
        - "null"
      title: Creative Commons
      description: Will apply the Creative Commons filter for search
    is3D:
      type:
        - boolean
        - "null"
      title: 3D
      description: Will apply the 3D filter for search
    isLive:
      type:
        - boolean
        - "null"
      title: Live
      description: Will apply the Live filter for search
    isBought:
      type:
        - boolean
        - "null"
      title: Purchased
      description: Will apply the Purchased filter for search
    is4K:
      type:
        - boolean
        - "null"
      title: 4K
      description: Will apply the 4K filter for search
    is360:
      type:
        - boolean
        - "null"
      title: 360 degrees
      description: Will apply the 360 degrees filter for search
    hasLocation:
      type:
        - boolean
        - "null"
      title: Location
      description: Will apply the Location filter for search
    isHDR:
      type:
        - boolean
        - "null"
      title: HDR
      description: Will apply the HDR filter for search
    isVR180:
      type:
        - boolean
        - "null"
      title: VR180
      description: Will apply the VR180 filter for search
    oldestPostDate:
      type: string
      title: Scrape videos published after [date]
      description: >-
        Only posts uploaded after or on this date will be scraped. Alternatively, specify how old
        the scraped videos should be in days. Putting 1 day will get you only today's posts, 2 days
        - yesterday's and today's, and so on. Note, that if you select this, sorting parameter will
        be auto-reset to NEWEST
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    sortVideosBy:
      type: string
      title: Sort by
      description: >-
        Maps to the sorting buttons on the top of the channel's 'Videos', 'Shorts' and 'Live' pages.
      enum:
        - NEWEST
        - POPULAR
        - OLDEST
    aiVideoDescription:
      type: boolean
      title: "Add-on: AI video description ($)"
      description: >-
        If enabled, uses AI to generate a time-segmented description of the video, covering both
        visual and audio content for each segment.
      default: false
    aiVideoSummary:
      type: boolean
      title: "Add-on: AI video summary ($)"
      description: >-
        If enabled, uses AI to generate a concise conceptual summary of the video covering both
        visual and audio content.
      default: false
    saveSubsToKVS:
      type: boolean
      title: Save subtitles to key-value store
      description: >-
        If set to true, the scraper will save the downloaded subtitles to the key-value store.
        Transcripts are always saved to the key-value store
    preferAutoGeneratedSubtitles:
      type: boolean
      title: Prefer automatically generated subtitles.
      description: >-
        If set to true, automatically generated subtitles are preferred to user subtitles. Note: a
        subtitle language must be selected and a subtitle-downloading option must be selected in
        Transcription & subtitles for this to work.
