kind: Telo.Library
metadata:
  name: StreamersYoutubeScraper
  version: 0.0.319
  description: >-
    YouTube Scraper: the Apify actor streamers/youtube-scraper (build 0.0.319) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    YouTube crawler and video scraper. Alternative YouTube API with no limits or quotas. Extract and
    download channel name, likes, number of views, and number of subscribers.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
