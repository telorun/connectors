          - object
          - "null"
        additionalProperties: true
        properties:
          name:
            type:
              - string
              - "null"
          url:
            type:
              - string
              - "null"
    company_employees_sample:
      type:
        - array
        - "null"
      description: A few employees LinkedIn shows on the page. Personal data.
      items:
        type:
          - object
          - "null"
