kind: Telo.Library
metadata:
  name: WorldunboxerRapidLinkedinScraper
  version: 1.2.132
  description: >-
    ⚡️Rapid Linkedin Jobs Scraper: the Apify actor worldunboxer/rapid-linkedin-scraper (build
    1.2.132) as typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5
    minutes); `Start` runs it in the background and polls until it finishes, for runs of any length.
    Both take an ApifyClient and the actor's own input, type-checked against the actor's input
    schema.

    🔥$0.10/1K jobs. Advanced filters, 23 data fields, JSON/CSV/Excel export, cron schedules,
    webhooks and MCP for AI agents. Scrape Linkedin job postings without login cookies. Cost
    Effective Linkedin Jobs API for recruiting, job boards, lead generation and AI agents.
