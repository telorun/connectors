kind: Telo.Library
metadata:
  name: WorldunboxerRapidLinkedinScraper
  version: 1.4.0
  description: >-
    Linkedin Jobs Scraper: the Apify actor worldunboxer/rapid-linkedin-scraper as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Scrape LinkedIn jobs with powerful search and advanced filters using keywords, search URLs and
    locations.🔥$0.10/1K jobs. Extract job listing, full job details, and company details directly
    from LinkedIn job search results.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of worldunboxer/rapid-linkedin-scraper, from its default build's input schema.
schema:
  type: object
  additionalProperties: true
  properties:
    jobs_titles:
      type: array
      title: Job Titles / Keywords
      description: >-
        Job titles to search for (e.g., 'Software Engineer', 'Data Scientist'). The scraper runs a
        search for each title and merges the results.
    location:
      type: string
      title: Location
      description: >-
        Enter a broad location (e.g., 'Worldwide', 'Europe', 'Canada') or a full search string
        (e.g., 'San Francisco, CA').
    include_job_details:
      type: boolean
      title: Include Full Job Details (+ $0.25/1k jobs)
      description: >-
        Open each job's page to add the full description, seniority, employment type, industries,
        applicants, salary, Easy Apply and, when LinkedIn shows one, the job poster (name, headline,
        photo and profile link). Turn it off for a cheaper and faster run with listing data only:
        job ID & link, title, company name/URL/logo, location, posted date and hiring badge.

        See the [Output
        Fields](https://apify.com/worldunboxer/rapid-linkedin-scraper#-output-fields) section of the
        README for the full list.
      default: true
    include_full_company_details:
      type: boolean
      title: Include Full Company Details (+ $0.75/1k jobs)
      description: >-
        Open the page of the company, showcase page or school that posted each job and add its
        details: followers, industry, size, website, description, headquarters, founded year,
        specialties, locations, similar and affiliated pages, recent posts, products and a sample of
        employees. Works with or without Include Full Job Details. A job whose page cannot be read
        is still returned, without these fields, and is not charged for them.
      default: false
    posted_within:
      type: string
      title: Job Posting Time
      description: >-
        Only return jobs posted within this period. To use a custom time window, leave this field
        unset.
      enum:
        - Any Time
        - Past 24 hours
        - Past Week
        - Past Month
    easy_apply:
      type: boolean
      title: Easy Apply Only
      description: Filter for jobs with simplified application
      default: false
    early_applicant_only:
      type: boolean
      title: Early Applicant Only
      description: Only jobs LinkedIn marks "Be an early applicant"
      default: false
    include_contact_details:
      type: boolean
      title: Include Contact Details
      description: >-
        Requires Include Full Job Details. Also return contact details the poster wrote in the job
        description. These are personal data: enable only if you have a lawful basis under the laws
        that apply to you. See Legal and compliance in the README.
      default: false
    jobs_entries:
      type: integer
      title: Number of Jobs Entries you want
      description: Number of jobs you want to scrape.
      minimum: 10
      maximum: 100000
      default: 1000
    company_names:
      type: array
      title: Company Names
      description: Only search for these companies
    cities:
      type: array
      title: Cities
      description: >-
        Optional. List specific cities to search (e.g., 'London', 'Manchester'). The scraper
        searches each city on its own, without the 'Location' field. If several places share a name,
        add the state or country (e.g., 'Birmingham, Alabama').
    distance:
      type: integer
      title: Distance (miles)
      description: >-
        Optional. Search radius in miles around the Location, Cities or Location IDs (e.g., 5, 25,
        100). Leave empty for LinkedIn's default (25 miles).
      minimum: 1
    search_urls:
      type: array
      title: Search URLs
      description: >-
        Optional. Paste LinkedIn job search URLs (e.g.
        'https://www.linkedin.com/jobs/search-results/?keywords=Software%20Engineer&geoId=101389470')
        instead of filling in the search fields. Include Full Job Details, Number of Jobs, Jobs per
        URL and Exclude Job IDs still apply.
    jobs_per_url:
      type: integer
      title: Jobs per URL
      description: >-
        Optional. Used with Search URLs: the most unique jobs to take from each address. Number of
        Jobs Entries still caps the whole run. Leave empty for no per-address limit.
      minimum: 10
      maximum: 100000
    boolean_search_strings:
      type: array
      title: Boolean Search Strings
      description: >-
        Optional. Search with AND, OR, NOT, quotes and parentheses, e.g. '(Data Engineer OR
        Analytics Engineer) AND Python NOT Intern'. Write operators in capitals; '-word' also means
        NOT. Works alongside Job Titles / Keywords and uses the same location and filters. LinkedIn
        applies NOT and AND loosely, so a few jobs may not match.
    geo_ids:
      type: array
      title: Location IDs
      description: >-
        Optional. LinkedIn location IDs (numbers, e.g. '101389470') to search directly, without
        looking up a name. An ID can be a city, region or country. Combined with 'Cities': the
        places from both lists are searched, each on its own. A location's ID is the number after
        'geoId=' in the address of a LinkedIn jobs search for that location.
    company_ids:
      type: array
      title: Company IDs
      description: >-
        Optional. LinkedIn company IDs (numbers, e.g. '1337') to search directly, without looking up
        a name. Combined with 'Company Names': the companies from both lists are searched. A
        company's ID is the number after 'f_C=' in the address of a LinkedIn jobs search filtered by
        that company.
    exclude_job_ids:
      type: array
      title: Exclude Job IDs
      description: >-
        Optional. LinkedIn job IDs (numbers, e.g. '4419969671') to leave out. These jobs are skipped
        entirely: not returned, and not charged. Pass the job IDs of a previous run to receive only
        new jobs.
    job_post_time:
      type: string
      title: Custom Job Post Time
      description: >-
        Optional custom posting window, used only when 'Job Posting Time' is not set.

        Enter the time in seconds as a positive whole number (e.g., 86400 for 1 day, 172800 for 2
        days).
---
kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item worldunboxer/rapid-linkedin-scraper produces.
schema:
  type: object
  additionalProperties: true
  properties:
    job_id:
      type:
        - string
        - "null"
      description: Numeric LinkedIn job ID.
    job_url:
      type:
        - string
        - "null"
      description: Address of the job on LinkedIn.
    search_keyword:
      type:
        - string
        - "null"
      description: Keywords of the search that first found the job; left out for searches without keywords.
    job_title:
      type:
        - string
        - "null"
      description: Job title.
    company_name:
      type:
        - string
        - "null"
      description: Name of the hiring company, showcase page or school.
    company_url:
      type:
        - string
        - "null"
      description: LinkedIn page of the hiring company, showcase page or school, without tracking parameters.
    company_logo_url:
      type:
        - string
        - "null"
      description: Logo image address.
    location:
      type:
        - string
        - "null"
      description: Job location as written in the listing.
    time_posted:
      type:
        - string
        - "null"
      description: Relative posting time such as '3 days ago'.
    posted_date:
      type:
        - string
        - "null"
      description: Posting date, YYYY-MM-DD.
    hiring_badge:
      type:
        - string
        - "null"
      description: Badge LinkedIn shows on the listing, such as 'Actively Hiring'.
    is_actively_hiring:
      type:
        - boolean
        - "null"
      description: Whether the listing carries the 'Actively Hiring' badge.
    is_early_applicant:
      type:
        - boolean
        - "null"
      description: Whether the listing carries the 'Be an early applicant' badge.
    num_applicants:
      type:
        - string
        - "null"
      description: Applicant count as written on the job page, such as 'Over 200 applicants'.
    salary_range:
      type:
        - string
        - "null"
      description: Salary range as written on the job page.
    job_description:
      type:
        - string
        - "null"
      description: Job description as plain text.
    job_description_raw_html:
      type:
        - string
        - "null"
      description: Job description as HTML.
    contact_email:
      type:
        - string
        - "null"
      description: First email address found in the description; present only with Include Contact Details.
    seniority_level:
      type:
        - string
        - "null"
      description: Seniority level from the job criteria.
    employment_type:
      type:
        - string
        - "null"
      description: Employment type from the job criteria.
    industries:
      type:
        - string
        - "null"
      description: Industries of the job from the job criteria.
    easy_apply:
      type:
        - boolean
        - "null"
      description: >-
        Whether the job can be applied to on LinkedIn (false when the application is on the
        company's site).
    company_id:
      type:
        - string
        - "null"
      description: Numeric LinkedIn ID of the company, showcase page or school.
    job_poster_name:
      type:
        - string
        - "null"
      description: Name of the person who posted the job.
    job_poster_headline:
      type:
        - string
        - "null"
      description: Headline of the person who posted the job. Personal data.
    job_poster_profile_url:
      type:
        - string
        - "null"
      description: LinkedIn profile address of the person who posted the job. Personal data.
    job_poster_photo_url:
      type:
        - string
        - "null"
      description: Profile photo address of the person who posted the job. Personal data.
    company_details_status:
      description: >-
        ok: the company page was read. failed: it could not be read. no_company_page: the job links
        to no company, showcase or school page. Present only with Include Full Company Details.
    company_page_type:
      description: Kind of LinkedIn page the job is posted from.
    company_followers:
      type:
        - number
        - "null"
      description: Followers of the page.
    company_industry:
      type:
        - string
        - "null"
      description: Industry shown on the page (a single value).
    company_tagline:
      type:
        - string
        - "null"
      description: Tagline shown under the name.
    company_description:
      type:
        - string
        - "null"
      description: About text of the page.
    company_website:
      type:
        - string
        - "null"
      description: Website address.
    company_size:
      type:
        - string
        - "null"
      description: Size bracket as shown, such as '51-200 employees'.
    company_size_min:
      type:
        - number
        - "null"
      description: Lower end of the size bracket.
    company_size_max:
      type:
        - number
        - "null"
      description: Upper end of the size bracket; left out for an open-ended bracket such as '10,001+'.
    company_employees_on_linkedin:
      type:
        - number
        - "null"
      description: Members who list the page as their employer. Not the payroll headcount.
    company_organization_type:
      type:
        - string
        - "null"
      description: Type shown on the page, such as 'Privately Held', 'Public Company' or 'Educational'.
    company_founded_year:
      type:
        - number
        - "null"
      description: Year founded.
    company_specialties:
      type:
        - array
        - "null"
      description: Specialties listed on the page.
      items:
        type:
          - string
          - "null"
    company_headquarters:
      type:
        - string
        - "null"
      description: Headquarters as written on the page.
    company_headquarters_street:
      type:
        - string
        - "null"
      description: Street address of the headquarters.
    company_headquarters_city:
      type:
        - string
        - "null"
      description: City of the headquarters.
    company_headquarters_region:
      type:
        - string
        - "null"
      description: State or region of the headquarters.
    company_headquarters_postal_code:
      type:
        - string
        - "null"
      description: Postal code of the headquarters.
    company_headquarters_country_code:
      type:
        - string
        - "null"
      description: Two-letter country code of the headquarters.
    company_cover_image_url:
      type:
        - string
        - "null"
      description: Cover image address.
    company_has_premium_page:
      type:
        - boolean
        - "null"
      description: Whether the page is a paid LinkedIn Premium page.
    company_open_jobs_count:
      type:
        - number
        - "null"
      description: Open jobs LinkedIn counts for this employer.
    company_locations:
      type:
        - array
        - "null"
      description: Addresses listed on the page, with the primary one flagged.
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          address:
            type:
              - string
              - "null"
          is_primary:
            type:
              - boolean
              - "null"
    company_similar_pages:
      type:
        - array
        - "null"
      description: Pages LinkedIn lists as similar.
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          name:
            type:
              - string
              - "null"
          url:
            type:
              - string
              - "null"
          industry:
            type:
              - string
              - "null"
          location:
            type:
              - string
              - "null"
    company_affiliated_pages:
      type:
        - array
        - "null"
      description: Affiliated pages; a showcase page lists its parent company here.
      items:
        type:
          - object
          - "null"
        additionalProperties: true
        properties:
          name:
            type:
              - string
              - "null"
          url:
            type:
              - string
              - "null"
          industry:
            type:
              - string
              - "null"
          location:
            type:
              - string
              - "null"
    company_recent_posts:
      type:
        - array
        - "null"
      description: Recent posts shown on the page; published_at is an ISO 8601 date-time.
      items:
        type:
          - object
          - "null"
