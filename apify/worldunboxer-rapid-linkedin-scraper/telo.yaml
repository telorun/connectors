kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of worldunboxer/rapid-linkedin-scraper, from its build 1.2.132 input schema.
schema:
  type: object
  additionalProperties: true
  properties:
    jobs_titles:
      type: array
      title: Job Titles / Keywords
      description: >-
        Job titles to search for (e.g., 'Software Engineer', 'Data Scientist'). The scraper runs a
        search for each title and merges the results.
    location:
      type: string
      title: Location
      description: >-
        Enter a broad location (e.g., 'Worldwide', 'Europe', 'Canada') or a full search string
        (e.g., 'San Francisco, CA').
    include_job_details:
      type: boolean
      title: Include Full Job Details
      description: >-
        Open each job's page to add the full description, seniority, employment type, industries,
        applicants, salary and Easy Apply. Turn it off for a cheaper and faster run with listing
        data only: job ID & link, title, company name/URL/logo, location, posted date and hiring
        badge.

        See the [Output
        Fields](https://apify.com/worldunboxer/rapid-linkedin-scraper#-output-fields) section of the
        README for the full list.
      default: true
    posted_within:
      type: string
      title: Job Posting Time
      description: >-
        Only return jobs posted within this period. To use a custom time window, leave this field
        unset.
      enum:
        - Any Time
        - Past 24 hours
        - Past Week
        - Past Month
    easy_apply:
      type: boolean
      title: Easy Apply Only
      description: Filter for jobs with simplified application
      default: false
    early_applicant_only:
      type: boolean
      title: Early Applicant Only
      description: Only jobs LinkedIn marks "Be an early applicant"
      default: false
    include_contact_details:
      type: boolean
      title: Include Contact Details
      description: >-
        Requires Include Full Job Details. Also return contact details the poster wrote in the job
        description. These are personal data: enable only if you have a lawful basis under the laws
        that apply to you. See Legal and compliance in the README.
      default: false
    jobs_entries:
      type: integer
      title: Number of Jobs Entries you want
      description: Number of jobs you want to scrape.
      minimum: 10
      maximum: 100000
      default: 1000
    company_names:
      type: array
      title: Company Names
      description: Only search for these companies
    cities:
      type: array
      title: Cities
      description: >-
        Optional. List specific cities to search (e.g., 'London', 'Manchester'). The scraper
        searches each city on its own, without the 'Location' field. If several places share a name,
        add the state or country (e.g., 'Birmingham, Alabama').
    distance:
      type: integer
      title: Distance (miles)
      description: >-
        Optional. Search radius in miles around the Location, Cities or Location IDs (e.g., 5, 25,
        100). Leave empty for LinkedIn's default (25 miles).
      minimum: 1
    search_urls:
      type: array
      title: Search URLs
      description: >-
        Optional. Paste LinkedIn job search URLs (e.g.
        'https://www.linkedin.com/jobs/search-results/?keywords=Software%20Engineer&geoId=101389470')
        instead of filling in the search fields. Include Full Job Details, Number of Jobs, Jobs per
        URL and Exclude Job IDs still apply.
    jobs_per_url:
      type: integer
      title: Jobs per URL
      description: >-
        Optional. Used with Search URLs: the most unique jobs to take from each address. Number of
        Jobs Entries still caps the whole run. Leave empty for no per-address limit.
      minimum: 10
      maximum: 100000
    geo_ids:
      type: array
      title: Location IDs
      description: >-
        Optional. LinkedIn location IDs (numbers, e.g. '101389470') to search directly, without
        looking up a name. An ID can be a city, region or country. Combined with 'Cities': the
        places from both lists are searched, each on its own. A location's ID is the number after
        'geoId=' in the address of a LinkedIn jobs search for that location.
    company_ids:
      type: array
      title: Company IDs
      description: >-
        Optional. LinkedIn company IDs (numbers, e.g. '1337') to search directly, without looking up
        a name. Combined with 'Company Names': the companies from both lists are searched. A
        company's ID is the number after 'f_C=' in the address of a LinkedIn jobs search filtered by
        that company.
    exclude_job_ids:
      type: array
      title: Exclude Job IDs
      description: >-
        Optional. LinkedIn job IDs (numbers, e.g. '4419969671') to leave out. These jobs are skipped
        entirely: not returned, and not charged. Pass the job IDs of a previous run to receive only
        new jobs.
    job_post_time:
      type: string
      title: Custom Job Post Time
      description: >-
        Optional custom posting window, used only when 'Job Posting Time' is not set.

        Enter the time in seconds as a positive whole number (e.g., 86400 for 1 day, 172800 for 2
        days).
