kind: Telo.Definition
metadata:
  name: Run
  description: Run Linkedin Jobs Scraper and wait for its dataset items (runs of up to 5 minutes).
capability: Telo.Invocable
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - items
    properties:
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActorSync
    metadata:
      name: run
    client: !cel "self.client"
invoke: !ref run
inputs:
  actorId: worldunboxer/rapid-linkedin-scraper
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
result:
  items: !cel "result.body"
---
kind: Telo.Definition
metadata:
  name: Start
  description: >-
    Run Linkedin Jobs Scraper in the background, poll until the run finishes, and return the run and
    its dataset items. Raises APIFY_RUN_NOT_SUCCEEDED when the run ends FAILED, TIMED-OUT or
    ABORTED.
capability: Telo.Invocable
throws:
  codes:
    APIFY_RUN_NOT_SUCCEEDED:
      description: >-
        The run finished without succeeding. `data` is the Apify run object (id, status,
        statusMessage, …).
schema:
  type: object
  required:
    - client
  properties:
    client:
      x-telo-ref:
        kind: Apify.ApifyClient
        use: dependency
      description: The ApifyClient holding the API token the run is charged to.
    timeout:
      type: integer
      minimum: 0
      description: Run timeout in seconds. Defaults to the actor's own setting.
    memory:
      type: integer
      minimum: 128
      description: Memory limit in megabytes (a power of 2). Defaults to the actor's own setting.
    maxItems:
      type: integer
      minimum: 1
      description: >-
        Maximum number of dataset items the run may produce (and, for pay-per-result actors, be
        charged for).
    maxTotalChargeUsd:
      type: number
      minimum: 0
      description: Spending cap in USD for pay-per-event actors.
inputType: !ref Input
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required:
      - run
      - items
    properties:
      run:
        type: object
        additionalProperties: true
        description: "The finished Apify run: id, status, defaultDatasetId, stats, usageTotalUsd, …"
      items:
        type: array
        description: The run's dataset items.
        items: !ref Item
resources:
  - kind: Apify.RunActor
    metadata:
      name: start
    client: !cel "self.client"
  - kind: Apify.GetRun
    metadata:
      name: getRun
    client: !cel "self.client"
  - kind: Apify.GetDatasetItems
    metadata:
      name: getItems
    client: !cel "self.client"
  - kind: Flow.Loop
    metadata:
      name: wait
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - runId
        properties:
          runId:
            type: string
    condition: !cel >-
      previous == null || !(previous.poll.result.body.data.status in ['SUCCEEDED', 'FAILED',
      'TIMED-OUT', 'ABORTED'])
    steps:
      - name: poll
        invoke: !ref getRun
        inputs:
          runId: !cel "inputs.runId"
          waitForFinish: 60
    outputs:
      run: !cel "steps.poll.result.body.data"
  - kind: Telo.Sequence
    metadata:
      name: seq
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required:
          - input
        properties:
          input:
            type: object
          timeout:
            type:
              - integer
              - "null"
          memory:
            type:
              - integer
              - "null"
          maxItems:
            type:
              - integer
              - "null"
          maxTotalChargeUsd:
            type:
              - number
              - "null"
    steps:
      - name: start
        invoke: !ref start
        inputs:
          actorId: worldunboxer/rapid-linkedin-scraper
          input: !cel "inputs.input"
          timeout: !cel "inputs.?timeout.orValue(null)"
          memory: !cel "inputs.?memory.orValue(null)"
          maxItems: !cel "inputs.?maxItems.orValue(null)"
          maxTotalChargeUsd: !cel "inputs.?maxTotalChargeUsd.orValue(null)"
      - name: wait
        invoke: !ref wait
        inputs:
          runId: !cel "steps.start.result.body.data.id"
      - name: check
        if: !cel "steps.wait.result.run.status != 'SUCCEEDED'"
        then:
          - name: fail
            throw:
              code: APIFY_RUN_NOT_SUCCEEDED
              message: !cel >-
                'Apify run ' + steps.wait.result.run.id + ' finished with status ' +
                steps.wait.result.run.status
              data: !cel "steps.wait.result.run"
      - name: items
        invoke: !ref getItems
        inputs:
          datasetId: !cel "steps.wait.result.run.defaultDatasetId"
    outputs:
      run: !cel "steps.wait.result.run"
      items: !cel "steps.items.result.body"
invoke: !ref seq
inputs:
  input: !cel "inputs"
  timeout: !cel "self.?timeout.orValue(null)"
  memory: !cel "self.?memory.orValue(null)"
  maxItems: !cel "self.?maxItems.orValue(null)"
  maxTotalChargeUsd: !cel "self.?maxTotalChargeUsd.orValue(null)"
