  description: The input of apify/beautifulsoup-scraper, from its build 0.1.12 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - startUrls
    - pageFunction
    - proxyConfiguration
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: A static list of URLs to scrape.
    maxCrawlingDepth:
      type: integer
      title: Max crawling depth
      description: >-
        Specifies how many links away from the Start URLs the scraper will descend. Note that pages
        added using context.request_queue in Page function are not subject to the maximum depth
        constraint.
      minimum: 0
      default: 1
    requestTimeout:
      type: integer
      title: Request timeout
      description: >-
        The maximum duration (in seconds) that processing a single page may take before it times
        out. This limits the request handler that runs your Page function.
      minimum: 1
      default: 10
    linkSelector:
      type: string
      title: Link selector
      description: >-
        A CSS selector stating which links on the page (<a> elements with href attribute) shall be
        followed and added to the request queue. To filter the links added to the queue, use the
        Link patterns field.

        If the Link selector is empty, the page links are ignored. Of course, you can work with the
        page links and the request queue in the Page function as well.
    linkPatterns:
      type: array
      title: Link patterns
      description: >-
        Link patterns (regular expressions) to match links in the page that you want to enqueue.
        Combine with Link selector to tell the scraper where to find links. Omitting the link
        patterns will cause the scraper to enqueue all links matched by the Link selector.
    pageFunction:
      type: string
      title: Page function
      description: >-
        A Python function, that is executed for every page. Use it to scrape data from the page,
        perform actions or add new URLs to the request queue. The page function has its own naming
        scope and you can import any installed modules. Typically you would want to obtain the data
        from the context.soup object and return them. Identifier page_function can't be changed. For
        the fields available on the context object, see the BeautifulSoupCrawlingContext
        (https://crawlee.dev/python/api/class/BeautifulSoupCrawlingContext) reference. Asynchronous
        functions are supported.
    soupFeatures:
      type: string
      title: BeautifulSoup parser
      description: >-
        The parser BeautifulSoup uses for each page (its features argument). Naming a specific
        parser keeps results consistent across platforms. Only the parsers bundled with this Actor
        are available.
      enum:
        - html.parser
        - lxml
        - xml
        - html5lib
      default: html.parser
    proxyConfiguration:
      type: object
      title: Proxy configuration
      description: Specifies proxy servers that will be used by the scraper in order to hide its origin.
      default:
        useApifyProxy: true
