kind: Telo.Library
metadata:
  name: ApifyBeautifulsoupScraper
  version: 0.1.12
  description: >-
    BeautifulSoup Scraper: the Apify actor apify/beautifulsoup-scraper (build 0.1.12) as typed Telo
    kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it
    in the background and polls until it finishes, for runs of any length. Both take an ApifyClient
    and the actor's own input, type-checked against the actor's input schema.

    Crawls websites using raw HTTP requests. It parses the HTML with the BeautifulSoup library and
    extracts data from the pages using Python code. Supports both recursive crawling and lists of
    URLs. This Actor is a Python alternative to Cheerio Scraper.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
