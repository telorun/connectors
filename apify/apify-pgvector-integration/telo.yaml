kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/pgvector-integration, from its build 0.1.2 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - postgresSqlConnectionStr
    - postgresCollectionName
    - embeddingsProvider
    - embeddingsApiKey
    - datasetFields
  properties:
    postgresSqlConnectionStr:
      type: string
      title: Postgres SQL connection string
      description: >-
        Connection string for the Postgres SQL database in the format
        `postgresql://user:password@host:port/database`
      x-telo-sensitive: true
    postgresCollectionName:
      type: string
      title: Postgres SQL collection name
      description: >-
        The name of the collection to use. NOTE: This is not the name of the table, but the name of
        the collection
    embeddingsProvider:
      type: string
      title: Embeddings provider (as defined in the langchain API)
      description: Choose the embeddings provider to use for generating embeddings
      enum:
        - OpenAI
        - Cohere
      default: OpenAI
    embeddingsConfig:
      type: object
      title: Configuration for embeddings provider
      description: >-
        Configure the parameters for the LangChain embedding class. Key points to consider:

        1. Typically, you only need to specify the model name. For example, for OpenAI, set the
        model name as {"model": "text-embedding-3-small"}.

        2. It's required to ensure that the vector size of your embeddings matches the size of
        embeddings in the database.

        3. Here are examples of embedding models:
           - [OpenAI](https://platform.openai.com/docs/guides/embeddings): `text-embedding-3-small`, `text-embedding-3-large`, etc.
           - [Cohere](https://docs.cohere.com/docs/cohere-embed): `embed-english-v3.0`, `embed-multilingual-light-v3.0`, etc.
        4. For more details about other parameters, refer to the [LangChain
        documentation](https://python.langchain.com/docs/integrations/text_embedding/).
    embeddingsApiKey:
      type: string
      title: Embeddings API KEY (whenever applicable, depends on provider)
      description: >-
        Value of the API KEY for the embeddings provider (if required).
         For example for OpenAI it is OPENAI_API_KEY, for Cohere it is COHERE_API_KEY)
      x-telo-sensitive: true
    datasetFields:
      type: array
      title: Dataset fields to select from the dataset results and store in the database
      description: >-
        This array specifies the dataset fields to be selected and stored in the vector store. Only
        the fields listed here will be included in the vector store.

        For instance, when using the Website Content Crawler, you might choose to include fields
        such as `text`, `url`, and `metadata.title` in the vector store.
      default:
        - text
    metadataDatasetFields:
      type: object
      title: Dataset fields to select from the dataset and store as metadata in the database
      description: >-
        A list of dataset fields which should be selected from the dataset and stored as metadata in
        the vector stores.

        For example, when using the Website Content Crawler, you might want to store `url` in
        metadata. In this case, use `metadataDatasetFields parameter as follows {"url": "url"}`
    metadataObject:
      type: object
      title: Custom object to be stored as metadata in the vector store database
      description: >-
        This object allows you to store custom metadata for every item in the vector store.

        For example, if you want to store the `domain` as metadata, use the `metadataObject` like
        this: {"domain": "apify.com"}.
    datasetId:
      type: string
      title: Dataset ID
      description: Dataset ID (when running standalone without integration)
    dataUpdatesStrategy:
      type: string
      title: Update strategy (add, upsert, deltaUpdates (default))
      description: >-
        Choose the update strategy for the integration. The update strategy determines how the
        integration updates the data in the database.

        The available options are:

        - **Add data** (`add`):
          - Always adds new records to the database.
          - No checks for existing records or updates are performed.
          - Useful when appending data without concern for duplicates.
        - **Upsert data** (`upsert`):
          - Updates existing records if they match a key or identifier.
          - Inserts new records into the database if they don't already exist.
          - Ideal for ensuring the database contains the most up-to-date data, avoiding duplicates.
        - **Update changed data based on deltas** (`deltaUpdates`):
          - Performs incremental updates by identifying differences (deltas) between the new dataset and the existing records.
          - Only adds new records and updates those that have changed.
          - Unchanged records are left untouched.
          - Maximizes efficiency by reducing unnecessary updates.
        Select the strategy that best fits your use case.
      enum:
        - add
        - upsert
        - deltaUpdates
      default: deltaUpdates
    dataUpdatesPrimaryDatasetFields:
      type: array
      title: >-
        Dataset fields to uniquely identify dataset items (only relevant when dataUpdatesStrategy is
        `upsert` or `deltaUpdates`)
      description: >-
        This array contains fields that are used to uniquely identify dataset items, which helps to
        handle content changes across different runs.

        For instance, in a web content crawling scenario, the `url` field could serve as a unique
        identifier for each item.
      default:
        - url
    enableDeltaUpdates:
      type: boolean
      title: Enable incremental updates for objects based on deltas (deprecated)
      description: >-
        When set to true, this setting enables incremental updates for objects in the database by
        comparing the changes (deltas) between the crawled dataset items and the existing objects,
        uniquely identified by the `datasetKeysToItemId` field.
         The integration will only add new objects and update those that have changed, reducing unnecessary updates. The `datasetFields`, `metadataDatasetFields`, and `metadataObject` fields are used to determine the changes.
      default: true
    deltaUpdatesPrimaryDatasetFields:
      type: array
      title: >-
        Dataset fields to uniquely identify dataset items (only relevant when `enableDeltaUpdates`
        is enabled) (deprecated)
      description: >-
        This array contains fields that are used to uniquely identify dataset items, which helps to
        handle content changes across different runs.

        For instance, in a web content crawling scenario, the `url` field could serve as a unique
        identifier for each item.
      default:
        - url
    deleteExpiredObjects:
      type: boolean
      title: Delete expired objects from the database
      description: >-
        When set to true, delete objects from the database that have not been crawled for a
        specified period.
      default: true
    expiredObjectDeletionPeriodDays:
      type: integer
      title: Delete expired objects from the database after a specified number of days
      description: >-
        This setting allows the integration to manage the deletion of objects from the database that
        have not been crawled for a specified period. It is typically used in subsequent runs after
        the initial crawl.

        When the value is greater than 0, the integration checks if objects have been seen within
        the last X days (determined by the expiration period). If the objects are expired, they are
        deleted from the database. The specific value for `deletedExpiredObjectsDays` depends on
        your use case and how frequently you crawl data.

        For example, if you crawl data daily, you can set `deletedExpiredObjectsDays` to 7 days. If
        you crawl data weekly, you can set `deletedExpiredObjectsDays` to 30 days.
      minimum: 0
      default: 30
    performChunking:
      type: boolean
      title: Enable text chunking
      description: >-
        When set to true, the text will be divided into smaller chunks based on the settings
        provided below. Proper chunking helps optimize retrieval and ensures accurate and efficient
        responses.
      default: true
    chunkSize:
      type: integer
      title: Maximum chunk size
      description: >-
        Defines the maximum number of characters in each text chunk. Choosing the right size
        balances between detailed context and system performance. Optimal sizes ensure high
        relevancy and minimal response time.
      minimum: 1
      default: 2000
    chunkOverlap:
      type: integer
      title: Chunk overlap
      description: >-
        Specifies the number of overlapping characters between consecutive text chunks. Adjusting
        this helps maintain context across chunks, which is crucial for accuracy in
        retrieval-augmented generation systems.
      minimum: 0
      default: 0
