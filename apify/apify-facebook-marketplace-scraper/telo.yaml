kind: Telo.Library
metadata:
  name: ApifyFacebookMarketplaceScraper
  version: 0.0.342
  description: >-
    Facebook Marketplace Scraper: the Apify actor apify/facebook-marketplace-scraper (build 0.0.342)
    as typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Extract data from one or multiple Facebook Marketplace listings. Scrape data on apartments,
    whole categories, items for sale, prices, location and sellers. Export scraped data in JSON,
    CSV, and Excel, run the scraper via API, schedule and monitor runs or integrate with other
    tools.
  repository: https://github.com/telorun/connectors
  license: MIT
