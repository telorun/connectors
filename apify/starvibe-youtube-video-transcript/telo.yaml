kind: Telo.Library
metadata:
  name: StarvibeYoutubeVideoTranscript
  version: 0.0.94
  description: >-
    YouTube Video Transcript: the Apify actor starvibe/youtube-video-transcript (build 0.0.94) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    This Apify Actor extracts full transcripts (with timestamps) and metadata from YouTube videos,
    including title, description, upload date, views, likes, channel info, and duration
