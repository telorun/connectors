        - ru
        - sk
        - sl
        - sr
        - sv
        - tr
        - zh-CN
        - zh-TW
      default: ""
    scoreLeads:
      type: boolean
      title: Use LLM to score leads
      description: >-
        Whether to use an LLM to score the leads, if this is the disabled the following options will
        not be used
      default: true
    llmPrompt:
      type: string
      title: Score the leads
      description: Write the prompt to score the leads by.
