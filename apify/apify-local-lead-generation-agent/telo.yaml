kind: Telo.Library
metadata:
  name: ApifyLocalLeadGenerationAgent
  version: 0.0.23
  description: >-
    Local Lead Generation Agent: the Apify actor apify/local-lead-generation-agent (build 0.0.23) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Find truly local leads by scraping Instagram profiles based on search queries. Extract website
    links, contact details, emails, social media details. The AI agent matches and scores leads
    using LLMs via LangChain, explains scoring, and compiles the data into a common dataset for easy
    access and use.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
