schema:
  type: object
  additionalProperties: false
  required:
    - queries
    - location
  properties:
    queries:
      type: string
      title: Search term
      description: Use regular search words like fitness, barber or flower shop.
      pattern: "[^\\s]+"
    location:
      type: string
      title: Location
      description: Use country (e.g. Spain, Iceland) or exact location (e.g. Barcelona, Vienna).
      pattern: "[^\\s]+"
    resultsLimit:
      type: integer
      title: Number of leads
      description: >-
        Set the number of local leads you want to scrape. The actual output may be slightly lower
        due to duplicates in Google Search results.
      minimum: 1
    searchLanguage:
      type: string
      title: Search language
      description: >-
        Restricts search results to pages in a specific language. For example, choosing 'German'
        results in pages only in German. Passed to Google Search as the lr URL query parameter. Read
        more here (https://developers.google.com/custom-search/v1/reference/rest/v1/cse/list).
      enum:
        - ""
        - ar
        - bg
