kind: Telo.Library
metadata:
  name: JungleeAmazonReviewsScraper
  version: 0.1.356
  description: >-
    Amazon Reviews Scraper: the Apify actor junglee/amazon-reviews-scraper (build 0.1.356) as typed
    Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs
    it in the background and polls until it finishes, for runs of any length. Both take an
    ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Amazon scraper to extract reviews from Amazon products. Scrape and download detailed reviews
    without using the Amazon API, including rating score, review description, reactions and images.
    Download your data as HTML table, JSON, CSV, Excel, XML.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of junglee/amazon-reviews-scraper, from its build 0.1.356 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - productUrls
  properties:
    productUrls:
      type: array
      title: URLs of Amazon products
      description: >-
        Enter the URL or URLs of the Amazon products you want to scrape.
         (E.g., https://www.amazon.com/Sceptre-E248W-19203R-Monitor-Speakers-Metallic/dp/B0773ZY26F). Click + Add to scrape multiple URLs at once.
      uniqueItems: true
    maxReviews:
      type: integer
      title: Max reviews per product (max count depends on the type of reviews)
      description: >-
        Type in the amount of reviews to be scraped. Leave this blank if you want to extract all
        reviews.

        ❗ Note:  max amount of reviews per product is 100 per star count (e.g. 100 reviews per 1
        star), 100 per product variant (100 reviews per each product variant), several hundred for
        media reviews, ~20 for keyword search
      minimum: 0
    includeGdprSensitive:
      type: boolean
      title: Include personal information
      description: >-
        Personal data such as name, ID or profile image is protected by GDPR in the European Union
        and by other regulations around the world. You should not scrape personal data unless you
        have a legitimate reason to do so. [Read
        more](https://blog.apify.com/is-web-scraping-legal/).
      default: false
    sort:
      type: string
      title: Sort reviews by
      description: Select by which criteria the reviews should be sorted. Amazon's default is Top reviews.
      enum:
        - helpful
        - recent
      default: helpful
    reviewsCutoffDate:
      type: string
      title: Newer than
      description: >-
        Limit how far back to the history the scraper should go. The date should be in YYYY-MM-DD or
        full ISO absolute format or in relative format e.g. 1 days, 2 months, 3 years. All time
        values are taken in UTC timezone. The maximum reviews per product we can get is 100.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    filterByRatings:
      type: array
      title: Filter by ratings
      description: >-
        Select the number of stars by which reviews should be filtered. Amazon's default is All
        stars.
         Duplicate reviews, caused by selecting overlapping ratings (e.g., 1 star and All critical) will be filtered out.
      items:
        type: string
        enum:
          - allStars
          - fiveStar
          - fourStar
          - threeStar
          - twoStar
          - oneStar
          - positive
          - critical
      default:
        - allStars
    reviewsUseProductVariantFilter:
      type: boolean
      title: Scrape a single product variant
      description: >-
        If the product has multiple variants (e.g., different colors, sizes, etc.), you can scrape
        reviews only for the selected variant.
      default: false
    reviewsFilterByKeywords:
      type: array
      title: Search by keywords
      description: >-
        Enter keywords by which the reviews should be filtered. Each keyword is scraped separately,
        in a combination with Filter by ratings option. Duplicate reviews, caused by selecting
        overlapping keywords, will be filtered out.

        Example keywords that get lots of results:

        `["Good", "Bad", "Great", "Quality", "Useful", "Love", "Price"]`
    scrapeProductDetails:
      type:
        - boolean
        - "null"
      title: Scrape product details
      description: >-
        If enabled, the Actor will scrape and save product data the same way as the [Amazon Product
        Scraper](https://console.apify.com/actors/BG3WDrGdteHgZgbPK). The product details will be
        available in the `product` output field.
      default: false
    reviewsAlwaysSaveCategoryData:
      type:
        - boolean
        - "null"
      title: Always save category data
      description: >-
        If enabled, the Actor will return the review category data even if there are no reviews.

        - Normally, only reviews are saved, if there are no reviews, the review category data is not
        saved.

        - With this option, the review category data will be saved alone, if there are no reviews
        (review fields are empty).
      default: false
    deduplicateRedirectedAsins:
      type: boolean
      title: Deduplicate redirected ASINs
      description: >-
        If set, the crawler will deduplicate the redirected ASINs (by default). Otherwise the
        product will be saved multiple times under the ASINs it was redirected to.
      default: true
---
kind: Telo.JsonSchema
metadata:
  name: Item
  description: One dataset item junglee/amazon-reviews-scraper produces.
schema:
  type: object
  additionalProperties: true
  properties:
    productAsin:
      type:
        - string
        - "null"
      description: Actual ASIN of the product whose reviews were scraped
    productOriginalAsin:
      type:
        - string
        - "null"
      description: ASIN from the input URL before any redirects
    variantAsin:
      type:
        - string
        - "null"
      description: ASIN of the product variant for which the review was enqueued
    ratingScore:
      type:
        - number
        - "null"
      description: Rating score given in the review (out of 5)
    reviewTitle:
      type:
        - string
        - "null"
      description: Review headline title
    reviewDescription:
      type:
        - string
        - "null"
      description: Full text of the review
    date:
      type:
        - string
        - "null"
      description: Date the review was published
    country:
      type:
        - string
        - "null"
      description: Country where the review was written
    countryCode:
      type:
        - string
        - "null"
      description: Country code extracted from the reviewed-in field
    isVerified:
      type:
        - boolean
        - "null"
      description: Whether this is a verified purchase review
    isAmazonVine:
      type:
        - boolean
        - "null"
      description: Whether this review was written through Amazon Vine program
    reviewId:
      type:
        - string
        - "null"
      description: Unique identifier of the review
    reviewUrl:
      type:
        - string
        - "null"
      description: URL of the individual review page
    reviewReaction:
      type:
        - string
        - "null"
      description: Number of helpful votes the review received
    variant:
      type:
        - string
        - "null"
      description: Product variant purchased by the reviewer (as a single string)
    variantAttributes:
      type:
        - array
        - "null"
      description: Product variant attributes purchased by the reviewer (as key-value pairs)
      items:
        type:
          - object
          - "null"
    username:
      type:
        - string
        - "null"
      description: Display name of the reviewer (only present when includeGdprSensitive is enabled)
    userId:
      type:
        - string
        - "null"
      description: Amazon user ID of the reviewer
    userProfileLink:
      type:
        - string
        - "null"
      description: URL to the reviewer's Amazon profile
    avatar:
      type:
        - string
        - "null"
      description: URL of the reviewer's avatar image (only present when includeGdprSensitive is enabled)
    reviewImages:
      type:
        - array
        - "null"
      description: URLs of images attached to the review
      items:
        type:
          - string
          - "null"
    position:
      type:
        - number
        - "null"
      description: Position of the review on the scraped page
    reviewedIn:
      type:
        - string
        - "null"
      description: Country and date information from the reviewed-in field
    reviewCategoryUrl:
      type:
        - string
        - "null"
      description: URL from which the review was extracted, including any active filters
    totalCategoryRatings:
      type:
        - number
        - "null"
      description: Total number of ratings in the review category/filter
    totalCategoryReviews:
      type:
        - number
        - "null"
      description: Total number of reviews in the review category/filter
    filterByRating:
      type:
        - string
        - "null"
      description: Star rating filter applied when scraping reviews
    filterByKeyword:
      type:
        - string
        - "null"
      description: Keyword filter applied when scraping reviews
    product:
      type:
        - object
        - "null"
      description: >-
        Product price details (or full product details when reviewsScrapeProductDetails is enabled)
    foundNoReviews:
      type:
        - boolean
        - "null"
      description: >-
        Indicates no reviews were found for this category (only present when
        reviewsAlwaysSaveCategoryData is enabled)
    input:
      type:
        - string
        - "null"
      description: Input URL that was used to scrape these reviews
