schema:
  type: object
  additionalProperties: false
  properties:
    startUrls:
      type: array
      title: Start URLs
      description: >-
        Instagram URLs. Paste the URLs, and get the results immediately. User, Tag, Location, Audio,
        Reels, Users' Tagged and Search URLs are supported. Provide this or Search Keywords.
    keywords:
      type: array
      title: Search Keywords
      description: >-
        Keywords to search Instagram posts by. Each keyword runs a separate search and returns
        matching posts (e.g. "travel"). Provide this or Start URLs.
    maxItems:
      type: integer
      title: Maximum number of items on output
      description: Maximum number of items that you want as output.
    until:
      type: string
      title: Scrape Until
      description: Returns posts newer than this date.
    getReels:
      type: boolean
      title: Include reels for hashtags
      description: >-
        When enabled, hashtag (Tag) URLs return the hashtag's reels in addition to its posts. Reels
        are not sorted by date, so Scrape Until is not applied to them.
      default: false
    customMapFunction:
      type:
        - string
        - "null"
      title: Custom map function
      description: >-
        Function that takes each of the objects as argument and returns data that will be mapped by
        the function itself. This function is not intended for filtering, please don't use it for
        filtering purposes or you will get banned automatically. Must be a single function, e.g.
        (object) => { return {...object} }. Leave empty if you do not need to transform the output -
        an unusable function is ignored and the original items are saved instead.
    outputConnector:
      type: string
      title: Send results to Notion, Todoist, … (optional)
      description: >-
        Pick an MCP connector you authorized in Console → Settings → API & Integrations → MCP
        connectors (e.g. Notion, Todoist — any service whose MCP server offers non-destructive write
        tools works best-effort). The scraped results are written through your own connector — the
        Actor never sees your third-party credentials. Only non-destructive write tools are used; it
        can never delete or overwrite your existing data.
    deliverTarget:
      type: string
      title: Destination target
      description: >-
        Where to write into the connector — paste the URL or ID. Notion example:
        https://www.notion.so/My-Posts-24f8a1b2c3d44e5f8a9b0c1d2e3f4a5b. Leave empty for services
        that need no target (e.g. Todoist Inbox, Slack). For Notion, share the page or database with
        your connector first (Notion's ••• → Connections menu), and point at a PAGE for structured
        columns (the Actor builds the database for you) — an empty database receives only the title
        (the rest of each record goes to the row's body).
    deliverMode:
      type: string
      title: Write mode
      description: perPost writes one record per scraped item; summary writes a single roll-up for the run.
      enum:
        - perPost
        - summary
      default: perPost
    deliverMaxItems:
      type: integer
      title: Max records to deliver — perPost only (optional)
      description: >-
        Cap on how many records perPost mode writes to the connector; ignored in summary mode. Leave
        empty to deliver everything scraped.
