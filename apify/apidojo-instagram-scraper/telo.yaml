  version: 0.0.1104
  description: >-
    Instagram Scraper (Pay Per Result): the Apify actor apidojo/instagram-scraper (build 0.0.1104)
    as typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Famous for its blazing-fast speed and completeness, it offers rapid and efficient scraping of
    many URLs such as; location, audio, tag, and profile.  It's incredibly cost-effective at only
    $0.50 for every 1000 posts, capable of scraping 100-200 posts each second!
