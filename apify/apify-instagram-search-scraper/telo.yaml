kind: Telo.Library
metadata:
  name: ApifyInstagramSearchScraper
  version: 0.1.554
  description: >-
    Instagram Search Scraper: the Apify actor apify/instagram-search-scraper (build 0.1.554) as
    typed Telo kinds. `Run` runs it and waits for its results (Apify allows up to 5 minutes);
    `Start` runs it in the background and polls until it finishes, for runs of any length. Both take
    an ApifyClient and the actor's own input, type-checked against the actor's input schema.

    Scrape Instagram search results: places, businesses, locations, users, popular reels, and
    hashtags. Add a keyword and extract search results like contact details, categories, metrics,
    recent posts, hashtag popularity. Export scraped data, schedule via API, integrate with other
    tools or AI workflows.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
---
kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of apify/instagram-search-scraper, from its build 0.1.554 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - search
  properties:
    search:
      type: string
      title: 🔍 Search term
      description: >-
        Provide a keyword which will be used to extract Instagram search results. A keyword can be
        one or more words. To scrape multiple search terms at once, submit them as a comma-separated
        list.
      default: restaurant, restaurant prague
    searchType:
      type: string
      title: 🧚 Search type
      description: >-
        Choose the type of Instagram page to search for (places, profiles, or hashtags), or `Search
        popular reels` to scrape trending reels for the keyword.
      enum:
        - place
        - user
        - hashtag
        - popular
      default: place
    searchLimit:
      type: integer
      title: 💯 Maximum results per search term
      description: >-
        Set the maximum number of search results (hashtags, users, or places) you want to scrape. If
        you set it to 5, you'll get 5 results for each search term you've included.
      minimum: 1
      maximum: 250
    enhanceUserSearchWithFacebookPage:
      type: boolean
      title: >-
        Enhance the user search (top 10) with Facebook page and email info when available (higher
        credit usage)
      description: >-
        For each user from the top 10, the scraper will extract their Facebook page that sometimes
        contains their business email. Keep in mind that you're forbidden to collect personal data
        in certain jurisdictions. See this article
        (https://blog.apify.com/is-web-scraping-legal/#think-twice-before-scraping-personal-data)
        for more details.
    liveSearch:
      type: boolean
      title: 🔎 Scrape with live search
      description: >-
        Enable this option if you want to get data from a live Instagram search. Please note that
        the dataset will be slightly different than the one produced by standard search.
