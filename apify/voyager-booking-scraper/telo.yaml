        - uk
        - id
        - ms
        - th
        - et
        - hr
        - lt
        - sk
        - sr
        - sl
        - vi
        - tl
        - is
      default: en-gb
    checkIn:
      type: string
      title: Check-in date
      description: >-
        Select the check-in date in format YYYY-MM-DD or {number} {unit}.

        - Input the date in the UTC timezone.

        Booking.com uses the UTC timezone for all check-in and check-out dates, so we do the same.
      pattern: ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$|^(\d+)\s*(day|week|month|year)s?$
    checkOut:
      type: string
      title: Check-out date
      description: >-
        Select the check-out date in format YYYY-MM-DD or {number} {unit}.

        - Input the date in the UTC timezone.

        Booking.com uses the UTC timezone for all check-in and check-out dates, so we do the same.
      pattern: ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$|^(\d+)\s*(day|week|month|year)s?$
    flexWindow:
      type: string
      title: Stay date flexibility (days)
      description: >-
        Number of days to flex around the check-in and check-out dates. E.g. setting `3` will scrape
        hotels with a possible date range up to 3 days before and 3 days after the selected dates.

        - **Applied per URL:** used for search-style start URLs (destination, region, coordinates)
        or a `search` query, and **ignored for direct hotel URLs** (`/hotel/...html`), where only
        the exact `checkIn`/`checkOut` dates are used.
      enum:
        - "0"
        - "1"
        - "2"
        - "3"
        - "7"
    rooms:
      type: integer
      title: Number of rooms
      description: Number of rooms for the availability and price search.
      minimum: 1
      maximum: 50
      default: 1
    adults:
      type: integer
      title: Number of adults
      description: Number of adult guests for the availability and price search.
      minimum: 1
      maximum: 50
      default: 2
    children:
      type: integer
      title: Number of children
      description: Number of child guests for the availability and price search.
      minimum: 0
      maximum: 50
      default: 0
    minMaxPrice:
      type: string
      title: Price range
      description: Insert the minimum and maximum price per night, e.g. '100-150' or '100+'.
