kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of voyager/booking-scraper, from its build 0.0.197 input schema.
schema:
  type: object
  additionalProperties: false
  properties:
    search:
      type:
        - string
        - "null"
      title: Destination
      description: Insert the destination name here, e.g. Amsterdam.
    startUrls:
      type: array
      title: Or use Start URLs instead
      description: >-
        Insert URLs to start with instead of a destination name. Hotel search URL's filters will be
        applied, except for the ones in the scraper input. You can also use shared list URLs. These
        links are generated for properties you saved in your Booking.com account.
    maxItems:
      type: integer
      title: Max results per destination or URL
      description: >-
        Limit the number of places to be scraped. Input a value over `1000` to activate the
        'overcome 1000 results limit' feature.
      minimum: 1
    extractAdditionalHotelData:
      type: boolean
      title: Scrape additional hotel data ($)
      description: >-
        Adds two fields to each hotel: surroundings (nearby points of interest and distances) and
        roomOfferings (available room types with details).
      default: false
    propertyType:
      type: string
      title: Property type
      description: Choose type of property
      enum:
        - none
        - Hotels
        - Apartments
        - Hostels
        - Guest houses
        - Homestays
        - Bed and breakfasts
        - Holiday homes
        - Boats
        - Villas
        - Motels
        - Resorts
        - Holiday parks
        - Campsites
        - Luxury tents
      default: none
    sortBy:
      type: string
      title: Order results by
      description: Hotel attribute by which the results will be ordered
      enum:
        - bayesian_review_score
        - distance_from_search
        - class_asc
        - price
        - review_score_and_price
        - class_and_price
      default: distance_from_search
    minScore:
      type: string
      title: Minimum rating
      description: >-
        Minimum rating of a hotel in "8.4" format.

        - Searching below a rating of `5` may be very inefficient, as it's not natively supported by
        Booking.com.
    starsCountFilter:
      type: string
      title: Stars count
      description: >-
        Only scrape places with the selected stars count. Also includes Booking.com's apartment-like
        properties 'square' rating.
      enum:
        - any
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - unrated
      default: any
    currency:
      type: string
      title: Preferred currency
      description: Currency to be set on the website
      enum:
        - ARS
        - AUD
        - AZN
        - BHD
        - BRL
        - BGN
        - CAD
        - XOF
