kind: Telo.Library
metadata:
  name: VoyagerBookingScraper
  version: 0.0.197
  description: >-
    Booking Scraper: the Apify actor voyager/booking-scraper (build 0.0.197) as typed Telo kinds.
    `Run` runs it and waits for its results (Apify allows up to 5 minutes); `Start` runs it in the
    background and polls until it finishes, for runs of any length. Both take an ApifyClient and the
    actor's own input, type-checked against the actor's input schema.

    Scrape Booking with this hotels scraper and get data about accommodation on Booking.com. You can
    crawl by keywords or URLs for hotel prices, ratings, addresses, number of reviews, stars. You
    can also download all that room and hotel data from Booking.com with a few clicks: CSV, JSON,
    HTML, and Excel
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Apify: ../apify
  Flow: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
exports:
  kinds:
    - Run
    - Start
    - Apify.ApifyClient
