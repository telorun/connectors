        - QAR
        - RON
        - RUB
        - SAR
        - SGD
        - ZAR
        - SEK
        - CHF
        - THB
        - TRY
        - AED
        - USD
        - UAH
      default: USD
    language:
      type: string
      title: Language
      description: Language to be set on the website (does not apply to reviews)
      enum:
        - en-gb
        - en-us
        - de
        - nl
        - fr
        - es
        - es-ar
        - ca
        - it
        - pt-pt
        - pt-br
        - no
        - fi
        - sv
        - da
        - cs
        - hu
        - ro
        - ja
        - zh-cn
        - zh-tw
        - pl
        - el
        - ru
        - tr
        - bg
