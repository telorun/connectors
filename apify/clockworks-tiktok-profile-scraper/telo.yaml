kind: Telo.JsonSchema
metadata:
  name: Input
  description: The input of clockworks/tiktok-profile-scraper, from its build 0.0.490 input schema.
schema:
  type: object
  additionalProperties: false
  required:
    - profiles
  properties:
    profiles:
      type: array
      title: Profile(s)
      description: >-
        Add one or multiple TikTok usernames or user IDs you want to scrape. You can enter the
        usernames one by one, or use the Bulk edit section to add a prepared list.
    profileScrapeSections:
      type: array
      title: Profile sections to scrape
      description: >-
        If a profile has reposted videos, you can scrape them by selecting 'Reposts'. If a profile
        currently has an active story, you can scrape it by selecting 'Stories'
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum:
          - videos
          - reposts
          - stories
      default:
        - videos
    profileSorting:
      type: string
      title: Profile video sorting
      description: >-
        Select Latest to scrape the most recent videos first, Oldest - the oldest videos first,
        Popular - the most popular videos first. Date filters only work with Latest and Oldest. Only
        supported for Videos section. Note: Popular sorting is limited by TikTok to approximately
        400–500 videos per profile and may return significantly fewer results than Latest or Oldest.
      enum:
        - latest
        - popular
        - oldest
      default: latest
    resultsPerPage:
      type: integer
      title: Max posts per profile
      description: The number of posts that will be scraped from every profile.
      minimum: 1
      default: 100
    oldestPostDateUnified:
      type: string
      title: 📅 Date filter - scrape profile videos published after [date] ($)
      description: >-
        Optional charged filter. Only videos uploaded after or on this date will be scraped.
        Alternatively, specify how old the scraped videos should be in days. Putting 1 will get you
        only today's posts, 2 - yesterday's and today's, and so on.
      pattern: >-
        ^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T[0-2]\d:[0-5]\d(:[0-5]\d)?(\.\d+)?Z?)?$|^(\d+)\s*(minute|hour|day|week|month|year)s?$
    newestPostDate:
      type: string
      title: 📅 Date filter - scrape profile videos published before [date] ($)
      description: Optional charged filter. Only videos uploaded before or on this date will be scraped.
    mostDiggs:
      type: integer
      title: ⭐ Popularity filter - scrape videos with number of hearts < [number] ($)
      description: >-
        Optional charged filter. Scrapes only videos with less hearts than the number you add.
        Doesn't work with date filters
      minimum: 1
    leastDiggs:
      type: integer
      title: ⭐ Popularity filter - scrape videos with number of hearts ≥ [number] ($)
      description: >-
        Optional charged filter. Scrapes only videos with no less hearts than the number you add.
        Doesn't work with date filters
      minimum: 1
    maxFollowersPerProfile:
      type: integer
      title: 🗂️ Maximum number of followers profiles ($)
      description: >-
        Scrapes number of 'Followers' profiles requested from the inputted profiles. You can find
        the link to the dataset under the followDatasetUrl field in the output. If you want to
        scrape only Followers/Following profiles, go to our TikTok Followers Scraper.
      minimum: 0
    maxFollowingPerProfile:
      type: integer
      title: 🗂️ Maximum number of following profiles ($)
      description: >-
        Scrapes number of 'Following' profiles requested from the inputted profiles. You can find
        the link to the dataset under the followDatasetUrl field in the output. If you want to
        scrape only Followers/Following profiles, go to our TikTok Followers Scraper.
      minimum: 0
    excludePinnedPosts:
      type: boolean
      title: Exclude pinned posts
      description: >-
        Tick to exclude pinned posts from profiles. Pinned posts are usually the first videos on a
        profile's page.
      default: false
    shouldDownloadVideos:
      type: boolean
      title: "⬇️ Add-on: video download ($)"
      description: This is a charged add-on. Tick to download TikTok videos.
      default: false
    shouldDownloadCovers:
      type: boolean
      title: Include thumbnails
      description: Tick to download TikTok video cover images (thumbnails).
      default: false
    downloadSubtitlesOptions:
      type: string
      title: Subtitles & Transcription
      description: >-
        Choose how to handle subtitles and audio transcription for input videos. Subtitles are
        provided by TikTok for some videos, and transcription means that this Actor will use
        speech-to-text AI to generate video transcript. Transcripts are charged as an extra event
        according to your plan.
      enum:
        - NEVER_DOWNLOAD_SUBTITLES
        - DOWNLOAD_SUBTITLES
        - DOWNLOAD_AND_TRANSCRIBE_VIDEOS_WITHOUT_SUBTITLES
        - TRANSCRIBE_ALL_VIDEOS
      default: NEVER_DOWNLOAD_SUBTITLES
    shouldDownloadSlideshowImages:
      type: boolean
      title: Download slideshow images
      description: Tick to download TikTok slideshow images.
      default: false
    shouldDownloadAvatars:
      type: boolean
      title: Include profile avatars
      description: Tick to download authors' profile pictures.
      default: false
    videoKvStoreIdOrName:
      type: string
      title: >-
        ✍️ Name your storage for videos. Unnamed key-value stores will be deleted after 7 days (or
        longer on paid plans)
      description: >-
        Name (or ID) of the Key Value Store where the videos and other media like thumbnails will be
        stored. Omit to store in the default one. Using this option will provide a named Key-Value
        store can help bypass data retention and store the content forever until the store is
        manually deleted.

        The Key-Value store's name can consist of a versatile combination of uppercase letters,
        lowercase letters, digits, or hyphens, all without any spaces.
      pattern: ^[a-zA-Z0-9-]+$
    commentsPerPost:
      type: integer
      title: Maximum comments per post
      description: >-
        The number of comments extracted from every result. Due to TikTok API limitations, the
        actual number of scraped comments may differ, especially for posts with thousands of
        comments. The link to the dataset will be under a field commentsDatasetURL in the output.
      minimum: 0
    topLevelCommentsPerPost:
      type: integer
      title: Maximum top-level comments per post
      description: The maximum number of top-level (non-reply) comments you want from a single post.
      minimum: 0
    maxRepliesPerComment:
      type: integer
      title: Maximum replies per comment
      description: >-
        The maximum number of replies you want from a single comment.

        Note: Successful extraction of all desired replies is currently not guaranteed.
      minimum: 0
