    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/apps/' + urlEncode(inputs.appId) + '?' + join([
        {'k': 'fields', 'v': inputs.?fields.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# POST https://oauth2.googleapis.com/token — exchange an OAuth2 refresh token for
# a fresh access token. Pure HTTP (no signing), so it needs no client: it posts a
# form-encoded body to Google's token endpoint. Feed body.access_token into a
# GoogleDriveClient. Obtain clientId/clientSecret/refreshToken from a Google
# Cloud OAuth client + consent grant with a Drive scope
# (https://www.googleapis.com/auth/drive, …/drive.file, …/drive.readonly).
# For a long-running process prefer a refreshing Http.Credential on the client.
kind: Telo.Definition
metadata:
  name: RefreshAccessToken
  description: Exchange an OAuth2 refresh token for a fresh Google access token.
capability: Telo.Invocable
schema:
  type: object
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [clientId, clientSecret, refreshToken]
    properties:
      clientId:
        type: string
        description: OAuth2 client id.
      clientSecret:
        type: string
        description: OAuth2 client secret.
      refreshToken:
        type: string
        description: OAuth2 refresh token previously granted for a Drive scope.
      tokenUrl:
        type: string
        description: Override the token endpoint (a proxy or a stub). Defaults to https://oauth2.googleapis.com/token.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON — { access_token, expires_in, scope, token_type }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: POST
  url: !cel "inputs.?tokenUrl.orValue('https://oauth2.googleapis.com/token')"
  headers:
    Content-Type: application/x-www-form-urlencoded
  body: !cel >-
    'client_id=' + urlEncode(inputs.clientId) +
    '&client_secret=' + urlEncode(inputs.clientSecret) +
    '&refresh_token=' + urlEncode(inputs.refreshToken) +
    '&grant_type=refresh_token'
