kind: Telo.Library
metadata:
  name: GoogleDrive
  version: 0.1.0
  description: >-
    Typed Google Drive (API v3) operations for Telo manifests. A friendly
    Http.Client (GoogleDriveClient) authenticated with either a static OAuth2
    access token or a self-refreshing Http.Credential, plus Invocable
    operations covering the whole REST surface: files (list, get, download,
    export, create, multipart and resumable upload, update, copy, delete,
    trash, ids, watch, labels), permissions, comments, replies, revisions,
    shared drives, changes, about, channels and apps. A RefreshAccessToken
    helper exchanges an OAuth2 refresh token for a fresh access token. Built on
    the http-client, multipart and run modules — no controller code.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  Http: oci://ghcr.io/telorun/http-client@0.22.0#sha256-UyC8nQDnKHXyPpPPHC7TS8MicesLsgDUKWBYObf5oQ4
  Multipart: oci://ghcr.io/telorun/multipart@0.2.2#sha256-RCqiT4UMwrVeRq1hU1xxkysRSxX4NC5DzsdrbbEBxv8
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
exports:
  kinds:
    # Clients
    - GoogleDriveClient
    - GoogleDriveOAuthClient
    # Files
    - ListFiles
    - GetFile
    - DownloadFile
    - ExportFile
    - CreateFile
    - UpdateFile
    - CopyFile
    - DeleteFile
    - EmptyTrash
    - GenerateFileIds
    - WatchFile
    - ListFileLabels
    - ModifyFileLabels
    # Uploads
    - UploadFile
    - UpdateFileContent
    - StartResumableUpload
    - UploadResumableContent
    - UploadFileResumable
    # Permissions
    - ListPermissions
    - GetPermission
    - CreatePermission
    - UpdatePermission
    - DeletePermission
    # Comments
    - ListComments
    - GetComment
    - CreateComment
    - UpdateComment
    - DeleteComment
    # Replies
    - ListReplies
    - GetReply
    - CreateReply
    - UpdateReply
    - DeleteReply
    # Revisions
    - ListRevisions
    - GetRevision
    - DownloadRevision
    - UpdateRevision
    - DeleteRevision
    # Shared drives
    - ListDrives
    - GetDrive
    - CreateDrive
    - UpdateDrive
    - DeleteDrive
    - HideDrive
    - UnhideDrive
    # Changes
    - GetStartPageToken
    - ListChanges
    - WatchChanges
    # Misc
    - GetAbout
    - StopChannel
    - ListApps
    - GetApp
    - RefreshAccessToken
---
# The service clients. Both inherit the Http.Client controller (and its Provider
# capability), so either IS an Http.Client at runtime and drops into any
# `x-telo-ref: Http.Client` slot — every operation below takes either.
#
# Two kinds rather than one optional field: a credential is a live resource
# reference, and a reference cannot be produced conditionally by an expression,
# so an "either/or" auth field would resolve to an empty object whenever it was
# left out. Which one to use:
#
#   - GoogleDriveClient — a bare OAuth2 access token. Google's expire about an
#     hour after issue; RefreshAccessToken exchanges a refresh token for a new
#     one. Right for a script or a short-lived run.
#   - GoogleDriveOAuthClient — any Http.Credential: Http.BearerToken for a fixed
#     token, or a refreshing credential (e.g. from the oauth-client module) that
#     re-acquires before expiry and again after a 401. Right for a long-lived
#     process.
#
# Both hosts Drive uses hang off the same origin (`/drive/v3` for metadata,
# `/upload/drive/v3` for content), so baseUrl is the origin. The default retry
# policy backs off on 408/429/5xx and honours Retry-After, which is what
# Google's usage-limit guidance asks for. Requests with a streamed body cannot
# be replayed; those operations disable retry themselves (see UploadFile).
kind: Telo.Definition
metadata:
  name: GoogleDriveClient
  description: >-
    Preconfigured Google Drive Http.Client — Bearer OAuth2 access token,
    baseUrl https://www.googleapis.com, retry with backoff.
extends: Http.Client
schema:
  type: object
  required: [accessToken]
  properties:
    accessToken:
      type: string
      description: >-
        OAuth2 access token (the bare token, no "Bearer " prefix). Sent as
        `Authorization: Bearer <accessToken>` on every request.
    baseUrl:
      type: string
      description: >-
        Override the API origin (no trailing slash). Defaults to
        https://www.googleapis.com. Point it at a proxy or a stub server for
        testing.
    timeout:
      type: integer
      minimum: 1
      description: Per-request timeout in milliseconds. Defaults to 60000.
    retryAttempts:
      type: integer
      minimum: 0
      description: >-
        Re-attempts after the first try for retryable failures (network errors,
        408, 429, 5xx). Defaults to 3; 0 disables retrying.
base:
  baseUrl: !cel "self.?baseUrl.orValue('https://www.googleapis.com')"
  headers:
    Authorization: !cel "'Bearer ' + self.accessToken"
  timeout: !cel "self.?timeout.orValue(60000)"
  retry:
    attempts: !cel "self.?retryAttempts.orValue(3)"
    initialDelay: 500
    maxDelay: 16000
    honorRetryAfter: true
---
# The same client authenticated by an Http.Credential — the production shape for
# a long-lived process, since the credential is re-consulted with forceRefresh
# and the request retried once when Google answers 401.
kind: Telo.Definition
metadata:
  name: GoogleDriveOAuthClient
  description: >-
    Google Drive Http.Client authenticated by an Http.Credential (a refreshing
    OAuth credential, or Http.BearerToken).
extends: Http.Client
schema:
  type: object
  required: [credential]
  properties:
    credential:
      x-telo-ref:
        kind: Http.Credential
        use: call
      description: >-
        The credential consulted on every request. Re-consulted with
        forceRefresh and the request retried once on a 401.
    baseUrl:
      type: string
      description: >-
        Override the API origin (no trailing slash). Defaults to
        https://www.googleapis.com.
    timeout:
      type: integer
      minimum: 1
      description: Per-request timeout in milliseconds. Defaults to 60000.
    retryAttempts:
      type: integer
      minimum: 0
      description: >-
        Re-attempts after the first try for retryable failures. Defaults to 3;
        0 disables retrying.
base:
  baseUrl: !cel "self.?baseUrl.orValue('https://www.googleapis.com')"
  credential: !cel "self.credential"
  timeout: !cel "self.?timeout.orValue(60000)"
  retry:
    attempts: !cel "self.?retryAttempts.orValue(3)"
    initialDelay: 500
    maxDelay: 16000
    honorRetryAfter: true
---
# GET /drive/v3/files — list or search files. `q` is the Drive search grammar
# (e.g. "'folderId' in parents and trashed = false"). Page with pageToken.
# `supportsAllDrives` defaults to true everywhere in this module, as Google
# recommends; set `includeItemsFromAllDrives` to search shared drives too.
kind: Telo.Definition
metadata:
  name: ListFiles
  description: List or search files (GET /drive/v3/files) with the Drive query grammar.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      q:
        type: string
        description: "Search query, e.g. \"name contains 'report' and trashed = false\"."
      pageSize:
        type: integer
        description: Maximum files per page (1-1000, default 100).
      pageToken:
        type: string
        description: nextPageToken from the previous page.
      orderBy:
        type: string
        description: "Sort keys, e.g. \"modifiedTime desc,name\"."
      fields:
        type: string
        description: "Field mask, e.g. \"nextPageToken,files(id,name,mimeType)\"."
      spaces:
        type: string
        description: "Comma-separated spaces to query: drive, appDataFolder."
      corpora:
        type: string
        description: "Bodies to query: user, domain, drive, allDrives."
      driveId:
        type: string
        description: Shared drive id to search (with corpora=drive).
      includeItemsFromAllDrives:
        type: boolean
        description: Include shared drive items in results.
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      includePermissionsForView:
        type: string
        description: "Extra permissions to include in the response (only 'published')."
      includeLabels:
        type: string
        description: Comma-separated label ids to include in labelInfo.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim (escape hatch for new API options).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON FileList — { files, nextPageToken?, incompleteSearch }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files?' + join([
        {'k': 'q', 'v': inputs.?q.orValue('')},
        {'k': 'pageSize', 'v': has(inputs.pageSize) ? string(inputs.pageSize) : ''},
        {'k': 'pageToken', 'v': inputs.?pageToken.orValue('')},
        {'k': 'orderBy', 'v': inputs.?orderBy.orValue('')},
        {'k': 'fields', 'v': inputs.?fields.orValue('')},
        {'k': 'spaces', 'v': inputs.?spaces.orValue('')},
        {'k': 'corpora', 'v': inputs.?corpora.orValue('')},
        {'k': 'driveId', 'v': inputs.?driveId.orValue('')},
        {'k': 'includeItemsFromAllDrives', 'v': has(inputs.includeItemsFromAllDrives) ? string(inputs.includeItemsFromAllDrives) : ''},
        {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
        {'k': 'includePermissionsForView', 'v': inputs.?includePermissionsForView.orValue('')},
        {'k': 'includeLabels', 'v': inputs.?includeLabels.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# GET /drive/v3/files/{fileId} — read a file's metadata. Use `fields` to
# choose the projection ("*" for everything); Drive returns a small default set.
kind: Telo.Definition
metadata:
  name: GetFile
  description: Read a file's metadata by id (GET /drive/v3/files/{fileId}).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [fileId]
    properties:
      fileId:
        type: string
        description: The file id.
      fields:
        type: string
        description: "Field mask, e.g. \"id,name,mimeType,size,parents\" or \"*\"."
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      acknowledgeAbuse:
        type: boolean
        description: Acknowledge the risk of downloading known malware or abusive files.
      includePermissionsForView:
        type: string
        description: "Extra permissions to include (only 'published')."
      includeLabels:
        type: string
        description: Comma-separated label ids to include in labelInfo.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON File resource.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files/' + urlEncode(inputs.fileId) + '?' + join([
        {'k': 'fields', 'v': inputs.?fields.orValue('')},
        {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
        {'k': 'acknowledgeAbuse', 'v': has(inputs.acknowledgeAbuse) ? string(inputs.acknowledgeAbuse) : ''},
        {'k': 'includePermissionsForView', 'v': inputs.?includePermissionsForView.orValue('')},
        {'k': 'includeLabels', 'v': inputs.?includeLabels.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# GET /drive/v3/files/{fileId}?alt=media — download a binary file's content.
# Only for files with binary content (not Google Docs/Sheets/Slides — use
# ExportFile for those). `responseType` picks buffered bytes (default) or a
# byte stream for large files; a `range` header ("bytes=0-1023") downloads a
# slice.
kind: Telo.Definition
metadata:
  name: DownloadFile
  description: Download a file's binary content as bytes or a byte stream (alt=media).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [fileId]
    properties:
      fileId:
        type: string
        description: The file id.
      responseType:
        type: string
        enum: [bytes, stream]
        description: Buffer the content as bytes (default) or return a byte stream.
      range:
        type: string
        description: "Optional HTTP Range header value, e.g. \"bytes=0-1023\", for a partial download."
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      acknowledgeAbuse:
        type: boolean
        description: Acknowledge the risk of downloading known malware or abusive files.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: The file content — raw bytes, or a byte stream when responseType is stream.
        anyOf:
          - x-telo-type: Telo.Bytes
          - x-telo-type:
              name: Telo.Stream
              of: Telo.Bytes
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  responseType: !cel "inputs.?responseType.orValue('bytes')"
  headers: !cel "has(inputs.range) ? {'Range': inputs.range} : {}"
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files/' + urlEncode(inputs.fileId) + '?alt=media&' + join([
        {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
        {'k': 'acknowledgeAbuse', 'v': has(inputs.acknowledgeAbuse) ? string(inputs.acknowledgeAbuse) : ''}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# GET /drive/v3/files/{fileId}/export?mimeType=… — export a Google Workspace
# document (Docs, Sheets, Slides, Drawings) to another format, e.g.
# application/pdf, text/csv, text/plain. Exports are capped at 10 MB by Google.
kind: Telo.Definition
metadata:
  name: ExportFile
  description: Export a Google Workspace document to another MIME type (bytes or stream).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [fileId, mimeType]
    properties:
      fileId:
        type: string
        description: The Google Workspace document id.
      mimeType:
        type: string
        description: "Target format, e.g. application/pdf, text/csv, text/plain."
      responseType:
        type: string
        enum: [bytes, stream]
        description: Buffer the content as bytes (default) or return a byte stream.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: The exported content — raw bytes, or a byte stream when responseType is stream.
        anyOf:
          - x-telo-type: Telo.Bytes
          - x-telo-type:
              name: Telo.Stream
              of: Telo.Bytes
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  responseType: !cel "inputs.?responseType.orValue('bytes')"
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files/' + urlEncode(inputs.fileId) + '/export?mimeType=' + urlEncode(inputs.mimeType)
        + join([''] + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# POST /drive/v3/files — create a file from metadata only: a folder
# (mimeType application/vnd.google-apps.folder), a shortcut, an empty Google
# Doc, or an empty binary file. To create a file WITH content use UploadFile.
kind: Telo.Definition
metadata:
  name: CreateFile
  description: Create a file, folder or shortcut from metadata alone (POST /drive/v3/files).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [metadata]
    properties:
      metadata:
        type: object
        additionalProperties: true
        description: "File resource, e.g. { name, mimeType, parents: [folderId], description, properties, appProperties }."
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      ignoreDefaultVisibility:
        type: boolean
        description: Ignore the domain's default visibility settings for the created file.
      keepRevisionForever:
        type: boolean
        description: Pin the new head revision (binary files only, 200 pinned max).
      ocrLanguage:
        type: string
        description: ISO 639-1 language hint for OCR during image import.
      useContentAsIndexableText:
        type: boolean
        description: Use the uploaded content as indexable text.
      fields:
        type: string
        description: Field mask for the returned File resource.
      includePermissionsForView:
        type: string
        description: "Extra permissions to include (only 'published')."
      includeLabels:
        type: string
        description: Comma-separated label ids to include in labelInfo.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON File resource of the created file.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: POST
  body: !cel "inputs.metadata"
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files?' + join([
        {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
        {'k': 'ignoreDefaultVisibility', 'v': has(inputs.ignoreDefaultVisibility) ? string(inputs.ignoreDefaultVisibility) : ''},
        {'k': 'keepRevisionForever', 'v': has(inputs.keepRevisionForever) ? string(inputs.keepRevisionForever) : ''},
        {'k': 'ocrLanguage', 'v': inputs.?ocrLanguage.orValue('')},
        {'k': 'useContentAsIndexableText', 'v': has(inputs.useContentAsIndexableText) ? string(inputs.useContentAsIndexableText) : ''},
        {'k': 'fields', 'v': inputs.?fields.orValue('')},
        {'k': 'includePermissionsForView', 'v': inputs.?includePermissionsForView.orValue('')},
        {'k': 'includeLabels', 'v': inputs.?includeLabels.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# PATCH /drive/v3/files/{fileId} — update metadata: rename, describe, star,
# trash/untrash (`trashed`), set properties, or move between folders with
# addParents / removeParents. Content is replaced with UpdateFileContent.
kind: Telo.Definition
metadata:
  name: UpdateFile
  description: Update a file's metadata, or move it with addParents/removeParents (PATCH).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [fileId]
    properties:
      fileId:
        type: string
        description: The file id.
      metadata:
        type: object
        additionalProperties: true
        description: "Fields to change, e.g. { name, description, starred, trashed, properties }. Defaults to {}."
      addParents:
        type: string
        description: Comma-separated parent ids to add (move into).
      removeParents:
        type: string
        description: Comma-separated parent ids to remove (move out of).
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      keepRevisionForever:
        type: boolean
        description: Pin the new head revision (binary files only).
      ocrLanguage:
        type: string
        description: ISO 639-1 language hint for OCR during image import.
      useContentAsIndexableText:
        type: boolean
        description: Use the uploaded content as indexable text.
      fields:
        type: string
        description: Field mask for the returned File resource.
      includePermissionsForView:
        type: string
        description: "Extra permissions to include (only 'published')."
      includeLabels:
        type: string
        description: Comma-separated label ids to include in labelInfo.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON File resource after the update.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: PATCH
  body: !cel "inputs.?metadata.orValue({})"
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files/' + urlEncode(inputs.fileId) + '?' + join([
        {'k': 'addParents', 'v': inputs.?addParents.orValue('')},
        {'k': 'removeParents', 'v': inputs.?removeParents.orValue('')},
