        description: MIME type of the content part. Defaults to application/octet-stream.
      contentEncoding:
        type: string
        enum: [utf8, base64]
        description: How a STRING content is interpreted — utf8 text (default) or base64-encoded bytes.
      addParents:
        type: string
        description: Comma-separated parent ids to add.
      removeParents:
        type: string
        description: Comma-separated parent ids to remove.
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      keepRevisionForever:
        type: boolean
        description: Pin the new head revision (binary files only).
      ocrLanguage:
        type: string
        description: ISO 639-1 language hint for OCR during image import.
      useContentAsIndexableText:
        type: boolean
        description: Use the uploaded content as indexable text.
      fields:
        type: string
        description: Field mask for the returned File resource.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON File resource after the update.
resources:
  - kind: Multipart.Encoder
    metadata:
      name: !cel "self.name + '-mp'"
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
    retry:
      attempts: 0
  - kind: Run.Sequence
    metadata:
      name: !cel "self.name + '-seq'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required: [fileId, content]
        properties:
          fileId: { type: string }
          metadata: { type: object, additionalProperties: true }
          content: {}
          contentType: { type: string }
          contentEncoding: { type: string }
          addParents: { type: string }
          removeParents: { type: string }
          supportsAllDrives: { type: boolean }
          keepRevisionForever: { type: boolean }
          ocrLanguage: { type: string }
          useContentAsIndexableText: { type: boolean }
          fields: { type: string }
          params: { type: object, additionalProperties: { type: string } }
    steps:
      - name: encode
        invoke:
          kind: Multipart.Encoder
          name: !cel "self.name + '-mp'"
        inputs:
          subtype: related
          parts:
            - content: !cel "json(inputs.?metadata.orValue({}))"
              contentType: application/json; charset=UTF-8
            - content: !cel "inputs.?contentEncoding.orValue('utf8') == 'base64' ? bytesFromBase64(inputs.content) : inputs.content"
              contentType: !cel "inputs.?contentType.orValue('application/octet-stream')"
      - name: send
        invoke:
          kind: Http.Request
          name: !cel "self.name + '-req'"
        inputs:
          method: PATCH
          headers:
            Content-Type: !cel "steps.encode.result.contentType"
          body: !cel "steps.encode.result.output"
          url: !cel >-
            trimSuffix(trimSuffix(
              '/upload/drive/v3/files/' + urlEncode(inputs.fileId) + '?uploadType=multipart&' + join([
                {'k': 'addParents', 'v': inputs.?addParents.orValue('')},
                {'k': 'removeParents', 'v': inputs.?removeParents.orValue('')},
                {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
                {'k': 'keepRevisionForever', 'v': inputs.?keepRevisionForever.orValue(false) ? 'true' : ''},
                {'k': 'ocrLanguage', 'v': inputs.?ocrLanguage.orValue('')},
                {'k': 'useContentAsIndexableText', 'v': inputs.?useContentAsIndexableText.orValue(false) ? 'true' : ''},
                {'k': 'fields', 'v': inputs.?fields.orValue('')}
              ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
                + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
            , '&'), '?')
    outputs:
      status: !cel "steps.send.result.status"
      headers: !cel "steps.send.result.headers"
      body: !cel "steps.send.result.body"
invoke:
  kind: Run.Sequence
  name: !cel "self.name + '-seq'"
inputs:
  fileId: !cel "inputs.fileId"
  metadata: !cel "inputs.?metadata.orValue({})"
  content: !cel "inputs.content"
  contentType: !cel "inputs.?contentType.orValue('application/octet-stream')"
  contentEncoding: !cel "inputs.?contentEncoding.orValue('utf8')"
  addParents: !cel "inputs.?addParents.orValue('')"
  removeParents: !cel "inputs.?removeParents.orValue('')"
  supportsAllDrives: !cel "inputs.?supportsAllDrives.orValue(true)"
  keepRevisionForever: !cel "inputs.?keepRevisionForever.orValue(false)"
  ocrLanguage: !cel "inputs.?ocrLanguage.orValue('')"
  useContentAsIndexableText: !cel "inputs.?useContentAsIndexableText.orValue(false)"
  fields: !cel "inputs.?fields.orValue('')"
  params: !cel "inputs.?params.orValue({})"
---
# POST /upload/drive/v3/files?uploadType=resumable (or PATCH …/files/{fileId}
# with `fileId`, to replace content) — open a resumable upload session. The
# response carries the session URI in `headers.location`; send the bytes to it
# with UploadResumableContent, in one request or in chunks (multiples of
# 256 KiB, each with a Content-Range). Sessions live for about a week. For the
# one-shot start+send pair use UploadFileResumable.
kind: Telo.Definition
metadata:
  name: StartResumableUpload
  description: Open a resumable upload session; the session URI is returned in headers.location.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      fileId:
        type: string
        description: When set, the session replaces this file's content (PATCH) instead of creating a file (POST).
      metadata:
        type: object
        additionalProperties: true
        description: "File resource for the new file (or fields to change), e.g. { name, parents }. Defaults to {}."
      contentType:
        type: string
        description: MIME type of the content to be uploaded (X-Upload-Content-Type). Defaults to application/octet-stream.
      contentLength:
        type: integer
        description: Total size in bytes of the content to be uploaded (X-Upload-Content-Length), when known.
      addParents:
        type: string
        description: With fileId — comma-separated parent ids to add.
      removeParents:
        type: string
        description: With fileId — comma-separated parent ids to remove.
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      ignoreDefaultVisibility:
        type: boolean
        description: Ignore the domain's default visibility settings (create only).
      keepRevisionForever:
        type: boolean
        description: Pin the new head revision (binary files only).
      ocrLanguage:
        type: string
        description: ISO 639-1 language hint for OCR during image import.
      useContentAsIndexableText:
        type: boolean
        description: Use the uploaded content as indexable text.
      fields:
        type: string
        description: Field mask for the File resource returned by the final upload request.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers:
        type: object
        additionalProperties: { type: string }
        description: Response headers; `location` is the resumable session URI.
      body:
        description: Empty on success (200).
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: !cel "has(inputs.fileId) ? 'PATCH' : 'POST'"
  body: !cel "inputs.?metadata.orValue({})"
  headers: !cel >-
    inputs.?contentLength.orValue(0) > 0
      ? {'X-Upload-Content-Type': inputs.?contentType.orValue('application/octet-stream'),
         'X-Upload-Content-Length': string(inputs.contentLength)}
      : {'X-Upload-Content-Type': inputs.?contentType.orValue('application/octet-stream')}
  url: !cel >-
    trimSuffix(trimSuffix(
      '/upload/drive/v3/files' + (has(inputs.fileId) ? '/' + urlEncode(inputs.fileId) : '')
        + '?uploadType=resumable&' + join([
        {'k': 'addParents', 'v': inputs.?addParents.orValue('')},
        {'k': 'removeParents', 'v': inputs.?removeParents.orValue('')},
        {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
        {'k': 'ignoreDefaultVisibility', 'v': inputs.?ignoreDefaultVisibility.orValue(false) ? 'true' : ''},
        {'k': 'keepRevisionForever', 'v': inputs.?keepRevisionForever.orValue(false) ? 'true' : ''},
        {'k': 'ocrLanguage', 'v': inputs.?ocrLanguage.orValue('')},
        {'k': 'useContentAsIndexableText', 'v': inputs.?useContentAsIndexableText.orValue(false) ? 'true' : ''},
        {'k': 'fields', 'v': inputs.?fields.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# PUT <session URI> — send content to a resumable upload session opened by
# StartResumableUpload. Send everything in one request (no contentRange), or a
# chunk at a time with `contentRange` ("bytes 0-262143/1048576"): Google
# answers 308 Resume Incomplete (with a `range` header naming what it holds)
# until the last chunk, then 200/201 with the File resource. To query a
# session's progress, send an empty content with contentRange "bytes */<total>".
# 308 is declared a success here so it is returned rather than thrown.
#
# Pass `contentLength` when `content` is a stream: it sets Content-Length so the
# request is not sent chunked, which Google's upload endpoint rejects.
kind: Telo.Definition
metadata:
  name: UploadResumableContent
  description: Send all or a chunk of a file's content to a resumable upload session (PUT).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [uploadUri, content]
    properties:
      uploadUri:
        type: string
        description: The session URI from StartResumableUpload's headers.location.
      content:
        description: The bytes to send — a string, raw bytes, or a byte stream. Empty string to query progress.
        anyOf:
          - type: string
          - x-telo-type: Telo.Bytes
          - x-telo-type:
              name: Telo.Stream
              of: Telo.Bytes
      contentType:
        type: string
        description: MIME type of the content. Defaults to application/octet-stream.
      contentEncoding:
        type: string
        enum: [utf8, base64]
        description: How a STRING content is interpreted — utf8 text (default) or base64-encoded bytes.
      contentRange:
        type: string
        description: "Content-Range for a chunk, e.g. \"bytes 0-262143/1048576\", or \"bytes */1048576\" to query progress."
      contentLength:
        type: integer
        description: Explicit Content-Length in bytes; required when `content` is a stream.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status:
        type: integer
        description: 200/201 when the upload completed, 308 when more chunks are expected.
      headers:
        type: object
        additionalProperties: { type: string }
        description: Response headers; on 308, `range` names the bytes received so far.
      body:
        description: Parsed JSON File resource once complete; empty on 308.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
    success: [200, 201, 308]
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: PUT
  url: !cel "inputs.uploadUri"
  body: !cel "inputs.?contentEncoding.orValue('utf8') == 'base64' ? bytesFromBase64(inputs.content) : inputs.content"
  headers: !cel >-
    has(inputs.contentRange)
      ? (inputs.?contentLength.orValue(0) > 0
          ? {'Content-Type': inputs.?contentType.orValue('application/octet-stream'),
             'Content-Range': inputs.contentRange,
             'Content-Length': string(inputs.contentLength)}
          : {'Content-Type': inputs.?contentType.orValue('application/octet-stream'),
             'Content-Range': inputs.contentRange})
      : (inputs.?contentLength.orValue(0) > 0
          ? {'Content-Type': inputs.?contentType.orValue('application/octet-stream'),
             'Content-Length': string(inputs.contentLength)}
          : {'Content-Type': inputs.?contentType.orValue('application/octet-stream')})
---
# Start a resumable session and send the whole content in one go — the
# recommended path for any file over 5 MB and the robust one for any size
# (Google's own clients default to it). Returns the final PUT response plus the
# session URI, so a caller that hits a transient failure can resume by querying
# the session with UploadResumableContent instead of starting over.
kind: Telo.Definition
metadata:
  name: UploadFileResumable
  description: Upload a file of any size via a resumable session (start + single PUT).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the requests against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [content]
    properties:
      fileId:
        type: string
        description: When set, replaces this file's content instead of creating a new file.
      metadata:
        type: object
        additionalProperties: true
        description: "File resource for the new file (or fields to change), e.g. { name, parents }. Defaults to {}."
      content:
        description: The file content — a string, raw bytes, or a byte stream.
        anyOf:
          - type: string
          - x-telo-type: Telo.Bytes
          - x-telo-type:
              name: Telo.Stream
              of: Telo.Bytes
      contentType:
        type: string
        description: MIME type of the content. Defaults to application/octet-stream.
      contentEncoding:
        type: string
        enum: [utf8, base64]
        description: How a STRING content is interpreted — utf8 text (default) or base64-encoded bytes.
      contentLength:
        type: integer
        description: Total size in bytes; required when `content` is a stream, advisory otherwise.
      addParents:
        type: string
        description: With fileId — comma-separated parent ids to add.
      removeParents:
        type: string
        description: With fileId — comma-separated parent ids to remove.
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      ignoreDefaultVisibility:
        type: boolean
        description: Ignore the domain's default visibility settings (create only).
      keepRevisionForever:
        type: boolean
        description: Pin the new head revision (binary files only).
      ocrLanguage:
        type: string
        description: ISO 639-1 language hint for OCR during image import.
      useContentAsIndexableText:
        type: boolean
        description: Use the uploaded content as indexable text.
      fields:
        type: string
        description: Field mask for the returned File resource.
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim to the session request.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body, uploadUri]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON File resource of the uploaded file.
      uploadUri:
        type: string
        description: The resumable session URI, for resuming after a failure.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-start'"
    client: !cel "self.client"
    throwOnHttpError: true
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-put'"
    client: !cel "self.client"
    throwOnHttpError: true
    success: [200, 201, 308]
  - kind: Run.Sequence
    metadata:
      name: !cel "self.name + '-seq'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required: [content]
        properties:
          fileId: { type: string }
          metadata: { type: object, additionalProperties: true }
          content: {}
          contentType: { type: string }
          contentEncoding: { type: string }
          contentLength: { type: integer }
          addParents: { type: string }
          removeParents: { type: string }
          supportsAllDrives: { type: boolean }
          ignoreDefaultVisibility: { type: boolean }
          keepRevisionForever: { type: boolean }
          ocrLanguage: { type: string }
          useContentAsIndexableText: { type: boolean }
          fields: { type: string }
          params: { type: object, additionalProperties: { type: string } }
    steps:
      - name: start
        invoke:
          kind: Http.Request
          name: !cel "self.name + '-start'"
        inputs:
          method: !cel "inputs.?fileId.orValue('') != '' ? 'PATCH' : 'POST'"
          body: !cel "inputs.?metadata.orValue({})"
          headers: !cel >-
            inputs.?contentLength.orValue(0) > 0
              ? {'X-Upload-Content-Type': inputs.?contentType.orValue('application/octet-stream'),
                 'X-Upload-Content-Length': string(inputs.contentLength)}
              : {'X-Upload-Content-Type': inputs.?contentType.orValue('application/octet-stream')}
          url: !cel >-
            trimSuffix(trimSuffix(
              '/upload/drive/v3/files' + (inputs.?fileId.orValue('') != '' ? '/' + urlEncode(inputs.fileId) : '')
                + '?uploadType=resumable&' + join([
                {'k': 'addParents', 'v': inputs.?addParents.orValue('')},
                {'k': 'removeParents', 'v': inputs.?removeParents.orValue('')},
                {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
                {'k': 'ignoreDefaultVisibility', 'v': inputs.?ignoreDefaultVisibility.orValue(false) ? 'true' : ''},
                {'k': 'keepRevisionForever', 'v': inputs.?keepRevisionForever.orValue(false) ? 'true' : ''},
                {'k': 'ocrLanguage', 'v': inputs.?ocrLanguage.orValue('')},
                {'k': 'useContentAsIndexableText', 'v': inputs.?useContentAsIndexableText.orValue(false) ? 'true' : ''},
                {'k': 'fields', 'v': inputs.?fields.orValue('')}
              ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
                + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
            , '&'), '?')
      - name: put
        invoke:
          kind: Http.Request
          name: !cel "self.name + '-put'"
        inputs:
          method: PUT
          url: !cel "steps.start.result.headers.location"
          body: !cel "inputs.?contentEncoding.orValue('utf8') == 'base64' ? bytesFromBase64(inputs.content) : inputs.content"
          headers: !cel >-
            inputs.?contentLength.orValue(0) > 0
              ? {'Content-Type': inputs.?contentType.orValue('application/octet-stream'),
                 'Content-Length': string(inputs.contentLength)}
              : {'Content-Type': inputs.?contentType.orValue('application/octet-stream')}
    outputs:
      status: !cel "steps.put.result.status"
      headers: !cel "steps.put.result.headers"
      body: !cel "steps.put.result.body"
      uploadUri: !cel "steps.start.result.headers.location"
invoke:
  kind: Run.Sequence
  name: !cel "self.name + '-seq'"
inputs:
  fileId: !cel "inputs.?fileId.orValue('')"
  metadata: !cel "inputs.?metadata.orValue({})"
  content: !cel "inputs.content"
  contentType: !cel "inputs.?contentType.orValue('application/octet-stream')"
  contentEncoding: !cel "inputs.?contentEncoding.orValue('utf8')"
  contentLength: !cel "inputs.?contentLength.orValue(0)"
  addParents: !cel "inputs.?addParents.orValue('')"
  removeParents: !cel "inputs.?removeParents.orValue('')"
  supportsAllDrives: !cel "inputs.?supportsAllDrives.orValue(true)"
  ignoreDefaultVisibility: !cel "inputs.?ignoreDefaultVisibility.orValue(false)"
  keepRevisionForever: !cel "inputs.?keepRevisionForever.orValue(false)"
  ocrLanguage: !cel "inputs.?ocrLanguage.orValue('')"
  useContentAsIndexableText: !cel "inputs.?useContentAsIndexableText.orValue(false)"
  fields: !cel "inputs.?fields.orValue('')"
  params: !cel "inputs.?params.orValue({})"
---
# GET /drive/v3/files/{fileId}/permissions — list who has access to a file or
# shared drive.
kind: Telo.Definition
metadata:
  name: ListPermissions
  description: List a file's or shared drive's permissions (GET /drive/v3/files/{fileId}/permissions).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GoogleDriveClient / GoogleDriveOAuthClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [fileId]
    properties:
      fileId:
        type: string
        description: The file or shared drive id.
      pageSize:
        type: integer
        description: Maximum permissions per page.
      pageToken:
        type: string
        description: nextPageToken from the previous page.
      fields:
        type: string
        description: "Field mask, e.g. \"permissions(id,role,type,emailAddress)\"."
      supportsAllDrives:
        type: boolean
        description: Whether the caller supports shared drives. Defaults to true.
      useDomainAdminAccess:
        type: boolean
        description: Issue the request as a domain administrator.
      includePermissionsForView:
        type: string
        description: "Extra permissions to include (only 'published')."
      params:
        type: object
        additionalProperties: { type: string }
        description: Extra query parameters appended verbatim.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON PermissionList — { permissions, nextPageToken? }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(trimSuffix(
      '/drive/v3/files/' + urlEncode(inputs.fileId) + '/permissions?' + join([
        {'k': 'pageSize', 'v': has(inputs.pageSize) ? string(inputs.pageSize) : ''},
        {'k': 'pageToken', 'v': inputs.?pageToken.orValue('')},
        {'k': 'fields', 'v': inputs.?fields.orValue('')},
        {'k': 'supportsAllDrives', 'v': string(inputs.?supportsAllDrives.orValue(true))},
        {'k': 'useDomainAdminAccess', 'v': has(inputs.useDomainAdminAccess) ? string(inputs.useDomainAdminAccess) : ''},
        {'k': 'includePermissionsForView', 'v': inputs.?includePermissionsForView.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '&'), '?')
---
# GET /drive/v3/files/{fileId}/permissions/{permissionId} — read one permission.
kind: Telo.Definition
metadata:
  name: GetPermission
