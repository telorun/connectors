# Collects a byte stream into text — used to read a streamed download back.
kind: Ptc.Decoder
metadata: { name: collect }
---
kind: Multipart.Decoder
metadata: { name: mpDecode }
---
# Generic echo handler: returns the request context it is fed, so a route can
# reflect what the operation actually sent back into the response body.
kind: Run.Value
metadata: { name: echo }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      path: {}
      method: {}
      query: {}
      body: {}
      headers: {}
value:
  contentType: !cel "inputs.?headers.orValue({})[?'content-type'].orValue('')"
  media: !cel "inputs.?query.orValue({}).?alt.orValue('') == 'media' || inputs.?path.orValue('').split('?')[0].endsWith('/export')"
  path: !cel "inputs.?path.orValue('').split('?')[0]"
  range: !cel "inputs.?headers.orValue({}).?range.orValue('')"
  location: !cel "variables.uploadBaseUrl + '/resumable/session-1'"
  received:
    method: !cel "inputs.?method.orValue('')"
    path: !cel "inputs.?path.orValue('').split('?')[0]"
    query: !cel "inputs.?query.orValue({})"
    body: !cel "inputs.?body.orValue({})"
    auth: !cel "inputs.?headers.orValue({}).?authorization.orValue('')"
    uploadContentType: !cel "inputs.?headers.orValue({})[?'x-upload-content-type'].orValue('')"
    uploadContentLength: !cel "inputs.?headers.orValue({})[?'x-upload-content-length'].orValue('')"
---
# Multipart upload handler: splits the multipart/related body the operation
# framed back into its metadata + content parts.
kind: Run.Sequence
metadata: { name: multipartUpload }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      path: {}
      method: {}
      query: {}
      headers: {}
      body: {}
steps:
  - name: decode
    invoke: !ref mpDecode
    inputs:
      input: !cel "inputs.body"
      contentType: !cel "inputs.headers['content-type']"
outputs:
  received:
    method: !cel "inputs.method"
    path: !cel "inputs.path.split('?')[0]"
    query: !cel "inputs.query"
    auth: !cel "inputs.headers.authorization"
  framing: !cel "inputs.headers['content-type'].split(';')[0]"
  metadata: !cel "parseJson(string(steps.decode.result.parts[0].content))"
  metadataContentType: !cel "steps.decode.result.parts[0].contentType"
  content: !cel "string(steps.decode.result.parts[1].content)"
  contentType: !cel "steps.decode.result.parts[1].contentType"
---
# Resumable PUT handler: collects the streamed bytes and reports the upload
# headers; `partial` selects the 308 response.
kind: Run.Sequence
metadata: { name: resumablePut }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      path: {}
      method: {}
      headers: {}
      body: {}
steps:
  - name: collect
    invoke: !ref collect
    inputs:
      input: !cel "inputs.body"
outputs:
  partial: !cel "inputs.headers[?'content-range'].orValue('') != ''"
  received:
    method: !cel "inputs.method"
    path: !cel "inputs.path.split('?')[0]"
    auth: !cel "inputs.headers.authorization"
    contentType: !cel "inputs.headers['content-type']"
    contentRange: !cel "inputs.headers[?'content-range'].orValue('')"
    contentLength: !cel "inputs.headers[?'content-length'].orValue('')"
    content: !cel "steps.collect.result.text"
---
# Stub Google Drive REST surface. Metadata routes are matched by path depth and
# echo the request; a GET with alt=media (or /export) answers with bytes.
kind: Server.Api
metadata: { name: stubApi }
routes:
  - request: { method: GET, path: /drive/v3/:a }
    inputs:
      path: !cel "request.path"
      method: !cel "request.method"
      query: !cel "request.query"
      headers: !cel "request.headers"
    handler: !ref echo
    returns:
      - status: 200
        content:
          application/json:
            body:
              id: stub-id
              received: !cel "result.received"
  - request: { method: POST, path: /drive/v3/:a }
    inputs:
      path: !cel "request.path"
      method: !cel "request.method"
      query: !cel "request.query"
      body: !cel "request.?body.orValue({})"
      headers: !cel "request.headers"
    handler: !ref echo
    returns:
      - status: 200
        content:
          application/json:
            body:
              id: stub-id
              received: !cel "result.received"
  - request: { method: GET, path: /drive/v3/:a/:b }
    inputs:
      path: !cel "request.path"
      method: !cel "request.method"
      query: !cel "request.query"
      headers: !cel "request.headers"
    handler: !ref echo
    returns:
      - status: 200
        when: !cel "result.media"
        content:
          application/octet-stream:
            body: !cel "'bytes-of:' + result.path + ':' + result.range"
      - status: 200
