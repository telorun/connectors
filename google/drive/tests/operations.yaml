        framing: multipart/related
        metadata: { name: hello.txt }
        metadataContentType: "application/json; charset=UTF-8"
        content: hello world
        contentType: text/plain
  - name: uploadFileBase64
    invoke: !ref uploadFile
    inputs: { metadata: { name: b.bin }, content: "YmluYXJ5IQ==", contentEncoding: base64 }
  - name: assertUploadFileBase64
    invoke: !ref Assert.equals
