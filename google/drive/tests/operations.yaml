kind: Telo.Application
metadata:
  name: GoogleDriveOperationsTest
  version: 1.0.0
# Exercises every Google Drive operation end-to-end against a stub HTTP server
# that echoes back the request each operation built (method, path, query, body,
# auth header) plus canned Drive-shaped responses. Uploads are exercised for
# real: the multipart route decodes the multipart/related body the operation
# framed, and the resumable routes stream the raw bytes back. This verifies:
# the GoogleDriveClient bakes the Bearer token (static or via an
# Http.Credential) + base URL, each operation builds the right method / path /
# query / headers, bodies are shaped correctly, binary downloads come back as
# bytes or a stream, and 308 Resume Incomplete is returned rather than thrown.
imports:
  Gd: ../
  Http: oci://ghcr.io/telorun/http-client@0.22.0#sha256-UyC8nQDnKHXyPpPPHC7TS8MicesLsgDUKWBYObf5oQ4
  Multipart: oci://ghcr.io/telorun/multipart@0.2.2#sha256-RCqiT4UMwrVeRq1hU1xxkysRSxX4NC5DzsdrbbEBxv8
  Ptc: oci://ghcr.io/telorun/plain-text-codec@0.10.4#sha256-Z1My-TDPdE13s63NSi5rT0Qg0CZf-7tAXbJBRcBGCOQ
  Server: oci://ghcr.io/telorun/http-server@0.29.2#sha256-9MtWZqXF9agsYRx97nLMJZW7YYwXpW2dLYcn_oA4kUs
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
  Assert: oci://ghcr.io/telorun/assert@0.18.0#sha256-mSy7HGMq_UoQUvt4WbQCIO_uqXcRZwRlmROp6DfLDjY
ports:
  http:
    env: TEST_PORT
    default: 34824
  httpUpload:
    env: TEST_UPLOAD_PORT
    default: 34825
variables:
  baseUrl:
    env: TEST_BASE_URL
    type: string
    default: http://localhost:34824
  uploadBaseUrl:
    env: TEST_UPLOAD_BASE_URL
    type: string
    default: http://localhost:34825
targets:
  - !ref testOperations
---
# The friendly client with a static token, pointed at the local stub. Every
# request carries `Authorization: Bearer test-token`.
kind: Gd.GoogleDriveClient
metadata: { name: stub }
accessToken: test-token
baseUrl: !cel "variables.baseUrl"
---
# The same client authenticated through an Http.Credential instead — the shape
# a refreshing OAuth credential plugs into.
kind: Http.BearerToken
metadata: { name: credToken }
token: cred-token
---
kind: Gd.GoogleDriveOAuthClient
metadata: { name: stubCred }
credential: !ref credToken
baseUrl: !cel "variables.baseUrl"
---
# Resumable uploads live on a second stub server: Google serves the multipart
# and resumable POSTs on ONE path, distinguished only by `uploadType`, and a
# router cannot register two handlers for the same method and path.
kind: Gd.GoogleDriveClient
metadata: { name: stubUpload }
accessToken: test-token
baseUrl: !cel "variables.uploadBaseUrl"
