      actual: !cel "steps.getFile.result.body.received"
      expected: {"method": "GET", "path": "/drive/v3/files/f1", "query": {"fields": "*", "acknowledgeAbuse": "false", "supportsAllDrives": "true"}, "body": {}, "auth": "Bearer test-token", "uploadContentType": "", "uploadContentLength": ""}
  - name: downloadFile
    invoke: !ref downloadFile
    inputs: {"fileId": "f1", "range": "bytes=0-3"}
  - name: assertDownloadFileX0
    invoke: !ref Assert.equals
    inputs:
      actual: !cel "steps.downloadFile.result.status"
      expected: 200
  - name: assertDownloadFileX1
    invoke: !ref Assert.equals
    inputs:
      actual: !cel "string(steps.downloadFile.result.body)"
      expected: "bytes-of:/drive/v3/files/f1:bytes=0-3"
  - name: downloadFileStream
    invoke: !ref downloadFile
    inputs: { fileId: f2, responseType: stream }
  - name: collectDownload
    invoke: !ref collect
