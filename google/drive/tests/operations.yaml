# The resumable-upload stub, served on its own port.
kind: Server.Api
metadata: { name: uploadApi }
routes:
  # Resumable session start (JSON body), answered with the session URI in Location.
  - request: { method: POST, path: /upload/drive/v3/files }
    inputs:
      path: !cel "request.path"
      method: !cel "request.method"
      query: !cel "request.query"
      body: !cel "request.body"
      headers: !cel "request.headers"
    handler: !ref echo
    returns:
      - status: 200
        headers:
          Location: !cel "result.location"
        content:
          application/json:
            body:
              received: !cel "result.received"
  - request: { method: PATCH, path: /upload/drive/v3/files/:id }
    inputs:
      path: !cel "request.path"
      method: !cel "request.method"
      query: !cel "request.query"
      body: !cel "request.body"
      headers: !cel "request.headers"
    handler: !ref echo
    returns:
      - status: 200
        headers:
          Location: !cel "result.location"
        content:
          application/json:
            body:
              received: !cel "result.received"
  # Resumable content PUT (streamed raw body): 308 for a chunk, 200 for all.
  - request:
      method: PUT
      path: /resumable/:session
      schema:
        body: { x-telo-type: Telo.Stream }
    inputs:
      path: !cel "request.path"
      method: !cel "request.method"
      headers: !cel "request.headers"
      body: !cel "request.body"
    handler: !ref resumablePut
    returns:
      - status: 308
        when: !cel "result.partial"
        headers:
          Range: bytes=0-4
        content:
          application/json:
            body:
              received: !cel "result.received"
      - status: 200
        content:
          application/json:
            body:
              id: uploaded-1
              received: !cel "result.received"
---
kind: Run.Sequence
metadata: { name: testOperations }
# The stub server is declared inline in the sequence scope so it starts before
# the steps and is torn down when they finish.
with:
  - kind: Server.Server
    metadata: { name: StubServer }
    port: !cel "ports.http"
    contentTypeParsers:
      - { contentType: multipart/related, stream: true }
      - { contentType: application/x-www-form-urlencoded, stream: true }
    mounts:
      - path: /
        mount: !ref stubApi
  - kind: Server.Server
    metadata: { name: UploadServer }
    port: !cel "ports.httpUpload"
    contentTypeParsers:
      - { contentType: application/octet-stream, stream: true }
      - { contentType: application/zip, stream: true }
    mounts:
      - path: /
        mount: !ref uploadApi
targets:
  - !ref StubServer
  - !ref UploadServer
steps:
  - name: listFiles
    invoke: !ref listFiles
    inputs: {"q": "name = 'x'", "pageSize": 10, "orderBy": "name", "fields": "files(id)", "includeItemsFromAllDrives": true, "params": {"foo": "bar"}}
  - name: assertListFiles
    invoke: !ref Assert.equals
    inputs:
      actual: !cel "steps.listFiles.result.body.received"
      expected: {"method": "GET", "path": "/drive/v3/files", "query": {"q": "name = 'x'", "pageSize": "10", "orderBy": "name", "fields": "files(id)", "includeItemsFromAllDrives": "true", "foo": "bar", "supportsAllDrives": "true"}, "body": {}, "auth": "Bearer test-token", "uploadContentType": "", "uploadContentLength": ""}
  - name: getFile
    invoke: !ref getFile
    inputs: {"fileId": "f1", "fields": "*", "acknowledgeAbuse": false}
  - name: assertGetFile
