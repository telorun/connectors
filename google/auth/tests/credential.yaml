kind: Telo.Application
metadata:
  name: GoogleAuthCredentialTest
  version: 1.0.0
# GoogleTokenSource must (a) stand in for OAuth.TokenSource at every slot that
# wants one, and (b) actually resolve its internal server+registration at
# runtime. Both are exercised: the grant is SEEDED through the same source that
# the credential later refreshes from — one config point, no duplication.
imports:
  GoogleAuth: ../
  OAuth: oci://ghcr.io/telorun/oauth-client@0.8.0#sha256-wREbvf_KoYtM7gJYN8nA5WmYuC9iN7aibaklxQVt3to
  Mem: oci://ghcr.io/telorun/kv-store-memory@0.7.0#sha256-i1Nen64mCl25XONkoBGRqiTptxBSBA8zBcW6om9autg
  Http: oci://ghcr.io/telorun/http-client@0.22.0#sha256-UyC8nQDnKHXyPpPPHC7TS8MicesLsgDUKWBYObf5oQ4
  Server: oci://ghcr.io/telorun/http-server@0.29.2#sha256-9MtWZqXF9agsYRx97nLMJZW7YYwXpW2dLYcn_oA4kUs
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
  Assert: oci://ghcr.io/telorun/assert@0.18.0#sha256-mSy7HGMq_UoQUvt4WbQCIO_uqXcRZwRlmROp6DfLDjY
ports:
  http:
    env: TEST_GOOGLE_AUTH_CREDENTIAL_PORT
    default: 34843
targets: [!ref test]
---
kind: Mem.Store
metadata: { name: store }
---
# ONE configuration point.
kind: GoogleAuth.GoogleAuthServer
metadata: { name: goog }
issuer: !cel "'http://localhost:' + string(dyn(ports.http))"
---
kind: GoogleAuth.GoogleAuthClient
metadata: { name: app }
authorizationServer: !ref goog
clientId: cid
clientSecret: csecret
scopes: ["https://www.googleapis.com/auth/drive"]
---
kind: GoogleAuth.GoogleTokenSource
metadata: { name: tokens }
client: !ref app
store: !ref store
---
kind: GoogleAuth.GoogleCredential
metadata: { name: cred }
source: !ref tokens
---
kind: GoogleAuth.GoogleClient
metadata: { name: api }
baseUrl: !cel "'http://localhost:' + string(dyn(ports.http))"
credential: !ref cred
---
kind: Http.Request
metadata: { name: call }
client: !ref api
inputs: { url: /resource, method: GET }
---
# Grant management against the SAME source — this is the thing the previous
# design could not reach.
kind: OAuth.GrantWrite
metadata: { name: seed }
source: !ref tokens
---
kind: OAuth.GrantRead
metadata: { name: readGrant }
source: !ref tokens
---
kind: Run.Value
metadata: { name: echo }
inputType: { kind: Telo.JsonSchema, schema: { type: object, properties: { h: {} } } }
value: { auth: !cel "inputs.?h.orValue({}).?authorization.orValue('<none>')" }
---
kind: Server.Api
metadata: { name: stub }
routes:
  - request: { method: GET, path: /.well-known/openid-configuration }
    inputs: { h: !cel "request.headers" }
    handler: !ref echo
    returns:
      - status: 200
        content:
          application/json:
            body:
              issuer: !cel "'http://localhost:' + string(dyn(ports.http))"
              authorization_endpoint: !cel "'http://localhost:' + string(dyn(ports.http)) + '/auth'"
              token_endpoint: !cel "'http://localhost:' + string(dyn(ports.http)) + '/token'"
  - request: { method: POST, path: /token }
    inputs: { h: !cel "request.headers" }
    handler: !ref echo
    returns:
      - status: 200
        content:
          application/json:
            body: { access_token: refreshed-access-token, token_type: Bearer, expires_in: 3600 }
  - request: { method: GET, path: /resource }
    inputs: { h: !cel "request.headers" }
    handler: !ref echo
    returns:
      - status: 200
        content: { application/json: { body: { auth: !cel "result.auth" } } }
---
kind: Run.Sequence
metadata: { name: test }
with:
  - kind: Server.Server
    metadata: { name: s }
    port: !cel "ports.http"
    contentTypeParsers:
      - { contentType: application/x-www-form-urlencoded, stream: true }
    mounts: [{ path: /, mount: !ref stub }]
targets: [!ref s]
steps:
  - name: seed
    invoke: !ref seed
    inputs:
      tokens: { accessToken: stale, refreshToken: rtok, expiresAt: 1000, scope: "https://www.googleapis.com/auth/drive" }
  - name: readGrant
    invoke: !ref readGrant
    inputs: {}
  - name: assertGrantVisible
    invoke: !ref Assert.equals
    inputs:
      actual: !cel "steps.readGrant.result.exists"
      expected: true
  - name: call
    invoke: !ref call
    inputs: {}
  - name: assertRefreshed
    invoke: !ref Assert.equals
    inputs:
      actual: !cel "steps.call.result.body.auth"
      expected: Bearer refreshed-access-token
