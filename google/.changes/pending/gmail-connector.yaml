modules:
  gmail: Added
body: "New `google/gmail` connector: a `GmailClient` specializing the shared `google/auth` client (static access token or a refreshing `Http.Credential`, retry with backoff) plus typed operations over the whole Gmail API v1 surface — messages (list, get, send, insert, import, modify, batch modify/delete, trash, attachments), threads, labels, drafts, history, and every settings resource including delegates, filters, forwarding addresses, send-as, S/MIME and client-side encryption. Media-upload variants raise the 5 MB JSON ceiling to Gmail's 35 MB message limit. `BuildRawMessage` and `SendEmail` compose an RFC 2822 message (plain text, HTML, attachments, inline images) from friendly fields; `DecodeMessageBody`, `DecodeBase64Url` and `EncodeBase64Url` read one back. The composer refuses to be used as a header-injection primitive — CR/LF in any address, extra header, `contentType` or `contentId` is collapsed the way RFC 5322 unfolds a folded value, an ASCII attachment filename is escaped for the quoted-string it sits in, and `text`/`html` line breaks are canonicalized to CRLF as RFC 2046 requires of an encoded text entity. Auth comes from the shared `google/auth` module and is re-exported, so a consumer imports `google/gmail` alone."
