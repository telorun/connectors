kind: Telo.Library
metadata:
  name: Gmail
  version: 0.0.0
  description: >-
    Typed Gmail (API v1) operations for Telo manifests. A friendly Http.Client
    (GmailClient) specializing the shared google/auth client — authenticated by
    a static OAuth2 access token or a refreshing Http.Credential — plus
    Invocable operations covering the whole REST surface: messages (list, get,
    send, insert, import, modify, batch modify/delete, trash, attachments),
    threads, labels, drafts, history, and every settings resource —
    auto-forwarding, IMAP, POP, vacation, language, delegates, filters,
    forwarding addresses, send-as, S/MIME and client-side encryption.
    Media-upload variants raise the 5 MB JSON ceiling to Gmail's 35 MB message
    limit. BuildRawMessage and SendEmail compose an RFC 2822 message — plain
    text, HTML, attachments, inline images — from friendly fields;
    DecodeMessageBody reads one back. Built on the google/auth, http-client,
    multipart and run modules — no controller code.
  repository: https://github.com/telorun/connectors
  license: MIT
imports:
  GoogleAuth: ../auth
  Http: oci://ghcr.io/telorun/http-client@0.22.0#sha256-UyC8nQDnKHXyPpPPHC7TS8MicesLsgDUKWBYObf5oQ4
  Multipart: oci://ghcr.io/telorun/multipart@0.2.2#sha256-RCqiT4UMwrVeRq1hU1xxkysRSxX4NC5DzsdrbbEBxv8
  Run: oci://ghcr.io/telorun/run@0.26.0#sha256-ZhW56yiMCImqBh0wJ4mVaUvh5WuUVIaWErASFx--wCY
exports:
  kinds:
    - GmailClient
    # Auth, re-exported from google/auth so a consumer imports this connector
    # alone. `<Alias>.<Kind>` in `exports.kinds` re-exports an imported kind
    # under THIS module's prefix — no local subtype needed. A bare name here
    # would name nothing.
    - GoogleAuth.GoogleAuthServer
    - GoogleAuth.GoogleAuthClient
    - GoogleAuth.GoogleTokenSource
    - GoogleAuth.GoogleCredential
    - GoogleAuth.RefreshAccessToken
    # Mailbox
    - GetProfile
    - WatchMailbox
    - StopMailbox
    # Messages
    - ListMessages
    - GetMessage
    - SendMessage
    - InsertMessage
    - ImportMessage
    - DeleteMessage
    - BatchDeleteMessages
    - ModifyMessage
    - BatchModifyMessages
    - TrashMessage
    - UntrashMessage
    - GetAttachment
    # Threads
    - ListThreads
    - GetThread
    - DeleteThread
    - ModifyThread
    - TrashThread
    - UntrashThread
    # Labels
    - ListLabels
    - GetLabel
    - CreateLabel
    - UpdateLabel
    - PatchLabel
    - DeleteLabel
    # Drafts
    - ListDrafts
    - GetDraft
    - CreateDraft
    - UpdateDraft
    - SendDraft
    - DeleteDraft
    # History
    - ListHistory
    # Settings
    - GetAutoForwarding
    - UpdateAutoForwarding
    - GetImap
    - UpdateImap
    - GetPop
    - UpdatePop
    - GetVacation
    - UpdateVacation
    - GetLanguage
    - UpdateLanguage
    # Settings — delegates
    - ListDelegates
    - GetDelegate
    - CreateDelegate
    - DeleteDelegate
    # Settings — filters
    - ListFilters
    - GetFilter
    - CreateFilter
    - DeleteFilter
    # Settings — forwarding addresses
    - ListForwardingAddresses
    - GetForwardingAddress
    - CreateForwardingAddress
    - DeleteForwardingAddress
    # Settings — send-as
    - ListSendAs
    - GetSendAs
    - CreateSendAs
    - UpdateSendAs
    - PatchSendAs
    - DeleteSendAs
    - VerifySendAs
    # Settings — S/MIME
    - ListSmimeInfo
    - GetSmimeInfo
    - InsertSmimeInfo
    - SetDefaultSmimeInfo
    - DeleteSmimeInfo
    # Settings — client-side encryption
    - ListCseIdentities
    - GetCseIdentity
    - CreateCseIdentity
    - PatchCseIdentity
    - DeleteCseIdentity
    - ListCseKeyPairs
    - GetCseKeyPair
    - CreateCseKeyPair
    - EnableCseKeyPair
    - DisableCseKeyPair
    - ObliterateCseKeyPair
    # Media uploads (≤35 MB)
    - SendMessageUpload
    - InsertMessageUpload
    - ImportMessageUpload
    - CreateDraftUpload
    - UpdateDraftUpload
    - SendDraftUpload
    # Composing, reading and encoding
    - BuildRawMessage
    - SendEmail
    - DecodeMessageBody
    - DecodeBase64Url
    - EncodeBase64Url
---
# The service client. It specializes GoogleAuth.GoogleClient — which is where
# the Bearer header, the credential handling, the timeout and Google's retry
# curve live — and adds the one thing that is Gmail's: the API host. It is still
# an Http.Client at runtime, so it drops into any `x-telo-ref: Http.Client`
# slot, and so does anything that extends it.
#
# Authenticate it one of two ways, and exactly one:
#
#   accessToken — a bare OAuth2 access token. Google's expire about an hour
#                 after issue; GoogleAuth.RefreshAccessToken mints a new one.
#                 Right for a script or a short-lived run.
#   credential  — any Http.Credential: Http.BearerToken for a fixed token, or a
#                 refreshing credential that re-acquires before expiry and again
#                 after a 401. Right for a long-lived process.
#
# `oneOf` makes supplying neither, or both, a `telo check` error rather than a
# 401 from Google at runtime.
#
# `timeout` and `retryAttempts` are forwarded rather than defaulted here: an
# absent optional stays absent through `base:`, so GoogleAuth's defaults apply
# and the numbers live in exactly one place.
#
# Both the API surface (`/gmail/v1`) and the media-upload surface
# (`/upload/gmail/v1`) hang off the same origin, so the host alone is enough.
kind: Telo.Definition
metadata:
  name: GmailClient
  description: >-
    Preconfigured Gmail Http.Client — a static OAuth2 access token or an
    Http.Credential, baseUrl https://gmail.googleapis.com, retry with backoff.
extends: GoogleAuth.GoogleClient
schema:
  type: object
  oneOf:
    - required: [accessToken]
    - required: [credential]
  properties:
    accessToken:
      type: string
      x-telo-eval: compile
      description: >-
        OAuth2 access token (the bare token, no "Bearer " prefix). Sent as
        `Authorization: Bearer <accessToken>` on every request. Mutually
        exclusive with `credential`.
    credential:
      x-telo-ref:
        kind: Http.Credential
        use: call
      description: >-
        The credential consulted on every request, re-consulted with
        forceRefresh and the request retried once on a 401. Mutually exclusive
        with `accessToken`.
    baseUrl:
      type: string
      x-telo-eval: compile
      description: >-
        Override the API origin (no trailing slash). Defaults to
        https://gmail.googleapis.com. Point it at a proxy or a stub server for
        testing.
    timeout:
      type: integer
      minimum: 1
      description: Per-request timeout in milliseconds. Defaults to 60000.
    retryAttempts:
      type: integer
      minimum: 0
      description: >-
        Re-attempts after the first try for retryable failures (network errors,
        408, 429, 5xx). Defaults to 3; 0 disables retrying.
base:
  baseUrl: !cel "self.?baseUrl.orValue('https://gmail.googleapis.com')"
  accessToken: !cel "self.accessToken"
  credential: !cel "self.credential"
  timeout: !cel "self.timeout"
  retryAttempts: !cel "self.retryAttempts"
---
# GET /gmail/v1/users/{userId}/profile — the mailbox's address, message and
# thread totals, and the historyId to start a ListHistory poll from.
kind: Telo.Definition
metadata:
  name: GetProfile
  description: >-
    Read the mailbox profile: address, totals and current historyId.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: >-
          Parsed JSON Profile — { emailAddress, messagesTotal, threadsTotal, historyId }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/profile?' + join(
        keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# POST /gmail/v1/users/{userId}/watch — subscribe the mailbox to a Cloud
# Pub/Sub topic so Gmail pushes a notification on every change. The
# subscription lapses after 7 days: renew it (call this again) at least
# daily. `topicName` is the full resource name and the Gmail service
# account must already hold Publish on it.
kind: Telo.Definition
metadata:
  name: WatchMailbox
  description: Subscribe the mailbox to Cloud Pub/Sub push notifications.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [topicName]
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      topicName:
        type: string
        description: Full Cloud Pub/Sub topic name, e.g. projects/my-project/topics/gmail-push.
      labelIds:
        type: array
        items: { type: string }
        description: Restrict notifications to these label ids. Omitted, every change is pushed.
      labelFilterBehavior:
        type: string
        enum: [include, exclude]
        description: >-
          Whether labelIds is an allow-list (include, the default) or a deny-list (exclude).
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: >-
          Parsed JSON WatchResponse — { historyId, expiration }. Store historyId as the
          starting point for ListHistory.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: POST
  body: !cel "has(inputs.labelFilterBehavior) ? {'topicName': inputs.topicName, 'labelIds': inputs.?labelIds.orValue([]), 'labelFilterBehavior': inputs.labelFilterBehavior} : {'topicName': inputs.topicName, 'labelIds': inputs.?labelIds.orValue([])}"
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/watch?' + join(
        keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# POST /gmail/v1/users/{userId}/stop — cancel the Pub/Sub subscription
# WatchMailbox opened. Answers 204 with no body.
kind: Telo.Definition
metadata:
  name: StopMailbox
  description: Stop pushing Pub/Sub notifications for the mailbox.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Empty (204 No Content).
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: POST
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/stop?' + join(
        keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# GET /gmail/v1/users/{userId}/messages — search the mailbox with the same
# query grammar as the Gmail search box ("from:a@b.com has:attachment
# newer_than:2d"). Returns id/threadId stubs only: follow each with
# GetMessage. Page with pageToken until nextPageToken is absent.
kind: Telo.Definition
metadata:
  name: ListMessages
  description: List or search messages with the Gmail search grammar (ids only).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      q:
        type: string
        description: >-
          Only return messages matching the specified query. Supports the same query format as
          the Gmail search box. For example, "from:someuser@example.com rfc822msgid:
          is:unread". Parameter cannot be used when accessing the api using the gmail.metadata
          scope.
      maxResults:
        type: integer
        description: >-
          Maximum number of messages to return. This field defaults to 100. The maximum
          allowed value for this field is 500.
      pageToken:
        type: string
        description: Page token to retrieve a specific page of results in the list.
      includeSpamTrash:
        type: boolean
        description: Include messages from SPAM and TRASH in the results.
      labelIds:
        type: array
        items: { type: string }
        description: >-
          Only return messages with labels that match all of the specified label IDs. Messages
          in a thread might have labels that other messages in the same thread don't have. To
          learn more, see Manage labels on messages and threads.
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: >-
          Parsed JSON ListMessagesResponse — { messages: [{ id, threadId }], nextPageToken,
          resultSizeEstimate }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/messages?' + join( [
        {'k': 'q', 'v': inputs.?q.orValue('')},
        {'k': 'maxResults', 'v': has(inputs.maxResults) ? string(inputs.maxResults) : ''},
        {'k': 'pageToken', 'v': inputs.?pageToken.orValue('')},
        {'k': 'includeSpamTrash', 'v': has(inputs.includeSpamTrash) ? string(inputs.includeSpamTrash) : ''}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + inputs.?labelIds.orValue([]).map(v, 'labelIds=' + urlEncode(v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# GET /gmail/v1/users/{userId}/messages/{id} — one message. `format`
# decides how much comes back: `full` (default) gives the parsed MIME
# payload tree with base64url part bodies, `raw` the whole RFC 2822
# message base64url-encoded, `metadata` headers only, `minimal` ids and
# labels only. DecodeMessageBody turns a `full` payload into readable text.
kind: Telo.Definition
metadata:
  name: GetMessage
  description: Read one message by id, in full, raw, metadata or minimal form.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [id]
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      id:
        type: string
        description: The message id.
      format:
        type: string
        enum: [minimal, full, raw, metadata]
        description: The format to return the message in.
      metadataHeaders:
        type: array
        items: { type: string }
        description: When given and format is METADATA, only include headers specified.
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: >-
          Parsed JSON Message — { id, threadId, labelIds, snippet, historyId, internalDate,
          payload | raw, sizeEstimate }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/messages/' +
        urlEncode(inputs.id) + '?' + join( [
        {'k': 'format', 'v': inputs.?format.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + inputs.?metadataHeaders.orValue([]).map(v, 'metadataHeaders=' + urlEncode(v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# POST /gmail/v1/users/{userId}/messages/send — send a message already
# framed as RFC 2822 and base64url-encoded in `message.raw`. BuildRawMessage
# produces that encoding from friendly fields, and SendEmail does both in
# one call. Total message size is capped at 5 MB on this JSON path — above
# that use SendMessageUpload.
#
# Replying into an existing thread needs all three of: `message.threadId`,
# matching `Subject`, and `In-Reply-To` / `References` headers naming the
# parent's Message-ID.
kind: Telo.Definition
metadata:
  name: SendMessage
  description: Send an RFC 2822 message supplied base64url-encoded as message.raw (≤5 MB).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [message]
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      message:
        type: object
        additionalProperties: true
        description: Message resource — { raw (base64url RFC 2822), threadId?, labelIds? }.
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON Message — the sent message's { id, threadId, labelIds }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: POST
  body: !cel "inputs.message"
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/messages/send?' + join(
        keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# POST /gmail/v1/users/{userId}/messages — put a message straight into the
# mailbox without sending it and without the usual scanning, classification
# or thread-matching. For migrating mail in; ImportMessage is the variant
# that runs Gmail's normal delivery processing.
kind: Telo.Definition
metadata:
  name: InsertMessage
  description: Insert a raw message into the mailbox, bypassing delivery scanning.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [message]
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      message:
        type: object
        additionalProperties: true
        description: Message resource — { raw (base64url RFC 2822), labelIds?, threadId? }.
      deleted:
        type: boolean
        description: >-
          Mark the email as permanently deleted (not TRASH) and only visible in Google Vault
          to a Vault administrator. Only used for Google Workspace accounts.
      internalDateSource:
        type: string
        enum: [receivedTime, dateHeader]
        description: Source for Gmail's internal date of the message.
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON Message — the inserted message.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: POST
  body: !cel "inputs.message"
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/messages?' + join( [
        {'k': 'deleted', 'v': has(inputs.deleted) ? string(inputs.deleted) : ''},
        {'k': 'internalDateSource', 'v': inputs.?internalDateSource.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
    , '?')
---
# POST /gmail/v1/users/{userId}/messages/import — import a message through
# Gmail's standard delivery path: spam classification, thread matching and
# filters all run, exactly as for received mail. Slower than InsertMessage;
# use it when the mailbox should treat the message as genuinely delivered.
kind: Telo.Definition
metadata:
  name: ImportMessage
  description: Import a raw message through Gmail's normal delivery processing.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
