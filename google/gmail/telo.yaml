# GET /gmail/v1/users/{userId}/history — everything that changed since
# `startHistoryId`: the incremental-sync feed, and what a Pub/Sub push
# notification tells you to read. Gmail keeps history for about a week; a
# 404 means the token is too old and a full re-sync is required. Store
# historyId from the response (or from GetProfile) for the next poll.
kind: Telo.Definition
metadata:
  name: ListHistory
  description: List mailbox changes since a historyId — the incremental sync feed.
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [startHistoryId]
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      startHistoryId:
        type: string
        description: >-
          Required. Returns history records after the specified startHistoryId. The supplied
          startHistoryId should be obtained from the historyId of a message, thread, or
          previous list response. History IDs increase chronologically but are not contiguous
          with random gaps in between valid IDs. Supplying an invalid or out of date
          startHistoryId typically returns an HTTP 404 error code. A historyId is typically
          valid for at least a week, but in some rare circumstances may be valid for only a
          few hours. If you receive an HTTP 404 error response, your application should
          perform a full sync. If you receive no nextPageToken in the response, there are no
          updates to retrieve and you can store the returned historyId for a future request.
      labelId:
        type: string
        description: Only return messages with a label matching the ID.
      maxResults:
        type: integer
        description: >-
          Maximum number of history records to return. This field defaults to 100. The maximum
          allowed value for this field is 500.
      pageToken:
        type: string
        description: Page token to retrieve a specific page of results in the list.
      historyTypes:
        type: array
        items: { type: string }
        description: >-
          History types to be returned by the function One of messageAdded, messageDeleted,
          labelAdded, labelRemoved.
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON ListHistoryResponse — { history, nextPageToken, historyId }.
resources:
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
invoke:
  kind: Http.Request
  name: !cel "self.name + '-req'"
inputs:
  method: GET
  url: !cel >-
    trimSuffix(
      '/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) + '/history?' + join( [
        {'k': 'startHistoryId', 'v': inputs.startHistoryId},
        {'k': 'labelId', 'v': inputs.?labelId.orValue('')},
        {'k': 'maxResults', 'v': has(inputs.maxResults) ? string(inputs.maxResults) : ''},
        {'k': 'pageToken', 'v': inputs.?pageToken.orValue('')}
      ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
        + inputs.?historyTypes.orValue([]).map(v, 'historyTypes=' + urlEncode(v))
        + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
