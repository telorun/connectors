      schema:
        type: object
        required: [content]
        properties:
          userId: { type: string }
          id: { type: string }
          draft: {}
          content: {}
          contentEncoding: { type: string }
          params: { type: object, additionalProperties: { type: string } }
    steps:
      - name: encode
        invoke:
          kind: Multipart.Encoder
          name: !cel "self.name + '-mp'"
        inputs:
          subtype: related
          parts:
            - content: !cel "json(inputs.?draft.orValue({}))"
              contentType: application/json; charset=UTF-8
            - content: !cel "inputs.?contentEncoding.orValue('utf8') == 'base64' ? bytesFromBase64(inputs.content) : inputs.content"
              contentType: message/rfc822
      - name: send
        invoke:
          kind: Http.Request
          name: !cel "self.name + '-req'"
        inputs:
          method: PUT
          headers:
            Content-Type: !cel "steps.encode.result.contentType"
          body: !cel "steps.encode.result.output"
          url: !cel >-
            trimSuffix(
              '/upload/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) +
                        '/drafts/' + urlEncode(inputs.id) + '?' + join( [
                {'k': 'uploadType', 'v': 'multipart'}
              ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
                + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
            , '?')
    outputs:
      status: !cel "steps.send.result.status"
      headers: !cel "steps.send.result.headers"
      body: !cel "steps.send.result.body"
invoke:
  kind: Run.Sequence
  name: !cel "self.name + '-seq'"
inputs:
  userId: !cel "inputs.?userId.orValue('me')"
  id: !cel "inputs.id"
  draft: !cel "inputs.?draft.orValue({})"
  content: !cel "inputs.content"
  contentEncoding: !cel "inputs.?contentEncoding.orValue('utf8')"
  params: !cel "inputs.?params.orValue({})"
---
# POST /upload/gmail/v1/users/{userId}/drafts/send?uploadType=multipart — the
# media-upload form of SendDraft: replace the named draft's content with the
# uploaded message and send it.
# The framed body is a stream and cannot be replayed, so retry is disabled on this
# request: a transient failure surfaces as the real HTTP error rather than
# ERR_HTTP_BODY_NOT_REPLAYABLE. Retry at the call site — a Run.Sequence step
# `retry:` re-invokes the whole operation and re-encodes.
kind: Telo.Definition
metadata:
  name: SendDraftUpload
  description: Send a draft, replacing its content from uploaded media (≤35 MB).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [content]
    properties:
      userId:
        type: string
        description: >-
          The mailbox to act on — an email address, or "me" for the authenticated user.
          Defaults to "me".
      draft:
        type: object
        additionalProperties: true
        description: Draft resource — { id }, naming the draft to send.
      content:
        anyOf:
          - type: string
          - x-telo-type: Telo.Bytes
          - x-telo-type:
              name: Telo.Stream
              of: Telo.Bytes
        description: >-
          The RFC 2822 message itself — a string, raw bytes, or a byte stream. Not base64url-
          encoded; it is sent as a message/rfc822 part.
      contentEncoding:
        type: string
        enum: [utf8, base64]
        description: >-
          How a STRING content is interpreted — utf8 text (default), or standard base64
          decoded to bytes first.
      params:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra query parameters appended verbatim (escape hatch for API options this module
          does not name).
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON Message — the sent message.
resources:
  - kind: Multipart.Encoder
    metadata:
      name: !cel "self.name + '-mp'"
  - kind: Http.Request
    metadata:
      name: !cel "self.name + '-req'"
    client: !cel "self.client"
    throwOnHttpError: true
    retry:
      attempts: 0
  - kind: Run.Sequence
    metadata:
      name: !cel "self.name + '-seq'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required: [content]
        properties:
          userId: { type: string }
          draft: {}
          content: {}
          contentEncoding: { type: string }
          params: { type: object, additionalProperties: { type: string } }
    steps:
      - name: encode
        invoke:
          kind: Multipart.Encoder
          name: !cel "self.name + '-mp'"
        inputs:
          subtype: related
          parts:
            - content: !cel "json(inputs.?draft.orValue({}))"
              contentType: application/json; charset=UTF-8
            - content: !cel "inputs.?contentEncoding.orValue('utf8') == 'base64' ? bytesFromBase64(inputs.content) : inputs.content"
              contentType: message/rfc822
      - name: send
        invoke:
          kind: Http.Request
          name: !cel "self.name + '-req'"
        inputs:
          method: POST
          headers:
            Content-Type: !cel "steps.encode.result.contentType"
          body: !cel "steps.encode.result.output"
          url: !cel >-
            trimSuffix(
              '/upload/gmail/v1/users/' + urlEncode(inputs.?userId.orValue('me')) +
                        '/drafts/send?' + join( [
                {'k': 'uploadType', 'v': 'multipart'}
              ].filter(p, p.v != '').map(p, p.k + '=' + urlEncode(p.v))
                + keys(inputs.?params.orValue({})).map(k, k + '=' + urlEncode(inputs.?params.orValue({})[k])), '&')
            , '?')
    outputs:
      status: !cel "steps.send.result.status"
      headers: !cel "steps.send.result.headers"
      body: !cel "steps.send.result.body"
invoke:
  kind: Run.Sequence
  name: !cel "self.name + '-seq'"
inputs:
  userId: !cel "inputs.?userId.orValue('me')"
  draft: !cel "inputs.?draft.orValue({})"
  content: !cel "inputs.content"
  contentEncoding: !cel "inputs.?contentEncoding.orValue('utf8')"
  params: !cel "inputs.?params.orValue({})"
---
# Gmail's own send/insert/import/draft calls all take one thing: an RFC 2822
# message, base64url-encoded. Everything hard about the API is producing that
# string, so this kind is the connector's centre of gravity — friendly fields in,
# a correct MIME document out. It touches no network and needs no client, so it
# also serves CreateDraft, InsertMessage and ImportMessage.
#
# What it builds, by what you pass:
#
#   text only              -> text/plain
#   html only              -> text/html
#   both                   -> multipart/alternative [plain, html]
#   + attachments          -> multipart/mixed    [ the above, each attachment ]
#   + only inline files    -> multipart/related  [ the above, each inline part ]
#
# Bodies and attachments are always base64 with 76-character lines
# (RFC 2045 §6.8), which sidesteps 8-bit content, the 998-octet line limit and
# every charset question. A non-ASCII Subject is wrapped as an RFC 2047
# encoded-word; a non-ASCII attachment name uses the RFC 2231 `filename*` form
# rather than an encoded-word, which is not legal in a parameter value.
#
# Mixing inline images with ordinary attachments yields one flat multipart/mixed
# rather than the strictly-correct mixed[related[…]] nesting. Every major client
# resolves `cid:` references across it; nest by hand with two calls if you need
# the canonical shape.
kind: Telo.Definition
metadata:
  name: BuildRawMessage
  description: >-
    Build an RFC 2822 message from friendly fields and base64url-encode it for
    Gmail's `raw` field. No network, no client.
capability: Telo.Invocable
schema:
  type: object
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      to:
        description: >-
          Recipients — one address, or a list. Each may be a bare address or
          `Display Name <addr@example.com>`.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      cc:
        description: Carbon-copy recipients — one address, or a list.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      bcc:
        description: >-
          Blind-copy recipients — one address, or a list. Gmail strips the Bcc
          header before delivery.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      from:
        type: string
        description: >-
          The From address. Omitted, Gmail fills in the authenticated user's
          address; set it only for a verified send-as address.
      replyTo:
        description: Reply-To addresses — one address, or a list.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      subject:
        type: string
        description: >-
          The subject line. Encoded as an RFC 2047 encoded-word when it is not
          pure ASCII.
      text:
        type: string
        description: The plain-text body.
      html:
        type: string
        description: >-
          The HTML body. Given alongside `text`, the two are sent as a
          multipart/alternative pair and the client picks.
      attachments:
        type: array
        description: >-
          Files to attach. `content` is standard base64 — what Fs.File with
          `encoding: base64` returns, and what DecodeBase64Url produces from a
          GetAttachment response.
        items:
          type: object
          required: [filename, content]
          properties:
            filename:
              type: string
              description: The name the recipient sees.
            content:
              type: string
              description: The file's bytes, standard base64-encoded.
            contentType:
              type: string
              description: MIME type. Defaults to application/octet-stream.
            contentId:
              type: string
              description: >-
                Content-ID for an image referenced from the HTML body as
                `cid:<id>`. Pair it with `inline: true`.
            inline:
              type: boolean
              description: >-
                Render in place (Content-Disposition inline) rather than as a
                download. When every attachment is inline the container becomes
                multipart/related.
      headers:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra headers, written verbatim after the generated ones. This is how
          a reply carries `In-Reply-To` and `References`, and how an imported
          message carries its original `Date` and `Message-ID`.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [raw, mime]
    properties:
      raw:
        type: string
        description: >-
          The message base64url-encoded, unpadded — ready for `message.raw` on
          SendMessage, InsertMessage, ImportMessage or a Draft.
      mime:
        type: string
        description: The RFC 2822 message itself, for inspection or for an upload operation.
resources:
  - kind: Run.Value
    metadata:
      name: !cel "self.name + '-mime'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        properties:
          to: {}
          cc: {}
          bcc: {}
          from: { type: string }
          replyTo: {}
          subject: { type: string }
          text: { type: string }
          html: { type: string }
          attachments: { type: array, items: { type: object, additionalProperties: true } }
          headers: { type: object, additionalProperties: { type: string } }
    bindings:
      # A single address is accepted wherever a list is, so `to: a@b.com` reads
      # as naturally as `to: [a@b.com, c@d.com]`.
      toList: !cel "type(inputs.?to.orValue([])) == type('') ? [inputs.to] : inputs.?to.orValue([])"
      ccList: !cel "type(inputs.?cc.orValue([])) == type('') ? [inputs.cc] : inputs.?cc.orValue([])"
      bccList: !cel "type(inputs.?bcc.orValue([])) == type('') ? [inputs.bcc] : inputs.?bcc.orValue([])"
      replyToList: !cel "type(inputs.?replyTo.orValue([])) == type('') ? [inputs.replyTo] : inputs.?replyTo.orValue([])"
      # RFC 2047 only where it is needed: an ASCII subject stays readable in the
      # wire format, which matters when debugging a raw message.
      subjectValue: !cel >-
        inputs.?subject.orValue('') == '' ? ''
          : (inputs.subject.matches('^[ -~]*$') ? inputs.subject
             : '=?UTF-8?B?' + base64Encode(inputs.subject) + '?=')
      # RFC 5322 gives a header value no way to escape a line break, so a CR or
      # LF reaching one ENDS it: `from: 'Ann <a@b.com>\r\nBcc: evil@x.com'` would
      # otherwise write a header of the caller's choosing, or terminate the block
      # early and take over the body. Every run of CR/LF plus the whitespace
      # after it collapses to one space — which is exactly RFC 5322 unfolding for
      # a value that was legitimately folded, and harmless for one that was not.
      # (`subjectValue` is already safe: `^[ -~]*$` excludes CR and LF, so a
      # subject carrying either takes the base64 encoded-word branch.)
      headerLines: !cel >-
        [
          {'k': 'MIME-Version', 'v': '1.0'},
          {'k': 'From', 'v': inputs.?from.orValue('')},
          {'k': 'To', 'v': join(toList, ', ')},
          {'k': 'Cc', 'v': join(ccList, ', ')},
          {'k': 'Bcc', 'v': join(bccList, ', ')},
          {'k': 'Reply-To', 'v': join(replyToList, ', ')},
          {'k': 'Subject', 'v': subjectValue}
        ].filter(h, h.v != '')
          .map(h, h.k + ': ' + trim(regexReplace(h.v, '[\r\n]+[ \t]*', ' ')))
          + keys(inputs.?headers.orValue({})).map(k,
              trim(regexReplace(k, '[\r\n]+[ \t]*', ' ')) + ': '
                + trim(regexReplace(inputs.?headers.orValue({})[k], '[\r\n]+[ \t]*', ' ')))
      topHeaders: !cel >-
        join(headerLines, '\r\n') + '\r\n'
      hasText: !cel "inputs.?text.orValue('') != ''"
      hasHtml: !cel "inputs.?html.orValue('') != ''"
      # RFC 2046 §4.1.1: the canonical line break inside an encoded text/* entity
      # is CRLF. A body typed with bare LFs would decode to bare LFs, which some
      # gateways and strict parsers render as one run-on line. Existing CRLFs
      # normalize to LF first so they are not doubled.
      textB64: !cel >-
        base64Encode(replace(replace(replace(inputs.?text.orValue(''),
          '\r\n', '\n'), '\r', '\n'), '\n', '\r\n'))
      htmlB64: !cel >-
        base64Encode(replace(replace(replace(inputs.?html.orValue(''),
          '\r\n', '\n'), '\r', '\n'), '\n', '\r\n'))
      # RFC 2045 §6.8: base64 lines are at most 76 characters. CEL has no
      # user functions, so the fold is written out at each of its three sites.
      textWrapped: !cel >-
        join(range((size(textB64) + 75) / 76).map(i,
          slice(textB64, i * 76, int(min([(i + 1) * 76, size(textB64)])))), '\r\n')
      htmlWrapped: !cel >-
        join(range((size(htmlB64) + 75) / 76).map(i,
          slice(htmlB64, i * 76, int(min([(i + 1) * 76, size(htmlB64)])))), '\r\n')
      textPart: !cel >-
        'Content-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n'
          + textWrapped + '\r\n'
      htmlPart: !cel >-
        'Content-Type: text/html; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n'
          + htmlWrapped + '\r\n'
      altBoundary: !cel "'alt_' + replace(uuidv4(), '-', '')"
      mixBoundary: !cel "'mix_' + replace(uuidv4(), '-', '')"
      # The body entity's own headers and content, kept apart so the entity can
      # be used either as the whole message or as the first part of a container.
      bodyHeaders: !cel >-
        hasText && hasHtml
          ? 'Content-Type: multipart/alternative; boundary="' + altBoundary + '"\r\n'
          : (hasHtml
             ? 'Content-Type: text/html; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n'
             : 'Content-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n')
      bodyContent: !cel >-
        hasText && hasHtml
          ? '--' + altBoundary + '\r\n' + textPart
            + '--' + altBoundary + '\r\n' + htmlPart
            + '--' + altBoundary + '--\r\n'
          : (hasHtml ? htmlWrapped + '\r\n' : textWrapped + '\r\n')
      attachmentList: !cel "inputs.?attachments.orValue([])"
      hasAttachments: !cel "size(attachmentList) > 0"
      # multipart/related only when every attachment is an inline part, which is
      # the shape an HTML mail with embedded images wants.
      relatedOnly: !cel "hasAttachments && attachmentList.all(a, a.?inline.orValue(false))"
      containerHeader: !cel >-
        'Content-Type: multipart/' + (relatedOnly ? 'related' : 'mixed')
          + '; boundary="' + mixBoundary + '"'
          + (relatedOnly ? '; type="text/html"' : '') + '\r\n'
      # An ASCII filename goes in a quoted-string, where RFC 2822 §3.2.5 requires
      # `\` and `"` to be backslash-escaped: `report"v2.pdf` unescaped closes the
      # parameter early, truncating the name the recipient sees and letting a
      # crafted one append parameters of its own. A non-ASCII name never reaches
      # this branch — `^[ -~]*$` sends it to the percent-encoded RFC 2231 form,
      # which is why CR and LF in a filename are already safe.
      #
      # contentType and contentId are header values like any other, so they get
      # the same CR/LF collapse the top-level headers get.
      attachmentParts: !cel >-
        attachmentList.map(a,
          'Content-Type: '
          + trim(regexReplace(a.?contentType.orValue('application/octet-stream'),
              '[\r\n]+[ \t]*', ' ')) + '\r\n'
          + 'Content-Disposition: ' + (a.?inline.orValue(false) ? 'inline' : 'attachment')
          + (a.filename.matches('^[ -~]*$')
             ? '; filename="' + replace(replace(a.filename, '\\', '\\\\'), '"', '\\"') + '"'
             : "; filename*=UTF-8''" + urlEncode(a.filename))
          + '\r\n'
          + (has(a.contentId)
             ? 'Content-ID: <' + trim(regexReplace(a.contentId, '[\r\n]+[ \t]*', ' ')) + '>\r\n'
             : '')
          + 'Content-Transfer-Encoding: base64\r\n\r\n'
          + join(range((size(a.content) + 75) / 76).map(i,
              slice(a.content, i * 76, int(min([(i + 1) * 76, size(a.content)])))), '\r\n')
          + '\r\n')
      mimeMessage: !cel >-
        hasAttachments
          ? topHeaders + containerHeader + '\r\n'
            + '--' + mixBoundary + '\r\n' + bodyHeaders + '\r\n' + bodyContent
            + join(attachmentParts.map(p, '--' + mixBoundary + '\r\n' + p), '')
            + '--' + mixBoundary + '--\r\n'
          : topHeaders + bodyHeaders + '\r\n' + bodyContent
    value:
      mime: !cel "mimeMessage"
      raw: !cel "replace(replace(replace(base64Encode(mimeMessage), '+', '-'), '/', '_'), '=', '')"
invoke:
  kind: Run.Value
  name: !cel "self.name + '-mime'"
inputs:
  to: !cel "inputs.?to.orValue([])"
  cc: !cel "inputs.?cc.orValue([])"
  bcc: !cel "inputs.?bcc.orValue([])"
  from: !cel "inputs.?from.orValue('')"
  replyTo: !cel "inputs.?replyTo.orValue([])"
  subject: !cel "inputs.?subject.orValue('')"
  text: !cel "inputs.?text.orValue('')"
  html: !cel "inputs.?html.orValue('')"
  attachments: !cel "inputs.?attachments.orValue([])"
  headers: !cel "inputs.?headers.orValue({})"
---
# Compose and send in one call: BuildRawMessage framing the message,
# SendMessage putting it on the wire. The whole point of the connector for most
# callers, and the shape to reach for unless you need the raw string for
# something else (a draft, an import) — in which case use the two kinds directly.
#
# Both internals are declared here rather than referenced, so a consumer wires
# one resource: `kind: Gmail.SendEmail` + `client: !ref <a Gmail client>`.
#
# Gmail's JSON path caps the encoded message at 5 MB. For anything larger, build
# with BuildRawMessage and send the `mime` output through SendMessageUpload.
kind: Telo.Definition
metadata:
  name: SendEmail
  description: >-
    Compose an RFC 2822 message from friendly fields and send it —
    BuildRawMessage plus SendMessage in one call (≤5 MB).
capability: Telo.Invocable
schema:
  type: object
  required: [client]
  properties:
    client:
      x-telo-ref:
        kind: Http.Client
        use: dependency
      description: A GmailClient (or any Http.Client) to run the request against.
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      userId:
        type: string
        description: >-
          The mailbox to send from — an email address, or "me" for the
          authenticated user. Defaults to "me".
      to:
        description: Recipients — one address, or a list.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      cc:
        description: Carbon-copy recipients — one address, or a list.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      bcc:
        description: Blind-copy recipients — one address, or a list.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      from:
        type: string
        description: >-
          The From address. Omitted, Gmail fills in the authenticated user's
          address; set it only for a verified send-as address.
      replyTo:
        description: Reply-To addresses — one address, or a list.
        anyOf:
          - type: string
          - type: array
            items: { type: string }
      subject:
        type: string
        description: The subject line.
      text:
        type: string
        description: The plain-text body.
      html:
        type: string
        description: The HTML body; sent as a multipart/alternative pair when `text` is given too.
      attachments:
        type: array
        description: Files to attach — see BuildRawMessage for the item shape.
        items:
          type: object
          required: [filename, content]
          additionalProperties: true
          properties:
            filename: { type: string }
            content: { type: string }
            contentType: { type: string }
            contentId: { type: string }
            inline: { type: boolean }
      headers:
        type: object
        additionalProperties: { type: string }
        description: >-
          Extra headers. Replying into a thread needs `In-Reply-To` and
          `References` naming the parent's Message-ID, alongside `threadId` and
          a matching subject.
      threadId:
        type: string
        description: >-
          Thread to reply into. Gmail also requires a matching Subject and
          correct In-Reply-To / References headers, or it starts a new thread.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [status, headers, body, raw]
    properties:
      status: { type: integer }
      headers: { type: object, additionalProperties: { type: string } }
      body:
        description: Parsed JSON Message — the sent message's { id, threadId, labelIds }.
      raw:
        type: string
        description: The base64url message that was sent, for logging or a follow-up call.
resources:
  - kind: Self.BuildRawMessage
    metadata:
      name: !cel "self.name + '-build'"
  - kind: Self.SendMessage
    metadata:
      name: !cel "self.name + '-send'"
    client: !cel "self.client"
  - kind: Run.Sequence
    metadata:
      name: !cel "self.name + '-seq'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        properties:
          userId: { type: string }
          to: {}
          cc: {}
          bcc: {}
          from: { type: string }
          replyTo: {}
          subject: { type: string }
          text: { type: string }
          html: { type: string }
          attachments: { type: array, items: { type: object, additionalProperties: true } }
          headers: { type: object, additionalProperties: { type: string } }
          threadId: { type: string }
    steps:
      - name: build
        invoke:
          kind: Self.BuildRawMessage
          name: !cel "self.name + '-build'"
        inputs:
          to: !cel "inputs.?to.orValue([])"
          cc: !cel "inputs.?cc.orValue([])"
          bcc: !cel "inputs.?bcc.orValue([])"
          from: !cel "inputs.?from.orValue('')"
          replyTo: !cel "inputs.?replyTo.orValue([])"
          subject: !cel "inputs.?subject.orValue('')"
          text: !cel "inputs.?text.orValue('')"
          html: !cel "inputs.?html.orValue('')"
          attachments: !cel "inputs.?attachments.orValue([])"
          headers: !cel "inputs.?headers.orValue({})"
      - name: send
        invoke:
          kind: Self.SendMessage
          name: !cel "self.name + '-send'"
        inputs:
          userId: !cel "inputs.?userId.orValue('me')"
          message: !cel >-
            inputs.?threadId.orValue('') == ''
              ? {'raw': steps.build.result.raw}
              : {'raw': steps.build.result.raw, 'threadId': inputs.threadId}
    outputs:
      status: !cel "steps.send.result.status"
      headers: !cel "steps.send.result.headers"
      body: !cel "steps.send.result.body"
      raw: !cel "steps.build.result.raw"
invoke:
  kind: Run.Sequence
  name: !cel "self.name + '-seq'"
inputs:
  userId: !cel "inputs.?userId.orValue('me')"
  to: !cel "inputs.?to.orValue([])"
  cc: !cel "inputs.?cc.orValue([])"
  bcc: !cel "inputs.?bcc.orValue([])"
  from: !cel "inputs.?from.orValue('')"
  replyTo: !cel "inputs.?replyTo.orValue([])"
  subject: !cel "inputs.?subject.orValue('')"
  text: !cel "inputs.?text.orValue('')"
  html: !cel "inputs.?html.orValue('')"
  attachments: !cel "inputs.?attachments.orValue([])"
  headers: !cel "inputs.?headers.orValue({})"
  threadId: !cel "inputs.?threadId.orValue('')"
---
# The reading counterpart of BuildRawMessage: a `format: full` Message comes
# back as a nested MIME tree with every body base64url-encoded, and this walks it
# into the two things a caller actually wants — the readable text and the list of
# attachments.
#
# The walk is four levels deep (payload, its parts, theirs, theirs), which covers
# every structure Gmail produces in practice: mixed[related[alternative[…]]] is
# the deepest real-world nesting. It touches no network and needs no client.
kind: Telo.Definition
metadata:
  name: DecodeMessageBody
  description: >-
    Extract decoded text and HTML bodies, common headers and the attachment list
    from a `format: full` Message. No network, no client.
capability: Telo.Invocable
schema:
  type: object
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [message]
    properties:
      message:
        type: object
        additionalProperties: true
        description: >-
          A Message resource as GetMessage returns it with `format: full` (the
          default) — pass `steps.<get>.result.body`. A Thread's
          `messages[i]` works too.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [text, html, headers, attachments]
    properties:
      text:
        type: string
        description: The decoded text/plain body, or '' when the message has none.
      html:
        type: string
        description: The decoded text/html body, or '' when the message has none.
      headers:
        type: array
        description: The top-level headers verbatim, as [{ name, value }].
        items: { type: object, additionalProperties: true }
      subject: { type: string }
      from: { type: string }
      to: { type: string }
      cc: { type: string }
      date: { type: string }
      messageId:
        type: string
        description: The Message-ID header — what a reply's In-Reply-To must name.
      inReplyTo: { type: string }
      references: { type: string }
      attachments:
        type: array
        description: >-
          Every part carrying a filename, as { partId, filename, mimeType, size,
          attachmentId, data }. Fetch the bytes with GetAttachment when
          `attachmentId` is set; small parts arrive inline in `data` instead.
        items: { type: object, additionalProperties: true }
resources:
  - kind: Run.Value
    metadata:
      name: !cel "self.name + '-decode'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required: [message]
        properties:
          message: { type: object, additionalProperties: true }
    bindings:
      payload: !cel "inputs.message.?payload.orValue({})"
      level1: !cel "payload.?parts.orValue([])"
      level2: !cel "flatten(level1.map(p, p.?parts.orValue([])))"
      level3: !cel "flatten(level2.map(p, p.?parts.orValue([])))"
      allParts: !cel "[payload] + level1 + level2 + level3"
      # A body part is one with content and no filename; a part WITH a filename
      # is an attachment even when its type is text/plain.
      textParts: !cel >-
        allParts.filter(p, p.?mimeType.orValue('') == 'text/plain'
          && p.?filename.orValue('') == ''
          && p.?body.orValue({}).?data.orValue('') != '')
      htmlParts: !cel >-
        allParts.filter(p, p.?mimeType.orValue('') == 'text/html'
          && p.?filename.orValue('') == ''
          && p.?body.orValue({}).?data.orValue('') != '')
      headerList: !cel "payload.?headers.orValue([])"
      subjectValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'subject').map(h, h.?value.orValue(''))"
      fromValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'from').map(h, h.?value.orValue(''))"
      toValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'to').map(h, h.?value.orValue(''))"
      ccValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'cc').map(h, h.?value.orValue(''))"
      dateValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'date').map(h, h.?value.orValue(''))"
      messageIdValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'message-id').map(h, h.?value.orValue(''))"
      inReplyToValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'in-reply-to').map(h, h.?value.orValue(''))"
      referencesValues: !cel "headerList.filter(h, lower(h.?name.orValue('')) == 'references').map(h, h.?value.orValue(''))"
      attachmentParts: !cel >-
        allParts.filter(p, p.?filename.orValue('') != '').map(p, {
          'partId': p.?partId.orValue(''),
          'filename': p.filename,
          'mimeType': p.?mimeType.orValue(''),
          'size': p.?body.orValue({}).?size.orValue(0),
          'attachmentId': p.?body.orValue({}).?attachmentId.orValue(''),
          'data': p.?body.orValue({}).?data.orValue('')
        })
    value:
      text: !cel >-
        size(textParts) > 0
          ? base64Decode(replace(replace(textParts[0].body.data, '-', '+'), '_', '/'))
          : ''
      html: !cel >-
        size(htmlParts) > 0
          ? base64Decode(replace(replace(htmlParts[0].body.data, '-', '+'), '_', '/'))
          : ''
      headers: !cel "headerList"
      subject: !cel "size(subjectValues) > 0 ? subjectValues[0] : ''"
      from: !cel "size(fromValues) > 0 ? fromValues[0] : ''"
      to: !cel "size(toValues) > 0 ? toValues[0] : ''"
      cc: !cel "size(ccValues) > 0 ? ccValues[0] : ''"
      date: !cel "size(dateValues) > 0 ? dateValues[0] : ''"
      messageId: !cel "size(messageIdValues) > 0 ? messageIdValues[0] : ''"
      inReplyTo: !cel "size(inReplyToValues) > 0 ? inReplyToValues[0] : ''"
      references: !cel "size(referencesValues) > 0 ? referencesValues[0] : ''"
      attachments: !cel "attachmentParts"
invoke:
  kind: Run.Value
  name: !cel "self.name + '-decode'"
inputs:
  message: !cel "inputs.message"
---
# Gmail hands back every body and attachment in base64url (RFC 4648 §5), which
# no file writer or decoder accepts directly. This translates it to standard
# base64 — re-padded, so a strict decoder is happy — and decodes it as UTF-8 for
# the text case. Feed `base64` to Fs.FileWrite with `encoding: base64` to save an
# attachment; read `text` for a body part.
kind: Telo.Definition
metadata:
  name: DecodeBase64Url
  description: >-
    Translate Gmail's base64url payload to padded standard base64, and decode it
    as UTF-8 text.
capability: Telo.Invocable
schema:
  type: object
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [data]
    properties:
      data:
        type: string
        description: >-
          A base64url string — `payload.body.data`, `parts[].body.data`, or a
          GetAttachment response's `body.data`.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [base64, text]
    properties:
      base64:
        type: string
        description: Standard base64 with padding restored — what a file writer expects.
      text:
        type: string
        description: >-
          The payload decoded as UTF-8. Meaningful for a text part; binary
          content will not survive the round trip, so use `base64` for that.
resources:
  - kind: Run.Value
    metadata:
      name: !cel "self.name + '-decode'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        required: [data]
        properties:
          data: { type: string }
    bindings:
      translated: !cel "replace(replace(inputs.data, '-', '+'), '_', '/')"
      # base64url drops the padding; a strict decoder wants it back. A length of
      # 1 mod 4 is not valid base64 at all and no padding can repair it.
      padded: !cel "translated + ['', '', '==', '='][size(translated) % 4]"
    value:
      base64: !cel "padded"
      text: !cel "base64Decode(padded)"
invoke:
  kind: Run.Value
  name: !cel "self.name + '-decode'"
inputs:
  data: !cel "inputs.data"
---
# The other direction: whatever produced a MIME message — this module's
# BuildRawMessage, a template, a file on disk — Gmail wants it base64url before
# it will go in `message.raw`.
kind: Telo.Definition
metadata:
  name: EncodeBase64Url
  description: >-
    Encode UTF-8 text (or re-encode standard base64) as unpadded base64url for
    Gmail's `raw` field.
capability: Telo.Invocable
schema:
  type: object
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    properties:
      text:
        type: string
        description: UTF-8 text to encode — an RFC 2822 message, for instance.
      base64:
        type: string
        description: >-
          Already-base64 content to re-spell as base64url, for bytes that
          reached the manifest encoded (Fs.File with `encoding: base64`). Wins
          over `text` when both are given.
outputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [base64url]
    properties:
      base64url:
        type: string
        description: Unpadded base64url, ready for `message.raw`.
resources:
  - kind: Run.Value
    metadata:
      name: !cel "self.name + '-encode'"
    inputType:
      kind: Telo.JsonSchema
      schema:
        type: object
        properties:
          text: { type: string }
          base64: { type: string }
    bindings:
      source: !cel >-
        inputs.?base64.orValue('') != ''
          ? inputs.base64
          : base64Encode(inputs.?text.orValue(''))
    value:
      base64url: !cel "replace(replace(replace(source, '+', '-'), '/', '_'), '=', '')"
invoke:
  kind: Run.Value
  name: !cel "self.name + '-encode'"
inputs:
  text: !cel "inputs.?text.orValue('')"
  base64: !cel "inputs.?base64.orValue('')"
