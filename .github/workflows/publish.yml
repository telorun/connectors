name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Module ARTIFACTS. Versioning happens in the Module Release PR below; this only
  # pushes what is already versioned. Runs on every push to main, not only on a
  # release commit: both gates in the script are idempotent (version moved in this
  # commit, or version absent at the registry), so nothing is republished and a
  # failed push heals on the next push. `vars.TELO_OCI_REGISTRY` unset skips it.
  publish-modules:
    name: Publish module artifacts
    runs-on: ubuntu-latest
    if: vars.TELO_OCI_REGISTRY != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD^ needed by the version-moved gate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A module's npm controller is packed from `dist/`, and `telo publish` pushes
      # that tarball before the manifest naming it.
      - name: Build controllers
        run: pnpm -r --if-present build

      - name: Install telo CLI
        run: npm install -g @telorun/cli

      # The OCI transport reads the ambient Docker credential chain, so logging in
      # here is what authorizes the push.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish modules
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run publish-modules

  # Modules are versioned by `telo release` — one workspace per vendor directory, so
  # a module keeps publishing at `<base>/<vendor>/<name>`. This job plans the bumps
  # and opens a single Version PR; merging it is what makes the job above publish.
  module-release:
    name: Module Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build controllers
        run: pnpm -r --if-present build

      - name: Install telo CLI
        run: npm install -g @telorun/cli

      # CAPTURED BEFORE APPLY. `telo release apply` consumes the fragments the
      # changelog entries come from, so a plan read afterwards can say which versions
      # moved but not why — the half of the body worth reading.
      - name: Capture the release plans
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node scripts/release.mjs status --base HEAD --json /tmp/release-plans

      # Writes every planned version into each module's telo.yaml, npm package and
      # `pkg:npm` pin, appends the changelogs, updates the ledger, and deletes the
      # fragments it consumed. A no-op when nothing drifted, so the PR step below
      # finds no changes and opens nothing.
      - name: Apply the release plans
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node scripts/release.mjs apply --base HEAD

      - name: Render the PR body
        run: node scripts/module-release-pr-body.mjs /tmp/release-plans > /tmp/release-body.md

      - name: Open Module Release PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: module-release/main
          base: main
          title: "chore(release): version modules"
          commit-message: "chore(release): version modules"
          body-path: /tmp/release-body.md
