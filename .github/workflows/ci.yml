name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check & manifest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Controllers resolve via `?local_path=./nodejs`; the published telo CLI
      # loads the built `dist/`, so it must exist before check/test.
      - name: Build controllers
        run: pnpm -r run build

      - name: Install telo CLI
        run: npm install -g @telorun/cli

      - name: Static check
        run: telo check aws/*/telo.yaml

      - name: Manifest tests
        run: telo ./test-suite.yaml

  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Controller bytes are part of a module's payload digest, so the release plan
      # is computed against built controllers.
      - name: Build controllers
        run: pnpm -r run build

      - name: Install telo CLI
        run: npm install -g @telorun/cli

      # Fails when no consistent release plan can be formed in a vendor workspace: a
      # fragment naming an unknown module, a major-inducing kind (modules are pre-1.0),
      # a manifest version disagreeing with its ledger entry, or digests taken against
      # another registry base. It does NOT fail merely because a payload moved — that
      # ships as an unattributed patch. It warns when a module's own files changed and
      # no fragment names it.
      - name: Release plan is consistent
        env:
          TELO_OCI_REGISTRY: ${{ vars.TELO_OCI_REGISTRY }}
        run: node scripts/release.mjs check
