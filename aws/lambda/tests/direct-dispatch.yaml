# End-to-end smoke test for Lambda.Function + Lambda.Direct. Invokes the
# Function with a synthetic AWS payload; the Function classifies it as
# Direct (catch-all), dispatches to a JavaScript handler, and returns
# the result through Direct's returns: matching.
kind: Telo.Application
metadata: { name: LambdaDirectDispatchTest, version: 1.0.0 }
imports:
  Lambda: ..
  Assert: oci://ghcr.io/telorun/assert@0.18.0#sha256-mSy7HGMq_UoQUvt4WbQCIO_uqXcRZwRlmROp6DfLDjY
targets:
  - !ref TestDirectDispatch
---
# User-supplied invocable. Receives the Direct-resolved inputs and returns
# a greeting payload.
kind: Telo.Value
metadata: { name: Greet }
inputType:
  kind: Telo.JsonSchema
  schema:
    type: object
    required: [name]
    properties:
      name: { type: string }
value:
  message: !cel "'Hello ' + inputs.name + '!'"
---
# Direct handler: maps the AWS event's `name` field to the JS handler's input,
# returns the handler's result verbatim.
kind: Lambda.Direct
metadata: { name: Greeter }
handler: !ref Greet
inputs:
  name: !cel "event.name"
---
# The AWS-facing service. Lists the Direct handler as a dispatch target.
# Direct is the catch-all classifier — any event shape lands here when no
# other handler kind matches.
kind: Lambda.Function
metadata: { name: main }
handlers:
  - !ref Greeter
---
# Telo.Sequence drives the test: call the Function with a synthetic payload
# (simulates `kernel.invoke` from a managed-runtime bootstrap), assert the
# returned message.
kind: Telo.Sequence
metadata: { name: TestDirectDispatch }
steps:
  - name: InvokeFunction
    inputs:
      event:
        name: "World"
      context: {}
    invoke: !ref main
  - name: VerifyMessage
    inputs:
      message: !cel "steps.InvokeFunction.result.message"
    invoke:
      kind: Assert.Schema
      schema:
        type: object
        properties:
          message:
            type: string
            const: "Hello World!"
