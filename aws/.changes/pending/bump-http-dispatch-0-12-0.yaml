modules:
  lambda: Added
body: "Upgrade the `http-dispatch` import to 0.12.0. Its `content` maps (on `Outcomes/$defs/Returns` and `Outcomes/$defs/Catches`, which `Lambda.HttpApi` draws its `returns` / `catches` schemas from) now carry `propertyNames` media-type hints, so an editor suggests `application/json` and friends without closing the set to a vendor content type."
